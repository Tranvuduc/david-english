<title>AI Workbench</title><meta name="description" content="Học cách dùng AI (ChatGPT, Claude, Gemini…) để học và dạy tiếng Anh: 9 bài học ngắn, thư viện prompt mẫu.">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f7f5ef; --surface:#FFFFFF; --surface-2:#F1EFE7; --border:#E4E0D3;
    --text:#201E1A; --text-muted:#6B6659; --text-faint:#9A947F;
    --accent:#2F4FE0; --accent-ink:#EDF0FF; --accent-strong:#1E36AC;
    --accent2:#D98A2B; --accent2-ink:#FBEEDC;
    --success:#28805A; --success-bg:#E4F3EA;
    --danger:#C1443D; --danger-bg:#FBE7E5;
    --level-auto:#7A4FE0; --level-auto-bg:#EDE6FC;
    --radius-sm:8px; --radius-md:14px; --radius-lg:20px;
    --shadow:0 1px 2px rgba(32,30,26,.05), 0 8px 24px -12px rgba(32,30,26,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15161A; --surface:#1D1F26; --surface-2:#24262E; --border:#33353F;
      --text:#EDEDEF; --text-muted:#A3A5B0; --text-faint:#71737E;
      --accent:#7C93FF; --accent-ink:#232A4D; --accent-strong:#AFC0FF;
      --accent2:#E7A94C; --accent2-ink:#3A2E17;
      --success:#59C08A; --success-bg:#173328;
      --danger:#E2726B; --danger-bg:#3A2320;
      --level-auto:#B79CFF; --level-auto-bg:#2C2447;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15161A; --surface:#1D1F26; --surface-2:#24262E; --border:#33353F;
    --text:#EDEDEF; --text-muted:#A3A5B0; --text-faint:#71737E;
    --accent:#7C93FF; --accent-ink:#232A4D; --accent-strong:#AFC0FF;
    --accent2:#E7A94C; --accent2-ink:#3A2E17;
    --success:#59C08A; --success-bg:#173328;
    --danger:#E2726B; --danger-bg:#3A2320;
    --level-auto:#B79CFF; --level-auto-bg:#2C2447;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:"Fraunces", Georgia, serif; text-wrap:balance; letter-spacing:-0.01em; }
  code, .mono{ font-family:"JetBrains Mono", ui-monospace, monospace; }
  a{ color:var(--accent); }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:var(--accent-ink); }

  #app{ max-width:1100px; margin:0 auto; padding-inline:20px; padding-bottom:64px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding-block:20px 12px;
  }
  .brand{ font-family:"Fraunces", serif; font-weight:600; font-size:1.5rem; }
  .brand em{ font-style:normal; color:var(--accent); }
  .greet{ font-size:.85rem; color:var(--text-muted); margin-top:2px; }
  .streak-pill{
    display:flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--border); border-radius:999px; padding:8px 14px;
    box-shadow:var(--shadow); white-space:nowrap;
  }
  .streak-pill .n{ font-family:"Fraunces",serif; font-weight:600; color:var(--accent2); }
  .streak-pill .lbl{ font-size:.78rem; color:var(--text-muted); }

  nav.tabs{
    display:flex; gap:6px; overflow-x:auto; padding-block:6px 18px;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    flex:0 0 auto; background:transparent; border:1px solid transparent;
    color:var(--text-muted); font-weight:600; font-size:.88rem;
    padding:9px 14px; border-radius:999px; transition:background .15s,color .15s,border-color .15s;
  }
  nav.tabs button:hover{ background:var(--surface-2); color:var(--text); }
  nav.tabs button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

  main{ min-height:60vh; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:22px; box-shadow:var(--shadow);
  }
  .grid{ display:grid; gap:16px; }
  .grid.cols-2{ grid-template-columns:1fr 1fr; }
  .grid.cols-3{ grid-template-columns:repeat(3,1fr); }
  @media (max-width:760px){ .grid.cols-2,.grid.cols-3{ grid-template-columns:1fr; } }

  .badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:11px; color:#fff; font-weight:700;
    font-size:.72rem; letter-spacing:.02em; flex:0 0 auto;
  }
  .badge.lg{ width:52px; height:52px; border-radius:14px; font-size:.85rem; }

  .pill{
    display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:600;
    padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--text-muted);
    border:1px solid var(--border);
  }
  .pill.on{ background:var(--success-bg); color:var(--success); border-color:transparent; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 18px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-weight:600; font-size:.9rem;
    transition:transform .12s, box-shadow .12s, background .12s;
  }
  .btn:hover{ box-shadow:var(--shadow); }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn.ghost{ background:transparent; border-color:transparent; }
  .btn.sm{ padding:7px 13px; font-size:.8rem; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }

  .progress-ring{ position:relative; width:76px; height:76px; flex:0 0 auto; }
  .progress-ring svg{ transform:rotate(-90deg); }
  .progress-ring .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:"Fraunces",serif; font-weight:600; font-size:1.05rem;
  }

  .section-title{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .section-title h2{ margin:0; font-size:1.3rem; }
  .eyebrow{ font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:0 0 6px; }

  .lesson-row{
    display:flex; align-items:center; gap:14px; padding:14px; border-radius:var(--radius-md);
    border:1px solid var(--border); background:var(--surface); cursor:pointer; text-align:left; width:100%;
  }
  .lesson-row:hover{ border-color:var(--accent); }
  .lesson-row .meta{ flex:1; min-width:0; }
  .lesson-row .meta h3{ margin:0 0 3px; font-size:1rem; }
  .lesson-row .meta p{ margin:0; font-size:.82rem; color:var(--text-muted); }
  .check{ width:22px; height:22px; border-radius:50%; border:2px solid var(--border); flex:0 0 auto; }
  .check.done{ background:var(--success); border-color:var(--success); position:relative; }
  .check.done::after{ content:"✓"; color:#fff; font-size:.7rem; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }

  .prose p{ line-height:1.65; color:var(--text); }
  .prose ul{ line-height:1.65; padding-left:1.2em; }
  .prose li{ margin-bottom:6px; }
  .callout{
    background:var(--accent-ink); border:1px solid transparent; border-radius:var(--radius-md);
    padding:16px 18px; margin-block:16px;
  }
  .callout .label{ font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-strong); margin-bottom:6px; }
  .callout p{ margin:0; font-family:"JetBrains Mono", monospace; font-size:.86rem; line-height:1.6; }

  .quiz-q{ border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:12px; }
  .quiz-q p.q{ font-weight:600; margin:0 0 10px; }
  .quiz-opt{
    display:block; width:100%; text-align:left; padding:10px 12px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface); margin-bottom:8px; font-size:.88rem;
  }
  .quiz-opt:hover{ border-color:var(--accent); }
  .quiz-opt.correct{ background:var(--success-bg); border-color:var(--success); }
  .quiz-opt.wrong{ background:var(--danger-bg); border-color:var(--danger); }
  .quiz-opt:disabled{ cursor:default; }

  .flip-card{ perspective:1200px; height:220px; }
  .flip-inner{
    position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-lg);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:22px;
    border:1px solid var(--border); box-shadow:var(--shadow);
  }
  .flip-face.front{ background:var(--surface); }
  .flip-face.front .term{ font-family:"Fraunces",serif; font-weight:600; font-size:1.3rem; }
  .flip-face.back{ background:var(--accent-ink); transform:rotateY(180deg); color:var(--text); font-size:.92rem; line-height:1.5; }

  .match-col{ display:flex; flex-direction:column; gap:10px; }
  .match-item{
    padding:12px 14px; border-radius:var(--radius-md); border:1px solid var(--border);
    background:var(--surface); font-size:.86rem; text-align:left;
  }
  .match-item.selected{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-ink); }
  .match-item.matched{ background:var(--success-bg); border-color:var(--success); color:var(--success); opacity:.75; }
  .match-item.shake{ border-color:var(--danger); }
  .match-item:disabled{ cursor:default; }

  .chip{
    display:inline-flex; align-items:center; padding:9px 14px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface); font-size:.84rem; margin:4px;
  }
  .chip.used{ opacity:.35; }
  .built-row{ min-height:52px; border:1px dashed var(--border); border-radius:var(--radius-md); padding:8px; display:flex; flex-wrap:wrap; align-items:center; margin-bottom:14px; }

  .project-card{ border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface); padding:18px; }
  .step-row{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
  .step-row:last-child{ border-bottom:none; }
  .step-row input{ margin-top:3px; width:16px; height:16px; accent-color:var(--accent); }
  .step-row.done label{ text-decoration:line-through; color:var(--text-faint); }

  .chat-log{ display:flex; flex-direction:column; gap:12px; max-height:440px; overflow-y:auto; padding:4px 2px 8px; }
  .msg{ max-width:82%; padding:11px 14px; border-radius:14px; font-size:.9rem; line-height:1.55; }
  .msg.user{ align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .msg.ai{ align-self:flex-start; background:var(--surface-2); border-bottom-left-radius:4px; white-space:pre-wrap; }
  .chat-input-row{ display:flex; gap:8px; margin-top:14px; }
  .chat-input-row textarea{
    flex:1; resize:none; border:1px solid var(--border); border-radius:var(--radius-md); padding:11px 13px;
    font-family:inherit; font-size:.9rem; background:var(--surface); color:var(--text); min-height:46px;
  }
  .suggest-chip{
    border:1px solid var(--border); background:var(--surface-2); border-radius:999px; padding:7px 12px;
    font-size:.78rem; color:var(--text-muted);
  }

  .lib-cat h3{ font-size:1.02rem; margin:26px 0 10px; }
  .prompt-card{
    border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface);
    padding:14px 16px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; justify-content:space-between;
  }
  .prompt-card p{ margin:0; font-family:"JetBrains Mono",monospace; font-size:.8rem; line-height:1.55; color:var(--text); }

  textarea.paste-box{
    width:100%; min-height:110px; border:1px solid var(--border); border-radius:var(--radius-md);
    padding:12px; font-family:"JetBrains Mono",monospace; font-size:.8rem; background:var(--surface); color:var(--text);
  }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(12px); opacity:0;
    background:var(--text); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.85rem;
    transition:opacity .2s, transform .2s; pointer-events:none; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .empty{ text-align:center; padding:40px 20px; color:var(--text-muted); }
  hr.rule{ border:none; border-top:1px solid var(--border); margin:20px 0; }
  .stat{ text-align:center; }
  .stat .n{ font-family:"Fraunces",serif; font-weight:600; font-size:1.6rem; }
  .stat .l{ font-size:.75rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
</style>

  </div>

function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const today = todayStr();
  if(state.streak.last === today) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  state.streak.count = (state.streak.last === y) ? (state.streak.count+1) : 1;
  state.streak.last = today;
  saveState();
}

    '<circle cx="38" cy="38" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'+
    '</svg>';
}

const lessonQuizProgress = {};
function answerLessonQuiz(lid, qi, oi, correct){
  const key = lid;
  const box = document.getElementById('lq-'+lid+'-'+qi);
  const opts = box.querySelectorAll('.quiz-opt');
  opts.forEach((el,i)=>{
    el.disabled = true;
    if(i===correct) el.classList.add('correct');
    else if(i===oi) el.classList.add('wrong');
  });
  lessonQuizProgress[key] = lessonQuizProgress[key] || {};
  lessonQuizProgress[key][qi] = (oi===correct);
  const l = LESSONS.find(x=>x.id===lid);
  const answeredCount = Object.keys(lessonQuizProgress[key]).length;
  if(answeredCount === l.quiz.length){
    const correctCount = Object.values(lessonQuizProgress[key]).filter(Boolean).length;
    const score = Math.round((correctCount/l.quiz.length)*100);
    state.quizBest[lid] = Math.max(state.quizBest[lid]||0, score);
    saveState();
    document.getElementById('lessonQuizResult').textContent = 'Score: '+score+'%  ·  Best: '+state.quizBest[lid]+'%';
  }
}
function toggleLessonDone(id){
  if(state.lessonsDone[id]) delete state.lessonsDone[id]; else state.lessonsDone[id] = true;
  saveState();
  render();
}

/* --- Tool Match --- */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function renderMatchGame(){
  if(!gameState.match){
    gameState.match = {
      tasks: shuffle(TASK_MATCH.map((t,i)=>({...t, key:i}))),
      tools: shuffle(TASK_MATCH.map((t,i)=>({tool:t.tool, key:i}))),
      selectedTask:null, matched:{}, mistakes:0
    };
  }
  const m = gameState.match;
  const total = TASK_MATCH.length;
  const doneCount = Object.keys(m.matched).length;
  const taskHtml = m.tasks.map(t=>{
    const isMatched = m.matched[t.key];
    const isSel = m.selectedTask===t.key;
    return `<button class="match-item ${isMatched?'matched':''} ${isSel?'selected':''}" ${isMatched?'disabled':''} onclick="selectMatchTask(${t.key})">${t.task}</button>`;
  }).join('');
  const toolHtml = m.tools.map(t=>{
    const isMatched = m.matched[t.key];
    return `<button class="match-item ${isMatched?'matched':''}" ${isMatched?'disabled':''} onclick="selectMatchTool(${t.key})">
      <span class="badge" style="background:${TOOL_COLORS[t.tool]}; width:26px; height:26px; border-radius:8px; font-size:.6rem; vertical-align:middle; margin-right:8px;">${TOOL_INITIALS[t.tool]}</span>${LESSONS.find(l=>l.id===t.tool).title}</button>`;
  }).join('');

  const finished = doneCount===total;
  return `
  <button class="btn ghost sm" onclick="go('games')">← Games</button>
  <div class="section-title" style="margin-top:12px;"><h2>Tool Match</h2><span class="pill ${finished?'on':''}">${doneCount}/${total} matched · ${m.mistakes} mistakes</span></div>
  ${finished ? `<div class="callout"><div class="label">Nice work</div><p>All matched with ${m.mistakes} mistake(s). <a href="#" onclick="gameState.match=null; render(); return false;">Play again →</a></p></div>` : ''}
  <div class="grid cols-2">
    <div class="match-col">${taskHtml}</div>
    <div class="match-col">${toolHtml}</div>
  </div>`;
}
function selectMatchTask(key){ gameState.match.selectedTask = key; render(); }
function selectMatchTool(toolKey){
  const m = gameState.match;
  if(m.selectedTask===null) return;
  const task = TASK_MATCH[m.selectedTask];
  const tool = TASK_MATCH[toolKey].tool;
  if(task.tool === tool){
    m.matched[m.selectedTask] = true;
    m.matched[toolKey] = true;
    m.selectedTask = null;
    toast('Matched!');
  } else {
    m.mistakes++;
    toast('Not quite — try again.');
  }
  render();
}

/* --- Speed Quiz --- */
function renderSpeedGame(){
  if(!gameState.speed || route.freshSpeed){
    gameState.speed = { queue: shuffle(ALL_QUESTIONS).slice(0,10), idx:0, score:0, timer:20, ticking:null, finished:false, answered:false };
    route.freshSpeed = false;
  }
  const s = gameState.speed;
  if(s.finished){
    return `<button class="btn ghost sm" onclick="go('games')">← Games</button>
    <div class="card" style="margin-top:12px; text-align:center;">
      <p class="eyebrow">Speed Quiz complete</p>
      <h2 style="margin:6px 0;">${s.score} / ${s.queue.length}</h2>
      <button class="btn primary" onclick="restartSpeed()">Play again</button>
    </div>`;
  }
  const q = s.queue[s.idx];
  const optsHtml = q.options.map((o,i)=>`<button class="quiz-opt" id="sq-opt-${i}" onclick="answerSpeed(${i},${q.correct})">${o}</button>`).join('');
  setTimeout(startSpeedTimer, 0);
  return `<button class="btn ghost sm" onclick="go('games')">← Games</button>
  <div class="section-title" style="margin-top:12px;"><h2>Speed Quiz</h2><span class="pill">Question ${s.idx+1}/${s.queue.length} · Score ${s.score}</span></div>
  <div class="card">
    <div style="height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-bottom:16px;">
      <div id="speedBar" style="height:100%; width:100%; background:var(--accent2); transition:width 1s linear;"></div>
    </div>
    <p class="eyebrow">${q.lessonTitle}</p>
    <p class="q" style="font-weight:600; font-size:1.02rem;">${q.q}</p>
    ${optsHtml}
  </div>`;
}
function startSpeedTimer(){
  const s = gameState.speed;
  if(!s || s.answered || s.finished) return;
  if(s._started) return;
  s._started = true;
  s.timer = 20;
  const bar = document.getElementById('speedBar');
  if(bar) bar.style.width='100%';
  clearInterval(s.ticking);
  s.ticking = setInterval(()=>{
    s.timer -= 1;
    const b = document.getElementById('speedBar');
    if(b) b.style.width = (s.timer/20*100)+'%';
    if(s.timer<=0){ clearInterval(s.ticking); if(!s.answered) answerSpeed(-1, s.queue[s.idx].correct); }
  },1000);
}
function answerSpeed(chosen, correct){
  const s = gameState.speed;
  if(s.answered) return;
  s.answered = true;
  s._started = false;
  clearInterval(s.ticking);
  if(chosen===correct) s.score++;
  const opts = document.querySelectorAll('#view .quiz-opt');
  opts.forEach((el,i)=>{ el.disabled=true; if(i===correct) el.classList.add('correct'); else if(i===chosen) el.classList.add('wrong'); });
  setTimeout(()=>{
    s.idx++; s.answered=false;
    if(s.idx>=s.queue.length) s.finished = true;
    render();
  }, 900);
}
function restartSpeed(){ gameState.speed=null; route.freshSpeed=true; render(); }

/* --- Prompt Builder --- */
function renderBuilderGame(){
  if(!gameState.builder){
    gameState.builder = { scenarioIdx:0, chosen:[], shuffled: shuffle(PROMPT_SCENARIOS[0].parts), result:null };
  }
  const b = gameState.builder;
  const scenario = PROMPT_SCENARIOS[b.scenarioIdx];
  const chipsHtml = b.shuffled.map(p=>{
    const used = b.chosen.includes(p.id);
    return `<button class="chip ${used?'used':''}" ${used?'disabled':''} onclick="pickPart('${p.id}')">${p.label}</button>`;
  }).join('');
  const builtHtml = b.chosen.map(id=>{
    const p = scenario.parts.find(x=>x.id===id);
    return `<span class="chip">${p.label}</span>`;
  }).join('') || '<span style="color:var(--text-faint); font-size:.85rem;">Click the pieces below in the right order.</span>';

  return `<button class="btn ghost sm" onclick="go('games')">← Games</button>
  <div class="section-title" style="margin-top:12px;"><h2>Prompt Builder</h2><span class="pill">Scenario ${b.scenarioIdx+1}/${PROMPT_SCENARIOS.length}</span></div>
  <div class="card">
    <p class="eyebrow">${scenario.title}</p>
    <p style="color:var(--text-muted); font-size:.85rem;">Order the pieces: Role → Context → Task → Format.</p>
    <div class="built-row">${builtHtml}</div>
    <div>${chipsHtml}</div>
    ${b.result ? `<div class="callout" style="margin-top:16px;"><div class="label">${b.result==='good'?'Correct order!':'Not the ideal order'}</div><p style="font-family:'Work Sans',sans-serif; font-size:.85rem;">${b.result==='good' ? 'That reads naturally and gives the AI everything it needs, in the order it needs it.' : 'The clearest order is usually Role → Context → Task → Format. Try again or move on.'}</p></div>` : ''}
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn ghost sm" onclick="resetBuilder()">Reset</button>
      <button class="btn ghost sm" onclick="nextBuilderScenario()">Next scenario →</button>
    </div>
  </div>`;
}
function pickPart(id){
  const b = gameState.builder;
  if(b.chosen.includes(id)) return;
  b.chosen.push(id);
  const scenario = PROMPT_SCENARIOS[b.scenarioIdx];
  if(b.chosen.length === scenario.parts.length){
    b.result = (JSON.stringify(b.chosen)===JSON.stringify(scenario.order)) ? 'good' : 'bad';
  }
  render();
}
function resetBuilder(){
  const b = gameState.builder;
  b.chosen = []; b.result = null;
  b.shuffled = shuffle(PROMPT_SCENARIOS[b.scenarioIdx].parts);
  render();
}
function nextBuilderScenario(){
  const b = gameState.builder;
  b.scenarioIdx = (b.scenarioIdx+1) % PROMPT_SCENARIOS.length;
  b.chosen = []; b.result = null;
  b.shuffled = shuffle(PROMPT_SCENARIOS[b.scenarioIdx].parts);
  render();
}

/* ============================= REVIEW (flashcards) ============================= */

let reviewDeck = null;
let reviewIdx = 0;
let reviewFlipped = false;

function buildReviewDeck(){
  const notKnown = ALL_CARDS.filter(c => state.cardStatus[c.id] !== 'known');
  const known = ALL_CARDS.filter(c => state.cardStatus[c.id] === 'known');
  reviewDeck = shuffle(notKnown).concat(shuffle(known));
  reviewIdx = 0; reviewFlipped = false;
}

function renderReview(){
  if(!reviewDeck) buildReviewDeck();
  const knownCount = ALL_CARDS.filter(c=>state.cardStatus[c.id]==='known').length;
  if(reviewDeck.length===0) return `<div class="empty">No flashcards yet.</div>`;
  if(reviewIdx >= reviewDeck.length){
    return `<div class="section-title"><h2>Review</h2><span class="pill on">${knownCount}/${ALL_CARDS.length} mastered</span></div>
      <div class="card" style="text-align:center;">
        <p class="eyebrow">Deck complete</p>
        <h3>You've been through every card this round.</h3>
        <button class="btn primary" onclick="buildReviewDeck(); render();">Shuffle & restart</button>
      </div>`;
  }
  const c = reviewDeck[reviewIdx];
  return `<div class="section-title"><h2>Review</h2><span class="pill on">${knownCount}/${ALL_CARDS.length} mastered</span></div>
  <p style="color:var(--text-muted); font-size:.82rem; margin-bottom:10px;">Card ${reviewIdx+1} of ${reviewDeck.length} · ${c.lessonTitle}</p>
  <div class="flip-card ${reviewFlipped?'flipped':''}" onclick="flipReview()">
    <div class="flip-inner">
      <div class="flip-face front"><span class="term">${c.term}</span></div>
      <div class="flip-face back">${c.def}</div>
    </div>
  </div>
  <div class="btn-row" style="margin-top:18px; justify-content:center;">
    <button class="btn" onclick="markCard('${c.id}','review')">Still learning</button>
    <button class="btn primary" onclick="markCard('${c.id}','known')">Got it</button>
  </div>`;
}
function flipReview(){ reviewFlipped = !reviewFlipped; render(); }
function markCard(id, status){
  state.cardStatus[id] = status;
  saveState();
  reviewIdx++; reviewFlipped = false;
  render();
}

/* ============================= PROJECTS ============================= */

function renderProjects(){
  if(route.param) return renderProjectDetail(route.param);
  const cards = PROJECTS.map(p=>{
    const steps = state.projectSteps[p.id] || {};
    const doneN = Object.values(steps).filter(Boolean).length;
    const complete = doneN === p.steps.length;
    const toolBadges = p.tools.map(t=>`<span class="badge" style="background:${TOOL_COLORS[t]}; width:26px; height:26px; border-radius:8px; font-size:.6rem;">${TOOL_INITIALS[t]}</span>`).join(' ');
    return `<button class="card" style="text-align:left; cursor:pointer;" onclick="go('projects','${p.id}')">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <h3 style="margin:0 0 6px; font-size:1.02rem;">${p.title}</h3>
        <span class="pill ${complete?'on':''}">${doneN}/${p.steps.length}</span>
      </div>
      <div style="margin-top:6px;">${toolBadges}</div>
    </button>`;
  }).join('');
  return `<div class="section-title"><h2>Projects</h2></div><div class="grid cols-2">${cards}</div>`;
}
function renderProjectDetail(id){
  const p = PROJECTS.find(x=>x.id===id);
  if(!p) return renderProjects();
  const steps = state.projectSteps[id] || {};
  const stepsHtml = p.steps.map((s,i)=>{
    const checked = !!steps[i];
    return `<div class="step-row ${checked?'done':''}">
      <input type="checkbox" id="step-${id}-${i}" ${checked?'checked':''} onchange="toggleStep('${id}',${i})">
      <label for="step-${id}-${i}">${s}</label>
    </div>`;
  }).join('');
  const toolBadges = p.tools.map(t=>`<span class="pill">${LESSONS.find(l=>l.id===t).title}</span>`).join(' ');
  return `<button class="btn ghost sm" onclick="go('projects')">← All projects</button>
  <div class="card" style="margin-top:12px;">
    <h1 style="margin:0 0 8px; font-size:1.4rem;">${p.title}</h1>
    <div style="margin-bottom:16px;">${toolBadges}</div>
    <div class="project-card" style="border:none; padding:0;">${stepsHtml}</div>
  </div>`;
}
function toggleStep(id, i){
  if(!state.projectSteps[id]) state.projectSteps[id] = {};
  state.projectSteps[id][i] = !state.projectSteps[id][i];
  saveState();
  render();
}

/* ============================= ASK AI ============================= */

const CHAT_CONTEXT = "You are a friendly, practical AI-literacy coach inside an app called AI Workbench. The user creates English-language (ESL/EFL) teaching materials and Vietnamese-language Reformed theology content. Give specific, concrete answers about which AI tool to use and how, with short example prompts when useful. Keep answers concise (under 180 words) unless asked for more.";
let chatHistory = [];
let uploadedContext = null;
let asking = false;

const SUGGESTIONS = [
  'Which tool should I use to turn a PDF chapter into a study guide?',
  'Write me a prompt to fact-check a quote before I publish it.',
  'How do I keep 10 flashcard images looking consistent?',
  'What\'s a good prompt for a 60-second devotional script?'
];

function renderAsk(){
  const log = chatHistory.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}">${escapeHtml(m.content)}</div>`).join('');
  const suggestChips = chatHistory.length===0 ? SUGGESTIONS.map(s=>`<button class="suggest-chip" onclick="sendChat(${JSON.stringify(s)})">${s}</button>`).join(' ') : '';
  return `<div class="section-title"><h2>Ask AI</h2></div>
  <div class="card">
    <div class="chat-log" id="chatLog">${log || '<p style="color:var(--text-muted); font-size:.88rem;">Ask anything about using AI for your teaching or theology work.</p>'}</div>
    <div id="chatSuggest" style="margin-top:10px;">${suggestChips}</div>
    ${uploadedContext ? `<div class="pill on" style="margin-top:10px;">Attached: ${uploadedContext.name} (${uploadedContext.words} words) <a href="#" onclick="clearUpload(); return false;" style="margin-left:8px;">×</a></div>` : ''}
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="Type your question..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendChatFromInput();}"></textarea>
      <label class="btn sm" style="align-self:flex-end;">Upload .txt<input type="file" accept=".txt,text/plain" style="display:none" onchange="handleUpload(event)"></label>
      <button class="btn primary" style="align-self:flex-end;" onclick="sendChatFromInput()" id="sendBtn">Send</button>
    </div>
  </div>`;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function handleUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result).slice(0, 6000);
    uploadedContext = { name:file.name, text, words: text.split(/\s+/).filter(Boolean).length };
    render();
    toast('File attached — I\'ll use it as context for your next question.');
  };
  reader.readAsText(file);
}
function clearUpload(){ uploadedContext = null; render(); }

function sendChatFromInput(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  sendChat(text);
}

async function sendChat(text){
  if(asking) return;
  chatHistory.push({role:'user', content:text});
  chatHistory.push({role:'assistant', content:'…'});
  asking = true;
  render();
  scrollChatBottom();

  try{
    if(!window.claude || !window.claude.use){ throw {code:'not_granted'}; }
    const sample = await window.claude.use('sample');
    if(!sample){ throw {code:'not_granted'}; }

    let ctx = CHAT_CONTEXT;
    if(uploadedContext){ ctx += "\n\nThe user has attached a document called '"+uploadedContext.name+"'. Its content:\n"+uploadedContext.text; }

    const turns = [{role:'user', content:ctx}, {role:'assistant', content:"Understood — I'm ready to help with AI tools for your ESL and theology work."}];
    chatHistory.slice(0,-1).forEach(m=> turns.push(m));

    const res = await sample(turns, {
      modelTier:'default',
      cache:false,
      onText: ({text})=>{
        chatHistory[chatHistory.length-1] = {role:'assistant', content:text};
        renderChatOnly();
      }
    });
    chatHistory[chatHistory.length-1] = {role:'assistant', content:res.text};
  }catch(err){
    const code = err && err.code;
    let msg = "I can't reach the AI chat right now.";
    if(code==='not_granted') msg = "Ask AI isn't available in this view.";
    else if(code==='rate_limited') msg = 'Too many questions at once — give it a moment and try again.';
    else if(code==='cancelled') msg = 'Cancelled.';
    chatHistory[chatHistory.length-1] = {role:'assistant', content: msg};
  }
  asking = false;
  render();
  scrollChatBottom();
}
function renderChatOnly(){
  const el = document.getElementById('chatLog');
  if(el){ el.innerHTML = chatHistory.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}">${escapeHtml(m.content)}</div>`).join(''); scrollChatBottom(); }
}
function scrollChatBottom(){ const el=document.getElementById('chatLog'); if(el) el.scrollTop = el.scrollHeight; }

/* ============================= LIBRARY ============================= */

let libSearchQuery = '';
function libraryResultsHtml(){
  const q = libSearchQuery.trim().toLowerCase();
  const cats = PROMPT_LIBRARY.map(c=>{
    const items = c.items.filter(p => !q || p.toLowerCase().includes(q) || c.cat.toLowerCase().includes(q));
    if(items.length===0) return '';
    const itemsHtml = items.map((p,i)=>`<div class="prompt-card"><p>${p}</p><button class="btn sm" onclick="copyPrompt(this)" data-text="${encodeURIComponent(p)}">Copy</button></div>`).join('');
    return `<div class="lib-cat"><h3>${c.cat}</h3>${itemsHtml}</div>`;
  }).join('');
  return cats || '<div class="empty">No prompts match your search.</div>';
}
function renderLibrary(){
  return `<div class="section-title"><h2>Prompt Library</h2>
    <div class="btn-row"><button class="btn ghost sm" onclick="downloadCheatSheet()">Tool cheat sheet (.txt)</button><button class="btn ghost sm" onclick="downloadLibrary()">All prompts (.txt)</button></div></div>
    <input type="search" placeholder="Search prompts..." value="${libSearchQuery.replace(/"/g,'&quot;')}" oninput="libSearchQuery=this.value; renderLibraryOnly();" style="width:100%; padding:11px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:.88rem; margin-bottom:18px;">
    <div id="libResults">${libraryResultsHtml()}</div>`;
}
function renderLibraryOnly(){
  const el = document.getElementById('libResults');
  if(el) el.innerHTML = libraryResultsHtml();
}
function copyPrompt(btn){
  const text = decodeURIComponent(btn.getAttribute('data-text'));
  navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard')).catch(()=>toast('Could not copy — select the text manually.'));
}
async function downloadOrShow(filename, text){
  try{
    if(window.claude && window.claude.use){
      const downloads = await window.claude.use('downloads');
      if(downloads){
        await downloads.save({filename, data:text});
        toast('Download started.');
        return;
      }
    }
    throw new Error('unavailable');
  }catch(e){
    navigator.clipboard.writeText(text).then(()=>toast("Downloads aren't available here — copied the content to your clipboard instead."))
      .catch(()=>toast('Could not download or copy automatically.'));
  }
}
function downloadLibrary(){
  let text = "AI WORKBENCH — PROMPT LIBRARY\n\n";
  PROMPT_LIBRARY.forEach(c=>{
    text += c.cat.toUpperCase()+"\n";
    c.items.forEach(p=> text += '- '+p+"\n");
    text += "\n";
  });
  downloadOrShow('ai-workbench-prompts.txt', text);
}
function downloadCheatSheet(){
  let text = "AI WORKBENCH — TOOL CHEAT SHEET\nWhich tool for which job\n\n";
  LESSONS.forEach(l=>{
    text += l.title.toUpperCase()+" — "+l.tag+"\n";
    text += l.summary+"\n";
    text += "Try: "+l.tryIt+"\n\n";
  });
  downloadOrShow('ai-workbench-cheat-sheet.txt', text);
}
function exportProgress(){
  const summary = {
    exportedAt: new Date().toISOString(),
    lessonsCompleted: Object.keys(state.lessonsDone),
    quizScores: state.quizBest,
    flashcardsMastered: ALL_CARDS.filter(c=>state.cardStatus[c.id]==='known').map(c=>c.term),
    streak: state.streak
  };
  downloadOrShow('ai-workbench-progress.json', JSON.stringify(summary, null, 2));
}

/* ============================= RENDER ROOT ============================= */

function render(){
  renderNav();
  renderHeader();
  const view = document.getElementById('view');
  if(route.tab==='home') view.innerHTML = renderHome();
  else if(route.tab==='learn') view.innerHTML = renderLearn();
  else if(route.tab==='games') view.innerHTML = renderGames();
  else if(route.tab==='review') view.innerHTML = renderReview();
  else if(route.tab==='projects') view.innerHTML = renderProjects();
  else if(route.tab==='ask') view.innerHTML = renderAsk();
  else if(route.tab==='library') view.innerHTML = renderLibrary();
  else view.innerHTML = renderHome();
}

render();
</script>
