<style>

}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  background:var(--ink); color:#fff; border-bottom:3px solid var(--ink);
}
.top-in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.logo b{color:var(--amber)}
.chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;color:#fff}
button.chip:hover{background:rgba(255,255,255,.22)}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.btn{

  padding:10px 16px;font-weight:800;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:12px}
.btn.ghost{background:var(--card)}
.btn.go{background:var(--good);color:#fff}
.btn.pink{background:var(--pink);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
.hero{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px;display:grid;gap:12px;margin-bottom:22px}
.hero h1{font-size:clamp(26px,6vw,38px)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.bar{height:14px;background:var(--soft);border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--amber),var(--teal));border-radius:99px;transition:width .4s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.file{
  text-align:left;border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--ink);
  display:grid;gap:6px;min-height:150px;align-content:start;transition:transform .12s;
}
.file:hover{transform:translateY(-2px) rotate(-.5deg)}
.file:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.file .num{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.file .ttl{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05}
.file .gr{font-size:13px;font-weight:700;opacity:.9}
.file .st{margin-top:auto;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;gap:6px}
.mini{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.45);overflow:hidden;border:1.5px solid currentColor}
.mini i{display:block;height:100%;background:currentColor}
.sec{margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.sec h2{font-size:24px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.game{
  display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;
  background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--ink);
}
.game:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.game .ic{width:52px;height:52px;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;font-size:26px}
.game .nm{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1}
.game .ds{font-size:13px;color:var(--muted);font-weight:700}
.stars{letter-spacing:1px;font-size:15px}
.stars .off{opacity:.22;filter:grayscale(1)}
.fhead{border:3px solid var(--ink);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--ink);display:grid;gap:8px}
.fhead h1{font-size:clamp(28px,7vw,42px)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:rgba(255,255,255,.85);color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px}
/* game frame */
.gtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.x{width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:var(--card);font-weight:800;font-size:18px;box-shadow:0 3px 0 var(--ink);flex:none}
.gtop .bar{flex:1}
.combo{font-family:var(--display);font-weight:800;background:var(--orange);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 10px;flex:none;font-variant-numeric:tabular-nums}
.combo.zero{background:var(--card);color:var(--muted)}
.hearts{font-size:18px;flex:none;letter-spacing:1px}
.gname{font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted);margin:-6px 0 10px}
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:18px;display:grid;gap:10px;justify-items:center;text-align:center;margin-bottom:16px}
.big{font-size:64px;line-height:1.1}
.vi{font-weight:800;color:var(--purple);font-size:18px}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(22px,5.4vw,30px);line-height:1.2;text-wrap:balance}
.blank{display:inline-block;min-width:70px;border-bottom:4px dashed var(--pink);color:var(--pink)}
.hint{color:var(--muted);font-weight:700;font-size:14px}
.audio{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:14px 12px;font-weight:800;font-size:18px;
  box-shadow:0 4px 0 var(--ink);text-align:center;transition:transform .08s,background .15s;
}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.ok{background:var(--good);color:#fff;animation:pop .35s}
.opt.no{background:var(--bad);color:#fff;animation:shake .35s}
.opt.dim{opacity:.45}
.opts.locked .opt{pointer-events:none}
.fb{margin-top:14px;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:800}
.fb.good{background:var(--goodbg)}
.fb.bad{background:var(--badbg)}
.fb .msg{flex:1;min-width:180px}
.fb small{display:block;font-weight:700;color:var(--muted)}
.story{background:#fdf3d7;border:3px dashed var(--ink);border-radius:16px;padding:12px 14px;text-align:left;font-size:16px;max-width:60ch;max-height:190px;overflow:auto}
.bubble{background:var(--soft);border:3px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:800;font-size:20px;text-align:left}

.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;padding:10px;border:3px dashed var(--muted);border-radius:16px;background:var(--soft);margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.tile{min-width:44px;height:48px;padding:0 12px;border:3px solid var(--ink);border-radius:12px;background:var(--amber);font-weight:800;font-size:20px;box-shadow:0 3px 0 var(--ink)}
.tile.w{background:var(--teal);color:var(--ink);font-size:17px}
.tile.empty{background:transparent;border-style:dashed;box-shadow:none;pointer-events:none;opacity:.5}
.tile.used{visibility:hidden}
.slots.ok{border-color:var(--good);background:var(--goodbg)}
.slots.no{border-color:var(--bad);background:var(--badbg);animation:shake .35s}

.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mt{min-height:78px;border:3px solid var(--ink);border-radius:16px;background:var(--card);font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--ink);padding:6px;display:grid;place-items:center;text-align:center;line-height:1.15}
.mt .e{font-size:26px;display:block}
.mt.sel{background:var(--amber);transform:translateY(-2px)}
.mt.done{background:var(--good);color:#fff;opacity:.35;pointer-events:none}
.mt.no{background:var(--bad);color:#fff;animation:shake .35s}

.flash{perspective:900px;margin-bottom:16px}
.fcard{position:relative;height:260px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;align-content:center;gap:8px;padding:16px;text-align:center;background:var(--card)}
.face.back{transform:rotateY(180deg);background:var(--teal)}
.face .w{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.05}
.face.back .w{font-size:clamp(24px,6vw,34px)}

.result{text-align:center;display:grid;gap:12px;justify-items:center;background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:26px 18px}
.result .bigstars{font-size:54px;letter-spacing:4px}
.result .pct{font-family:var(--display);font-weight:800;font-size:44px;font-variant-numeric:tabular-nums}
.review{display:grid;gap:8px;width:100%;max-width:520px;text-align:left;margin-top:6px}
.rv{text-align:left;background:var(--badbg);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700}
.exam{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-align:left;width:100%;margin-top:18px;background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--purple)}
.exam .ic{width:56px;height:56px;border-radius:14px;background:var(--amber);display:grid;place-items:center;font-size:28px;border:3px solid #fff}
.exam .nm{font-family:var(--display);font-weight:800;font-size:22px}
.exam .ds{font-size:13px;opacity:.85;font-weight:700}
.exam b{color:var(--amber);font-size:14px}
.opt.pick,.tile.pick{background:var(--blue);color:#fff}
#timer.low{background:var(--bad);color:#fff}
textarea.txt{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);resize:vertical}
.secs{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:minmax(120px,170px) 1fr 52px;gap:10px;align-items:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.wbox{background:var(--soft);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;white-space:pre-wrap;margin:8px 0}
.wbox.model{background:var(--goodbg)}
.chk{margin:6px 0;padding-left:4px;list-style:none;display:grid;gap:4px;font-weight:700;font-size:14px}
details summary{cursor:pointer;padding:6px 0}
.note{margin-top:28px;font-size:13px;color:var(--muted);font-weight:700;max-width:65ch}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes rise{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.anim{animation:rise .3s ease-out}
@media (max-width:420px){.mgrid{grid-template-columns:repeat(2,1fr)}.big{font-size:54px}.opt{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.brandbar{max-width:820px;margin:0 auto;padding:8px 16px 0;text-align:right}
.brandmark{display:inline-flex;align-items:baseline;gap:1px;font-family:ui-monospace,ui-monospace,Menlo,monospace;font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted, #5b6b7d)}

.brandmark i{font-style:normal;color:#7a5200}
</style>

function tone(f,d,type,t0,vol){
  if(!store.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(t0||0);
    o.type=type||"triangle";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.05);
  }catch(e){}
}

  let html=`<section class="fhead anim" style="background:${bg};color:${fg}">
    <div class="row" style="justify-content:space-between"><button class="btn sm ghost" id="back">← Tất cả File</button><b>⭐ ${fileStars(i)}/${GAMES.length*3}</b></div>
    <span class="num label" style="color:${fg};opacity:.85">File ${i+1}</span>
    <h2>${esc(f.t)}</h2>
    <div class="tagrow"><span class="tag">🧠 ${esc(f.g)}</span><span class="tag">🔤 ${esc(f.v)}</span><span class="tag">${f.vocab.length} từ</span></div>
  </section>`;
  const best=store.tests&&store.tests[i]!=null?store.tests[i]:null;
  html+=`<button class="exam" id="exam"><span class="ic">📝</span><span><span class="nm">Thi thử File ${i+1}</span><br><span class="ds">Giống bài kiểm tra thật: ngữ pháp, từ vựng, phát âm, đọc, nghe, viết · 44 câu · 40 phút · chấm điểm /100 · không gợi ý</span><br><b>${best!=null?"Điểm cao nhất: "+best+"/100":"Chưa làm bài thi nào"}</b></span></button>`;
  Object.keys(SECS).forEach(sec=>{
    html+=`<div class="sec"><span style="font-size:24px">${SECS[sec]}</span><h2>${SECVI[sec]}</h2></div><div class="games">`;
    GAMES.filter(g=>g.sec===sec).forEach(g=>{
      html+=`<button class="game" data-g="${g.id}"><span class="ic" style="background:${g.c}">${g.icon}</span>
      <span><span class="nm">${g.name}</span><br><span class="ds">${g.desc}</span><br><span class="stars">${starStr(store.stars[i+"-"+g.id]||0)}</span></span></button>`;
    });
    html+=`</div>`;
  });
  app.innerHTML=html;
  $("#back").onclick=()=>{sfx.click();home();};
  app.querySelectorAll(".game").forEach(b=>b.onclick=()=>{sfx.click();play(i,b.dataset.g);});
  $("#exam").onclick=()=>{sfx.click();startTest([i],i);};
  top0();
}

/* ============ GAME FRAME ============ */
let cur=null;
function frame(body,{i,n,combo,hearts}){
  const g=GAMES.find(x=>x.id===cur.g);
  const title=cur.f<0?"🌈 Tổng hợp":`File ${cur.f+1} · ${g.icon} ${g.name}`;
  app.innerHTML=`<div class="gtop"><button class="x" id="quit" aria-label="Thoát trò chơi">✕</button>
    <div class="bar"><i style="width:${n?(i/n*100):0}%"></i></div>
    ${hearts!=null?`<span class="hearts">${"❤️".repeat(Math.max(hearts,0))}${"🤍".repeat(Math.max(3-hearts,0))}</span>`:""}
    <span class="combo ${combo>1?"":"zero"}">🔥×${combo||0}</span></div>
    <div class="gname">${title}</div><div class="anim">${body}</div>`;
  $("#quit").onclick=()=>{sfx.click();try{speechSynthesis.cancel();}catch(e){}cur.f<0?home():fileView(cur.f);};
}
function audioBtns(){return `<div class="audio"><button class="btn sm blue" id="aPlay">🔊 Nghe</button><button class="btn sm ghost" id="aSlow">🐢 Chậm</button></div>`;}
function wireAudio(t){const p=$("#aPlay"),s=$("#aSlow");if(p)p.onclick=()=>say(t);if(s)s.onclick=()=>say(t,true);}

function play(fi,gid){
  cur={f:fi,g:gid};
  const F=fi>=0?FILES[fi]:null;
  const run={flash,match,pick,ear,spell,gap,build,fix,hear,read,talk,write,boss}[gid];
  run(F);top0();
}

/* ---- generic multiple choice ---- */
function mcq(items,opt){
  opt=opt||{};let i=0,right=0,combo=0,hearts=opt.hearts?3:null;const miss=[];
  function draw(){
    if(i>=items.length||(hearts!=null&&hearts<=0))return finish(right,items.length,hearts,miss);
    const it=items[i];
    frame(`<div class="qcard">${it.q}${it.say?audioBtns():""}</div>
      <div class="opts ${it.cols||""}" id="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="fb"></div>`,{i,n:items.length,combo,hearts});
    if(it.say){wireAudio(it.say);say(it.say);}
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const choice=it.opts[+b.dataset.k],ok=choice===it.ans;
      $("#opts").classList.add("locked");
      app.querySelectorAll(".opt").forEach(x=>{if(it.opts[+x.dataset.k]===it.ans)x.classList.add("ok");else if(x!==b)x.classList.add("dim");});
      if(ok){right++;combo++;store.xp+=combo>=3?15:10;sfx.good(combo);}
      else{b.classList.add("no");combo=0;if(hearts!=null)hearts--;sfx.bad();miss.push(it.rev||it.after||it.ans);}
      chips();
      if(it.after)setTimeout(()=>say(it.after),ok?350:500);
      const ex=it.explain?`<small>${it.explain}</small>`:"";
      if(ok&&!it.explain&&!it.after){
        $("#fb").innerHTML=`<div class="fb good"><span class="msg">${PRAISE[Math.floor(Math.random()*PRAISE.length)]}${combo>=3?" 🔥 Thưởng chuỗi đúng!":""}</span></div>`;
        setTimeout(()=>{i++;draw();},800);
      }else{
        $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><span class="msg">${ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:"Chưa đúng. Đáp án: "+esc(it.ans)}${ex}</span><button class="btn go" id="next">Tiếp →</button></div>`;
        const nx=$("#next");nx.focus();nx.onclick=()=>{sfx.click();i++;draw();};
      }
    });
  }
  draw();
}

/* ---- vocabulary games ---- */
function flash(F){
  let deck=shuffle(F.vocab),known=0,total=F.vocab.length;
  function draw(){
    if(!deck.length)return finish(total,total);
    const [en,em,vi]=deck[0];
    frame(`<div class="flash"><div class="fcard" id="card" role="button" tabindex="0" aria-label="Lật thẻ">
      <div class="face"><div class="big">${em}</div><div class="w">${esc(en)}</div><div class="hint">Chạm để xem nghĩa</div></div>
      <div class="face back"><div class="big">${em}</div><div class="w">${esc(vi)}</div><div class="hint" style="color:var(--ink)">${esc(en)}</div></div></div></div>
      <div class="row" style="justify-content:center"><button class="btn blue" id="aPlay">🔊 Nghe</button><button class="btn ghost" id="again">🔁 Học lại</button><button class="btn go" id="got">✅ Đã thuộc</button></div>
      <p class="hint" style="text-align:center">Đã thuộc ${known}/${total} từ</p>`,{i:known,n:total,combo:0});
    const c=$("#card");
    const flip=()=>{c.classList.toggle("flip");sfx.flip();};
    c.onclick=flip;c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}};
    $("#aPlay").onclick=()=>say(en);
    $("#again").onclick=()=>{sfx.click();deck.push(deck.shift());draw();};
    $("#got").onclick=()=>{sfx.good(0);known++;store.xp+=2;chips();deck.shift();draw();};
    say(en);
  }
  draw();
}
function match(F){
  const set=sample(F.vocab,6);let miss=0,done=0,sel=null,combo=0;
  const tiles=shuffle(set.flatMap((v,k)=>[{k,side:"en",h:esc(v[0])},{k,side:"vi",h:`<span class="e">${v[1]}</span>${esc(v[2])}`}]));
  frame(`<p class="hint" style="text-align:center;margin:0 0 12px">Chạm vào một từ tiếng Anh, rồi chạm vào nghĩa của nó.</p><div class="mgrid">${tiles.map((t,x)=>`<button class="mt" data-x="${x}">${t.h}</button>`).join("")}</div>`,{i:0,n:6,combo:0});
  const btns=[...app.querySelectorAll(".mt")];
  btns.forEach(b=>b.onclick=()=>{
    const t=tiles[+b.dataset.x];
    if(sel===null){sel=b;b.classList.add("sel");sfx.pop();if(t.side==="en")say(set[t.k][0]);return;}
    if(sel===b){b.classList.remove("sel");sel=null;return;}
    const s=tiles[+sel.dataset.x];
    if(s.k===t.k&&s.side!==t.side){
      [sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("done");});
      done++;combo++;store.xp+=10;sfx.good(combo);say(set[t.k][0]);
      $(".gtop .bar i").style.width=(done/6*100)+"%";$(".combo").textContent="🔥×"+combo;$(".combo").classList.toggle("zero",combo<2);chips();
      if(done===6)setTimeout(()=>finish(6,6+miss),700);
    }else{
      miss++;combo=0;sfx.bad();const a=sel;
      [a,b].forEach(x=>{x.classList.remove("sel");x.classList.add("no");});
      setTimeout(()=>[a,b].forEach(x=>x.classList.remove("no")),400);
      $(".combo").textContent="🔥×0";$(".combo").classList.add("zero");
    }
    sel=null;
  });
}
function wordOpts(F,en,n){return shuffle([en,...sample(F.vocab.map(v=>v[0]).filter(w=>w!==en),n-1)]);}
function pick(F){
  mcq(sample(F.vocab,10).map(([en,em,vi])=>({q:`<div class="big">${em}</div><div class="vi">${esc(vi)}</div><div class="hint">Đây là từ tiếng Anh nào?</div>`,opts:wordOpts(F,en,4),ans:en,after:en,cols:"two"})));
}
function ear(F){
  mcq(sample(F.vocab,10).map(([en])=>({q:`<div class="big">👂</div><div class="qtext">Bạn nghe thấy từ nào?</div>`,say:en,opts:wordOpts(F,en,4),ans:en,cols:"two"})));
}

/* ---- tile builder (spell / build) ---- */
function tileGame(rounds,sep,cls){
  let i=0,right=0,combo=0;const miss=[];
  function draw(){
    if(i>=rounds.length)return finish(right,rounds.length,null,miss);
    const r=rounds[i];let pool=r.tokens.map((t,k)=>({t,k}));
    do{pool=shuffle(pool);}while(pool.length>1&&pool.map(p=>p.t).join("")===r.tokens.join(""));
    let picked=[],tried=false;
    frame(`<div class="qcard">${r.hint}${r.say?audioBtns():""}</div><div class="slots" id="slots"></div><div class="pool" id="pool"></div>
      <div class="row" style="justify-content:center"><button class="btn ghost" id="clr">↺ Xóa</button><button class="btn go" id="chk" disabled>Kiểm tra ✓</button></div><div id="fb"></div>`,{i,n:rounds.length,combo});
    if(r.say){wireAudio(r.say);say(r.say);}
    function paint(){
      $("#slots").innerHTML=picked.map((p,x)=>`<button class="tile ${cls}" data-x="${x}">${esc(p.t)}</button>`).join("")+(cls?"":Array(r.tokens.length-picked.length).fill('<span class="tile empty"></span>').join(""));
      $("#pool").innerHTML=pool.map((p,x)=>`<button class="tile ${cls} ${picked.includes(p)?"used":""}" data-x="${x}">${esc(p.t)}</button>`).join("");
      $("#chk").disabled=picked.length!==r.tokens.length;
      $("#pool").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{const p=pool[+b.dataset.x];if(picked.includes(p))return;picked.push(p);sfx.pop();paint();if(picked.length===r.tokens.length&&!cls)check();});
      $("#slots").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.x,1);sfx.click();paint();});
    }
    function check(){
      const ok=picked.map(p=>p.t).join(sep)===r.tokens.join(sep);
      const sl=$("#slots");sl.classList.remove("ok","no");void sl.offsetWidth;
      if(ok){
        sl.classList.add("ok");if(!tried){right++;combo++;store.xp+=combo>=3?15:10;}sfx.good(combo);chips();say(r.answer);
        $("#fb").innerHTML=`<div class="fb good"><span class="msg">${PRAISE[Math.floor(Math.random()*PRAISE.length)]} ${esc(r.answer)}</span><button class="btn go" id="next">Tiếp →</button></div>`;
        $("#chk").disabled=true;$("#clr").disabled=true;$("#pool").style.pointerEvents="none";$("#slots").style.pointerEvents="none";
        $("#next").onclick=()=>{sfx.click();i++;draw();};
      }else{
        sl.classList.add("no");sfx.bad();combo=0;if(!tried)miss.push(r.answer);
        if(!tried){tried=true;$("#fb").innerHTML=`<div class="fb bad"><span class="msg">Thử lại lần nữa nhé!<small>Chạm vào ô trong khung để trả lại.</small></span></div>`;}
        else{
          $("#fb").innerHTML=`<div class="fb bad"><span class="msg">Đáp án: ${esc(r.answer)}</span><button class="btn go" id="next">Tiếp →</button></div>`;
          say(r.answer);$("#next").onclick=()=>{sfx.click();i++;draw();};
        }
      }
    }
    $("#clr").onclick=()=>{picked=[];sfx.click();paint();};
    $("#chk").onclick=check;
    paint();
  }
  draw();
}
function spell(F){
  let words=F.vocab.filter(v=>/^[A-Za-z]{3,10}$/.test(v[0]));
  words=sample(words,Math.min(8,words.length));
  tileGame(words.map(([en,em,vi])=>({tokens:en.toLowerCase().split(""),answer:en,say:en,hint:`<div class="big">${em}</div><div class="vi">${esc(vi)}</div><div class="hint">Nghe và đánh vần từ này</div>`})),"","");
}
function build(F){
  tileGame(sample(F.sent,6).map(s=>({tokens:s.split(" "),answer:s,say:null,hint:`<div class="big">🧱</div><div class="qtext">Sắp xếp các từ thành câu</div>`})).concat(
    sample(F.gram.filter(g=>!/ – |→/.test(g[0])&&g[1]!=="–"),2).map(g=>{const s=g[0].replace(/^\([^)]*\)\s*/,"").replace(/\s*\([^)]*\)\s*$/,"").replace("___",g[1]).replace(/^7:30 → /,"");return {tokens:s.split(" "),answer:s,say:null,hint:`<div class="big">🧱</div><div class="qtext">Sắp xếp các từ thành câu</div>`};})
  )," ","w");
}

/* ---- grammar ---- */
function gapItem(g){
  const [s,a,...w]=g;
  return {q:`<div class="qtext">${esc(s).replace("___",'<span class="blank">&nbsp;?&nbsp;</span>')}</div><div class="hint">Chọn từ còn thiếu</div>`,opts:shuffle([a,...w]),ans:a,after:s.replace(/^\([^)]*\)\s*/,"").replace(/^7:30 → /,"").replace(/\s*\([^)]*\)\s*$/,"").replace("___",a==="–"?"":a).replace(/\s+/g," ")};
}
function gap(F){mcq(sample(F.gram,10).map(gapItem));}
function fixItem(r){
  const [s,c]=r;
  return {q:`<div class="big">🕵️</div><div class="qtext">${esc(s)}</div><div class="hint">Câu này đúng hay sai?</div>`,opts:["✅ Đúng","❌ Sai"],ans:c?"❌ Sai":"✅ Đúng",cols:"two",explain:c?"Câu đúng: <b>"+esc(c)+"</b>":null,after:c||s};
}
function fix(F){mcq(sample(F.rw,8).map(fixItem));}

/* ---- skills ---- */
function hearItem(F,s,pool){
  const others=sample((pool||F.sent).filter(x=>x!==s),2);
  return {q:`<div class="big">🎧</div><div class="qtext">Bạn nghe thấy câu nào?</div>`,say:s,opts:shuffle([s,...others]),ans:s};
}
function hear(F){mcq(sample(F.sent,6).map(s=>hearItem(F,s)).concat(sample(F.talk,2).map(t=>hearItem(F,t[1],[t[2],t[3]]))));}
function read(F){
  const R=sample(F.reads,1)[0];
  mcq(R.q.map(([st,v])=>({rev:st+" → "+(v?"True":"False"),q:`<div class="story">${esc(R.t)}</div><div class="qtext">${esc(st)}</div><div class="hint">Đọc đoạn văn, câu trên đúng hay sai?</div>`,opts:["✅ Đúng","❌ Sai"],ans:v?"✅ Đúng":"❌ Sai",cols:"two"})));
}
function talkItem(t){
  const [p,a,...w]=t;
  return {q:`<div class="row" style="width:100%"><span style="font-size:34px">🧑</span><div class="bubble">${esc(p)}</div></div><div class="hint">Chọn câu đáp phù hợp nhất</div>`,say:p,opts:shuffle([a,...w]),ans:a,after:a,explain:"🗣️ Giờ hãy đọc to câu này: <b>"+esc(a)+"</b>"};
}
function talk(F){mcq(sample(F.talk,6).map(talkItem));}
function write(F){
  const items=sample(F.sent,6);let i=0,right=0,combo=0;const miss=[];
  function draw(){
    if(i>=items.length)return finish(right,items.length,null,miss);
    const s=items[i];
    frame(`<div class="qcard"><div class="big">⌨️</div><div class="qtext">Gõ lại câu bạn nghe được</div>${audioBtns()}</div>
      <form id="wf" autocomplete="off"><input class="txt" id="dict" placeholder="Gõ câu vào đây" autocapitalize="sentences" spellcheck="false" autocorrect="off">
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" type="button" id="hint">💡 Gợi ý</button><button class="btn go" type="submit">Kiểm tra ✓</button></div></form><div id="fb"></div>`,{i,n:items.length,combo});
    wireAudio(s);say(s);
    const inp=$("#dict");inp.focus();
    $("#hint").onclick=()=>{const w=s.split(" ");inp.placeholder=w[0]+" "+w.slice(1).map(x=>x[0]+"…").join(" ");sfx.pop();};
    $("#wf").onsubmit=e=>{
      e.preventDefault();
      const ok=norm(inp.value)===norm(s);
      if(ok){right++;combo++;store.xp+=combo>=3?20:15;sfx.good(combo);}else{combo=0;sfx.bad();miss.push(s);}
      chips();inp.disabled=true;
      const mine=new Set(norm(inp.value).split(" "));
      const marked=s.split(" ").map(w=>mine.has(norm(w))?esc(w):`<u style="color:var(--bad)">${esc(w)}</u>`).join(" ");
      $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><span class="msg">${ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:"Gần đúng rồi! Từ gạch chân là từ bạn viết sai hoặc thiếu:"}<small>${marked}</small></span><button class="btn go" id="next">Tiếp →</button></div>`;
      $("#wf button[type=submit]").disabled=true;
      const nx=$("#next");nx.focus();nx.onclick=()=>{sfx.click();i++;draw();};
    };
  }
  draw();
}
function bossFrom(F,n){
  const it=[];
  sample(F.gram,3).forEach(g=>it.push(gapItem(g)));
  sample(F.rw,2).forEach(r=>it.push(fixItem(r)));
  sample(F.vocab,2).forEach(([en,em,vi])=>it.push({q:`<div class="big">${em}</div><div class="vi">${esc(vi)}</div>`,opts:wordOpts(F,en,4),ans:en,cols:"two"}));
  sample(F.sent,2).forEach(s=>it.push(hearItem(F,s)));
  it.push(talkItem(sample(F.talk,1)[0]));
  return shuffle(it).slice(0,n).map(x=>Object.assign({},x,{explain:x.explain&&x.explain.startsWith("🗣️")?null:x.explain,after:null}));
}
function boss(F){
  if(F)return mcq(bossFrom(F,10),{hearts:true});
  const pool=[];sample(FILES,5).forEach(f=>pool.push(...bossFrom(f,3)));
  mcq(shuffle(pool),{hearts:true});
}

/* ============ RESULTS ============ */
function finish(right,total,hearts,miss){
  miss=[...new Set(miss||[])];
  const pct=Math.round(right/total*100);
  const stars=pct>=100?3:pct>=80?2:pct>=50?1:0;
  const key=(cur.f<0?"mega":cur.f)+"-"+cur.g;
  const prev=store.stars[key]||0,better=stars>prev;
  if(cur.f>=0&&better)store.stars[key]=stars;
  if(cur.f<0&&better)store.stars[key]=stars;
  const bonus=stars*20;store.xp+=bonus;
  const t=today();
  if(store.last!==t){const y=new Date(Date.now()-864e5).toLocaleDateString("en-CA");store.streak=store.last===y?(store.streak||0)+1:1;store.last=t;}
  save();chips();
  const lostAll=hearts!=null&&hearts<=0;
  const head=lostAll?"Hết mạng rồi! 💥":stars===3?"Hoàn hảo! 🏆":stars===2?"Làm tốt lắm! 🎉":stars===1?"Khá lắm! 👍":"Cố gắng thêm nhé! 💪";
  stars>0&&!lostAll?sfx.win():sfx.lose();
  if(stars>=2&&!lostAll)confetti();
  const gi=GAMES.findIndex(g=>g.id===cur.g),next=cur.f>=0&&gi<GAMES.length-1?GAMES[gi+1]:null;
  app.innerHTML=`<section class="result anim">
    <span class="label">${cur.f<0?"Tổng hợp":"File "+(cur.f+1)+" · "+GAMES[gi].name}</span>
    <h2 style="font-size:34px">${head}</h2>
    <div class="bigstars stars">${starStr(stars)}</div>
    <div class="pct">${pct}%</div>
    <b>Đúng ${right}/${total} câu · +${bonus} XP thưởng${better&&prev>0?" · Kỷ lục mới!":""}</b>
    <div class="row" style="justify-content:center">
      <button class="btn" id="again">🔁 Chơi lại</button>
      ${next?`<button class="btn go" id="nextG">${next.icon} Tiếp: ${next.name}</button>`:""}
      <button class="btn ghost" id="toFile">${cur.f<0?"🏠 Trang chủ":"📂 Về File"}</button>
    </div>${miss.length?`<div class="review"><span class="label">📝 Cần ôn lại (${miss.length})</span>${miss.map((m,k)=>`<button class="rv" data-k="${k}">🔊 ${esc(m)}</button>`).join("")}</div>`:""}</section>`;
  app.querySelectorAll(".rv").forEach(b=>b.onclick=()=>say(miss[+b.dataset.k].replace(/ → (True|False)$/,"")));
  const f=cur.f,g=cur.g;
  $("#again").onclick=()=>{sfx.click();play(f,g);};
  if(next)$("#nextG").onclick=()=>{sfx.click();play(f,next.id);};
  $("#toFile").onclick=()=>{sfx.click();f<0?home():fileView(f);};
  top0();
}

/* ============ CONFETTI ============ */
function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#fx");cv.hidden=false;const ctx=cv.getContext("2d");
  const W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cols=["#FF4F8B","#FFB627","#17C3B2","#3A86FF","#8338EC","#FB5607"];
  const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*6)]}));
  let t=0;
  (function step(){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(++t<150)requestAnimationFrame(step);else{ctx.clearRect(0,0,W,H);cv.hidden=true;}
  })();
}

function expand(s){return norm(s).replace(/\bi'm\b/g,"i am").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/\bwon't\b/g,"will not").replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'s\b/g," is").replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/\s+/g," ").trim();}

function buildTest(idx){

  sample(flat("rw").filter(o=>o.x[1]),5).forEach(({x})=>Q.push({sec:"G",kind:"fixw",q:`<div class="hint">Câu sau có một lỗi sai. Viết lại câu đúng.</div><div class="qtext">${esc(x[0])}</div>`,ans:x[1],show:x[1]}));
  const voc=sample(flat("vocab"),10);
  voc.slice(0,6).forEach(({x})=>Q.push({sec:"V",kind:"vocw",q:`<div class="big">${x[1]}</div><div class="vi">${esc(x[2])}</div><div class="hint">Viết từ tiếng Anh (chú ý chính tả)</div>`,ans:x[0],show:x[0]}));
  voc.slice(6).forEach(({x,F})=>Q.push({sec:"V",kind:"mc",q:`<div class="vi" style="font-size:22px">${esc(x[2])}</div><div class="hint">Chọn từ tiếng Anh đúng</div>`,opts:wordOpts(F,x[0],4),ans:x[0],show:x[0]}));
  sample(idx.flatMap(i=>STRESS[i]),5).forEach(w=>{const syl=w.split("-");Q.push({sec:"P",kind:"stress",syl:syl.map(s=>s.toLowerCase()),ans:syl.findIndex(s=>s===s.toUpperCase()),show:syl.join("·")+"  (trọng âm: "+syl.find(s=>s===s.toUpperCase())+")"});});
  sample(fs.flatMap(F=>F.reads),2).forEach(R=>R.q.forEach(([st,v])=>Q.push({sec:"R",kind:"mc",story:R.t,q:`<div class="qtext">${esc(st)}</div><div class="hint">Đúng hay sai theo bài đọc?</div>`,opts:["✅ Đúng","❌ Sai"],ans:v?"✅ Đúng":"❌ Sai",show:st+" → "+(v?"Đúng":"Sai")})));
  const sents=flat("sent");
  sample(sents,4).forEach(({x,F})=>{Q.push({sec:"L",kind:"mc",say:x,q:`<div class="big">🎧</div><div class="qtext">Bạn nghe thấy câu nào?</div>`,opts:shuffle([x,...sample(F.sent.filter(s=>s!==x),2)]),ans:x,show:x});});
  sample(flat("vocab").filter(o=>/^[A-Za-z]{3,10}$/.test(o.x[0])),3).forEach(({x})=>Q.push({sec:"L",kind:"vocw",say:x[0],q:`<div class="big">✏️</div><div class="qtext">Nghe và viết từ</div>`,ans:x[0],show:x[0]}));
  sample(flat("talk"),3).forEach(({x})=>{const [p,a,...w]=x;Q.push({sec:"L",kind:"mc",say:p,q:`<div class="big">💬</div><div class="qtext">Nghe câu hỏi. Chọn câu đáp đúng.</div>`,opts:shuffle([a,...w]),ans:a,show:p+" → "+a});});
  const wi=idx[Math.floor(Math.random()*idx.length)];
  Q.push({sec:"W",kind:"write",w:WRITE[wi]});
  return Q;
}
function writeScore(text,w){
  const t=text.trim(),words=t?t.split(/\s+/).length:0;
  const sents=t.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const caps=sents.length>0&&sents.every(s=>/^[A-Z0-9"']/.test(s))&&/[.!?]["']?$/.test(t);
  const rows=[[words>=25?4:words>=15?2:0,4,`Độ dài: ${words} từ (cần ≥ 25)`],[sents.length>=3?2:0,2,`Số câu: ${sents.length} (cần ≥ 3)`],[caps?2:0,2,"Viết hoa đầu câu, có dấu chấm cuối câu"]];
  w.c.forEach(([re,lab])=>rows.push([re.test(t)?2:0,2,lab]));
  return {score:rows.reduce((a,r)=>a+r[0],0),rows};
}

      <div style="text-align:center;display:grid;gap:6px;justify-items:center">
      <span class="label">${key==="final"?"🎓 Thi cuối khóa":"📝 Thi thử File "+(idx[0]+1)} · ${new Date().toLocaleString("vi-VN")}</span>
      <div class="pct" style="color:${band[1]}">${total}<span style="font-size:24px;color:var(--muted)">/100</span></div>
      <h2 style="font-size:30px">${band[0]}</h2>
      <b>Thời gian: ${Math.floor(used/60)} phút ${used%60} giây${total>prev&&prev>0?" · Kỷ lục mới!":""}</b></div>
      <div class="secs">${Object.keys(SECT).map(k=>`<div class="srow"><span>${SECT[k][0]}</span><div class="bar"><i style="width:${secPts[k]/secMax[k]*100}%"></i></div><b>${secPts[k]}/${secMax[k]}</b></div>`).join("")}</div>
      ${weak.length?`<div class="fb bad" style="display:block"><b>Cần luyện thêm:</b><ul style="margin:6px 0 0;padding-left:20px">${weak.map(k=>`<li>${SECT[k][0]}: ${tips[k]}</li>`).join("")}</ul></div>`:`<div class="fb good">Tất cả các phần đều đạt từ 60% trở lên. Rất tốt!</div>`}
      <details open><summary class="label">✍️ Bài viết · ${wr.score}/14 điểm (máy chấm ước tính)</summary>
        <div class="wbox">${wr.text?esc(wr.text):"<i>(bỏ trống)</i>"}</div>
        <ul class="chk">${wr.rows.map(r=>`<li>${r[0]===r[1]?"✅":"❌"} ${esc(r[2])} <b>(${r[0]}/${r[1]})</b></li>`).join("")}</ul>
        <div class="hint">Bài mẫu:</div><div class="wbox model">${esc(wr.w.m)}</div>
        <p class="hint">Máy chỉ kiểm tra độ dài, dấu câu và cấu trúc cần dùng. Hãy nhờ giáo viên chấm lại lỗi ngữ pháp và chính tả.</p></details>
      <details ${wrong.length?"open":""}><summary class="label">📝 Câu sai (${wrong.length})</summary>
        <div class="review" style="max-width:none">${wrong.map((w,k)=>`<div class="rv"><small>${SECT[w.sec][0]}</small><br>${w.your!==""?`<s>${esc(w.your)}</s> → `:"(bỏ trống) → "}<b>${esc(w.right)}</b> ${w.say?`<button class="btn sm ghost rvs" data-k="${k}">🔊</button>`:""}</div>`).join("")||"Không có câu sai. Tuyệt vời!"}</div></details>
      <details><summary class="label">🗣️ Luyện nói (phần thi nói với giáo viên)</summary>
        <p class="hint">Trong bài thi thật, giáo viên sẽ hỏi bạn. Nghe câu hỏi, tự trả lời thành tiếng bằng câu đầy đủ, rồi xem câu mẫu.</p>
        <div class="review" style="max-width:none">${talkQs.map((t,k)=>`<div class="rv"><button class="btn sm blue spk" data-k="${k}">🔊</button> <b>${esc(t[0])}</b><br><small>Câu mẫu: ${esc(t[1])}</small></div>`).join("")}</div></details>
      <div class="row" style="justify-content:center">
        <button class="btn" id="again">🔁 Làm đề mới</button>
        <button class="btn ghost" id="toFile">${key==="final"?"🏠 Trang chủ":"📂 Về File"}</button></div>
      <p class="hint" style="text-align:center">Chụp màn hình trang này để gửi kết quả cho giáo viên.</p></section>`;
    app.querySelectorAll(".rvs").forEach(b=>b.onclick=()=>say(wrong[+b.dataset.k].say));
    app.querySelectorAll(".spk").forEach(b=>b.onclick=()=>say(talkQs[+b.dataset.k][0]));
    $("#again").onclick=()=>{sfx.click();startTest(idx,key);};
    $("#toFile").onclick=()=>{sfx.click();key==="final"?home():fileView(idx[0]);};
    top0();
  }
  draw();
}

home();
</script>

<div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Thông báo về cookie" hidden>

    <div class="cookie-actions">
      <button type="button" id="cookie-accept" class="btn">Đồng ý</button>
      <button type="button" id="cookie-decline" class="btn">Từ chối</button>
    </div>
  </div>
</div>
<script>
(function(){
  var KEY='de-consent';
  var banner=document.getElementById('cookie-banner');
  function loadGA(){
    if(document.querySelector('script[src*="googletagmanager.com/gtag/js"]')){return;}
    var s=document.createElement('script');
    s.async=true;
    s.src='https://www.googletagmanager.com/gtag/js?id=G-6WKB00FR9G';
    document.head.appendChild(s);
    gtag('js', new Date());
    gtag('config', 'G-6WKB00FR9G');
  }
  function eraseGaCookies(){
    document.cookie.split(';').forEach(function(c){
      var name=c.split('=')[0].trim();
      if(name.indexOf('_ga')===0){
        document.cookie=name+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
      }
    });
  }
  function showBanner(){banner.hidden=false;}
  function hideBanner(){banner.hidden=true;}
  function accept(){
    try{localStorage.setItem(KEY,'granted');}catch(e){}
    gtag('consent','update',{'analytics_storage':'granted'});
    loadGA();
    hideBanner();
  }
  function decline(){
    try{localStorage.setItem(KEY,'denied');}catch(e){}
    gtag('consent','update',{'analytics_storage':'denied'});
    eraseGaCookies();
    hideBanner();
  }
  document.getElementById('cookie-accept').addEventListener('click',accept);
  document.getElementById('cookie-decline').addEventListener('click',decline);
  var settings=document.getElementById('cookie-settings');
  if(settings){settings.addEventListener('click',function(e){e.preventDefault();showBanner();});}
  var stored=null;
  try{stored=localStorage.getItem(KEY);}catch(e){}
  if(stored==='granted'){
    gtag('consent','update',{'analytics_storage':'granted'});
    loadGA();
  }else if(stored==='denied'){
    /* Da tu choi: khong tai gtag.js, khong hien lai banner. */
  }else{
    showBanner();
  }
})();
</script>
