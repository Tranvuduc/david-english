 {id:"para",skill:"read",glyph:"≈",title:"Paraphrase Hunter",desc:"The skill behind every IELTS answer: spot the same meaning in different words.",run:c=>mcqGame({...c,make:mk(PARA,qPara,10)})},
 {id:"tfng",skill:"read",glyph:"T/F",title:"True, False or Not Given",desc:"Judge the statement against the text. Every answer comes with the reason.",run:c=>mcqGame({...c,make:mk(TFNG,qTF,10)})},
 {id:"head",skill:"read",glyph:"H",title:"Heading Hunter",desc:"Read a paragraph and choose the heading that covers all of it.",run:c=>mcqGame({...c,make:mk(HEAD,qHead,8)})},
 {id:"trap",skill:"listen",glyph:"◉",title:"Trap Detector",desc:"Listen to a clip, dodge the corrections and distractors, and pick the real answer.",run:c=>mcqGame({...c,make:mk(TRAP,qTrap,8)})},
 {id:"trend",skill:"write",glyph:"↗",title:"Trend Lab",desc:"A new chart every round. Pick the sentence with the right verb, adverb and numbers.",run:c=>mcqGame({...c,make:()=>Array.from({length:8},qTrend)})},
 {id:"passive",skill:"write",glyph:"be+pp",title:"Passive Factory",desc:"Build passive sentences for process diagrams and maps. Watch for trap tiles.",run:passiveGame},
 {id:"order",skill:"write",glyph:"1-2-3",title:"Essay Architect",desc:"Put model answers back in order and learn how linking words build coherence.",run:orderGame},
 {id:"sort",skill:"mix",glyph:"▤",title:"Sort It Out",desc:"Six quick sorting games: A-R-E-O, fact or opinion, overview or detail, essay types and more.",run:sorterMenu},
 {id:"cue",skill:"speak",glyph:"2:00",title:"Cue Card Studio",desc:"Real Part 2 timing: 1 minute to prepare, 2 minutes to talk, then a self-check.",run:cueGame},
 {id:"roul",skill:"speak",glyph:"🎲",title:"Question Roulette",desc:"Spin for a Part 1 or Part 3 question. Talk until the clock turns green.",run:rouletteGame},
 {id:"rules",skill:"mix",glyph:"!",title:"Rule Check",desc:"20 exam rules from the strategy toolkit. Know them before test day.",run:c=>mcqGame({...c,make:()=>shuffle(RULES).slice(0,12).map(qRule)})},
 {id:"boss",skill:"mix",glyph:"♥♥♥",title:"Boss Battle",desc:"Mixed review of every skill. 15 questions, 20 seconds each, 3 lives.",run:c=>mcqGame({...c,hearts:3,qtime:20,make:()=>{const p=V.filter(v=>inUnit(v.u));return shuffle([
   ...pick(PARA.filter(x=>inUnit(x[0])),3).map(qPara),...pick(TFNG.filter(x=>inUnit(x[0])),3).map(qTF),...pick(HEAD.filter(x=>inUnit(x[0])),2).map(qHead),
   ...pick(TRAP.filter(x=>inUnit(x[0])),2).map(t=>({...qTrap(t),trap:null,html:`<blockquote>${esc(t[1])}</blockquote>`+qTrap(t).html})),...pick(p,3).map(v=>qVocab(v,p)),qTrend(),...pick(RULES,1).map(qRule)]).slice(0,15)}})}
];
const TMAP={"t-read":"test-reading","t-listen":"test-listening","t-write":"test-writing","t-speak":"test-speaking","t-calc":"test-calc"};
const SK={test:["Test Room · real exam practice","test"],vocab:["Vocabulary","vocab"],read:["Reading & Listening","read"],write:["Writing","write"],speak:["Speaking","speak"],mix:["Review & strategy","mix"]};

let curTimers=[];function clearTimers(){curTimers.forEach(t=>clearInterval(t));curTimers=[];try{canSpeak&&speechSynthesis.cancel()}catch(e){}}
function bindBack(){app.querySelectorAll("[data-back]").forEach(b=>b.onclick=home)}
function open(id){clearTimers();VIEW="play";const g=GAMES.find(x=>x.id===id);window.scrollTo(0,0);try{history.replaceState(null,"","#"+id)}catch(e){}g.run({id:g.id,title:g.title})}
const open_=open;

function home(){
  clearTimers();VIEW="home";try{history.replaceState(null,"","#")}catch(e){}newDay();paintMeter();
  const hr=new Date().getHours();const greet=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening";
  const qReady=S.today.q.filter(q=>q.p>=QUESTS.find(x=>x.id===q.id).g&&!q.claimed).length;const nb=Object.keys(S.badges).length;
  const starOf=id=>id==="sort"?Math.max(0,...Object.entries(S.stars).filter(([k])=>k.startsWith("sort-")).map(([,v])=>v)):(S.stars[id]||0);
  const totalStars=GAMES.reduce((a,g)=>a+starOf(g.id),0);
  app.innerHTML=`<section class="hero"><h1>${greet}, ${esc(S.name||"champion")}! ${S.avatar}</h1>
   <p>${S.today.xp>=100?"Daily goal smashed! Every extra answer still moves you up.":`Today's goal: <b>${S.today.xp} / 100 XP</b>. `}${S.day.streak?` 🔥 ${S.day.streak}-day streak — keep it alive!`:" Answer one question to start your streak."} ⭐ ${totalStars}/${GAMES.length*3} stars collected.</p>
   <div class="hero-actions"><button class="chunky" id="hSpin">🎡 Lucky Spin${S.spun!==dstr()?'<span class="dot">1</span>':""}</button><button class="chunky" id="hQuest">🎯 Quests${qReady?`<span class="dot">${qReady}</span>`:""}</button><button class="chunky" id="hBadge">🏅 Badges ${nb}/${BADGES.length}</button><button class="chunky" id="hShop">🛍️ Shop</button>${S.name?"":`<button class="chunky" id="hName">✏️ Add your name</button>`}</div></section>
  <div class="sec-h"><h2>Island map</h2><small>Tap islands to focus your practice · 40 right answers master an island</small></div>
  <div class="mapwrap"><div class="map">${Object.keys(UNITS).map((u,n)=>`${n?'<span class="path"></span>':""}<button class="isle" data-u="${u}" aria-pressed="${units.includes(+u)}" style="--c:${UNITCOL[u]};--p:${umast(u)}">${umast(u)>=100?'<span class="crown">👑</span>':""}<span class="orb"><b>${UNITICON[u]}</b></span><span class="nm">${u}. ${UNITS[u]}</span><span class="pc">${umast(u)}% mastered</span></button>`).join("")}</div></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px"><button class="allbtn" data-u="0" aria-pressed="${!units.length}">🌍 All islands</button><span style="font-size:13px;color:var(--muted)">${units.length?"Playing: "+units.map(u=>UNITICON[u]+" "+UNITS[u]).join(" · "):"Games mix questions from all eight units."}</span></div>
  <div class="sec-h"><h2>Today's quests</h2><small>🪙 30 each · finish all 3 for a chest</small></div>
  <div class="quests" id="qs">${questHTML()}</div>
  ${Object.entries(SK).map(([k,[name,c]])=>`<section class="skill-sec" style="--c:var(--${c})"><h3 class="sk">${name}</h3><div class="grid">${GAMES.filter(g=>g.skill===k||(k==="read"&&g.skill==="listen")).map(g=>{const tg=g.skill==="listen"?"Listening":g.skill==="read"?"Reading":g.skill==="test"?"Exam mode":name;const col=GCOL[g.id];const st=starOf(g.id);return `<button class="card" style="--a:${col[0]};--b:${col[1]}" data-g="${g.id}">${S.gamesSet.includes(TMAP[g.id]||g.id)?"":'<span class="new">NEW</span>'}<span class="glyph" aria-hidden="true">${g.glyph}</span><span class="tag">${tg}</span><h3>${g.title}</h3><p>${g.desc}</p>${g.skill==="test"?`<span class="stars">${esc(S.best[{"t-read":"test-reading","t-listen":"test-listening","t-write":"test-writing","t-speak":"test-speaking","t-calc":"test-calc"}[g.id]]||"Not taken yet")}</span>`:`<span class="stars" aria-label="${st} of 3 stars">${[1,2,3].map(n=>`<span class="${n<=st?"":"off"}">★</span>`).join("")}</span>`}</button>`}).join("")}</div></section>`).join("")}
  <div class="sec-h"><h2>Badge shelf</h2><small>${nb} of ${BADGES.length} unlocked</small></div><div class="shelf">${badgeHTML()}</div>
  <p class="foot">Built on the topics and strategies of <i>Mindset for IELTS Level 2</i> and the companion practice book. All passages and questions are original practice material. Your band here is a game level, not an official IELTS score. Progress, coins and badges are saved in this browser only. <button class="icon-btn" id="resetp" style="margin-left:6px;font-size:13px">Reset progress</button></p>
  <p class="foot" style="text-align:center;border-top:0;padding-top:0"><span class="brandmark"><b>DAVID</b><i>.English</i></span></p>`;
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>open(b.dataset.g));
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const u=+b.dataset.u;if(!u)units=[];else units=units.includes(u)?units.filter(x=>x!==u):[...units,u].sort();S.units=units;save();beep("tick");home()});
  bindClaims(app,home);
  setTimeout(flushPopups,300);$("#hSpin").onclick=openSpin;$("#hQuest").onclick=openQuests;$("#hBadge").onclick=openBadges;$("#hShop").onclick=()=>openShop("avatars");if($("#hName"))$("#hName").onclick=()=>openShop("profile");
  const rp=$("#resetp");rp.onclick=()=>{if(rp.dataset.sure){try{localStorage.removeItem(KEY)}catch(e){}S={xp:0,best:{},played:0,correct:0,answered:0,units:[],...JSON.parse(JSON.stringify(DEF))};units=[];newDay();applyTheme();save();paintMeter();home();toast("Progress reset")}else{rp.dataset.sure=1;rp.textContent="Tap again to confirm"}};
}
$("#ava").onclick=()=>openShop("avatars");$("#ring").onclick=openQuests;
document.addEventListener("keydown",e=>{if($("#modal .sheet"))return;if(/^[1-4a-d]$/i.test(e.key)){const n="1234".includes(e.key)?+e.key-1:"abcd".indexOf(e.key.toLowerCase());const b=app.querySelectorAll(".opt:not([disabled])")[n];if(b&&!/TEXTAREA|INPUT/.test(document.activeElement.tagName))b.click()}});
paintMeter();
const h=(location.hash||"").slice(1);if(GAMES.find(g=>g.id===h))open(h);else home();
})();
