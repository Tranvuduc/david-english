</head><body><style>.de-back{margin:0;text-align:left;background:#123a6d;color:#fff;padding:0 16px}.de-back a{display:inline-flex;align-items:center;min-height:44px;color:#fff;font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-decoration:none}.de-back a:hover{color:#e8a020;text-decoration:underline}.de-back a:focus-visible{outline:3px solid #e8a020;outline-offset:2px}</style><header class="de-back"><a href="/">← David English</a></header>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg: #f7f5ef; --surface:#FFFFFF; --surface-2:#F7F5FF; --ink:#1E1646; --muted:#6A6391; --line:#DDD6F7;
  --purple:#7C4DFF; --pink:#FF4D8D; --orange:#FF9F1C; --yellow:#FFD23F; --teal:#14B8A6; --blue:#3A86FF; --green:#22C55E; --red:#EF4444;
  --pencil:#7C4DFF; --pencil-soft:#EDE6FF; --hl:#FFD23F; --hl-ink:#3A2600;
  --ok:#16A34A; --ok-soft:#DCFCE7; --bad:#E11D48; --bad-soft:#FFE4EA;
  --vocab:#FF9F1C; --read:#3A86FF; --listen:#14B8A6; --write:#FF4D8D; --speak:#7C4DFF; --mix:#1E1646;
  --g1:#7C4DFF; --g2:#FF4D8D; --g3:#FF9F1C;
  --shadow:0 2px 0 rgba(30,22,70,.08),0 8px 24px rgba(124,77,255,.12);
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#130E2B; --surface:#201946; --surface-2:#2A2257; --ink:#F3F0FF; --muted:#AFA6D8; --line:#3A3170;
  --pencil:#A98BFF; --pencil-soft:#2F2566; --hl:#FFD23F; --hl-ink:#2A1C00;
  --ok:#4ADE80; --ok-soft:#153A26; --bad:#FB7185; --bad-soft:#47182A; --mix:#E6E0FF;
  --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}
.brandmark i{color:#E0AC5A}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#130E2B; --surface:#201946; --surface-2:#2A2257; --ink:#F3F0FF; --muted:#AFA6D8; --line:#3A3170;
  --pencil:#A98BFF; --pencil-soft:#2F2566; --hl:#FFD23F; --hl-ink:#2A1C00;
  --ok:#4ADE80; --ok-soft:#153A26; --bad:#FB7185; --bad-soft:#47182A; --mix:#E6E0FF;
  --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}
:root[data-theme="dark"] .brandmark i{color:#E0AC5A}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;
  background-image:radial-gradient(circle at 8% 12%,color-mix(in srgb,var(--g1) 14%,transparent) 0 160px,transparent 161px),radial-gradient(circle at 92% 30%,color-mix(in srgb,var(--g2) 12%,transparent) 0 200px,transparent 201px),radial-gradient(circle at 20% 90%,color-mix(in srgb,var(--g3) 12%,transparent) 0 180px,transparent 181px);background-attachment:fixed}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.brandmark{display:inline-flex;align-items:baseline;gap:1px;font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted, #6B6558)}
.brandmark b{color:var(--ink, #231942);font-weight:600}
.brandmark i{font-style:normal;color:#B9812C}

/* ===== player bar ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;gap:10px;align-items:center}
.ava{width:44px;height:44px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--g1),var(--g2));font-size:26px;display:grid;place-items:center;box-shadow:0 3px 0 color-mix(in srgb,var(--g1) 60%,#000);flex:none}
.who{min-width:0;flex:1}
.who b{font-family:var(--f-display);font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.mini{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px;max-width:260px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.who small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.pill{display:flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--surface);border:2px solid var(--line);white-space:nowrap}
.pill.band{background:var(--purple);color:#fff;border-color:transparent}
.pill.coin{border-color:#F5B700}
.pill.fire{border-color:var(--orange)}
.ring{width:40px;height:40px;flex:none;position:relative;border:0;background:none;padding:0}
.ring svg{width:40px;height:40px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;font-family:var(--f-mono)}
.icon-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 9px;font-size:16px;line-height:1}
@media (max-width:620px){.hide-sm{display:none!important}.pill{padding:4px 8px;font-size:14px}}

/* ===== hero ===== */
.hero{margin-top:18px;border-radius:24px;padding:22px 22px 20px;color:#fff;background:linear-gradient(120deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 6px 0 color-mix(in srgb,var(--g1) 55%,#000);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero h1{font-size:clamp(26px,5.5vw,42px);line-height:1.05}
.hero p{margin:8px 0 0;max-width:56ch;opacity:.95}
.hero-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative;z-index:1}
.chunky{border:0;border-radius:14px;padding:10px 16px;font-family:var(--f-display);font-weight:700;font-size:16px;background:#fff;color:#1E1646;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s}
.chunky:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.chunky .dot{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--pink);color:#fff;font-size:12px;margin-left:4px}

/* ===== adventure map ===== */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:28px 0 10px}
.sec-h h2{font-size:24px}
.sec-h small{color:var(--muted);font-size:13px}
.mapwrap{overflow-x:auto;padding:6px 2px 12px;scrollbar-width:thin}
.map{display:flex;gap:0;align-items:center;min-width:max-content;position:relative}
.isle{display:flex;flex-direction:column;align-items:center;gap:6px;width:112px;border:0;background:none;padding:0;position:relative}
.isle:nth-child(even){transform:translateY(22px)}
.isle .orb{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,#000);transition:transform .2s}
.isle .orb b{width:62px;height:62px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:26px}
.isle:hover .orb{transform:translateY(-4px) rotate(-4deg)}
.isle[aria-pressed="true"] .orb{outline:4px solid var(--hl);outline-offset:3px}
.isle .nm{font-size:12px;text-align:center;line-height:1.2;color:var(--ink);font-weight:700;max-width:104px}
.isle .pc{font-size:11px;font-family:var(--f-mono);color:var(--muted)}
.isle .crown{position:absolute;top:-14px;font-size:22px}
.path{width:26px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px);flex:none;margin-top:-30px}
.allbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.allbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ===== quests ===== */
.quests{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.quest{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.quest .qt{font-weight:700}
.qbar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:6px}
.quest .rw{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.claim{border:0;border-radius:10px;padding:5px 12px;background:var(--yellow);color:var(--hl-ink);font-weight:700;box-shadow:0 3px 0 #C99A00;animation:wiggle 1.2s infinite}
.quest.done{border-color:var(--green)}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:rotate(0)}}

/* ===== game cards ===== */
.skill-sec{margin-top:22px}
.skill-sec h3.sk{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-family:var(--f-body);display:flex;align-items:center;gap:8px}
.skill-sec h3.sk::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
.card{position:relative;text-align:left;border:0;border-radius:20px;padding:16px 16px 14px;color:#fff;background:linear-gradient(145deg,var(--a),var(--b));box-shadow:0 5px 0 color-mix(in srgb,var(--a) 55%,#000);display:flex;flex-direction:column;gap:6px;min-height:170px;overflow:hidden;transition:transform .15s}
.card:hover{transform:translateY(-3px) rotate(-.6deg)}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--a) 55%,#000)}
.card h3{font-size:21px;line-height:1.1;position:relative}
.card p{margin:0;font-size:13.5px;opacity:.95;position:relative;max-width:26ch}
.card .tag{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9;position:relative}
.card .glyph{position:absolute;right:-6px;bottom:-14px;font-family:var(--f-display);font-weight:700;font-size:78px;line-height:1;opacity:.22}
.card .stars{margin-top:auto;font-size:18px;letter-spacing:2px;position:relative}
.card .stars .off{opacity:.35}
.card .new{position:absolute;right:10px;top:10px;background:#fff;color:var(--a);font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.06em}

/* ===== badges shelf ===== */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11.5px;line-height:1.2;border:0;background:none;padding:0}
.badge .medal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 30%,#fff8,transparent 40%),linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 0 color-mix(in srgb,var(--c2) 55%,#000)}
.badge.locked .medal{background:var(--line);box-shadow:none;filter:grayscale(1);opacity:.55}
.badge b{font-size:12px}

/* ===== game view (shared) ===== */
.gtop{display:flex;align-items:center;gap:10px;padding:16px 0 8px;flex-wrap:wrap}
.gtop h2{font-size:26px;flex:1;min-width:150px}
.back{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-weight:700}
.hud{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:14px;flex-wrap:wrap}
.hud span{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:3px 9px}
.hud .streak{background:linear-gradient(90deg,var(--orange),var(--pink));color:#fff;border-color:transparent;animation:pop .4s}
.combo{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:0 0 6px}
.combo i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink));transition:width .3s}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .3s;border-radius:5px}
.timer i{background:linear-gradient(90deg,var(--green),var(--yellow),var(--red))}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);position:relative}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:700}
.big{font-family:var(--f-display);font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.1;margin:4px 0 10px}
blockquote{margin:6px 0 14px;padding:12px 14px;border-left:6px solid var(--yellow);background:var(--surface-2);border-radius:0 14px 14px 0;font-size:17px}
.stmt{font-size:19px;font-weight:700;margin:8px 0 14px}
.opts{display:grid;gap:9px;margin-top:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:16px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 3px 0 var(--line);transition:transform .1s,border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--purple);transform:translateY(-1px)}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:none}
.opt kbd{font-family:var(--f-display);font-weight:700;font-size:14px;border-radius:8px;min-width:26px;text-align:center;padding:1px 6px;color:#fff;background:var(--purple)}
.opts .opt:nth-child(2) kbd{background:var(--pink)}.opts .opt:nth-child(3) kbd{background:var(--orange)}.opts .opt:nth-child(4) kbd{background:var(--teal)}
.row3 .opt{justify-content:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff;border:0}
.row3 .opt:nth-child(1){background:var(--green);box-shadow:0 4px 0 #15803D}.row3 .opt:nth-child(2){background:var(--red);box-shadow:0 4px 0 #B91C1C}.row3 .opt:nth-child(3){background:var(--blue);box-shadow:0 4px 0 #1D4ED8}
.row3 .opt[disabled]:not(.ok):not(.bad){opacity:.4}
.opt.ok{border-color:var(--ok)!important;background:var(--ok-soft);outline:3px solid var(--ok)}
.opt.bad{border-color:var(--bad)!important;background:var(--bad-soft);outline:3px solid var(--bad)}
.row3 .opt.ok,.row3 .opt.bad{color:var(--ink)}
.opt[disabled]{cursor:default}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.why{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--pencil-soft);font-size:15px}
.why b{font-family:var(--f-display);font-size:16px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:11px 18px;font-family:var(--f-display);font-weight:700;font-size:16px;background:var(--purple);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--purple) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--purple) 55%,#000)}
.btn.hl{background:var(--yellow);color:var(--hl-ink);box-shadow:0 4px 0 #C99A00}
.btn.ghost{background:var(--surface);border:2px solid var(--line);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.04)}}
.script{position:relative;background:var(--surface-2);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;font-style:italic;margin:6px 0 12px}
.script.hidden-text{filter:blur(6px);user-select:none}
.listen-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media (max-width:560px){.mem{grid-template-columns:repeat(3,1fr)}}
.tile{aspect-ratio:1/1;max-width:100%;border-radius:16px;border:0;color:#fff;font-family:var(--f-display);font-weight:700;font-size:30px;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 4px 0 #5B2FD6;transition:transform .25s}
.tile:nth-child(3n+2){background:linear-gradient(135deg,var(--orange),var(--pink));box-shadow:0 4px 0 #C7631A}
.tile:nth-child(3n){background:linear-gradient(135deg,var(--blue),var(--teal));box-shadow:0 4px 0 #1D4ED8}
.tile.open{background:var(--surface-2)!important;color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:clamp(11px,2.6vw,15px);line-height:1.2;overflow-wrap:anywhere;box-shadow:0 3px 0 var(--line)!important;transform:rotateY(0) scale(1.03)}
.tile.vi.open{color:var(--orange)}
.tile.done{background:var(--ok-soft)!important;color:var(--ink);box-shadow:0 3px 0 var(--ok)!important;animation:pop .4s}

/* flashcards */
.fc{perspective:1200px;max-width:560px;margin:0 auto}
.fc-in{position:relative;min-height:260px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--g1) 55%,#000)}
.fc-face .lbl{color:#fff;opacity:.85}
.fc-back{transform:rotateY(180deg);background:var(--surface);color:var(--ink);border:3px solid var(--g2)}
.fc-back .lbl{color:var(--muted)}
.fc-face .vi{color:var(--orange);font-weight:700;font-size:22px;font-family:var(--f-display)}
.fc-face .eg{font-style:italic;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fc-in,.card,.mini i,.isle .orb{transition:none}.shake,.pop,.claim,.tile.done{animation:none}}

/* order & tiles */
.slot-list{display:grid;gap:6px;min-height:60px;border:3px dashed var(--line);border-radius:14px;padding:8px;margin:8px 0}
.slot-list:empty::before{content:"Tap the sentences below in the right order";color:var(--muted);font-size:14px;padding:8px}
.piece{text-align:left;border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 12px;font-size:15px;display:flex;gap:8px;box-shadow:0 3px 0 var(--line)}
.slot-list .piece{background:var(--pencil-soft);border-color:var(--purple)}
.piece .n{font-family:var(--f-display);font-weight:700;color:#fff;background:var(--purple);border-radius:8px;min-width:24px;text-align:center}
.piece.ok{border-color:var(--ok);background:var(--ok-soft)}.piece.bad{border-color:var(--bad);background:var(--bad-soft)}
.pool{display:grid;gap:6px}
.tiles{display:flex;flex-wrap:wrap;gap:7px}

.bin{border:0;border-radius:16px;padding:14px;font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff;background:var(--purple);box-shadow:0 4px 0 #5B2FD6}

/* trend */
.chartbox{background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:8px;overflow-x:auto}
.chartbox svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}

/* speaking */
.cue{border:3px solid var(--purple);border-radius:18px;padding:16px 18px;background:var(--surface-2)}

.phase{text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--purple)}

.checks{display:grid;gap:6px;margin-top:8px}

paras:[
["A","Look down on almost any large city from a tall building and you will see a landscape of grey: flat roofs covered in bitumen, gravel and air-conditioning units. Together, these surfaces make up a large share of a city's total area, yet for most of the twentieth century they were treated as wasted space. Over the past few decades, however, a growing number of architects and city governments have begun to see roofs as an opportunity. By covering them with soil and plants, they argue, cities can tackle several environmental problems at once."],
["B","The modern green roof movement began in Germany in the 1970s and 1980s, when researchers developed lightweight growing systems and waterproof layers that could protect a building from roots and moisture. German cities later offered subsidies and passed planning rules that encouraged or required planted roofs on new buildings, and the country remains a world leader in the industry. The industry there has also developed technical standards that describe how roofs should be built and tested, which has helped architects in other countries to copy German methods. Other cities followed. In 2009, Toronto became the first city in North America to pass a law requiring green roofs on many new developments above a certain size."],
["C","Specialists usually divide green roofs into two types. 'Extensive' roofs have a thin layer of growing material, often less than fifteen centimetres deep, and are planted with hardy, low-growing species such as sedums, which need little water or care. Because they are light, they can often be added to existing buildings without major structural work. 'Intensive' roofs, by contrast, have much deeper soil and can support lawns, shrubs and even small trees. They are, in effect, rooftop gardens, and they need regular maintenance and far stronger roof structures."],
["D","The most widely studied benefit concerns rainwater. In a conventional city, rain falls on hard surfaces and runs straight into drains, which can overflow during heavy storms. A green roof works like a sponge: the plants and growing material hold much of the water and release it slowly, while some evaporates back into the air. Research suggests that a well-designed roof can retain a large proportion of the rain that falls on it in summer, although the figure is much lower in winter, when plants grow slowly and the soil is already wet. City authorities are especially interested in this effect, because building larger drains under existing streets is expensive and disruptive."],
["E","Green roofs also help to cool cities. Dark roofs absorb sunlight and can become extremely hot on summer afternoons, contributing to what scientists call the 'urban heat island' effect, in which city centres stay several degrees warmer than the surrounding countryside. Plants, on the other hand, cool the air as water evaporates from their leaves. Buildings below green roofs may also need less energy for air conditioning in summer and, to a smaller extent, for heating in winter, because the soil acts as an extra layer of insulation."],
["F","Not everyone is convinced. The initial cost of a green roof is considerably higher than that of a conventional one, and owners must be confident that the waterproof layer beneath the soil will not leak. Supporters reply that the plants protect this layer from sunlight and extreme temperatures, so it may last significantly longer than an exposed roof, reducing costs over the building's lifetime. Critics also point out that the benefits depend heavily on local climate: a roof that thrives in rainy northern Europe may need constant watering in a hot, dry city, which could cancel out some of its environmental advantages."],
["G","Perhaps the most surprising benefit is ecological. Surveys of green roofs have recorded a wide variety of insects, spiders and birds, including some species that are rare at ground level. Some designers now deliberately create 'biodiverse roofs' with different soil depths, logs and stones to provide varied habitats. As cities continue to grow, it seems likely that the spaces above our heads will play an increasingly important part in making urban life greener. Some researchers are already testing 'blue-green' roofs, which combine plants with tanks that store rainwater so that it can later be used to water gardens or flush toilets."]],

{id:"r2",unit:6,title:"The Return of the Beaver",level:"Passage 2 level",mins:20,
paras:[
["A","Few animals have changed the landscape of Europe as much as the Eurasian beaver. For thousands of years, beavers built dams across streams and rivers, creating ponds and wetlands that supported countless other species. Yet by the start of the twentieth century they had almost disappeared. Hunted for their fur, their meat and a substance called castoreum, which was used in medicine and perfume, they survived in only a handful of isolated populations. By some estimates, little more than a thousand animals remained across the whole continent."],
["B","The recovery began slowly. From the 1920s onwards, several countries, starting with Norway and Sweden, gave beavers legal protection, and animals were later moved from surviving populations to rivers where they had been lost. Over the following decades, reintroduction projects spread across much of Europe. Beavers breed steadily and can travel long distances along waterways, so once a small group was established, it often spread naturally. In some places, beavers were released officially after years of planning; in others, animals escaped from private collections or were released illegally, which caused disagreements between conservation groups and landowners. Today the species is found in most European countries, and its total population is thought to have grown to well over a million."],
["C","Scientists are particularly interested in what beavers do to water. A series of dams slows the flow of a stream, spreading water across the surrounding land. During heavy rain, this can reduce the height of floods further downstream, because the water is released gradually instead of all at once. In dry periods, the ponds behind the dams continue to hold water, which can help to keep streams flowing. Studies have also found that beaver ponds trap soil and pollutants from farmland, so the water that leaves them is often cleaner than the water that enters."],
["D","The effects on wildlife can be dramatic. The mix of deep ponds, shallow channels, fallen trees and flooded meadows that beavers create provides habitats for insects, amphibians, fish and birds. Researchers comparing sites with and without beavers have frequently recorded a greater variety of species where beavers are present. For this reason, some ecologists describe the beaver as an 'ecosystem engineer': a species that does not simply live in a habitat but actively builds it. Some studies in North America have even found that the wet ground around beaver ponds can stay green during wildfires, acting as a natural firebreak."],
["E","Not everyone welcomes the beaver's return, however. Farmers may find fields flooded or valuable trees cut down, and dams can block drainage ditches or damage roads and railways. Some fishermen argue that dams stop salmon and trout from moving upstream, although researchers disagree about how serious this problem is. In Scotland, where beavers were given legal protection in 2019, a licensing system allows landowners to remove or, as a last resort, kill beavers in certain circumstances. Other solutions are less drastic. So-called 'flow devices' — pipes placed through a dam — allow engineers to control the water level without destroying the dam, while protective wire around the base of trees can stop beavers from felling them."],
["F","Supporters argue that the key to success is careful planning. Rather than releasing animals and hoping for the best, recent projects in Britain have involved long consultations with farmers, fishermen and local councils, together with funding to deal with problems when they arise. In 2025, England approved the first licensed releases of beavers into the wild, a decision that reflected both growing scientific evidence and changing public attitudes. The beaver's story suggests that bringing a species back is as much about people as it is about animals."]],

const LSCRIPTS={"1": [["Agent", "Good morning, Oakfield Lettings. How can I help?"], ["Maria", "Hi, I'm looking for a flat to rent from September."], ["Agent", "Great. Can I take your name first?"], ["Maria", "Yes, it's Maria Kowalski. That's K-O-W-A-L-S-K-I."], ["Agent", "Thank you. And a contact number?"], ["Maria", "It's 0774 516 293 — sorry, no, I always mix it up. It's 516 239."], ["Agent", "0774 516239. Got it. Now, do you have an area in mind? A lot of our tenants want to be near the university."], ["Maria", "Actually, I work in the city, so I'd rather be near the station. The university doesn't really matter to me."], ["Agent", "OK. And what size of property?"], ["Maria", "I was going to look for a one-bedroom place, but my sister might move in with me, so let's say two bedrooms."], ["Agent", "Right. And your budget?"], ["Maria", "I'd like to pay around 750 a month, but I can go up to 850. Not more than that."], ["Agent", "Fine. Is there anything the flat must have? Some people insist on a dishwasher, for example."], ["Maria", "A dishwasher would be nice, but it's not essential. What I really need is a washing machine — I don't want to go to a launderette every week."], ["Agent", "Understood. When would you like to move in?"], ["Maria", "My current contract ends on the 25th, so… the 28th of September would be ideal."], ["Agent", "The 28th. Anything you'd prefer to avoid?"], ["Maria", "Yes — I don't want anything on the ground floor. It's not really about security; my last flat was at street level and the noise from traffic kept me awake."], ["Agent", "I have one that might suit you. Could you view it this Saturday? I've got 9.30 free… oh, actually, that's just been taken. How about 10.30?"], ["Maria", "10.30 is perfect. Where shall I meet you — at your office?"], ["Agent", "It's easier if we meet at the property. It's on Elm Street, and I'll wait outside the library, which is right next door."], ["Maria", "Great, see you then."]], "2": [["Manager", "Good evening, everyone, and thanks for coming to hear about the changes at Greenway Leisure Centre. As you know, we've been closed for refurbishment since March. We originally planned to reopen on the 1st of June, but the builders need a little longer, so our new opening date is the 15th of June."], ["Manager", "So what's new? Well, the main pool is the same size, but we've added something many of you asked for — an indoor climbing wall. It's suitable for complete beginners, and instructors will be there at weekends."], ["Manager", "Now, our classes. Beginners' yoga used to run on Monday evenings. However, Monday is when the sports hall is busiest, so we've moved it to Wednesday evenings, same time, seven o'clock."], ["Manager", "Membership prices: the standard adult rate is now 32 pounds a month. For students with a valid card, it's 18 pounds — that's slightly less than before, actually."], ["Manager", "Children's swimming lessons are very popular, so to be fair to everyone, you can't book them online or by phone any more. You need to come in person and book at reception."], ["Manager", "Parking. The car park is free for members for up to two hours. After that, the normal charge of one pound fifty an hour applies."], ["Manager", "And finally, the café. We used to sell mostly snacks and fizzy drinks, which didn't really match a healthy leisure centre! So now everything is homemade — soups, salads, cakes — all made in our own kitchen each morning."], ["Manager", "If you'd like the full timetable, please visit our website. Don't look under \"News\" — that's being updated. Instead, click on the \"Events\" page, where you'll find everything."]], "3": [["Tom", "OK, Lina, let's go through the presentation plan. First, the topic — remind me why we went with podcasts?"], ["Lina", "Well, Dr Harris suggested TV news, but we both listen to podcasts every single day, so it felt more natural. And it's not as if there's no research — there's actually quite a lot."], ["Tom", "True. Now, the survey. I'd guessed the average listening time correctly — about six hours a week. And I expected most people to listen while commuting, which they did. But I assumed listeners would be mostly students, and nearly forty percent were over fifty-five. That really surprised me."], ["Lina", "Me too. What about the interview with the podcast producer? It's twenty minutes long."], ["Tom", "Far too long to play all of it. But just describing it would be boring. Why don't we choose the best minute or so?"], ["Lina", "Yes, a short clip — good idea. Now, I've read through everything. The introduction's strong, I think. And the statistics are clear now that we've made the charts."], ["Tom", "So what's the problem?"], ["Lina", "The ending. At the moment we just repeat the numbers. We need a proper conclusion with some recommendations — that's our weakest section."], ["Tom", "Agreed. When shall we practise the whole thing? Tuesday morning?"], ["Lina", "I've got a lab on Tuesday. Thursday evening is too late — we present on Friday morning. How about Wednesday after lunch?"], ["Tom", "Wednesday afternoon it is."]], "8": [["Lecturer", "Good morning. Today's lecture looks at a tradition that many of us take for granted: the Christmas card. Where did it come from?"], ["Lecturer", "To understand its origins, we need to look at the postal system in Britain. Before 1840, sending a letter was expensive, and — unlike today — the cost wasn't paid by the sender. It was the receiver who had to pay, and the price depended on the distance and the number of sheets of paper. So people wrote letters rarely, and often only when necessary."], ["Lecturer", "Everything changed in 1840 with the introduction of the Penny Post. For the first time, the sender paid in advance with a stamp, and a letter could be sent anywhere in the country for just one penny. Suddenly, ordinary people could afford to keep in touch."], ["Lecturer", "This brings us to the first commercial Christmas card, which appeared in 1843. It was the idea of Sir Henry Cole — that's C-O-L-E — a civil servant who had helped to introduce the new postal system. Cole had a large number of friends and business contacts, and like many people at the time, he traditionally sent them letters at Christmas. But that year, he was simply too busy to write them all by hand. So he asked an artist friend, John Horsley, to design a card with a printed message that he could send instead."], ["Lecturer", "The picture showed a family at a Christmas dinner table, raising their glasses. Interestingly, the card was criticised by some people, because one of the figures in the picture was a young child who was clearly drinking wine. About one thousand copies were printed, and those Cole didn't use were sold to the public — although at a shilling each, they were too expensive for most people."], ["Lecturer", "Over the following decades, improvements in printing technology — especially colour printing — made cards much cheaper to produce, and by the 1880s sending Christmas cards had become a popular custom. Today, although millions of paper cards are still sent, more and more people choose to send digital greetings through email and social media instead."]]};
const WTASKS={"1": {"task": "<p><i>The chart below shows the types of housing that households lived in in Riverton in 2000 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.</i></p>\n<div class=\"chart\">{{u1.svg}}</div>", "model": "<h4>Model answer (Band 7 level, 172 words)</h4>\n<p>The bar chart compares the proportion of households living in five types of housing in Riverton in 2000 and 2020.</p>\n<p><mark>Overall, there was a clear shift away from houses towards flats over the twenty-year period. The most striking change was in high-rise flats, which went from being one of the least common types of home to the most common.</mark></p>\n<p>In 2000, detached houses were the most popular type of housing, accounting for just over a third of households (34%), followed by terraced houses at 28%. By 2020, however, the figure for detached houses had almost halved to 18%, while terraced houses fell more modestly to 24%.</p>\n<p>In contrast, the proportion of households in high-rise flats nearly tripled, rising from 10% to 29%. Low-rise flats also became slightly more common, increasing from 22% to 25%. The remaining category, other types of housing, was the smallest in both years and dropped from 6% to 4%.</p>\n<p class=\"note\">Highlighted = the overview. Notice: no opinions, no reasons (\"because people prefer…\"), and numbers only in the detail paragraphs.</p>"}, "2": {"task": "<p><i>The graph below shows the average number of hours per week that young adults in Country X spent on four leisure activities between 2005 and 2025. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.</i></p>\n<div class=\"chart\">{{u2.svg}}</div>", "model": "<h4>Model answer (Band 7 level, 185 words)</h4>\n<p>The line graph shows how many hours per week young adults aged 18 to 25 in Country X spent on four leisure activities between 2005 and 2025.</p>\n<p><mark>Overall, social media use rose dramatically and replaced television as the most popular activity, while the time spent reading for pleasure declined. Sport was the only activity that remained fairly stable.</mark></p>\n<p>In 2005, watching TV was by far the most common pastime, at 12 hours a week. This figure fell steadily over the period, reaching 7 hours in 2025. By contrast, social media use began at just 2 hours but increased sharply, drawing level with television in 2015, when both stood at 9 hours. By 2025 it had climbed to 15 hours, more than double the time spent watching TV.</p>\n<p>The other two activities occupied much less time. The number of hours spent on sport rose only slightly, from 4 to 6, whereas reading for pleasure dropped from 5 hours to 3 in 2015 and then levelled off.</p>"}, "3": {"task": "<p><i>The diagram below shows how a daily printed newspaper is produced. Summarise the information by selecting and reporting the main features. Write at least 150 words.</i></p>\n<div class=\"process\">\n<div class=\"pstep\"><b>1</b>Journalists research &amp; write stories</div><div class=\"arrow\">→</div>\n<div class=\"pstep\"><b>2</b>Editors check facts &amp; edit</div><div class=\"arrow\">→</div>\n<div class=\"pstep\"><b>3</b>Pages designed on computer</div><div class=\"arrow\">→</div>\n<div class=\"pstep\"><b>4</b>Metal printing plates made</div><div class=\"arrow\">→</div>\n<div class=\"pstep\"><b>5</b>Printed overnight (1 a.m.–4 a.m.)</div><div class=\"arrow\">→</div>\n<div class=\"pstep\"><b>6</b>Folded &amp; tied into bundles</div><div class=\"arrow\">→</div>\n<div class=\"pstep\"><b>7</b>Delivered by van to shops by 6 a.m.</div>\n</div>\n<p class=\"note\" style=\"text-align:center\">Also: after stage 3, the stories are uploaded to the newspaper's website.</p>", "model": "<h4>Model answer (Band 7 level, 170 words)</h4>\n<p>The diagram illustrates the stages involved in producing a daily printed newspaper.</p>\n<p><mark>Overall, there are seven stages in the process, which begins with journalists writing stories and ends with the newspaper being delivered to shops early the next morning. The process can be divided into a content stage and a physical production stage.</mark></p>\n<p>To begin with, stories are researched and written by journalists. They are then checked for accuracy and edited by editors. Once the content is final, the pages are designed on a computer. At this point, the stories are also uploaded to the newspaper's website, so they can be read online before the printed version is available.</p>\n<p>Next, metal printing plates are made from the page designs, and the newspaper is printed overnight, between 1 a.m. and 4 a.m. After being printed, the copies are folded and tied into bundles. In the final stage, the bundles are loaded into vans and delivered to shops by 6 a.m., ready for customers.</p>"}, "4": {"task": "<p><i>The maps below show the centre of Kingsbridge in 2005 and today. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.</i></p>\n<div class=\"maps\">\n<svg viewBox=\"0 0 250 200\" width=\"48%\" font-family=\"DejaVu Sans\" font-size=\"9\">\n<rect width=\"250\" height=\"200\" fill=\"#f4f1ea\"/><text x=\"125\" y=\"14\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11\">2005</text>\n<rect x=\"0\" y=\"20\" width=\"250\" height=\"22\" fill=\"#9ec5e8\"/><text x=\"10\" y=\"35\" fill=\"#1f4e79\">River Avon</text>\n<rect x=\"0\" y=\"100\" width=\"250\" height=\"18\" fill=\"#bdb6a5\"/><text x=\"85\" y=\"112\">High Street (cars)</text>\n<rect x=\"150\" y=\"52\" width=\"85\" height=\"40\" fill=\"#ddd\" stroke=\"#777\"/><text x=\"192\" y=\"76\" text-anchor=\"middle\">Car park</text>\n<rect x=\"15\" y=\"52\" width=\"110\" height=\"40\" fill=\"#fff\" stroke=\"#777\"/><text x=\"70\" y=\"76\" text-anchor=\"middle\">Shops</text>\n<rect x=\"15\" y=\"128\" width=\"100\" height=\"50\" fill=\"#f6e3c4\" stroke=\"#777\"/><text x=\"65\" y=\"156\" text-anchor=\"middle\">Houses</text>\n<rect x=\"140\" y=\"128\" width=\"95\" height=\"50\" fill=\"#cfc6c6\" stroke=\"#777\"/><text x=\"187\" y=\"156\" text-anchor=\"middle\">Factory</text>\n<circle cx=\"135\" cy=\"95\" r=\"4\" fill=\"#c0392b\"/><text x=\"128\" y=\"62\" font-size=\"8\">bus</text><text x=\"128\" y=\"71\" font-size=\"8\">stop</text><line x1=\"135\" y1=\"74\" x2=\"135\" y2=\"91\" stroke=\"#c0392b\"/>\n</svg>\n<svg viewBox=\"0 0 250 200\" width=\"48%\" font-family=\"DejaVu Sans\" font-size=\"9\">\n<rect width=\"250\" height=\"200\" fill=\"#f4f1ea\"/><text x=\"125\" y=\"14\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11\">Today</text>\n<rect x=\"0\" y=\"20\" width=\"250\" height=\"22\" fill=\"#9ec5e8\"/><text x=\"10\" y=\"35\" fill=\"#1f4e79\">River Avon</text>\n<rect x=\"0\" y=\"42\" width=\"250\" height=\"7\" fill=\"#e39b2d\"/><text x=\"160\" y=\"49\" font-size=\"7\">cycle path</text>\n<rect x=\"0\" y=\"100\" width=\"250\" height=\"18\" fill=\"#e8e2cf\"/><text x=\"60\" y=\"112\">High Street (pedestrians only)</text>\n<g fill=\"#3a8a5c\"><circle cx=\"20\" cy=\"109\" r=\"4\"/><circle cx=\"235\" cy=\"109\" r=\"4\"/></g>\n<rect x=\"150\" y=\"55\" width=\"85\" height=\"40\" fill=\"#fff\" stroke=\"#1f4e79\" stroke-width=\"1.5\"/><text x=\"192\" y=\"72\" text-anchor=\"middle\">Shopping</text><text x=\"192\" y=\"84\" text-anchor=\"middle\">centre</text>\n<rect x=\"15\" y=\"55\" width=\"110\" height=\"40\" fill=\"#fff\" stroke=\"#777\"/><text x=\"70\" y=\"79\" text-anchor=\"middle\">Shops &amp; cafés</text>\n<rect x=\"15\" y=\"128\" width=\"100\" height=\"50\" fill=\"#f6e3c4\" stroke=\"#777\"/><text x=\"65\" y=\"156\" text-anchor=\"middle\">Houses</text>\n<rect x=\"140\" y=\"128\" width=\"95\" height=\"50\" fill=\"#b9dbb9\" stroke=\"#3a8a5c\"/><text x=\"187\" y=\"152\" text-anchor=\"middle\">Park &amp;</text><text x=\"187\" y=\"164\" text-anchor=\"middle\">playground</text>\n<rect x=\"0\" y=\"182\" width=\"250\" height=\"14\" fill=\"#bdb6a5\"/><text x=\"8\" y=\"192\" font-size=\"8\">New road (cars &amp; buses)</text>\n<rect x=\"190\" y=\"183\" width=\"55\" height=\"12\" fill=\"#c0392b\"/><text x=\"217\" y=\"192\" font-size=\"7\" fill=\"#fff\" text-anchor=\"middle\">bus station</text>\n</svg></div>", "model": "<h4>Model answer (Band 7 level, 176 words)</h4>\n<p>The maps compare the centre of Kingsbridge in 2005 with its layout today.</p>\n<p><mark>Overall, the town centre has been transformed from a car-based area into one that is more suitable for pedestrians, cyclists and leisure. Traffic has been moved to the south, while the only feature that has remained unchanged is the housing.</mark></p>\n<p>In 2005, cars drove along the High Street, which ran through the middle of the town, and there was a car park to the north of it, next to the river. Today, the High Street has been pedestrianised and trees have been planted at each end. The car park has been replaced by a shopping centre, and the shops opposite it now include cafés. In addition, a cycle path has been built along the southern bank of the river.</p>\n<p>South of the High Street, the factory has been demolished and a park with a playground has been created in its place. Finally, a new road for cars and buses has been constructed along the southern edge of the town, and the small bus stop has been replaced by a bus station.</p>"}, "5": {"task": "<p><i>Some people believe that working from home is better for both employees and employers. To what extent do you agree or disagree? Give reasons for your answer and include any relevant examples from your own knowledge or experience. Write at least 250 words.</i></p>", "model": "<h4>Model answer (Band 7 level, 290 words)</h4>\n<p>Since the pandemic, working from home has become normal for millions of office workers. While I agree that this arrangement brings clear benefits to employees, I believe its advantages for employers are much less certain.</p>\n<p>For employees, the most obvious benefit is the time and money saved by not commuting. Someone who spends an hour travelling each way gains ten hours a week, which can be spent with family, exercising or simply resting. Remote work also offers flexibility. Parents, for instance, can take their children to school and still start work on time, which reduces stress and improves their work-life balance. It is therefore not surprising that many surveys show staff strongly prefer to keep this option.</p>\n<p>For employers, however, the picture is more mixed. It is true that companies can save money by renting smaller offices. Yet working from home can weaken teamwork and make it harder to build a shared company culture. New and junior employees are particularly affected, because much of what they learn comes from watching and listening to experienced colleagues, and this is difficult to reproduce on a video call. In addition, some managers find it harder to notice when an employee is struggling or losing motivation, which can lead to problems being discovered too late.</p>\n<p>In conclusion, I partly agree with the statement. Working from home is clearly beneficial for most employees, but for employers the costs can be as significant as the savings. In my view, a hybrid model, in which staff spend two or three days in the office, offers the best balance for both sides.</p>"}, "6": {"task": "<p><i>In many cities around the world, air pollution is becoming a serious problem. What are the main causes of this problem, and what measures can be taken to solve it? Write at least 250 words.</i></p>", "model": "<h4>Model answer (Band 7 level, 280 words)</h4>\n<p>Air quality in many large cities has declined sharply in recent decades, damaging both public health and the environment. In my view, the two main causes of this problem are road traffic and industrial activity, and both can be addressed by government action and changes in individual behaviour.</p>\n<p>The most significant cause is the rapid growth in the number of private vehicles. In fast-growing cities such as Hanoi, millions of motorbikes and cars fill the roads every day, and the exhaust fumes they produce are released at street level, where people breathe them in directly. A second cause is industry. Factories and coal-fired power stations located near cities release large amounts of smoke and fine dust, particularly when environmental laws are weak or poorly enforced.</p>\n<p>To tackle traffic pollution, governments should invest in clean, affordable public transport. When metro lines and electric buses are fast and cheap, many people will choose them over private vehicles. This could be supported by restricting older, more polluting vehicles from city centres, as a number of European cities have already done. As for industry, stricter emission limits should be introduced and properly enforced with heavy fines. At the same time, authorities could offer tax incentives to companies that switch to renewable energy, making the cleaner option the cheaper one.</p>\n<p>In conclusion, urban air pollution is mainly caused by the growth of traffic and by industrial emissions. Better public transport, restrictions on polluting vehicles and stricter controls on factories are the most effective ways to solve the problem. If these measures are taken together, city air could become significantly cleaner within a decade.</p>"}, "7": {"task": "<p><i>Some people think that university education should be free for all students. Others believe that students should pay for their own studies. Discuss both views and give your own opinion. Write at least 250 words.</i></p>", "model": "<h4>Model answer (Band 7 level, 285 words)</h4>\n<p>Whether university should be free or paid for by students is a question that governments around the world answer differently. While there are strong arguments for making students pay, I believe that tertiary education should be largely free, with some conditions.</p>\n<p>Those who believe students should pay argue that graduates are the main beneficiaries of a degree. On average, people with a university qualification earn considerably more over their lifetime, so it seems fair that they, rather than taxpayers, should cover the cost. Supporters of this view also claim that when students pay, they value their education more and are less likely to choose a course without thinking carefully or to drop out.</p>\n<p>However, I am more persuaded by the case for free education. Firstly, society as a whole benefits from a well-educated population. Doctors, teachers and engineers trained at public expense provide services that everyone depends on. Secondly, high tuition fees discourage talented students from poorer families, even when loans are available, because the idea of large debts is frightening. This means that a country loses potential talent simply because of family income. Germany, for example, abolished tuition fees at public universities, partly to widen access to higher education.</p>\n<p>That said, free education should not mean unlimited education. Governments could fund places according to the country's needs and require students to maintain a minimum level of academic performance to keep their free place.</p>\n<p>In conclusion, although graduates do gain personally from their degrees, I believe the wider benefits to society and the importance of equal opportunity mean that university education should be free, provided that the system is well managed.</p>"}, "8": {"task": "<p><i>Many traditional festivals are becoming more commercial. Do the advantages of this development outweigh the disadvantages? Write at least 250 words.</i></p>", "model": "<h4>Model answer (Band 7 level, 280 words)</h4>\n<p>In many countries, traditional festivals have become major shopping seasons, with businesses promoting special products and sales. Although this trend brings some economic benefits, I believe its disadvantages are more significant.</p>\n<p>On the positive side, commercialisation supports the economy. Festivals such as Tết in Vietnam or Christmas in Western countries generate a large share of annual sales for many shops, and they create seasonal jobs in retail, transport and food production. Furthermore, businesses help to keep some traditions visible. Special foods, decorations and gifts linked to a festival are promoted through advertising, which can remind young people in busy cities of customs they might otherwise forget.</p>\n<p>However, these benefits come at a considerable cost. The first problem is financial pressure. Many families feel obliged to spend more than they can afford on gifts, new clothes and food, and some even borrow money to meet these expectations. Secondly, and more importantly, the original meaning of festivals can be lost. When a celebration is presented mainly as an opportunity to buy things, activities such as visiting relatives, worshipping or remembering ancestors may seem less important than shopping. Finally, excessive consumption creates a large amount of waste, from packaging to uneaten food.</p>\n<p>In conclusion, while the commercial side of festivals benefits businesses and can keep certain customs alive, it also places financial pressure on families, weakens the true meaning of celebrations and harms the environment. For these reasons, I believe the disadvantages clearly outweigh the advantages.</p>"}};

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clean=w=>w.replace(/\s*\([^)]*\)\s*$/,"").trim();

/* ---------- persistence ---------- */
const KEY="bandclimb-v1";
let S={xp:0,best:{},played:0,correct:0,answered:0,units:[]};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let units=Array.isArray(S.units)?S.units:[];
const inUnit=u=>!units.length||units.includes(u)||u===0;

/* ---------- level meter ---------- */
const PER=150;
const lvlN=xp=>Math.min(8,Math.floor((Math.sqrt(1+8*xp/PER)-1)/2));const lvlT=n=>PER*n*(n+1)/2;
function band(){return 5+lvlN(S.xp)*0.5}
function paintMeter(){const b=band();$("#bandv").textContent=b.toFixed(1);$("#xpv").textContent=S.xp;const n=lvlN(S.xp);$("#nextv").textContent=b>=9?"—":(lvlT(n+1)-S.xp);$("#fill").style.width=(b>=9?100:(S.xp-lvlT(n))/(lvlT(n+1)-lvlT(n))*100)+"%";
  if(typeof S.coins==="number"&&S.day){$("#coinv").textContent=S.coins;$("#dayv").textContent=S.day.streak;$("#pname").textContent=S.name||"Player";$("#ava").textContent=S.avatar;const pc=Math.min(100,S.today.xp||0);$("#ringc").style.strokeDashoffset=100.5*(1-pc/100);$("#ringv").textContent=pc+"%"}}
function addXP(n){const before=band();const tb=(S.today&&S.today.xp)||0;S.xp+=n;if(S.today)S.today.xp=tb+n;save();paintMeter();
  if(S.today&&tb<100&&S.today.xp>=100){S.coins+=20;save();toast("🎉 Daily goal reached! +20 🪙");beep("up")}
  if(band()>before){S.coins+=50;save();beep("up");confetti();pendingLevel=true;if(VIEW==="play")toast(`🚀 Level up! Band ${band().toFixed(1)} · +50 🪙`);else setTimeout(flushPopups,300);if(typeof checkBadges==="function")setTimeout(checkBadges,50)}}
let VIEW="home",pendingLevel=false;
function flushPopups(){if($("#modal .sheet"))return;if(pendingLevel){pendingLevel=false;modal(`<div style="text-align:center"><div style="font-size:72px">🚀</div><p class="lbl">Level up</p><h2 style="font-size:52px">Band ${band().toFixed(1)}</h2><p>You climbed a level! <b>+50 🪙</b></p><div class="actions" style="justify-content:center"><button class="btn hl" data-close>Keep climbing</button></div></div>`,()=>setTimeout(flushPopups,200));return}if(badgeQ.length)showBadge()}

/* ---------- sound ---------- */
let sound=true,ac=null;
$("#snd").onclick=e=>{sound=!sound;const b=$("#snd");b.textContent=sound?"🔊":"🔇";b.setAttribute("aria-pressed",sound);b.setAttribute("aria-label",sound?"Sound on":"Sound off")};
function beep(kind){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const seq={ok:[660,880],bad:[220,160],up:[523,659,784,1047],tick:[900]}[kind]||[440];
  seq.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=kind==="bad"?"sawtooth":"triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,ac.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+i*.09+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.09+.16);o.connect(g).connect(ac.destination);o.start(ac.currentTime+i*.09);o.stop(ac.currentTime+i*.09+.18)})}catch(e){}}
const canSpeak="speechSynthesis" in window;
function say(t,rate=.95){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[“”"]/g,""));u.lang="en-GB";u.rate=rate;speechSynthesis.speak(u)}catch(e){}}

/* ---------- toast & confetti ---------- */
let tt;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#FFCC33","#2446A8","#0F8F6E","#B23A6B","#6B4FC0"];const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,c:cols[Math.random()*5|0],a:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-4,-2,8+p.r,4);x.restore()});if(++f<160)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}

/* ================= GAMIFICATION LAYER ================= */

for(const k in DEF)if(S[k]===undefined||S[k]===null)S[k]=JSON.parse(JSON.stringify(DEF[k]));
const dstr=(o=0)=>{const d=new Date(Date.now()+o*864e5);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const UNITCOL=["","#FF4D8D","#FF9F1C","#3A86FF","#14B8A6","#7C4DFF","#22C55E","#F43F5E","#EAB308"];

function applyTheme(){const t=THEMES.find(x=>x[0]===S.theme)||THEMES[0];const r=document.documentElement.style;r.setProperty("--g1",t[3][0]);r.setProperty("--g2",t[3][1]);r.setProperty("--g3",t[3][2])}

 {id:"ans20",t:"Get 20 answers right",g:20,f:(e,d)=>e==="ok"},

  S.today={d:t,xp:0,q:pickd.map(id=>({id,p:0,claimed:false})),chest:false,games:[]};save()}}

/* ---------- question builders ---------- */
const V=VOCAB.map(([u,w,m,vi,eg])=>({u,w,m,vi,eg,word:clean(w)}));
function blankEg(v){
  const words=v.word.split(/\s+/);const first=words[0].toLowerCase();
  const stem=first.length>4?first.slice(0,first.length-2):first;
  const rest=words.slice(1).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("\\s+\\w*\\s*");
  const re=new RegExp("\\b"+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*"+(rest?"\\s+"+rest:""),"i");
  return re.test(v.eg)?v.eg.replace(re,"_____"):null}
function qVocab(v,pool){
  const others=pool.filter(x=>x.word!==v.word);let mode=rnd(0,2),html,opts,ans;
  if(mode===2){const b=blankEg(v);if(!b)mode=0;else{html=`<p class="lbl">Complete the sentence</p><blockquote>${esc(b)}</blockquote>`;opts=[v.word,...pick(others,3).map(x=>x.word)]}}
  if(mode===0){html=`<p class="lbl">What does it mean?</p><div class="big">${esc(v.w)}</div>`;opts=[v.m,...pick(others,3).map(x=>x.m)]}
  if(mode===1){html=`<p class="lbl">Which English word means…</p><div class="big" style="color:var(--vocab)">${esc(v.vi)}</div>`;opts=[v.w,...pick(others,3).map(x=>x.w)]}
  return {u:v.u,html,opts,ans:0,why:`<b>${esc(v.w)}</b>: ${esc(v.m)} · <i>${esc(v.vi)}</i><br>${esc(v.eg)}`,speak:v.word}}
const qPara=p=>({u:p[0],html:`<p class="lbl">The text says</p><blockquote>${esc(p[1])}</blockquote><p>Which option means the same?</p>`,opts:[p[2],...p[3]],ans:0,why:`Paraphrase: <b>${esc(p[1])}</b> ≈ <b>${esc(p[2])}</b>. Train your eye to match meaning, not identical words.`});
function qTF(t){const yn=t[2].startsWith("(Y/N/NG)");const labs=yn?["YES","NO","NOT GIVEN"]:["TRUE","FALSE","NOT GIVEN"];
  return {u:t[0],html:`<p class="lbl">Text</p><blockquote>${esc(t[1])}</blockquote><p class="lbl">Statement</p><div class="stmt">${esc(t[2].replace("(Y/N/NG) ",""))}</div>`,opts:labs,ans:{T:0,F:1,NG:2}[t[3]],why:t[4],fixed:true,row:true}}
const qHead=h=>({u:h[0],html:`<p class="lbl">Paragraph</p><blockquote>${esc(h[1])}</blockquote><p>Choose the best heading.</p>`,opts:[h[2],...h[3]],ans:0,why:`The heading must cover the <b>whole paragraph</b>. Wrong options usually pick up one word from it.`});
const qTrap=t=>({u:t[0],trap:t[1],html:`<p class="lbl">Question</p><div class="stmt">${esc(t[2])}</div>`,opts:t[3],ans:t[4],why:t[5]});
const qRule=r=>({u:0,html:`<div class="stmt">${esc(r[1])}</div>`,opts:r[2],ans:r[3],why:r[4]});

/* trend generator */
function qTrend(){
  const years=[2000,2005,2010,2015,2020];
  const kind=pick(["up-big","up-med","up-small","down-big","down-med","down-small","flat"],1)[0];
  const start=rnd(20,60);let end;
  const f={"up-big":rnd(170,240)/100,"up-med":rnd(125,150)/100,"up-small":rnd(106,114)/100,"down-big":rnd(30,50)/100,"down-med":rnd(62,78)/100,"down-small":rnd(86,93)/100,"flat":1}[kind];
  end=Math.round(start*f);const vals=years.map((y,i)=>{const lin=start+(end-start)*i/4;const noise=kind==="flat"?rnd(-1,1):(i===0||i===4?0:rnd(-1,1));return Math.max(1,Math.round(lin+noise))});vals[0]=start;vals[4]=end;
  const [subj,unitsTxt]=pick([["The number of cinema visitors","millions"],["Online course enrolments","thousands"],["Bus passengers","millions"],["Newspaper sales","millions of copies"],["Recycled waste","thousand tonnes"],["Tourists visiting the park","thousands"],["Time spent on social media","minutes per day"]],1)[0];
  const dir=kind.split("-")[0],size=kind.split("-")[1];
  const verb=d=>pick(TRENDWORDS[d==="up"?"up":d==="down"?"down":"flat"],1)[0];
  const adv=s=>pick(TRENDWORDS[s],1)[0];
  const strong={up:["soared","rocketed"],down:["plummeted","plunged"]};
  const sent=(d,s,a,b)=>d==="flat"?`${subj} ${pick(["remained stable","stayed the same","remained steady"],1)[0]} at around ${a} between 2000 and 2020.`:(s==="big"&&Math.random()<.5)?`${subj} ${pick(strong[d],1)[0]} between 2000 and 2020, from ${a} to ${b}.`:`${subj} ${verb(d)} ${adv(s)} between 2000 and 2020, from ${a} to ${b}.`;
  const correct=sent(dir,size,start,end);
  const wrongSize=dir==="flat"?"small":(size==="big"?"small":"big");
  const opp=dir==="up"?"down":dir==="down"?"up":"up";
  const w1=dir==="flat"?`${subj} ${verb("up")} ${adv("big")} between 2000 and 2020, from ${start} to ${Math.round(start*2)}.`:sent(dir,wrongSize,start,end);
  const w2=dir==="flat"?`${subj} ${verb("down")} ${adv("med")} between 2000 and 2020, from ${start} to ${Math.round(start*.7)}.`:sent(opp,size,start,end);
  const W=520,H=250,pl=48,pr=16,pt=16,pb=34;const max=Math.ceil(Math.max(...vals)*1.15/20)*20;const X=i=>pl+i*(W-pl-pr)/4,Y=v=>pt+(H-pt-pb)*(1-v/max);
  let g="";for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`}
  years.forEach((y,i)=>g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${y}</text>`);
  const pts=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
  g+=`<polyline points="${pts}" fill="none" stroke="var(--write)" stroke-width="3" stroke-linejoin="round"/>`+vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="var(--surface)" stroke="var(--write)" stroke-width="2.5"/><text x="${X(i)}" y="${Y(v)-10}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${v}</text>`).join("");
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of ${esc(subj)}">${g}</svg>`;
  const sizeTip={big:"a big change → dramatically / sharply / significantly, or strong verbs: soar, rocket, plummet, plunge",med:"a regular, moderate change → steadily / gradually",small:"a small change → slightly / marginally"};
  return {u:1,html:`<p class="lbl">${esc(subj)} (${unitsTxt}), 2000–2020</p><div class="chartbox">${svg}</div><p>Which sentence describes the chart <b>accurately</b>?</p>`,opts:[correct,w1,w2],ans:0,why:dir==="flat"?"The line hardly moves → <b>remained stable / stayed the same</b>.":`Direction: <b>${dir==="up"?"upward ↑":"downward ↓"}</b>. Size: ${start} → ${end} is ${sizeTip[size]}.`}}

function mcqGame(cfg){

  let i=0,nAns=0,score=0,streak=0,hearts=cfg.hearts||0,xp=0,wrong=[],timer=null,tLeft=0;

function endScreen(cfg,score,done,xp,wrong,o={}){
  S.played++;const prev=S.best[cfg.id]||0;const nb=score>prev&&prev>0;if(score>prev)S.best[cfg.id]=score;

  if(st>(S.stars[cfg.id]||0))S.stars[cfg.id]=st;
  const coins=st*5+(nb?5:0);S.coins+=coins;save();
  track("finish",{game:cfg.id,stars:st,win:o.win!==false});

const toBand=(raw,tab)=>{for(const [min,b] of BANDTAB[tab])if(raw>=min)return b;return 0};
const scaleBand=(right,total,tab)=>toBand(Math.round(right/total*40),tab);
function overallBand(arr){const avg=arr.reduce((a,b)=>a+b,0)/arr.length;const fl=Math.floor(avg),fr=avg-fl;return fr<0.25?fl:fr<0.75?fl+0.5:fl+1}
const norm=s=>String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[.,;:!?]+$/,"").replace(/\s+/g," ").trim();
const wordsIn=s=>norm(s)?norm(s).split(" ").length:0;
const fmtT=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
/* AI marking via the site's own /api/chat (Groq primary, Gemini fallback).
   The old Claude sample API never works on the live site. Every AI answer is
   labelled "AI, chưa duyệt". 429 = out of free turns today, 503 = not ready.
   The API takes at most 500 characters per question, so prompts are short
   and answers are excerpted. Photo marking of handwritten pages is not
   possible through this text-only API, so that button was removed. */
async function askChatAI(question,signal){
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:String(question).slice(0,500),history:[],mode:"chat"}),signal});
    const d=await r.json().catch(()=>({}));
    if(r.status===200&&d.answer)return {ok:true,answer:d.answer};
    if(r.status===429)return {ok:false,msg:d.message||"Hôm nay đã hết lượt trả lời miễn phí, mời bạn quay lại sau 0:00 giờ."};
    if(r.status===503)return {ok:false,msg:d.message||"Tính năng chat AI đang được chuẩn bị, mời bạn quay lại sau."};
    return {ok:false,msg:(d&&d.message)||"Có lỗi xảy ra, mời thử lại sau."};
  }catch(e){return {ok:false,msg:"Không kết nối được, thử lại sau.",cancelled:e&&e.name==="AbortError"};}
}

function checkEssay(u,text){
  const task=u<=4?1:2,min=task===1?150:250;const words=(text.match(/[A-Za-z0-9'’-]+/g)||[]).length;const low=text.toLowerCase();
  const paras=text.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);const sents=text.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>3);
  const out=[];const add=(ok,t,d)=>out.push({ok,t,d});
  add(words>=min,`Length: ${words} words`,words>=min?"Meets the minimum.":`Under ${min} words. Examiners lower your Task ${task===1?"Achievement":"Response"} score for short answers.`);
  add(paras.length>=(task===1?3:4),`Paragraphs: ${paras.length}`,paras.length>=(task===1?3:4)?"Clear paragraphing helps Coherence & Cohesion.":`Use ${task===1?"3–4":"4–5"} paragraphs with a blank line between them. One block of text limits Coherence to about band 5.`);
  if(task===1){const ov=/\b(overall|in general|it is clear|it is noticeable|generally speaking)\b/i.test(text);add(ov,"Overview",ov?"You have an overview sentence. Check it summarises the main trends with no numbers.":"No overview found. Start paragraph 2 with 'Overall, …' and give the two biggest features. Without one, Task Achievement is usually capped at band 5.");
    const op=/\b(i think|i believe|in my opinion|i feel|in my view)\b/i.test(text);add(!op,"Objective tone",op?"Task 1 is a report. Remove personal opinions.":"No personal opinions. Good.");
    const nums=(text.match(/\d+(\.\d+)?%?/g)||[]).length;if(u!==3&&u!==4)add(nums>=4,`Data used: ${nums} figures`,nums>=4?"You support your points with data.":"Add figures from the chart to support each comparison.")}
  else{const intro=(paras[0]||"").toLowerCase();const pos=/\b(i (strongly |partly |completely )?(agree|disagree|believe|think)|in my (view|opinion)|this essay will|i would argue|personally)\b/.test(intro);add(pos,"Position in the introduction",pos?"Your position is clear from the start.":"State your answer to the question in the introduction. An unclear position limits Task Response to about band 5–6.");
    const con=/\b(in conclusion|to conclude|to sum up|overall)\b/i.test(paras.at(-1)||"");add(con&&paras.length>1,"Conclusion",con?"You have a clear conclusion.":"End with a short conclusion that restates your position.")}
  const found=LINKERS.filter(l=>new RegExp("\\b"+l+"\\b","i").test(text));const over=LINKERS.map(l=>[l,(low.match(new RegExp("\\b"+l+"\\b","g"))||[]).length]).filter(x=>x[1]>=3&&!["because","while","since"].includes(x[0]));
  add(found.length>=5&&!over.length,`Linking words: ${found.length} different`,over.length?`Overused: ${over.map(x=>`"${x[0]}" ×${x[1]}`).join(", ")}. Mechanical linking is a band 6 feature.`:found.length>=5?"Good range of cohesive devices.":"Use a wider range: however, whereas, as a result, for instance, in contrast.");
  const contr=text.match(/\b\w+(n't|'re|'ve|'ll|'d|'m)\b/gi)||[];add(!contr.length,"Formal style",contr.length?`Avoid contractions in academic writing: ${[...new Set(contr)].slice(0,4).join(", ")}.`:"No contractions. Good.");
  const cx=sents.filter(s=>/\b(which|who|whereas|although|while|because|if|when|since|that|unless)\b/i.test(s)).length;add(sents.length&&cx/sents.length>=0.4,`Complex sentences: ${cx} of ${sents.length}`,cx/Math.max(1,sents.length)>=0.4?"Good mix of simple and complex sentences.":"Band 6–7 needs a mix. Join ideas with which, although, whereas, because.");
  const stop=new Set("the a an and or of to in on for is are was were be been by with that this it its as at from these those their there than which who has have had also more most not but can will would".split(" "));
  const freq={};(low.match(/[a-z']+/g)||[]).forEach(w=>{if(w.length>3&&!stop.has(w))freq[w]=(freq[w]||0)+1});const rep=Object.entries(freq).filter(x=>x[1]>=6).sort((a,b)=>b[1]-a[1]).slice(0,4);
  add(!rep.length,"Word repetition",rep.length?`Repeated often: ${rep.map(x=>`"${x[0]}" ×${x[1]}`).join(", ")}. Use synonyms or pronouns.`:"No heavy repetition.");
  const prompt=((WTASKS[u].task.match(/<i>(.*?)<\/i>/)||["",""])[1]).toLowerCase().match(/[a-z']+/g)||[];const tw=low.match(/[a-z']+/g)||[];let copied=0;for(let i=0;i+7<=prompt.length;i++){const g=prompt.slice(i,i+7).join(" ");if(tw.join(" ").includes(g))copied++}
  add(!copied,"Own words",copied?"Parts of the question are copied word for word. Copied words are not counted and suggest weak paraphrasing.":"You paraphrased the question.");

}

    $("#bk").onclick=testMenu;$("#calc").onclick=()=>{const b=[0,1,2,3].map(k=>+app.querySelector(`input[name="s${k}"]:checked`).value);const ov=overallBand(b);$("#sres").innerHTML=`<div class="aiband">Self-estimated Speaking band <b>${ov.toFixed(1)}</b></div><p class="note2">Self-scores are usually half a band higher than real results. For an accurate score, practise with a teacher.</p>`;logMock("Speaking (self)",{s:ov})};
    if($("#aisp"))$("#aisp").onclick=async()=>{const t=$("#tr").value.trim();const o=$("#aso");if((t.match(/\w+/g)||[]).length<30){o.innerHTML=`<p class="aiwarn">Paste at least 30 words.</p>`;return}
      o.innerHTML=`<p class="thinking">Listening… thinking…</p>`;
      const res=await askChatAI(`You are an IELTS Speaking examiner. A Vietnamese learner (target 6.5) gave this answer. You cannot hear pronunciation: assess only Fluency and Coherence, Lexical Resource, Grammar from the words. Simple English.\nTopic: ${card[1].slice(0,60)}\nTranscript (excerpt): ${t.slice(0,100)}\nGive a band per criterion, 2 better phrases (said -> try), one practical tip.`);
      if(res.ok){o.innerHTML=`<div class="yours">${esc(res.answer).replace(/\n/g,"<br>")}</div><p class="note2">AI feedback — AI, chưa duyệt. It cannot hear your pronunciation.</p>`;addXP(10)}
      else{o.innerHTML=`<p class="aiwarn">${esc(res.msg)}</p>`}};
    setTimeout(flushPopups,500)}
}

/* ---------- SCORE CALCULATOR + MOCK LOG ---------- */
function logMock(label,b){S.mocks=S.mocks||[];S.mocks.push({d:dstr(),label,...b});if(S.mocks.length>60)S.mocks.shift();save()}
function scoreCalc(){
  VIEW="play";const bands=[];for(let b=9;b>=1;b-=0.5)bands.push(b);
  const sel=(id,def)=>`<select id="${id}" class="ans sel">${bands.map(b=>`<option ${b===def?"selected":""}>${b.toFixed(1)}</option>`).join("")}</select>`;
  app.innerHTML=`<div class="gtop"><button class="back" id="bk">← Test Room</button><h2>Score Calculator</h2></div>
  <p class="lead">After a full practice test (for example a Cambridge IELTS book), enter your raw scores. The calculator uses the official conversion and rounding rules.</p>
  <div class="panel calc">
   <div class="crow"><label for="cl">Listening correct answers (out of 40)</label><input type="number" id="cl" min="0" max="40" value="26" class="ans"></div>
   <div class="crow"><label for="cr">Reading correct answers (out of 40)</label><input type="number" id="cr" min="0" max="40" value="25" class="ans"><select id="ct" class="ans sel"><option value="academic">Academic</option><option value="general">General Training</option></select></div>
   <div class="crow"><label for="cw">Writing band (from your teacher or the AI examiner)</label>${sel("cw",6)}</div>
   <div class="crow"><label for="cs">Speaking band</label>${sel("cs",6)}</div>
   <div class="crow"><label for="cg">Target overall band</label>${sel("cg",6.5)}</div>
   <div id="cout"></div>
   <div class="actions"><button class="btn hl" id="save">Save to my progress</button></div>
  </div>
  <div class="panel" style="margin-top:14px"><p class="lbl">My progress</p><div id="hist"></div></div>
  <details class="desc"><summary>How the overall band is rounded</summary><p>The overall band is the average of the four skills, rounded to the nearest half band. An average ending in .25 rounds up to the next half band (6.25 → 6.5). One ending in .75 rounds up to the next whole band (6.75 → 7.0). Below .25 rounds down (6.125 → 6.0).</p></details>`;
  const calc=()=>{const l=Math.max(0,Math.min(40,+$("#cl").value||0)),r=Math.max(0,Math.min(40,+$("#cr").value||0));const bl=toBand(l,"listening"),br=toBand(r,$("#ct").value),bw=+$("#cw").value,bs=+$("#cs").value,g=+$("#cg").value;
    const avg=(bl+br+bw+bs)/4,ov=overallBand([bl,br,bw,bs]);const skills=[["Listening",bl],["Reading",br],["Writing",bw],["Speaking",bs]];const weak=skills.filter(s=>s[1]<g).sort((a,b)=>a[1]-b[1]);
    const needL=BANDTAB.listening.slice().reverse().find(x=>x[1]>=g),needR=BANDTAB[$("#ct").value].slice().reverse().find(x=>x[1]>=g);
    $("#cout").innerHTML=`<div class="bands4">${skills.map(s=>`<div class="${s[1]>=g?"met":"gap"}"><small>${s[0]}</small><b>${s[1].toFixed(1)}</b></div>`).join("")}<div class="ovr"><small>Overall</small><b>${ov.toFixed(1)}</b><span>average ${avg.toFixed(3).replace(/0+$/,"").replace(/\.$/,"")}</span></div></div>
     <p class="${ov>=g?"okmsg":"gapmsg"}">${ov>=g?`🎉 On target for band ${g.toFixed(1)}.`:`To reach ${g.toFixed(1)}: ${weak.map(w=>w[0]).join(", ")} ${weak.length>1?"are":"is"} below target.`} For band ${g.toFixed(1)} you need about <b>${needL?needL[0]:"—"}/40</b> in Listening and <b>${needR?needR[0]:"—"}/40</b> in Reading.</p>`;return{l:bl,r:br,w:bw,s:bs,o:ov}};
  app.querySelectorAll("#cl,#cr,#ct,#cw,#cs,#cg").forEach(e=>e.oninput=e.onchange=calc);const first=calc();
  const hist=()=>{const m=(S.mocks||[]).slice().reverse();$("#hist").innerHTML=m.length?`<table class="rtab"><tr><th>Date</th><th>Test</th><th>L</th><th>R</th><th>W</th><th>S</th><th>Overall</th></tr>${m.slice(0,20).map(x=>`<tr><td>${x.d}</td><td>${esc(x.label)}</td><td>${x.l??""}</td><td>${x.r??""}</td><td>${x.w??""}</td><td>${x.s??""}</td><td><b>${x.o??""}</b></td></tr>`).join("")}</table>`:`<p class="note2">No results yet. Save a full practice test, or finish a test in the Test Room.</p>`};hist();
  $("#save").onclick=()=>{const c=calc();logMock("Full practice test",c);addXP(30);track("finish",{game:"test-calc",stars:1});hist();toast("Saved to your progress")};
  $("#bk").onclick=testMenu;
}
const TESTS=[
 {id:"reading",tag:"Reading · 20–40 min",title:"Reading Test",desc:"Full-length passages, split screen, highlighter, strict timer, band estimate.",c:["#1D4ED8","#06B6D4"],run:readingPick},
 {id:"listening",tag:"Listening · ~20 min",title:"Listening Test",desc:"Four parts, heard once, different voices, reading time, 2 minutes to check.",c:["#0F766E","#22C55E"],run:listeningPick},
 {id:"writing",tag:"Writing · 20–60 min",title:"Writing Test",desc:"No spellcheck, live word count, instant structure check and AI examiner marking.",c:["#BE185D","#F97316"],run:writingPick},
 {id:"speaking",tag:"Speaking · 11–14 min",title:"Speaking Mock",desc:"A spoken examiner runs Parts 1–3 with real timing. Record yourself and self-score.",c:["#6D28D9","#C026D3"],run:speakingMock},

/* ---------- registry ---------- */

const GAMES=[
 {id:"t-read",skill:"test",glyph:"R",title:"Reading Test",desc:"Full-length passages in the computer-test layout: split screen, highlighter, strict timer, band estimate.",run:()=>readingPick()},

 {id:"flash",skill:"vocab",glyph:"Aa",title:"Flashcards",desc:"Learn all 94 unit words: meaning, Vietnamese and an example. Tap to flip.",run:flashGame},
 {id:"flip",skill:"vocab",glyph:"⇄",title:"Word Flip",desc:"Memory match: pair each English word with its Vietnamese meaning.",run:memoryGame},
