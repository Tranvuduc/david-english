<style>
/* Layout: one centered column like a game cabinet; home grid of mode cards, then level path, then play screen. */
:root{
  --bg: #f7f5ef; --panel:#ffffff; --panel2:#e3eceb; --ink:#12302f; --muted:#52706e;
  --accent:#0f8b7a; --accent-ink:#ffffff; --chalk:#f2b705; --good:#17a25a; --bad:#e04a3c; --sky:#2f7fd1;
  --line:#c9dad8; --shadow:0 3px 0 rgba(18,48,47,.14);
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1f21; --panel:#14302f; --panel2:#1b3f3d; --ink:#e9f3f1; --muted:#9bbab6;
  --accent:#34d1b6; --accent-ink:#06211d; --chalk:#ffd23f; --good:#4fe08e; --bad:#ff7a6b; --sky:#6db8ff;
  --line:#26514e; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1f21; --panel:#14302f; --panel2:#1b3f3d; --ink:#e9f3f1; --muted:#9bbab6;
  --accent:#34d1b6; --accent-ink:#06211d; --chalk:#ffd23f; --good:#4fe08e; --bad:#ff7a6b; --sky:#6db8ff;
  --line:#26514e; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:14px 40px;
  background-image:radial-gradient(circle at 12% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 45%),radial-gradient(circle at 100% 0,color-mix(in srgb,var(--chalk) 12%,transparent),transparent 40%)}
#app{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.2px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:26px;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.ibtn{width:42px;height:42px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:translateY(2px);box-shadow:none}
.hud{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px}
.hud-row{display:flex;gap:12px;align-items:center}
.rankbadge{width:56px;height:56px;flex:none}
.hud-main{flex:1;min-width:0}
.hud-title{font-family:var(--f-display);font-size:20px;line-height:1.1}
.hud-sub{color:var(--muted);font-size:13px}
.bar{height:12px;border-radius:8px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--chalk));border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:5px 11px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip b{color:var(--accent)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-size:20px}
.sec span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card:active{transform:translateY(2px);box-shadow:none}
.cico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.cico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:18px;line-height:1.15}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.stars{display:flex;gap:3px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.stars svg{width:17px;height:17px}
.star-on{fill:var(--chalk);stroke:#b98900}.star-off{fill:none;stroke:var(--line);stroke-width:2}
.mini{height:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.levels{display:grid;gap:10px}
.lv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);text-align:left;width:100%}
.lv[disabled]{opacity:.55;cursor:not-allowed}
.lvn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;flex:none}
.lv[disabled] .lvn{background:var(--line);color:var(--muted)}
.lv div{min-width:0;flex:1}
.lv b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px}
.lv small{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;font-size:18px;padding:12px 22px;border-radius:14px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.play{display:flex;flex-direction:column;gap:14px}
.ph{display:flex;align-items:center;gap:10px}
.ph .bar{flex:1}
.q{font-family:var(--f-display);font-size:21px;line-height:1.3;font-weight:500}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:600;transition:transform .08s,background .15s,border-color .15s;display:flex;gap:10px;align-items:flex-start}
.opt i{font-style:normal;font-family:var(--f-display);width:26px;height:26px;border-radius:8px;background:var(--panel);display:grid;place-items:center;flex:none;font-size:14px;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:active:not([disabled]){transform:scale(.985)}
.opt.ok{background:color-mix(in srgb,var(--good) 22%,var(--panel));border-color:var(--good)}
.opt.no{background:color-mix(in srgb,var(--bad) 22%,var(--panel));border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:12px 14px;font-size:15px;display:none}
.fb.show{display:block;animation:pop .25s ease}
.fb.good{background:color-mix(in srgb,var(--good) 18%,var(--panel));border:1px solid var(--good)}
.fb.bad{background:color-mix(in srgb,var(--bad) 18%,var(--panel));border:1px solid var(--bad)}
.fb b{font-family:var(--f-display);font-size:17px}
.slots,.pool{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.slots{min-height:78px;padding:10px;border:2px dashed var(--line);border-radius:14px;background:var(--panel2)}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;box-shadow:var(--shadow);text-align:left}
.tile:active{transform:translateY(2px)}
.tile.used{opacity:.25;pointer-events:none}
.slots.stack{flex-direction:column;flex-wrap:nowrap}
.pool.stack{flex-direction:column;flex-wrap:nowrap}
.stack .tile{width:100%}
.slots.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel2))}
.slots.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel2))}
.timer{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--chalk);min-width:44px;text-align:right}
.combo{font-family:var(--f-display);color:var(--chalk);font-size:17px;min-height:22px}
.result{text-align:center;display:grid;gap:12px;justify-items:center}
.result h2{font-size:30px}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:54px;height:54px}
.bigstars svg.in{animation:starin .5s both}
.xpgain{font-family:var(--f-display);font-size:26px;color:var(--accent)}
.rev{width:100%;text-align:left;display:grid;gap:8px}
.rev div{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:14.5px}
.rev small{color:var(--muted);display:block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{background:var(--panel2);border-radius:14px;padding:12px;display:grid;gap:4px;justify-items:center;text-align:center;font-size:13px}
.bd.off{opacity:.45;filter:grayscale(1)}
.bd svg{width:38px;height:38px}
.bd b{font-family:var(--f-display);font-weight:600;font-size:15px}
.stat{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-size:14px;font-weight:600}
.stat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-220%);opacity:0;background:var(--chalk);color:#2a2100;font-family:var(--f-display);font-weight:600;padding:10px 18px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.2,1.3,.4,1);z-index:30;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{padding:8px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.banner{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
button.banner:hover{transform:translateY(-2px)}button.banner:active{transform:translateY(2px);box-shadow:none}
.banner.done{opacity:.75}
.banner b{font-family:var(--f-display);font-weight:600;font-size:17px;display:block}
.banner small{color:var(--muted);font-size:13px}
.banner .cico{flex:none}
.lvrow{display:flex;gap:8px;align-items:stretch}
.lvrow .lv{flex:1;min-width:0}
.lbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--accent);box-shadow:var(--shadow);flex:none}
.lbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lbtn:active{transform:translateY(2px);box-shadow:none}
.dots{display:flex;gap:6px}.dots i{flex:1;height:6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}.dots i.on{background:var(--accent);border-color:var(--accent)}
.lesson{display:grid;gap:12px}.lesson h2{font-size:25px;line-height:1.15}.lesson p{margin:0;font-size:17px}
.exs{display:grid;gap:8px}
.ex{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--panel2);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-weight:600}
.spk{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent)}
.spk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tipbox{background:color-mix(in srgb,var(--chalk) 22%,var(--panel));border:1px solid color-mix(in srgb,var(--chalk) 60%,var(--line));border-radius:12px;padding:10px 12px;font-size:15px}
.hearts{display:flex;gap:2px}.hearts svg{width:22px;height:22px;fill:var(--bad);stroke:var(--bad);stroke-width:2;stroke-linejoin:round}.hearts .off svg{fill:none;opacity:.4}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.small{font-size:14px;padding:6px 12px;margin-top:8px;box-shadow:none}
.listen .row{margin-top:10px}
.sents{display:grid;gap:8px}
.sent{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:flex-start;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600}
.sent i{font-style:normal;font-family:var(--f-display);color:var(--muted);width:22px;flex:none}
.sent span{flex:1;min-width:0}
.sent em{flex-basis:100%;padding-left:32px;font-style:normal;font-weight:500;font-size:14px;color:var(--muted)}
.sent.flag{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 16%,var(--panel2))}
.sent.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--panel))}
.sent.miss{border-color:var(--chalk);background:color-mix(in srgb,var(--chalk) 22%,var(--panel))}
.sent.fa{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--panel))}
.sent[disabled]{cursor:default}
.essay{margin-top:10px;background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.55;border-left:4px solid var(--chalk)}
.crits,.trows{display:grid;gap:10px}
.crit,.trow{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.crit.ok,.trow.ok{border-color:var(--good)}.crit.near{border-color:var(--chalk)}.crit.no,.trow.no{border-color:var(--bad)}
.cn{min-width:0;flex:1}.cn b{font-family:var(--f-display);font-weight:600;font-size:16px;display:block}
.cn small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.cn small.why{color:var(--ink);margin-top:4px}
.stepper{display:flex;align-items:center;gap:8px;flex:none}
.stepper output{min-width:44px;text-align:center;font-family:var(--f-display);font-size:21px;font-variant-numeric:tabular-nums}
.stepper .ibtn{width:40px;height:40px;font-size:22px;font-weight:700}
.tsum{font-weight:700;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.tsum.full{background:color-mix(in srgb,var(--good) 20%,var(--panel));border-color:var(--good)}
.tsum.over{background:color-mix(in srgb,var(--bad) 18%,var(--panel));border-color:var(--bad)}
.form{display:grid;gap:10px}
.form label{font-weight:700;font-size:14px}
.form input[type=text],.form textarea,.form select{width:100%;font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.form input[type=text]:focus,.form textarea:focus{outline:3px solid var(--sky);outline-offset:1px}
.orow{display:flex;gap:10px;align-items:center}
.orow input[type=radio]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.crow small{display:block;color:var(--muted)}
.hud.slim{padding:12px;gap:10px}
.hero{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--sky)));color:var(--accent-ink);border-radius:20px;padding:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,#000);transition:transform .08s}
.hero:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.hero>div{flex:1;min-width:0}.hero small{display:block;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;opacity:.85}
.hero b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.15;font-weight:600}
.hero span:not(.cico):not(.go){display:block;font-size:15px;opacity:.92}
.hero .cico{background:#fff!important;flex:none;width:52px;height:52px}.hero .cico svg{stroke:#12302f}
.hero .go{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;flex:none}
.hero .go svg{width:22px;height:22px;fill:currentColor;stroke:none}
.banner.topic{justify-content:space-between}.banner.topic>div{flex:1;min-width:0;display:grid;gap:4px}
.chev svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.seg.small{max-width:260px;align-self:center;width:100%}.seg.small button{padding:5px;font-size:14px}
.prog{display:grid;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}
.flash-ok{animation:fok .5s}.flash-no{animation:fno .5s}
.shake{animation:shake .4s}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes fok{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 70%,transparent)}100%{box-shadow:0 0 0 22px transparent}}

<script>
var D={};
/* Level = {learn:[[title,text,[examples],tip]], q:[[prompt,[options],correctIndex,note]]} */
D.grammar=[
{learn:[
["Present perfect or past simple?","Use the past simple for a finished time (yesterday, in 2019, last week). Use the present perfect when the time is unfinished (this week, so far) or when the result matters now. Never join the present perfect to a finished time word.",["I saw her yesterday.","I have seen her twice this week.","She has lived here since 2019."],"Learner trap: 'I have seen him yesterday' is wrong."],
["Conditionals 0, 1 and 2","Zero: if + present, present (facts). First: if + present, will + base (real future). Second: if + past, would + base (unreal present). Will and would never go inside the if-clause.",["If you heat ice, it melts.","If it rains, we'll stay in.","If I were you, I'd apply."],"In formal English use 'were' for every person: If he were here."]
],q:[
["I ___ to London three times, but I have never visited the Tower.",["have been","went","was going","had gone"],0,"Life experience with no finished time word calls for the present perfect."],
["She ___ here since 2019.",["works","has worked","worked","is working"],1,"Since + a starting point needs the present perfect."],
["If you ___ the water, it boils.",["will heat","heated","heat","would heat"],2,"Zero conditional for general truths: present + present."],
["I wish I ___ more free time.",["have","had","would have","will have"],1,"Wish about the present takes the past simple."],
["Which sentence has an article error?",["She is the best student in class.","He plays the piano well.","She has a advice for you.","I saw an elephant."],2,"Advice is uncountable, so it takes no 'a'. Say 'a piece of advice'."],
["You ___ have told me earlier! Now it is too late.",["should","must","might","would"],0,"Should have + past participle criticises a past action."]
]},
{learn:[
["Third and mixed conditionals","Third: if + past perfect, would have + past participle (unreal past). Mixed: if + past perfect, would + base (a past cause with a present result). Always check the time of each clause separately.",["If I had studied, I would have passed.","If I had taken that job, I would be living in Hanoi now.","If she weren't so busy, she would have come."],"Ask two questions: when is the 'if' part, and when is the result?"],
["Relative clauses","Defining clauses add essential information, have no commas and can use 'that'. Non-defining clauses add extra information, need commas and never use 'that'. You can drop the pronoun only when it is the object.",["The book that I bought is great.","My brother, who lives in Da Nang, is a nurse.","The girl I met was kind."],"'Which' can refer to a whole clause: He passed, which surprised everyone."]
],q:[
["If she ___ the bus, she wouldn't be late now.",["hadn't missed","didn't miss","wouldn't miss","hasn't missed"],0,"Mixed conditional: past cause (missed), present result (late now)."],
["My sister, ___ lives in Da Nang, is a nurse.",["that","who","which","whom"],1,"Non-defining clause about a person: who. 'That' is not allowed."],
["I'd rather you ___ smoke in here.",["don't","didn't","won't","wouldn't"],1,"Would rather + subject + past simple talks about someone else's present action."],
["The new bridge, ___ construction began last year, will open in May.",["which","that","whose","of which"],2,"Whose shows possession, even for things."],
["Choose the correct passive of: 'People say that he is very rich.'",["He is said to be very rich.","He is said being very rich.","He says to be very rich.","It is said him to be rich."],0,"Say, believe, think and report verbs: He is said to + infinitive."],
["No sooner ___ sat down than the phone rang.",["had she","she had","did she","has she"],0,"After 'No sooner' invert the subject and use the past perfect."]
]},
{learn:[
["Inversion for emphasis","After negative or restrictive adverbs at the start (never, rarely, seldom, hardly, no sooner, not only, only after, not until) invert the subject and auxiliary. If there is no auxiliary, add do, does or did.",["Never have I felt so tired.","Only after the exam did she relax.","Not until midnight did they finish."],"Inversion is formal. It is useful for IELTS Writing but rare in speech."],
["Participle clauses and clefts","A participle clause shortens a sentence, and its subject must be the same as the main clause. Cleft sentences move the focus: 'What I need is a rest.' 'It was Tom who called.'",["Having missed the bus, he walked.","What I need is a long holiday.","It was the noise that woke me."],"Dangling participle: 'Walking home, the rain started.' is wrong. Who was walking?"]
],q:[
["Only after the meeting ___ she realise her mistake.",["did","had","was","does"],0,"'Only after' at the start needs inversion. No auxiliary in the original, so add did."],
["Which sentence has a dangling participle?",["Walking home, I met an old friend.","Walking home, the rain started.","Having eaten, we left.","Tired, she went to bed."],1,"The rain cannot walk. The participle must match the subject."],
["It was not until she left ___ I understood her.",["that","when","than","then"],0,"Cleft pattern: It was not until ... that ..."],
["___ for your help, I would have failed.",["Had it not been","Were it not","If it wasn't","Was it not"],0,"Inverted third conditional: Had it not been for ..."],
["She insisted that he ___ the form himself.",["fill","fills","filled","filling"],0,"After insist, suggest and demand, the subjunctive uses the base form."],
["Not only ___ rude, but he also refused to apologise.",["was he","he was","did he","is he"],0,"Not only + inversion. The verb is 'be', so it moves in front of the subject."]
]},
{learn:[
["Tense, aspect, and meaning","English has two tenses (present and past). Simple, continuous and perfect are aspects. Perfect links an earlier event to a later time. Continuous shows something in progress or temporary. Be + -ing with 'always' can show annoyance.",["I've been waiting for an hour.","She will have finished by six.","He was always complaining."],"Teachers who name the aspect can explain errors clearly."],
["Terminology teachers need","Stative verbs (know, belong, seem) rarely take continuous forms. Phrasal verbs can be separable (turn it off) or inseparable (look after them). Pronoun objects go inside separable phrasal verbs.",["She knows the answer. (not is knowing)","Switch the light off / switch it off.","Look after the children."],"Diagnose the cause of an error before you correct it."]
],q:[
["Which verb is stative?",["belong","run","build","listen"],0,"Belong describes a state, not an action."],
["'I'm seeing the doctor tomorrow.' The present continuous here expresses...",["a fixed arrangement","a habit","a permanent state","an action in progress now"],0,"Present continuous for the future = an arrangement already made."],
["A learner writes 'She said me she was tired.' Best diagnosis?",["Confusing say and tell patterns","Wrong tense","Missing article","Word order"],0,"Say needs no person object. Tell takes a person: She told me."],
["Which is an inseparable phrasal (prepositional) verb?",["look after","turn off","put on","take out"],0,"You cannot say 'look the kids after'. The others can split."],
["'I used to living in Hue.' The error is...",["Confusing 'used to + base' with 'be used to + -ing'","Wrong preposition","Missing subject","Wrong plural"],0,"I used to live (past habit). I am used to living (familiar with it)."],
["Which sentence uses 'will' for a spontaneous decision?",["The phone's ringing. I'll get it.","I'll see the dentist on Friday. (booked)","It will be sunny tomorrow (forecast).","I will have finished by noon."],0,"A decision made at the moment of speaking takes will."]
]},
{learn:[
["Nuances that decide Band 8 and 9","Few = almost none (negative). A few = some (positive). Little and a little work the same with uncountables. Use zero article for general plural or uncountable nouns. 'The' + adjective names a group (the poor).",["Few people came.","A few people came.","The unemployed need support."],"One small word can change the meaning of the whole sentence."],
["Future in the past","'Was going to' shows a plan that did not happen. 'Would' is the future from a past point of view. 'Was about to' means on the point of doing something.",["I was going to call you, but I forgot.","He knew he would never return.","I was about to leave when she arrived."],"Match the tense with the viewpoint of the narrator."]
],q:[
["'There is ___ hope left.' (almost none)",["little","a little","few","a few"],0,"Hope is uncountable. Little = almost none."],
["By next June, I ___ in this job for ten years.",["will have been working","will work","have worked","am working"],0,"Future perfect continuous stresses duration up to a future point."],
["___ unemployed need more support from the state.",["The","A","Some","An"],0,"The + adjective names a whole group of people."],
["I ___ you earlier, but my phone died.",["was going to call","would call","called","have called"],0,"Was going to = an intention that was not completed."],
["Which sentence is correct?",["Seldom I have seen such courage.","Seldom have I seen such courage.","Seldom I did see such courage.","Seldom have seen I such courage."],1,"Seldom at the start requires inversion of auxiliary and subject."],
["Scarcely had we left the house ___ it began to rain.",["when","than","that","as"],0,"Scarcely and hardly go with when. No sooner goes with than."]
]}
];
D.vocab=[
{learn:[
["Make or do?","Do is for tasks, work and activities (do homework, do the dishes, do business). Make is for creating or producing (make a cake, make a mistake, make a decision, make progress). These are fixed chunks, so learn them together.",["do homework","make a mistake","do someone a favour","make progress"],"Research is uncountable. We 'do research', never 'make a research'."],
["Word families","Learn the noun, verb, adjective and adverb of a word together. Suffixes help: -tion and -ment make nouns, -ful, -ous and -ive make adjectives, -ly makes adverbs.",["succeed, success, successful, successfully","create, creation, creative, creatively"],"Many PET and IELTS gaps test the correct part of speech."]
],q:[
["She made a serious ___ when she signed without reading the contract.",["mistake","wrong","failure","fault"],0,"Make a mistake is the fixed collocation."],
["We need to ___ a decision before Friday.",["do","make","have","give"],1,"Make a decision."],
["The ___ of the new road reduced traffic in the city.",["construct","constructive","construction","constructed"],2,"A noun is needed after 'the'."],
["The driver was fined for driving ___.",["careless","carelessly","care","careful"],1,"An adverb modifies the verb 'driving'."],
["Let's ___ the meeting until next week. I'm ill.",["put off","put on","put out","put up"],0,"Put off = postpone."],
["The film was a great ___ at the box office.",["success","succeed","successful","successfully"],0,"After 'a great' we need a noun."]
]},
{learn:[
["Phrasal verbs by meaning","Group phrasal verbs by meaning, not alphabet. Put off = postpone. Carry on = continue. Come up with = invent an idea. Run out of = have none left. Get over = recover from.",["We ran out of milk.","She came up with a solution.","He got over the flu quickly."],"Many phrasal verbs have more than one meaning. Check the context."],
["Idioms in context","Idioms are fixed expressions. Break the ice = start a friendly talk. Hit the books = study hard. Under the weather = slightly ill. Do not change the words or the idiom stops working.",["She told a joke to break the ice.","I'm under the weather today.","I must hit the books tonight."],"Use idioms sparingly in IELTS Speaking. One natural idiom beats five forced ones."]
],q:[
["We've ___ of milk, so I'll go to the shop.",["run out","put out","given up","carried on"],0,"Run out of = have none left."],
["She finally ___ a brilliant solution to the problem.",["came up with","came across","came round","came out"],0,"Come up with = think of an idea."],
["I'm feeling a bit under the ___ today.",["weather","rain","cloud","wind"],0,"Under the weather = unwell."],
["He quickly got ___ the flu and returned to work.",["over","off","away","through"],0,"Get over = recover from."],
["To break the ___ at the party, she told a joke.",["ice","glass","wall","plate"],0,"Break the ice = start a conversation in an awkward situation."],
["Her plan to open a café fell ___ because she had no money.",["through","over","out","down"],0,"Fall through = fail to happen."]
]},
{learn:[
["Academic words for IELTS Writing","Swap everyday words for precise ones. Increase: rise, grow, surge. Decrease: fall, decline, plummet. Show: illustrate, indicate. Big: substantial, considerable. Problem: issue, challenge.",["Sales surged by 40%.","The chart illustrates the trend.","There was a considerable rise."],"Precision beats fancy words. Use only words you can control."],
["Hedging language","Academic writing avoids absolute claims. Use may, tend to, appear to, it is likely that, to some extent, evidence suggests.",["Evidence suggests that sleep improves memory.","Younger people tend to use social media more."],"Hedging shows balance, which helps Task Response."]
],q:[
["Visitors rose from 10,000 to 40,000, which is a ___ increase.",["substantial","slightly","fragile","narrow"],0,"Substantial = large. Slightly is an adverb and cannot go before 'increase'."],
["It is ___ that exercise improves memory, but more research is needed.",["suggested","certain","proven","obvious"],0,"Only 'suggested' fits with 'more research is needed'."],
["Best paraphrase of 'The cost of living has risen dramatically'?",["Living expenses have increased sharply.","Living is costly now.","Costs rose because of living.","The living costs is rising."],0,"Keeps the meaning and changes the words with correct grammar."],
["Which word is the most formal?",["commence","start","begin","get going"],0,"Commence is formal and used in academic or official writing."],
["The government must ___ the problem of homelessness.",["tackle","hit","strike","knock"],0,"Tackle a problem is a strong collocation."],
["Her argument was ___ by strong evidence.",["underpinned","underground","undertaken","understood"],0,"Underpin = support something."]
]},
{learn:[
["Teaching a word: meaning, form, use","A learner knows a word when they know its meaning, spelling and pronunciation, grammar pattern (countable or not, collocations), register and connotation. Tests that only ask for a definition miss most of this.",["research is uncountable","heavy rain, not strong rain","formal: require. informal: need."],"Always ask: can the learner USE it in a sentence?"],
["Lexical Resource in IELTS","Examiners reward range, precision, natural collocation, awareness of register, and spelling control. Rare words used wrongly lower the band. Paraphrase shows flexibility.",["make progress, not do progress","a considerable amount of research"],"Repeated errors in common words hurt more than one risky word used well."]
],q:[
["A learner writes 'make a research'. The main problem is...",["collocation and countability","spelling","tense","article only"],0,"We do research, and research is uncountable."],
["Which sentence has a register problem in an IELTS essay?",["Kids need lots of attention.","Children require considerable attention.","Parents should supervise children.","Children benefit from supervision."],0,"Kids and lots of are informal for academic writing."],
["Which task best checks that a student can USE a word, not only know its meaning?",["Write a sentence using the word","Match it to a translation","Copy it five times","Read it aloud"],0,"Production shows grammar, collocation and meaning together."],
["Which word has the most negative connotation?",["stubborn","determined","persistent","resolute"],0,"The other three are positive or neutral."],
["Which pair shows correct collocations?",["heavy traffic, strong wind","strong traffic, heavy wind","big traffic, high wind","thick traffic, strong snow"],0,"Heavy traffic and strong wind are natural."],
["A candidate uses 'phenomenon' correctly but writes 'informations' and 'advices' repeatedly. What holds back Lexical Resource?",["Repeated word-form errors","Using too few words","Using formal words","Using idioms"],0,"Errors in basic uncountable nouns show weak control."]
]},
{learn:[
["Confusing pairs","Affect (verb) and effect (noun). Imply (speaker hints) and infer (listener concludes). Economic (about the economy) and economical (saving money). Historic (important in history) and historical (about the past). Sensitive (easily hurt) and sensible (practical).",["Smoking affects health. It has a bad effect.","The speaker implied. I inferred.","A historic victory. A historical novel."],"These pairs appear often in IELTS and Cambridge tests."],
["Words with attitude","Words can have the same basic meaning but a different attitude. Slim is positive, skinny is negative. Thrifty is positive, stingy is negative. Curious is positive, nosy is negative.",["She is thrifty. He is stingy.","a slim model, a skinny teenager"],"Choose words that match your intended attitude."]
],q:[
["The new tax will ___ small businesses most.",["affect","effect","infect","defect"],0,"Affect is the verb: influence."],
["From his tone, I ___ that he was unhappy.",["inferred","implied","applied","replied"],0,"The listener infers. The speaker implies."],
["The ___ event, the first moon landing, changed science.",["historic","historical","history","historian"],0,"Historic = important in history."],
["A person who hates spending money, described negatively, is...",["stingy","economical","careful","wise"],0,"Stingy carries a negative attitude."],
["Which word means 'not taking sides'?",["disinterested","uninterested","interested","interesting"],0,"Disinterested = impartial. Uninterested = bored."],
["Which sentence uses 'sensitive' correctly?",["He is sensitive to criticism.","The sensitive plan saved money.","She is a sensitive driver, always cautious.","It was a sensitive amount of money."],0,"Sensitive = easily affected. Sensible = practical."]
]}
];
D.teach=[
{learn:[
["Giving instructions","Keep instructions short and give one step at a time. Demonstrate with a student, then check with ICQs (instruction checking questions), then start the activity. Use gestures and stand still while speaking. Avoid 'Do you understand?'.",["Work in pairs. Student A asks. Student B answers.","ICQ: Are you working alone or in pairs? How many questions?"],"If half the class does the wrong thing, the instructions failed, not the students."],
["Elicit, don't tell","Elicit means drawing ideas out of students with pictures, gestures and questions. It keeps students active and shows what they already know. Use it for vocabulary, rules and examples.",["Show a picture of an umbrella: What is this?","Mime 'borrow' and ask what the action is."],"Wait 5 to 10 seconds after a question. Silence is thinking time."]
],q:[
["You give instructions and half the class starts the wrong task. What was most likely missing?",["ICQs and a demonstration","A louder voice","A longer explanation","More homework"],0,"Demonstration and ICQs prevent confusion."],
["Best way to elicit the word 'umbrella'?",["Show a picture and ask 'What is this?'","Write it on the board","Translate it","Say 'repeat after me'"],0,"Elicitation draws the word from students."],
["Silence follows your question. Best response?",["Wait 5 to 10 seconds, then rephrase or let pairs discuss","Answer it yourself immediately","Call the weakest student","Move on"],0,"Wait time improves answers. Pair discussion lowers the risk."],
["Teacher talking time is too high. Which change helps most?",["Use pair work and elicit more","Talk faster","Write more on the board","Give more tests"],0,"More student talk means less teacher talk."],
["A student keeps using Vietnamese in pair work. Best first step?",["Design the task to need English, set a clear goal, and monitor","Shout at the class","Cancel pair work","Fine them"],0,"Solve the cause: a task that needs English plus monitoring."],
["Clearest instruction for an A2 class?",["Work with your partner. Ask three questions. You have two minutes.","I'd like you to get into pairs and then, if you could possibly, discuss...","Do the activity.","Speak."],0,"Short, sequenced, with time and number."]
]},
{learn:[
["Lesson shapes","PPP: present, practise, produce. Test-Teach-Test: students try a task first, you teach the gaps, then they repeat the task. Task-based learning: task, planning, report, then language focus. Lexical approach: teach chunks and collocations. Each fits different needs.",["PPP: a clear single grammar point.","TTT: learners who already know some of the language."],"Pick the shape for the learners, not the other way round."],
["CCQs and ICQs","CCQs check the meaning of new language. ICQs check instructions. Good CCQs are short, use easy words, and have clear yes/no or either/or answers.",["Target: I've been waiting an hour. Am I still waiting? Did I start an hour ago?","ICQ: Are you working alone or in pairs?"],"A CCQ must not be harder than the target language."]
],q:[
["A lesson starts with a speaking task, then you teach the gaps, then repeat the task. This is...",["Test-Teach-Test","PPP","Grammar-translation","Dictogloss"],0,"Task first, teach gaps, retest."],
["Best CCQs for 'I've been waiting for an hour'?",["Am I still waiting? Did I start an hour ago?","Is it present perfect continuous?","Do you understand?","What is the rule?"],0,"CCQs check meaning, not grammar terms."],
["Which is an ICQ for 'Work in pairs and write 3 questions'?",["How many questions will you write? Alone or in pairs?","Do you understand?","What is a question?","Who writes best?"],0,"ICQs check what students will do."],
["In task-based learning, when does the main language focus normally happen?",["After the task","Before the task","Never","Only in homework"],0,"The task comes first, then analysis of language."],
["Which activity is controlled practice in PPP?",["A gap-fill or drill with right and wrong answers","A free role-play","A warm-up chat","A project"],0,"Controlled practice limits the language and checks accuracy."],
["A lexical approach focuses mostly on...",["chunks and collocations","verb tables only","spelling lists only","translation"],0,"Chunks help fluency and natural language."]
]},
{learn:[
["Feedback and correction","During accuracy work correct straight away (finger correction, a prompt, a recast, or elicit self-correction). During fluency work note errors and give delayed feedback. Focus on a few important errors and praise good language too.",["Student: I goed home. Teacher: I...? Student: I went home.","Recast: Student: She go to school. Teacher: Yes, she goes to school."],"A recast fixes the form without stopping the talk."],
["Mixed ability and monitoring","Grade your language to the level. Use tiered tasks (same task, different support), open-ended tasks, peer teaching, and fast-finisher extensions. While monitoring, walk, listen, note errors and help quietly.",["Weaker group gets a word bank. Stronger group answers inference questions."],"Monitoring is teaching. It is not marking time."]
],q:[
["During controlled practice a student says 'I goed home.' Best technique?",["Prompt 'I...?' and elicit 'went'","Ignore it","Give a long grammar lecture","Only mark it later"],0,"Elicit self-correction while the target is fresh."],
["During a fluency discussion a student makes many mistakes. What should you do?",["Note errors and give delayed feedback to the class","Stop at every mistake","Say nothing at all","Tell the student off"],0,"Protect fluency and then teach from the notes."],
["A recast is...",["Repeating the sentence correctly without stopping the talk","Asking for the rule","Giving a mark","Translating it"],0,"A recast gently models the correct form."],
["Which is a tiered task for mixed ability?",["Same reading text. Weaker group gets a word bank. Stronger group answers inference questions","Different homework by gender","Send strong students away","No task for strong students"],0,"Same goal, different support."],
["After a fluency task, how many errors should you focus on?",["A few key ones that block meaning or are common","All of them","None","Only spelling"],0,"Too many errors overwhelm students."],
["Best way to monitor pair work?",["Walk around, listen, note errors and support quietly","Stay at the desk and mark","Correct every error loudly","Leave the room"],0,"Monitoring gives information for feedback."]
]},
{learn:[
["Key ideas from SLA research","Krashen: comprehensible input (i+1). Vygotsky: zone of proximal development and scaffolding. Long: interaction and negotiation of meaning. Schmidt: noticing. Swain: pushed output helps learners see gaps. Use the ideas to explain why activities work.",["Students write, then compare with a model: noticing gaps.","A teacher gives prompts that fade away: scaffolding."],"Theory is useful when it changes what you do tomorrow."],
["Assessment","Formative assessment happens during learning to guide teaching. Summative is at the end. Validity means a test measures what it should. Reliability means consistent scores. Washback is the effect of a test on teaching. Use clear rubrics for speaking and writing.",["Exit ticket: a quick question at the end of the lesson.","Two examiners give the same score: good reliability."],"A test can be reliable but not valid."]
],q:[
["'i+1' belongs to...",["Krashen's input hypothesis","Vygotsky's ZPD","Swain's output","Schmidt's noticing"],0,"Input slightly above the current level."],
["Which activity best reflects Swain's output hypothesis?",["Students write a short text, then compare it with a model to notice gaps","Students only listen","Students copy sentences","Students memorise lists"],0,"Producing language reveals what you cannot yet say."],
["Two examiners give very different scores for the same speaking performance. The main problem is...",["low reliability","low washback","too much formative feedback","high validity"],0,"Reliability = consistent scoring."],
["Which is formative assessment?",["A mid-unit quiz used to adjust teaching","The final exam","A school ranking","A university entrance exam"],0,"It informs the next lesson."],
["Washback means...",["The effect of a test on teaching and learning","Test difficulty","Test cost","Test length"],0,"Exams change what teachers and students do in class."],
["The zone of proximal development is...",["What a learner can do with help but not yet alone","What a learner already knows","What a learner forgot","What is too easy"],0,"Vygotsky: learn best in this zone with scaffolding."]
]},
{learn:[
["Large classes and the Vietnamese context","In large classes use choral drilling, structured pair and group work with clear roles, board work, peer correction and routines. Many learners are used to teacher-centred lessons and fear losing face. Use low-risk pair-checking before open feedback.",["Pairs check answers, then one pair reports.","Roles in groups: leader, writer, reporter, timekeeper."],"Confidence first, then accuracy, then challenge."],
["Planning with aims","Write aims as what learners can do by the end: 'By the end, students can book a hotel room politely using Could I...?'. A plan also needs stages, interaction patterns, timing, anticipated problems with solutions, and reflection.",["Problem: students confuse borrow and lend. Solution: CCQs and a diagram."],"If you cannot test the aim, it is not a good aim."]
],q:[
["Which aim is best written?",["By the end, students can book a hotel room politely using 'Could I...?'","Teach polite requests","Practise speaking","Do page 45"],0,"It states what learners can do and can be checked."],
["In a class of 60, what increases interaction most?",["Structured pair and group work with clear roles","Teacher talk for the whole lesson","One-by-one speaking","Removing speaking"],0,"Everyone speaks at once and the teacher monitors."],
["Students fear mistakes in front of the class. First choose...",["Pair-check before open feedback","Random individual questions with criticism","Remove speaking","Only written work"],0,"Low-risk steps build confidence."],
["Which is an anticipated problem in a plan?",["Students may confuse borrow and lend. Solution: CCQs and a table","The bell may ring","I like this activity","The board is green"],0,"A problem tied to the language, with a solution."],
["An exam class wants only grammar drills. Best response?",["Explain how skills work raises exam scores and mix drills with exam-style tasks","Refuse all drills","Drills forever","Say exams do not matter"],0,"Balance expectations with evidence."],
["Online class: how do you keep interaction high?",["Breakout pairs, polls and short tasks every few minutes","A 40 minute lecture","No questions","Mute everyone forever"],0,"Frequent small interactions keep attention."]
]}
];
D.ccq=[
{learn:[
["What makes a good CCQ","A concept checking question tests meaning, not grammar words. It is short, uses simple language, and has a clear yes/no or either/or answer. It must not be harder than the target. Never use 'Do you understand?'.",["Target: expensive. Is a new car expensive or cheap?","Target: borrow. Do I take it or give it?"],"If students can answer without understanding, the CCQ is weak."],
["Checking vocabulary","Use a concrete example, a contrast or a situation. Ask 2 to 4 questions that together show the full meaning, such as who, when, where and how strong.",["Exhausted: Is it very tired or a bit tired? Do you want to sleep?","Cousin: Is he the child of my aunt or uncle?"],"Ask about meaning, use and context, not spelling."]
],q:[
["Target: 'lend'. Which CCQ checks the meaning best?",["Do I give something for a short time?","Is lend a noun?","Do you like lending?","Can you spell lend?"],0,"It tests meaning with simple words."],
["Which is NOT a good CCQ for 'exhausted'?",["Do you understand 'exhausted'?","Is it very tired or a bit tired?","Do you want to sleep?","Do you have a lot of energy?"],0,"'Do you understand?' proves nothing."],
["Target: 'expensive'. Best CCQ?",["Is a new car expensive or cheap?","Is expensive a verb?","Do you like it?","Is it a long word?"],0,"A concrete either/or question."],
["Target: 'cousin'. Best CCQ?",["Is he the child of my aunt or uncle?","Do you have a cousin?","How do you spell cousin?","Is it plural?"],0,"It tests the relationship."],
["Target: 'must' (obligation). Which CCQ is best?",["Is it a rule? Do I have a choice?","Is must a modal verb?","Can I use must in speech?","Is it past?"],0,"Meaning, not terminology."],
["A CCQ should avoid...",["Language harder than the target","Yes/no answers","Concrete examples","Simple words"],0,"If the CCQ is harder, you are testing the CCQ."]
]},
{learn:[
["Timelines and tense CCQs","For tenses ask about time (past, now, future), whether it is finished, how long it lasts and why it matters now. Draw a timeline on the board and use CCQs to read it.",["I've lived here for five years. Do I still live here? Did it start five years ago?","I was cooking when she called. Which started first?"],"Past, present, future, finished, continuing: ask about these."],
["Past forms","Past simple = a finished time. Past continuous = in progress at a past moment. Used to = a past habit or state that is now finished. Present perfect = unfinished time or present result.",["I used to play football. Do I play now?","I've just finished. Is it finished now?"],"Mix yes and no answers so the CCQs really test."]
],q:[
["Target: 'I was cooking when she called.' Best CCQs?",["Which started first? Was I still cooking when she called?","Is it present?","Do I like cooking?","Is called a verb?"],0,"They test the time relationship."],
["Target: 'I've just finished.' Best CCQs?",["Did I finish a minute ago or last year? Is it finished now?","Is finish regular?","Do you finish quickly?","Is just an adverb?"],0,"Time and result are the concept."],
["Target: 'I used to play football.' Best CCQ pair?",["Did I play in the past? Do I play now?","Do I like football?","Is football a noun?","Will I play?"],0,"Past habit that stopped."],
["Target: 'I'll have finished by six.' Best CCQ?",["Is it finished before six or after six?","Is it past?","Do you finish at six?","Is it a promise?"],0,"Future perfect: done before a future time."],
["Target: 'I'm going to call him.' (a plan). Best CCQs?",["Have I decided already? Is it now or later?","Is going a motion verb?","Do I call him now?","Is it a promise?"],0,"Check the decision time and the future time."],
["Which is the flawed CCQ for 'She has been working here since 2020'?",["Is it present perfect continuous?","Does she still work here?","Did she start in 2020?","Is 2020 now?"],0,"It asks for grammar terms, not meaning."]
]},
{learn:[
["Modal verbs","Obligation: must, have to. No obligation: don't have to. Prohibition: mustn't. Advice: should. Possibility: might. Deduction: must be (sure) and can't be (sure it is not). Ask: is it a rule, a choice, advice or a guess?",["You mustn't park here. Is it allowed?","You don't have to come. Can I come if I want?"],"Don't have to and mustn't are opposites in meaning, a big trap."],
["Conditionals and wishes","Ask: is it real or imaginary? Past, present or future? Possible or impossible? For wishes ask what the real situation is and how the speaker feels.",["If I were rich, I'd travel. Am I rich?","I wish I had a car. Do I have a car now?"],"The real situation is always the opposite of the unreal one."]
],q:[
["Target: 'You mustn't park here.' Best CCQs?",["Is it allowed? Is it a rule or a choice?","Is it advice?","Is must strong?","Do you park here?"],0,"Prohibition means not allowed."],
["Target: 'You don't have to come.' Best CCQs?",["Is it necessary? Can I come if I want?","Is it forbidden?","Is don't a negative?","Do I come?"],0,"No obligation, but permission remains."],
["Target: 'She must be at home.' (deduction). Best CCQs?",["Am I sure or guessing? Do I have a reason?","Is it a rule?","Is she a student?","Is it past?"],0,"Deduction uses evidence."],
["Target: 'If I were rich, I'd travel.' Best CCQs?",["Am I rich? Is it real or imaginary?","Is were past?","Do I travel?","Is it first conditional?"],0,"Second conditional is imaginary."],
["Target: 'I wish I had a car.' Best CCQs?",["Do I have a car now? Do I want one?","Is wish a verb?","Was it yesterday?","Do I drive?"],0,"Contrast the real situation and the wish."],
["Which question does NOT check meaning?",["Is 'should' a modal verb?","Is it advice or a rule?","Is the speaker giving an opinion?","Is it very strong?"],0,"It asks for a grammar label."]
]},
{learn:[
["Common CCQ mistakes","Weak CCQs use grammar terms, are too long, check form instead of meaning, only get 'yes' answers, or include the target so students can echo. A good set mixes yes and no answers and checks time, meaning and attitude.",["Weak: Is it present perfect?","Better: Do I still live here? Did I leave already?"],"Plan CCQs in advance. They are hard to invent live."],
["Concept, form, pronunciation","Analyse every target with CFP: concept (meaning), form (structure) and pronunciation (stress, weak forms, linking). Check form with a gap sentence and check pronunciation by drilling.",["Form: I have + been + -ing.","Pronunciation: weak form of have /əv/."],"A timeline helps concept. A substitution table helps form."]
],q:[
["A CCQ set for 'I've lived here for five years' should mix yes and no. Which set does?",["Do I live here now? (yes) Did I leave already? (no) Did it start five years ago? (yes)","Do I live here? Do I live here now? Do I still live here?","Is it present perfect? Is it for? Is it five?","Do you understand? Is it clear? OK?"],0,"Mixed answers prove understanding."],
["CFP stands for...",["Concept, Form, Pronunciation","Check, Fix, Practise","Context, Feedback, Practice","Concept, Fluency, Production"],0,"A framework for analysing language."],
["A timeline for 'I'm going to see him tomorrow' shows...",["Now, a plan already made, an event in the future","A past event only","A habit","A finished event"],0,"Intention now, event later."],
["Which CCQ is too wordy for A2?",["Would you say the speaker's intention was formulated before the moment of speaking?","Did I decide before now?","Is it a plan?","Is it now?"],0,"CCQs must be easier than the target."],
["Why avoid CCQs that include the target structure?",["Students can answer by echoing without understanding","They are too short","They are too concrete","They use pictures"],0,"Echoing is not understanding."],
["Best way to check FORM for 'I've been waiting'?",["Gap sentence: I ___ ___ waiting for an hour.","Do you like waiting?","Is it past?","Is it long?"],0,"A gap completion checks structure."]
]},
{learn:[
["Subtle contrasts","Used to describes past habits and states. Would describes repeated past actions only. Must often shows the speaker's own authority. Have to shows an external rule. 'I'll' is a decision made now. 'I'm going to' is a decision made before.",["I used to live in Hue. (state)","I would play there as a child. (repeated action)"],"Choose the pair that really contrasts the meaning."],
["Reported speech and passive","Reported speech: the verb often moves back a tense, and time and place words change (now to then, here to there). Passive: the focus is on the action or the receiver; the agent is often unknown or unimportant.",["He said he was tired.","The window was broken. (by whom?)"],"Check who spoke, when, and what the original words were."]
],q:[
["Which pair contrasts 'must' and 'have to'?",["The speaker's own authority versus an external rule","Past versus present","Polite versus rude","Written versus spoken"],0,"A common teaching distinction, though usage overlaps."],
["'I used to live in Hue.' and 'I would play there as a child.' Which statement is true?",["Used to can describe states, but would cannot","Would describes states","Both describe states","Neither describes habits"],0,"Would is for repeated actions in the past."],
["Target: 'He said he was tired.' Best CCQs?",["Who said it? Did he say 'I am tired' or 'I was tired'?","Is it reported speech?","Is he asleep now?","Is said regular?"],0,"They test the original words."],
["Target: 'The window was broken.' Best CCQs?",["Do we know who broke it? Is the focus on the window or the person?","Is it past?","Was the window big?","Is broken irregular?"],0,"Passive voice focuses on the receiver."],
["'I'll help you' vs 'I'm going to help you'. Which CCQ shows the difference?",["Did I decide before speaking or while speaking?","Is help a verb?","Is it past?","Is it polite?"],0,"Decision time is the key."],
["Target: 'I'm meeting him at six.' Best CCQs?",["Is it already arranged? Do we know the time?","Is it a habit?","Is it in progress now?","Is it finished?"],0,"Present continuous for arrangements."]
]}
];
D.ielts=[
{learn:[
["The four papers","Listening: 4 sections, 40 questions, about 30 minutes, heard once. Reading: 3 sections, 40 questions, 60 minutes. Writing: 2 tasks, 60 minutes. Speaking: 3 parts, 11 to 14 minutes. Scores run from 0 to 9 in half bands.",["Listening 40 questions","Reading 60 minutes","Speaking 11 to 14 minutes"],"Always check the official IELTS site for current details."],
["Writing tasks","Academic Task 1: describe a graph, chart, table, process or map in at least 150 words (about 20 minutes). Task 2: an essay in at least 250 words (about 40 minutes). Task 2 counts about twice as much as Task 1. General Training Task 1 is a letter.",["Task 1: describe data","Task 2: discuss an issue"],"Plan your time: spend more of it on Task 2."]
],q:[
["How long is the IELTS Writing test?",["60 minutes","40 minutes","90 minutes","30 minutes"],0,"Both tasks share 60 minutes."],
["Which Writing task carries more weight?",["Task 2 (about twice as much)","Task 1","Both equal","Neither"],0,"Task 2 contributes twice as much to the Writing score."],
["How long does the Speaking test last?",["11 to 14 minutes","5 to 7 minutes","20 to 25 minutes","30 minutes"],0,"Three parts, face to face with an examiner."],
["In Listening you hear each recording...",["Once","Twice","Three times","As often as you like"],0,"Train prediction and note-taking."],
["Academic Task 1 may be...",["A process diagram","A formal letter","A persuasive essay","A story"],0,"Letters belong to General Training."],
["How many questions are in IELTS Reading?",["40","30","50","60"],0,"Three sections, 40 questions, 60 minutes."]
]},
{learn:[
["Writing criteria","Four equal criteria, 25 percent each: Task Achievement (Task 1) or Task Response (Task 2), Coherence and Cohesion, Lexical Resource, and Grammatical Range and Accuracy. Spelling and handwriting are not separate criteria, but spelling errors affect Lexical Resource.",["Task Achievement: overview and key data","Task Response: all parts answered, clear position"],"Know the criteria. They are the marking scheme."],
["Task 1 essentials","A strong answer has an overview of the main trends or features, selects key data instead of listing every number, makes comparisons, uses accurate figures, and gives no opinions.",["Overall, sales rose steadily while costs fell."],"No overview is one of the most common reasons for a low score."]
],q:[
["Which is NOT an official IELTS Writing criterion?",["Spelling and handwriting","Lexical Resource","Coherence and Cohesion","Grammatical Range and Accuracy"],0,"Spelling is judged inside Lexical Resource."],
["Which part is essential in Task 1 for a high score?",["A clear overview","Your opinion","A conclusion with advice","A personal story"],0,"The overview shows you understand the main picture."],
["Which criterion is used for Task 2 content?",["Task Response","Task Achievement","Fluency","Pronunciation"],0,"Task 2 uses Task Response."],
["A Task 1 answer lists every number but has no overview. Which criterion suffers most?",["Task Achievement","Pronunciation","Task Response","Fluency"],0,"Selecting key features and summarising are part of Task Achievement."],
["In Task 2 a candidate answers only one part of a two-part question. This mainly lowers...",["Task Response","Pronunciation","Fluency","Handwriting"],0,"All parts of the question must be addressed."],
["What is the weight of each Writing criterion?",["25 percent each","40 percent for grammar","50 percent for task","Only Task 1 is equal"],0,"All four are equal."]
]},
{learn:[
["Speaking parts and criteria","Part 1: familiar topics (4 to 5 minutes). Part 2: a long turn after one minute of preparation, talk 1 to 2 minutes. Part 3: abstract discussion linked to Part 2. Criteria, 25 percent each: Fluency and Coherence, Lexical Resource, Grammatical Range and Accuracy, Pronunciation.",["Part 2 cue card: Describe a place you visited."],"Pronunciation is judged on clarity, not accent."],
["Reading question types","True/False/Not Given tests facts. Yes/No/Not Given tests the writer's views or claims. Not Given means the text does not say. Other types: matching headings, matching information, sentence completion, summary completion, multiple choice.",["Text: tripled. Statement: doubled. Answer: False."],"Not Given is not 'false'. It means no information."]
],q:[
["How long do you prepare in Speaking Part 2?",["1 minute","3 minutes","30 seconds","5 minutes"],0,"You may make notes."],
["Which criterion appears in Speaking but not in Writing?",["Pronunciation","Lexical Resource","Grammatical Range","Coherence"],0,"Speaking: Fluency and Coherence, Lexical Resource, Grammar, Pronunciation."],
["In Yes/No/Not Given, 'No' means...",["The statement contradicts the writer's view","The text does not mention it","The statement is partly true","You disagree"],0,"The writer says the opposite."],
["Part 3 questions are usually...",["Abstract and linked to the Part 2 topic","Personal and simple","Reading aloud","About grammar"],0,"Part 3 expects discussion, opinions and reasons."],
["The text says the population 'tripled'. The statement says it 'doubled'. Answer?",["False","True","Not Given","Yes"],0,"The text contradicts the statement."],
["A statement is about the writer's opinion. Which question type applies?",["Yes/No/Not Given","True/False/Not Given","Matching headings","Sentence completion"],0,"Views and claims use Yes/No/Not Given."]
]},
{learn:[
["How the overall band is calculated","Average the four skills. Round to the nearest half band: an average ending in .25 rounds up to .5, and an average ending in .75 rounds up to the next whole band. Example: 6.0, 6.5, 6.5, 7.0 average 6.5.",["6.25 becomes 6.5","6.75 becomes 7.0"],"Check the four skill scores, not the overall alone."],
["Penalties and limits","Under-length answers are penalised in Task Achievement or Response. Memorised or off-topic material cannot be credited. Examiners judge the best fit across descriptors, not perfection.",["190 words in Task 2 is under length."],"Plan for length and relevance, not tricks."]
],q:[
["Scores 6.5, 6.0, 7.0, 6.5. Overall band?",["6.5","6.0","7.0","7.5"],0,"The average is 6.5."],
["Scores 6.0, 6.0, 6.5, 7.0 give an average of 6.375. Overall band?",["6.5","6.0","7.0","6.375"],0,"6.375 rounds to the nearest half band, which is 6.5."],
["Scores 5.5, 6.0, 6.0, 6.0 give an average of 5.875. Overall band?",["6.0","5.5","6.5","5.875"],0,"5.875 rounds to 6.0."],
["An average of 6.25 becomes...",["6.5","6.0","6.25","7.0"],0,"A .25 rounds up to .5."],
["A candidate writes 190 words for Task 2. What is likely?",["A penalty in Task Response","No penalty","Disqualification","A bonus"],0,"Under length lowers the task criterion."],
["A candidate recites a memorised paragraph in Speaking Part 1. Examiners...",["Cannot credit the memorised language","Reward the accuracy","Give Band 9","Stop the test"],0,"Spontaneous language is what is assessed."]
]},
{learn:[
["Band 6 versus Band 7 (Writing)","Training summary: Band 6 addresses the task with some development and a mix of simple and complex sentences, with errors that rarely block meaning. Band 7 keeps a clear position throughout, extends ideas well, shows a good range of structures with frequent error-free sentences, and uses less common vocabulary with some control. Always read the official public descriptors.",["Band 7: a clear position from start to finish."],"The gap is control and development, not difficult words."],
["Task 2: position and development","Give a clear position from the introduction to the conclusion. Each body paragraph needs one main idea, explained and supported with an example. Do not copy the question. Avoid memorised templates and unrelated examples.",["One main reason is that remote work saves commuting time."],"Depth beats length."]
],q:[
["Which feature best separates Band 7 from Band 6 in Task Response?",["A clear position throughout with well-extended ideas","Writing 300 words","Using as many linkers as possible","Using only simple sentences"],0,"Development and a consistent position."],
["An essay changes its opinion between the introduction and the conclusion. The biggest effect is on...",["Task Response","Pronunciation","Spelling only","Listening"],0,"The position must stay clear."],
["A candidate uses 'Firstly, Secondly, Moreover' in every paragraph with thin ideas. Coherence and Cohesion is likely...",["Limited by mechanical linking","At Band 9","Not assessed","Perfect"],0,"Linkers cannot replace logical development."],
["Which is the strongest topic sentence?",["One main reason is that remote work saves commuting time and raises productivity.","I will talk about work.","Work is good and bad.","There are many things."],0,"It states a clear, specific idea."],
["A candidate answers a question about cars with a memorised essay on technology. Examiners...",["Cannot credit off-topic memorised content","Give Band 8","Ask for clarification","Give half marks"],0,"The response must address the question."],
["Which improves Lexical Resource most?",["Using precise collocations naturally","One rare word per sentence","Repeating key words","Avoiding topic words"],0,"Natural precision, not showing off."]
]}
];
D.traps=[
{learn:[
["Why the first language matters","Vietnamese verbs do not change for tense, person or number, and time words like 'yesterday' already show the time. Nouns do not take plural endings. Adjectives often work like verbs. So learners drop -s and -ed and leave out be.",["Yesterday I go to the market. Better: I went.","She very tall. Better: She is very tall.","Two book. Better: two books."],"Explain the cause kindly. These errors are logical, not careless."],
["Be and negation","'I no like' comes from the Vietnamese negative word 'khong'. English uses do, does or did + not. Age and feelings need the verb be: I am 20. I am hungry.",["I don't like coffee.","I am 20 years old."],"Drill contrast pairs: statement, negative, question."]
],q:[
["A learner writes 'Yesterday I go to the market.' Likely cause?",["Vietnamese marks time with words, not verb endings","Spelling","Bad handwriting","Poor memory only"],0,"The time word already carries the tense in L1."],
["'She very tall.' Best correction?",["She is very tall.","She very is tall.","She does very tall.","She tall very."],0,"English needs the verb be before adjectives."],
["'I no like coffee.' Best correction?",["I don't like coffee.","I not like coffee.","I no likes coffee.","I am not like coffee."],0,"Use do + not before the base verb."],
["'Two book' is common because...",["Vietnamese nouns do not take plural endings","English has no plurals","The learner is lazy","The teacher said so"],0,"The plural is shown by a number word in L1."],
["'He work in a bank.' What is missing?",["Third person -s","An article","A time word","A comma"],0,"He works. Third person singular needs -s."],
["'I 20 years old.' What is missing?",["The verb be (am)","The verb have","An article","A capital letter"],0,"I am 20 years old."]
]},
{learn:[
["Articles","Vietnamese has no articles, so learners omit them or use them wrongly. Teach a simple frame: a/an for one of many or first mention, the for specific or known things, no article for general plurals and uncountables.",["I bought a car. The car is red.","I love music. (general)"],"Show meaning, not only the rule: which car do we both know?"],
["Question forms","Vietnamese questions often use a question word at the end or a particle, not inversion. 'You go where?' becomes 'Where do you go?'. Teach do-support and inversion with drills.",["Where do you go?","Why are you late?"],"Contrast statements and questions in a substitution table."]
],q:[
["'I bought car yesterday.' What is missing?",["An article (a car)","A plural","The verb be","A question word"],0,"A singular countable noun needs a or the."],
["'You go where?' Best correction?",["Where do you go?","Where you go?","Where go you?","You where go?"],0,"Wh-word + do + subject + base verb."],
["'Why you are late?' Best correction?",["Why are you late?","Why do you are late?","Why you late?","Why late you?"],0,"With the verb be, invert the verb and subject."],
["Which sentence uses articles correctly?",["I have a dog. The dog is friendly.","I have the dog. A dog is friendly.","I have dog. The dog friendly.","The I have dog."],0,"First mention: a. Second mention: the."],
["Which is correct?",["Do you speak English?","Do you speak an English?","Does you speak English?","Are you speak English?"],0,"Languages take no article here."],
["Best way to teach inversion in questions?",["Contrast the statement and the question, then drill with substitution","Tell them the rule once","Translate word for word","Avoid questions"],0,"Contrast and repetition build the pattern."]
]},
{learn:[
["Translation traps","Direct translation creates unnatural English. Open the light becomes turn on the light. Eat medicine becomes take medicine. See TV becomes watch TV. Make homework becomes do homework. Teach these as chunks.",["turn on the light","take medicine","watch TV","do homework"],"One correct chunk beats ten rules."],
["Adverb placement and -ed/-ing","'I very like it' follows Vietnamese order. English: I really like it, or I like it very much. For feelings, -ed describes the person and -ing describes the thing: I am bored. The class is boring.",["I really like music.","I am bored. It is boring."],"Check feelings and causes: who feels it, and what causes it?"]
],q:[
["'Open the light.' Correct form?",["Turn on the light.","Switch the open light.","Open on the light.","Light the open."],0,"Turn on / turn off for lights."],
["'I eat medicine.' Correct form?",["I take medicine.","I drink medicine.","I eat the medicine.","I do medicine."],0,"Take medicine is the standard collocation."],
["'I very like music.' Correct form?",["I really like music.","I like very music.","I very likes music.","Music I very like."],0,"Very cannot modify a verb directly."],
["'We see TV every night.' Best verb?",["watch","look at","look","stare"],0,"Watch TV."],
["'I make homework after school.' Best verb?",["do","make","go","take"],0,"Do homework."],
["'I am boring in class.' (the learner feels no interest) Correct form?",["I am bored in class.","I am boring in class.","I am bore in class.","I boring class."],0,"-ed for the feeling."]
]},
{learn:[
["Sounds that are often hard","Many learners drop final consonants and clusters (worked, texts, desks), find /θ/ and /ð/ hard (think, this), mix /s/ and /ʃ/, shorten long vowels (sheep, ship) and use flat word stress. Poor endings change meaning (work, worked) and hurt listening and speaking scores.",["think /θɪŋk/","worked /wɜːkt/","three, tree, free"],"Final sounds carry grammar: -s, -ed, -ing."],
["Teaching techniques","Use minimal pairs, listen-and-choose, mouth and tongue pictures, a hand on the throat for voiced sounds, backchaining for long words, and tapping or clapping for stress and rhythm.",["ship / sheep","Back-chain: -tion, -ca-tion, com-mu-ni-ca-tion"],"Perception comes first. If they cannot hear it, they cannot say it."]
],q:[
["A learner says 'ice' for 'rice'. Likely issue?",["The initial /r/ is not produced clearly","Final -s is missing","Article error","Stress error"],0,"Initial /r/ is often weak or replaced."],
["A learner says 'work' for 'worked'. Likely cause?",["The final consonant cluster is dropped","Wrong vowel","Wrong stress","Wrong word"],0,"Clusters like /kt/ are difficult."],
["'Three' sounds like 'tree'. Best technique?",["Show the tongue between the teeth and drill three/tree/free","Repeat louder","Translate three","Ignore it"],0,"Show articulation and use minimal pairs."],
["Which minimal pair practises vowel length?",["ship / sheep","cat / cut","bad / bed","pen / ben"],0,"/ɪ/ vs /iː/ differ in length and quality."],
["Which syllable is stressed in 'photograph'?",["First syllable","Second syllable","Third syllable","All equally"],0,"PHO-to-graph. Compare photography."],
["Best way to practise sentence rhythm?",["Tapping or clapping the strong beats","Reading silently","Writing the rule","Long word lists"],0,"English is stress-timed, so feel the beat."]
]},
{learn:[
["Teaching by error cause","Sort errors: slips, L1 transfer, overgeneralisation (goed) and knowledge gaps. For transfer, contrast English with Vietnamese. For overgeneralisation, show the exception. For slips, let learners self-correct. Do not correct everything.",["I goed: overgeneralisation.","Open the light: L1 transfer."],"Different causes need different treatments."],
["Using learner strengths","Many Vietnamese learners are strong in grammar rules, memorisation and writing, and respect study. They may struggle with speaking confidence and connected speech. Build on strengths and design low-risk speaking.",["Rehearse in pairs, then speak to the class."],"Respect the learning culture and extend it."]
],q:[
["'I goed' is mainly...",["Overgeneralisation","L1 transfer","A typing slip","Handwriting"],0,"The learner applied the regular -ed rule to an irregular verb."],
["'Open the light' is mainly...",["L1 transfer (translation)","Overgeneralisation","A slip","A pronunciation error"],0,"It translates the Vietnamese verb."],
["A student uses -ed correctly in writing but drops it in speech. Best diagnosis?",["A pronunciation or performance issue with final clusters","No grammar knowledge","Spelling","An article error"],0,"Knowledge exists, but production under speed fails."],
["Best response to a learner who knows grammar but is afraid to speak?",["Low-risk pair practice and rehearsal, then gradual public speaking","Force them to speak first","Remove speaking","Only grammar drills"],0,"Reduce fear gradually."],
["Which approach best helps learners notice article errors?",["Compare their own sentences with and without articles and discuss meaning","Memorise a long table","Ignore articles","Only translate"],0,"Noticing in own writing is powerful."],
["For IELTS Speaking, which usually reduces Pronunciation most?",["Unclear endings and stress that reduce intelligibility","A Vietnamese accent","Speaking slowly","Using contractions"],0,"Accent alone is not penalised. Intelligibility is."]
]}
];
D.pte=[
{learn:[
["PTE Academic overview","PTE Academic is a computer-based test of about 2 hours, scored by automated AI. Three parts: Speaking and Writing, Reading, and Listening. You receive an overall score from 10 to 90, four communicative skill scores, and enabling skills scores for grammar, oral fluency, pronunciation, spelling, vocabulary and written discourse.",["Overall: 10 to 90","Enabling skills: spelling, fluency, grammar"],"Item types can change. Always check Pearson's official site."],
["Scores and CEFR","Approximate guide: 30 to 42 is A2, 43 to 58 is B1, 59 to 75 is B2, 76 to 84 is C1, 85 to 90 is C2. Many universities and visa programs set their own minimums, so ask the learner for their target.",["65 is around B2."],"Targets come from the institution, not the test."]
],q:[
["Overall PTE Academic scores range from...",["10 to 90","0 to 9","120 to 170","10 to 990"],0,"The Global Scale of English style range for PTE."],
["Who or what scores PTE Academic?",["Automated AI scoring","One human examiner","The test centre manager","Your teacher"],0,"Scoring is automated."],
["About how long is the test?",["About 2 hours","30 minutes","4 hours","1 hour"],0,"One sitting, around 2 hours."],
["Which section includes writing an essay?",["Speaking and Writing","Reading","Listening","None"],0,"Speaking and Writing are in the first part."],
["A score of 65 is closest to which CEFR level?",["B2","A2","C1","C2"],0,"59 to 75 is about B2."],
["Which is an enabling skill?",["Spelling","The Listening section","The essay topic","The time limit"],0,"Enabling skills include spelling, grammar, vocabulary, pronunciation, oral fluency and written discourse."]
]},
{learn:[
["Read Aloud and Repeat Sentence","Read Aloud: read the on-screen text with natural stress, pauses at punctuation and a steady pace. Repeat Sentence: listen once and repeat the whole sentence with the same rhythm. Long pauses and false starts lower oral fluency.",["Read in meaningful groups of words."],"Fluency means smooth, not necessarily fast."],
["Describe Image and Re-tell Lecture","Describe Image: about 25 seconds to prepare and 40 seconds to speak. Use a structure: introduction, main features or trend, key details, short conclusion. Re-tell Lecture: listen, note the topic, key words and numbers, then summarise in about 40 seconds.",["The chart shows... The main trend is... Overall..."],"Keep speaking until the recording ends."]
],q:[
["In Repeat Sentence you should...",["Repeat the whole sentence with natural rhythm","Change some words","Translate it","Repeat only the last word"],0,"Content and rhythm both count."],
["In Describe Image, a good structure is...",["Introduction, main features, details, short conclusion","Only numbers","A story","Questions only"],0,"A clear structure helps content and fluency."],
["A long pause in Read Aloud mostly hurts...",["Oral fluency","Spelling","Grammar","Written discourse"],0,"Pauses disrupt fluency."],
["For Re-tell Lecture, your notes should include...",["Topic, key words and numbers","Every word","Nothing","Only the title"],0,"You cannot write everything."],
["In Answer Short Question you give...",["One or a few words","A paragraph","An essay","A song"],0,"A short factual answer."],
["Speaking very fast but unclearly in PTE can...",["Lower pronunciation and fluency scores","Raise all scores","Not matter","Improve spelling"],0,"Clarity and rhythm matter more than speed."]
]},
{learn:[
["Summarize Written Text","Read a passage of up to about 300 words and write ONE sentence of 5 to 75 words in about 10 minutes. Include the main idea and key support. Join ideas with linkers such as although, because, while, or a semicolon. Check grammar and spelling.",["Although prices rose, demand stayed steady because supply increased."],"One full stop at the end. Two sentences lose points."],
["Write Essay","Write 200 to 300 words in about 20 minutes. Use a clear structure: introduction, two body paragraphs, conclusion. Stay on topic, develop ideas, and check spelling and grammar. Too short or too long loses points.",["Plan 3 minutes. Write 14. Check 3."],"Relevant content and accurate language are both scored."]
],q:[
["A Summarize Written Text response should be...",["One sentence of 5 to 75 words","Three paragraphs","An essay","Bullet points"],0,"A single sentence."],
["The recommended Write Essay length is...",["200 to 300 words","50 to 100 words","500 words","Any length"],0,"Outside the range loses points."],
["Which would break the rule for a one-sentence summary?",["Two sentences separated by a full stop","Using although","Using because","Using while"],0,"It must be one sentence."],
["In Write Essay, what hurts the score most?",["Off-topic content and many spelling errors","A clear structure","Using linkers","Writing 250 words"],0,"Relevance and accuracy."],
["Spelling in PTE Writing...",["Counts as an enabling skill and affects scores","Is ignored","Matters only in Speaking","Only counts for numbers"],0,"Spelling is a scored enabling skill."],
["Best time plan for Write Essay (20 minutes)?",["2 to 3 min plan, about 14 min write, 2 to 3 min check","20 min writing, no check","10 min planning only","No plan"],0,"Planning and checking raise accuracy."]
]},
{learn:[
