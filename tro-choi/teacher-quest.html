["Reading item types","Reading and Writing: Fill in the Blanks (choose words from a list). Reading: Fill in the Blanks (drag words), Multiple Choice with one or more answers, and Re-order Paragraphs. Use grammar, collocation and logical links. In multiple-answer items, wrong choices can lose points.",["Re-order: look at pronouns and time order."],"Do not choose answers you cannot justify in multiple-answer items."],
["Listening item types","Summarize Spoken Text (50 to 70 words, about 10 minutes), Multiple Choice, Fill in the Blanks, Highlight Correct Summary, Select Missing Word, Highlight Incorrect Words and Write from Dictation. In Write from Dictation each correct word counts, and spelling matters.",["Write from Dictation: type the whole sentence you hear."],"Take notes for key words. Listening plays only once."]
],q:[
["Write from Dictation scoring is based mostly on...",["Each correct, correctly spelled word","Handwriting","Typing speed","Punctuation only"],0,"Accuracy of words matters."],
["Re-order Paragraphs rewards...",["Logical links, pronouns and time order","The longest paragraph first","Alphabetical order","Random guessing"],0,"Find the cohesive devices."],
["Summarize Spoken Text length?",["50 to 70 words","5 to 75 words","200 to 300 words","10 words"],0,"A short summary paragraph."],
["In multiple-answer multiple choice you should...",["Select only options you are confident about","Select all options","Select none","Select the first two"],0,"Wrong answers can lose points."],
["In Highlight Incorrect Words, you...",["Click the words that differ from the audio","Retype the text","Translate","Count words"],0,"Listen and read together."],
["Which strategy helps most in Reading: Fill in the Blanks?",["Check grammar and collocation around the gap","Pick the longest word","Pick the first word","Skip all"],0,"Context decides the correct word."]
]},
{learn:[
["Coaching for scores","PTE rewards accuracy and fluency under time pressure. Teach structure, not memorised content. Use timing drills, repeat practice on weak item types, and read the score report to target enabling skills.",["Shadowing: speak along with a recording."],"Pearson discourages memorised responses. Teach flexible frameworks."],
["Common problems","Long pauses in speaking, unclear pronunciation, run-on or multiple sentences in summaries, wrong word counts in essays, ignoring spelling and not tracking the timer.",["Essay length: 180 words is too short."],"Fix the biggest cost first."]
],q:[
["A student has high Reading but low oral fluency. Best practice?",["Daily timed speaking drills with recording and feedback","More reading only","More spelling","Longer essays"],0,"Target the weak skill."],
["Why avoid fully memorised templates?",["Content must match the prompt and memorised responses are discouraged","Templates are illegal","Templates are too short","Templates improve grammar"],0,"Use frameworks, not scripts."],
["Which skills does Write from Dictation help?",["Listening and spelling","Only speaking","Only reading","Only vocabulary"],0,"It combines listening and writing accuracy."],
["Best use of the on-screen timer?",["Track time per item and keep a steady pace","Ignore it","Restart at 0","Use it only in Writing"],0,"Pacing prevents rushed endings."],
["A student's essay is 180 words. Best fix?",["Add a developed example to reach 200 to 300 words","Remove the conclusion","Add a topic list","Leave it"],0,"Meet the length and develop ideas."],
["The score report shows low oral fluency and pronunciation. Best focus?",["Shadowing and Read Aloud with stress and rhythm","Vocabulary lists only","Writing essays","Grammar quizzes only"],0,"Practise the targeted skill directly."]
]}
];
D.toeic=[
{learn:[
["Format of TOEIC Listening and Reading","Two sections, 200 multiple-choice questions, about 2 hours. Listening: 100 questions in 45 minutes. Reading: 100 questions in 75 minutes. The total score runs from 10 to 990 (Listening 5 to 495 plus Reading 5 to 495). Speaking and Writing are separate tests.",["Listening: 100 questions, 45 minutes","Reading: 100 questions, 75 minutes"],"Confirm current details on the official ETS TOEIC site."],
["The seven parts","Listening: Part 1 Photographs, Part 2 Question and Response, Part 3 Conversations, Part 4 Talks. Reading: Part 5 Incomplete Sentences, Part 6 Text Completion, Part 7 Reading Comprehension (single and multiple passages).",["Part 5: 30 questions","Part 7: 54 questions"],"Learn the parts by number and name."]
],q:[
["How many questions are in TOEIC Listening and Reading together?",["200","100","150","300"],0,"100 Listening plus 100 Reading."],
["How long is the Reading section?",["75 minutes","45 minutes","60 minutes","90 minutes"],0,"Time management is critical."],
["The total score range is...",["10 to 990","0 to 100","0 to 9","120 to 170"],0,"Each section contributes 5 to 495."],
["Part 5 is...",["Incomplete Sentences","Photographs","Conversations","Talks"],0,"A single sentence with a gap."],
["Part 2 is...",["Question and Response","Photographs","Text Completion","Short talks"],0,"You hear a question and three answers."],
["The Listening and Reading test includes a Speaking section?",["No, Speaking is a separate test","Yes, 3 parts","Yes, 2 parts","Only for companies"],0,"Speaking and Writing are a different test."]
]},
{learn:[
["Part 1: Photographs","Choose the statement that best describes the photo. Expect present continuous (a man is typing), present perfect and passive (boxes are being loaded). Beware of distractors that name an object in the photo but the wrong action.",["A document is being handed over.","Some chairs have been arranged."],"Describe the photo in your head before the audio."],
["Part 2: Question and Response","Listen carefully to the first words (who, what, where, when, why, how, yes/no). Indirect answers are common. Avoid sound-alike traps, where an answer repeats a similar-sounding word.",["When is the meeting? Right after lunch.","Where did you park? In the garage."],"A logical answer is better than a matching word."]
],q:[
["'Where is the report?' Best answer:",["It's on your desk.","Yes, it is.","At 3 p.m.","Because it was late."],0,"Where needs a place."],
["'Why was the flight delayed?' Best answer:",["There was heavy fog.","Next Friday.","To Seoul.","Yes, it was."],0,"Why needs a reason."],
["Photo: a woman is handing a document to a man. Best statement?",["A document is being handed over.","The man is reading a newspaper.","They are boarding a plane.","A car is being washed."],0,"It matches the action in the photo."],
["Question: 'Where did you park?' Which answer is a sound-alike trap?",["I like the dark.","In the garage.","Behind the building.","Near the entrance."],0,"Dark sounds like park but does not answer the question."],
["'Would you like tea or coffee?' Best answer:",["Coffee, please.","Yes, I would.","At noon.","In the kitchen."],0,"An either/or question needs a choice."],
["'Haven't you finished the budget yet?' Best answer:",["Not yet. I need the final figures.","It's in the budget.","Yesterday morning.","The bank is closed."],0,"An indirect answer that makes sense."]
]},
{learn:[
["Parts of speech in Part 5","Look at the gap. After a, the or an adjective, expect a noun. Before a noun, expect an adjective. Before a verb or adjective, expect an adverb. After be, expect an adjective or participle. Word-form questions are very common.",["an impressive presentation","She works efficiently."],"Decide the part of speech before reading the options."],
["Prepositions and business chunks","Learn chunks, not single words: in charge of, responsible for, effective immediately, on behalf of, as soon as possible, in order to, due to, according to, in accordance with.",["responsible for the team","by Friday, on Monday, at 5 p.m."],"By = no later than. On = a day. At = a time."]
],q:[
["The manager gave an ___ presentation.",["impressive","impress","impression","impressively"],0,"An adjective before the noun."],
["Please submit your report ___ Friday.",["by","on","at","in"],0,"By = no later than."],
["She is ___ for the marketing team.",["responsible","responsibility","responsibly","respond"],0,"Be + adjective + for."],
["___ the delay, the shipment arrived on time.",["Despite","Although","Because","However"],0,"Despite + noun phrase."],
["The contract is valid ___ the date of signing.",["from","since","during","between"],0,"Valid from a date."],
["Our profits have increased ___ since January.",["steadily","steady","steadiness","steadied"],0,"An adverb modifies the verb."]
]},
{learn:[
["Parts 3 and 4: conversations and talks","Read the questions before the audio. Predict the speaker, place and topic. Expect questions about the main idea, details, intention and graphics (match audio with a chart or table). Questions follow the order of the audio. Listen for paraphrase.",["What will the woman probably do next?"],"The answer is often in the last part of the audio."],
["Part 7: reading strategies","Know the question types: NOT questions, inference, intention (why does the writer say...?), vocabulary in context and sentence insertion. For double and triple passages, connect information across texts. Aim for about one minute per question.",["Which is NOT mentioned? Eliminate each option."],"Move on after a minute. Come back if there is time."]
],q:[
["In Parts 3 and 4, questions generally follow...",["The order of the audio","A random order","The reverse order","The alphabet"],0,"Use the order to stay on track."],
["A 'NOT' question asks you to find...",["The option the text does not support","The most important detail","The author's name","The title"],0,"Eliminate three true options."],
["A graphic question in Part 3 requires...",["Combining the audio with information in a chart or table","Reading the chart only","Ignoring the audio","Guessing"],0,"The answer needs both sources."],
["The speaker says, 'I'd be happy to help, but my schedule is full.' The intention is likely...",["A polite refusal","Complete agreement","A complaint","A joke"],0,"But signals the real message."],
["Part 7 double-passage questions often require...",["Combining information from both texts","Reading only the first text","Ignoring dates","Memorising names"],0,"Cross-referencing is the skill."],
["Best use of time in Reading?",["Move on after about a minute and return later","Spend 5 minutes on each","Skip Part 5","Read everything twice"],0,"Time pressure is the main challenge."]
]},
{learn:[
["Targets and scores","Many companies set target scores, so ask the learner for theirs. Track Listening and Reading separately. Use a diagnostic test, then plan weekly practice by part: grammar for Parts 5 and 6, listening discrimination for Parts 1 and 2, skimming for Part 7.",["Weak Part 7: practise skimming and timing."],"Practise the parts that cost the most points."],
["Business English focus","Teach workplace functions: emails, meetings, schedules, travel, orders and complaints. Use authentic forms such as invoices, memos and advertisements. Teach collocations and word families. Build stamina with timed full practice tests.",["Invoices, memos, advertisements, schedules"],"Stamina matters in a 2-hour test."]
],q:[
["A learner finishes only 70 of 100 Reading questions. Best focus?",["Timing practice and skipping hard questions","More Listening","More speaking","Handwriting"],0,"The problem is speed."],
["Which activity builds Part 5 accuracy fastest?",["Short daily practice with error analysis by grammar point","One long weekly test only","Only reading novels","Memorising a dictionary"],0,"Frequent targeted practice works."],
["Which material is the most authentic for Part 7 preparation?",["Emails, memos, invoices and advertisements","Poems","Folk tales","Song lyrics"],0,"The test uses workplace documents."],
["A learner has Listening 400 and Reading 250. Best plan?",["Keep Listening steady and add Reading skills and grammar","More Listening only","Stop studying","Only vocabulary lists"],0,"Raise the weaker section."],
["Why teach word families for TOEIC?",["Parts 5 and 6 often test word forms","Part 1 uses them","They are not tested","They only help speaking"],0,"Word-form questions are common."],
["Best way to build stamina for the test?",["Periodic full-length timed practice tests","Five minutes of study per day","Only untimed practice","Only vocabulary apps"],0,"Practise under test conditions."]
]}
];
D.kids=[
{learn:[
["How young learners learn","Young learners learn through movement, play, stories and songs. Their attention is short, about 5 to 10 minutes per activity for ages 5 to 7, so change activities often. They need routines, clear rules and plenty of specific praise.",["Warm-up song, game, story, craft, goodbye song"],"If the class is restless, the activity is too long."],
["TPR and routines","Total Physical Response links words to actions: stand up, sit down, jump, run. Use the same hello song, weather routine and goodbye song every lesson. Routines give children security and save instruction time.",["Teacher: Jump! Children jump."],"Do the action first, then say the word."]
],q:[
["Best activity length for 6-year-olds?",["5 to 10 minutes, then change","45 minutes","A whole lesson of one task","No change needed"],0,"Short, varied activities hold attention."],
["TPR means...",["Learners respond with actions to spoken commands","Teacher Reads Passages","Test Practice Review","Timed Reading Practice"],0,"Total Physical Response."],
["Why use routines?",["They give children security and save time","They bore children","They replace teaching","They are only for adults"],0,"Predictability reduces anxiety."],
["Which is the best praise?",["Specific: 'Great, you used a full sentence!'","Only 'Wrong'","Silence","Comparing with others negatively"],0,"Specific praise shows what to repeat."],
["The class is noisy. Best first step?",["Use a calm signal, such as a clap rhythm, and wait","Shout louder","Punish everyone","Cancel class"],0,"A calm signal restores attention."],
["Best way to teach 'jump, run, sit'?",["Do the actions and have children copy","Write definitions","Translate lists","Give a test"],0,"Actions give meaning without translation."]
]},
{learn:[
["Phonics and reading","Teach letter sounds, not only letter names. Blend sounds (c-a-t) to read words, teach sight words, and use rhymes and songs. Make it multi-sensory: see it, say it, touch it, move it.",["c-a-t: cat","Rhymes: cat, hat, mat"],"Short and frequent beats long and rare."],
["Stories and flashcards","Use large picture books, gestures and voices. Ask prediction questions. With flashcards: show, say, drill, then play games such as flash and guess, or put cards on the walls and children run to touch the word you call.",["What do you think will happen next?"],"Let children handle cards and objects."]
],q:[
["Which is a phonics activity?",["Blending sounds c-a-t to read 'cat'","Writing an essay","Memorising grammar tables","Translating a text"],0,"Phonics links sounds to letters."],
["A good story-time question is...",["What do you think will happen next?","Define the passive.","Translate paragraph three.","What is the past perfect?"],0,"Prediction engages thinking and language."],
["Why teach sounds, not only letter names?",["Sounds help children read and spell words","Names are forbidden","Sounds are easier for adults","It saves paper"],0,"Reading uses sounds."],
["Which flashcard game gets everyone moving?",["Cards on the walls. Call a word and children touch it","Silent reading","Copy the page","Paper quiz"],0,"Movement and meaning together."],
["Multi-sensory learning means...",["Using sight, sound, touch and movement","Using only sound","Using only text","Using only video"],0,"More senses means stronger memory."],
["Songs help young learners because...",["Rhythm and repetition support memory","They replace speaking","They are only for fun","They test grammar"],0,"Chunks stick in memory with music."]
]},
{learn:[
["Assessing young learners","Use informal, low-stress assessment: observation, can-do checklists, stickers, simple tasks and portfolios. Some children take Cambridge Young Learners English tests: Pre A1 Starters, A1 Movers and A2 Flyers.",["I can say my name and age.","I can name five animals."],"Assessment should make children feel capable."],
["Mixed ages and parents","In mixed-age groups give different roles and tiered tasks. Talk to parents about progress and how to help at home: short daily listening, reading together, and encouragement without pressure.",["Older child reads, younger child points."],"Parents are partners, not inspectors."]
],q:[
["Which Cambridge Young Learners test is aligned with A1?",["Movers","Starters","Flyers","Advanced"],0,"Starters Pre A1, Movers A1, Flyers A2."],
["Best informal assessment for young learners?",["Observation with can-do checklists","A two-hour exam","Public ranking","Only spelling tests"],0,"Low stress and informative."],
["How can parents help best?",["Short daily listening or reading together","Three hours of drilling","Avoid English at home","Only buy workbooks"],0,"Little and often."],
["A mixed-age group. Best approach?",["Give different roles and tiered tasks","Teach only the oldest","Teach only the youngest","Separate rooms"],0,"Include everyone at their level."],
["'Starters' is aligned with...",["Pre A1","B1","C1","A2"],0,"Starters is the first level."],
["Which is a can-do statement?",["I can say my name and age.","Learn present simple.","Page 12.","Be good."],0,"Can-do statements describe what a learner can do."]
]},
{learn:[
["Motivation and behaviour","Use positive reinforcement, clear routines, short instructions and choices. Give jobs such as line leader or helper. Praise effort and strategies. When a child misbehaves, ask why: bored, tired, confused or seeking attention?",["Line leader, board cleaner, card handler"],"Behaviour is communication."],
["Correcting children","Keep correction gentle. Recast the sentence, model it, and smile. Focus on communication. Accept one-word answers early and extend them gradually with prompts.",["Child: Me go park. Teacher: Yes, you went to the park! Did you play?"],"Confidence first, accuracy later."]
],q:[

["A child says 'Me go park.' Best gentle response?",["Yes, you went to the park! Did you play?","No, that's wrong.","Write the rule.","Say nothing."],0,"A recast keeps the conversation going."],
["Which job builds responsibility?",["Line leader or helper","Detention","A test","Silent reading"],0,"Jobs give children status."],
["Effective praise targets...",["Effort and strategy","Only talent","Only grades","Only winners"],0,"Effort praise builds resilience."],
["The class is tired after lunch. Best activity?",["A movement song or game, then a calm task","A long reading","A test","Silence"],0,"Energise, then settle."],
["When should you accept one-word answers?",["Early on, then extend with prompts","Never","Always, forever","Only for adults"],0,"Build language step by step."]
]},
{learn:[
["Planning a kids lesson","Plan 4 to 6 short activities: greeting routine, review game, new language with a story or song, craft or movement, and a calm ending. Include a language aim, materials, transitions and a plan B if an activity fails.",["Hello song, review game, story, craft, goodbye song"],"Prepare materials before class. Children notice delays."],
["Online lessons and safeguarding","Online kids classes need short activities, props, reward systems, and a parent nearby. For safeguarding: follow the school policy, avoid private one-to-one contact where possible, keep communication professional and report concerns.",["Props: puppet, flashcards, whiteboard"],"Protecting children is part of the job."]
],q:[

["An online kids class tip?",["Use props, short tasks and frequent interaction","Lecture for 40 minutes","Mute the child","No rewards"],0,"Interaction keeps children engaged."],

["An activity fails. What do you need?",["A plan B ready","Nothing","Blame the students","End class"],0,"Backups save lessons."],

/* GPA = Growing Participator Approach. Training summary of widely taught principles. Check your own GPA manual for details. */
D.gpa=[
{learn:[
["What GPA is","The Growing Participator Approach is a way of learning a language by taking part in real activities with people who speak it, starting with understanding. Learners grow from watching to joining in. Relationships and meaning matter more than memorising lists.",["Cooking a simple dish together with a friend who speaks the language."],"This game gives a training summary. Use your own GPA manual as the final authority."],
["Core principles","1. Understand before you speak. 2. Learn through meaning, not translation. 3. Take part in real activities. 4. Learn with people, with respect. 5. Keep stress low and celebrate progress. 6. Review often with recordings and repetition.",["Understand first. Speak when ready."],"Comprehension builds the foundation for speaking."]
],q:[
["In GPA, the first priority is...",["Understanding the language in context","Memorising vocabulary lists","Writing grammar rules","Translating every sentence"],0,"Understanding comes first."],
["'Growing participator' describes a learner who...",["Gradually joins in real activities using the language","Only watches","Only reads books","Only takes tests"],0,"Participation grows over time."],
["Why avoid translation at the start?",["It builds direct links between language and meaning","Translation is illegal","It is too fast","It is boring"],0,"The learner links words to experience."],
["Which supports GPA best?",["Regular time with a friendly language helper","Silent self-study only","Memorising 100 words per night","Avoiding the community"],0,"Relationship and interaction matter."],
["A stressed learner stops speaking. A GPA-style response?",["Keep it low-pressure, celebrate understanding and invite small steps","Force speaking","Test them","Give up"],0,"Lower anxiety and keep progress visible."],
["Which is a participation activity?",["Cooking a simple dish together with the helper","Copying a dictionary","Only listening to lectures","Watching exam videos"],0,"Real activity gives context and meaning."]
]},
{learn:[
["Monolingual demonstration","In a monolingual demonstration (MD) session the helper speaks only the target language and shows meaning by doing, using objects, actions, pictures and gestures. The learner watches, listens, and joins in as understanding grows.",["The helper opens a box and says the word for open."],"Meaning comes from what you see and do."],
["The helper's role","The helper acts naturally, repeats key phrases in different situations, speaks at a comfortable speed, slows down for key words, and does not translate. The helper is a friend and teacher, not an examiner.",["The same phrase appears while cooking, shopping and cleaning."],"Repetition in varied contexts builds memory."]
],q:[
["In an MD session the helper...",["Speaks only the target language and shows meaning by doing","Translates each word","Gives a vocabulary quiz","Reads a grammar book aloud"],0,"No translation; demonstration."],
["To show the word 'open' the helper...",["Opens a door or box while saying the word","Writes a translation","Draws a grammar chart","Tests the learner"],0,"Action gives meaning."],
["Repetition in GPA is best when...",["The same phrase appears in different real situations","The same list is chanted 50 times","It is only written","It is silent"],0,"Varied contexts strengthen understanding."],
["The learner does not understand a phrase. What should the helper do?",["Repeat with clearer action, objects or pictures","Translate to English","Scold","Move on forever"],0,"Make the meaning clearer, not translated."],
["What speed should the helper use?",["Natural but clear, slowing for key words","Very fast","Robotic word by word","Whispering"],0,"Natural rhythm with support."],
["An MD session is best seen as...",["A friendly shared activity with meaning","A written exam","A translation test","A grammar lecture"],0,"Learning through shared experience."]
]},
{learn:[
["Pictures and stories","Wordless pictures (no text) let the helper tell or act out events in the target language. Learners follow, retell, and match pictures to sentences. Sequencing pictures builds comprehension without translation.",["Picture 1: a boy wakes up. Picture 2: he eats breakfast."],"Clear, culturally fitting pictures matter."],
["Checking understanding without translation","Ask learners to point, act out, choose the matching picture or sequence the pictures. These show understanding without using the first language.",["Point to the picture where she opens the door."],"Show me, do not tell me."]
],q:[
["Why use wordless pictures?",["Meaning comes from the picture, not from translation","They are cheaper than books","They are only decoration","They replace speaking"],0,"No text means no translation shortcut."],
["A good comprehension check is...",["The learner points to the matching picture","The learner translates the sentence","The learner writes a rule","The learner recites a list"],0,"Pointing shows understanding."],
["A picture story is out of order. Learner task?",["Sequence the pictures while listening to the story","Translate the story","Memorise it word by word","Write grammar notes"],0,"Sequencing uses listening comprehension."],
["How should a helper retell a story?",["Use gestures, pictures and repetition with variation","Read a script fast","Translate sentence by sentence","Give a test first"],0,"Support meaning with visuals and action."],
["The learner understands but cannot say it yet. What next?",["Keep giving comprehensible input and invite small, low-pressure responses","Insist on perfect speech","Switch to translation only","Stop sessions"],0,"Speaking grows from understanding."],
["Real wordless pictures matter because...",["Clear, culturally appropriate images support understanding without text","They look modern","They are random","They need translation"],0,"Quality visuals are the learner's support."]
]},
{learn:[
["Planning a GPA session","Plan one clear activity (cooking, shopping, a story). Choose a few key phrases to recycle. Prepare objects or pictures. Decide how the learner will take part. Record the session for review. Keep sessions short and frequent.",["Plan: make tea together. Key phrases: pour, hot, cup."],"Small, clear, repeatable."],
["Progress without tests","Track progress with can-do statements, what the learner now does independently, and recordings over time. Celebrate growth: from understanding, to joining in, to leading part of the activity.",["I can follow the helper's instructions to make tea."],"Progress is visible participation."]
],q:[
["Best plan for a first session?",["One simple activity with props and a few key phrases repeated naturally","A grammar lecture","A long vocabulary list","A written test"],0,"Keep it small and clear."],
["Why record sessions?",["To review and listen again to build understanding","To show grades","To publish them","To replace the helper"],0,"Re-listening builds comprehension."],
["How can you track progress?",["Can-do statements and what the learner now does independently","Only exam scores","Only hours spent","Only vocabulary lists"],0,"Observe participation."],
["Which is a sign of growth in participation?",["The learner begins to lead part of the activity","The learner stays silent forever","The learner reads silently","The learner translates"],0,"Leading shows confidence."],
["Best session length for beginners?",["Short and frequent","Rare and very long","Only weekends","One session per month"],0,"Frequent exposure helps."],
["How should the learner review between sessions?",["Listen to recordings and use phrases in real situations","Memorise a dictionary","Avoid the language","Only write"],0,"Review through listening and use."]
]},
{learn:[
["Training language helpers","Helpers need to understand the approach: speak only the target language, show meaning, be patient, repeat naturally and encourage. Give simple guidelines, a demonstration, practice and feedback. Respect their time and culture and show appreciation.",["Demonstrate one short session together."],"A helper is a partner, not a tool."],
["Quality and ethics","Respect local culture and customs, listen more than you speak, be honest about your goals, and serve the community. Stay flexible: adapt for age, culture and learner needs.",["Children: more songs, movement and play."],"Humility and respect keep relationships healthy."]
],q:[
["When training helpers, the first step is...",["Explain and demonstrate how an MD session works","Give them a grammar book","Ask them to translate","Test their English"],0,"Demonstration makes the approach clear."],
["A helper keeps translating into English. Best response?",["Kindly show the approach again and practise a short session together","Ignore it","Dismiss them immediately","Give a test"],0,"Support and practise."],
["Ethical GPA practice includes...",["Respecting culture and treating helpers as partners with fair appreciation","Using the helper only for answers","Ignoring local customs","Hiding your purpose"],0,"Respect and honesty."],
["A program leader wants to measure success. Best measure?",["Learners' real participation and can-do progress","Only attendance","Only time spent","Only vocabulary quiz scores"],0,"Real use shows growth."],
["How should a GPA program adapt for children?",["More play, songs, movement and shorter sessions","Longer lectures","Written tests","Silent reading"],0,"Match the age and context."],
["Which is the best long-term goal?",["Confident use of the language in real community relationships","Passing a vocabulary exam","Knowing grammar terms","Translating books"],0,"Language lives in relationships."]
]}

/* New A1 and A2 levels, merged by assemble.js */

["To be and there is/are","Use am, is, are: I am, you are, he/she/it is, we/you/they are. Negative: am not, isn't, aren't. Question: Are you a student? Use there is for one thing and there are for many things.",["She is a teacher.","They are from Vietnam.","There are two books on the table."],"Say it aloud: I am, you are, he is."],
["Present simple","For habits and facts: I/you/we/they work. He/she/it works (add -s). Negative: don't or doesn't + base verb. Question: Do you...? Does she...?",["He plays football on Sundays.","Do you like coffee?","She doesn't like fish."],"After does and doesn't the verb has no -s."]
],q:[
["She ___ a teacher.",["is","are","am","be"],0,"He, she and it take is."],
["They ___ from Vietnam.",["are","is","am","be"],0,"They takes are."],
["He ___ football on Sundays.",["plays","play","playing","is play"],0,"Third person singular needs -s."],
["___ you like coffee?",["Do","Does","Are","Is"],0,"Use do with you."],
["There ___ two books on the table.",["are","is","am","be"],0,"Two books is plural, so use there are."],
["She ___ like fish.",["doesn't","don't","isn't","not"],0,"Use doesn't with she."]
]};
var GA2={learn:[
["Past simple","Regular verbs add -ed (worked). Irregular verbs change (go, went; have, had; see, saw). Negative: didn't + base verb. Question: Did you go? Use time words like yesterday, last week and two days ago.",["I went to the market yesterday.","She didn't call me.","Did you see the film?"],"After did and didn't the verb is in the base form."],
["Comparing and planning","Short adjectives: tall, taller. Long adjectives: more interesting. Use going to for plans and things you can see will happen. Use will for quick decisions. Use much with uncountable nouns and many with countable nouns.",["This film is more interesting than that one.","Look at the clouds. It is going to rain.","How much water do you drink?"],"Check: can you count it? Then use many."]
],q:[
["Yesterday I ___ to the market.",["went","go","goed","was go"],0,"Go is irregular: went."],
["She ___ call me last night.",["didn't","doesn't","don't","wasn't"],0,"Past negative: didn't."],
["This film is ___ than that one.",["more interesting","interestinger","most interesting","more interest"],0,"Long adjectives take more."],
["How ___ water do you drink a day?",["much","many","few","lot"],0,"Water is uncountable."],
["Look at the clouds. It ___ rain.",["is going to","will to","going to","is go to"],0,"Going to for predictions with evidence."],

{learn:[["How to mark a Writing Task 2","Score four criteria from 1 to 9 in half bands. Task Response: all parts answered, clear position, developed ideas. Coherence and Cohesion: clear paragraphs and logical flow. Lexical Resource: range, precision, collocation, spelling. Grammatical Range and Accuracy: variety and control. Mark each criterion alone.",["Band 5: limited development, frequent errors.","Band 7: clear position, mostly accurate."],"These samples are short excerpts. Judge the quality you see, not the word count."]],e:{
task:"Some people think children should start school at age 4. Do you agree or disagree?",
text:"I agree children go to school when age 4 because they learn fast. Children is very smart in this age and they can learn many thing like number and letter. Also, parent are busy so school can take care children. But some child are too small and they cry. In my country, many children start school late and they have problem. So I think school at 4 is good idea. In conclusion I agree.",
key:[5,5,4.5,4],
why:["Task Response 5: a position is given and ideas appear, but they are very thin and not developed.","Coherence and Cohesion 5: some linking (Also, But, So) and a conclusion, but ideas jump and are repetitive.","Lexical Resource 4.5: very basic words, with errors like 'many thing' and 'take care children'.","Grammar 4: frequent errors in agreement and plurals (children is, parent are) make reading hard."],
tip:"Band 4 to 5 writing often has a position but no development."}},
{learn:[["Band 6: adequate but uneven","Band 6 writing answers the question with some development, uses a mix of simple and complex sentences, and has noticeable errors that rarely block meaning. Look for a clear but sometimes underdeveloped argument.",["Partly agree, with reasons and one example."],"Count the errors: do they stop you understanding?"]],e:{
task:"Some people think children should start school at age 4. Do you agree or disagree?",
text:"Nowadays, many people believe that children should begin formal education at the age of four. I partly agree with this view. On the one hand, young children are able to learn languages and social skills quickly, so an early start can give them an advantage. On the other hand, children at this age needs play more than lessons, and too much pressure may make them dislike school in the future. For example, in Finland children start at seven but their results are among the highest. Therefore, I think the age should not be lowered, but nurseries should offer simple learning activities.",
key:[6,6.5,6,6.5],
why:["Task Response 6: a clear partly-agree position with reasons and an example, but development is moderate.","Coherence and Cohesion 6.5: clear paragraph logic with a range of linkers (On the one hand, For example, Therefore).","Lexical Resource 6: adequate range (formal education, pressure, nurseries) with some repetition.","Grammar 6.5: a mix of structures, one agreement error (needs), errors rarely block meaning."],
tip:"A single slip does not drop a band if control is otherwise good."}},
{learn:[["Band 7: clear and controlled","Band 7 writing keeps a clear position throughout, extends and supports ideas, uses a range of complex structures with frequent error-free sentences, and uses less common vocabulary with some awareness of style and collocation.",["Clear position, extended ideas, occasional slips."],"Check precision and cohesion, not just difficult words."]],e:{
task:"Some people think children should start school at age 4. Do you agree or disagree?",
text:"Whether formal schooling should start at four is a contested issue. While an early start can narrow gaps between children from different backgrounds, I believe the potential drawbacks outweigh the benefits. Cognitive research suggests that young children learn best through play, and a rigid timetable may erode their curiosity before it has been given a chance to flourish. Finland, where compulsory education begins at seven, consistently ranks among the top performers, which implies that an early start is not a prerequisite for academic success. A more balanced solution would be to expand high-quality preschool provision that blends structured activities with free exploration.",
key:[7,7,7,7.5],
why:["Task Response 7: a clear position throughout, with extended, well-supported ideas.","Coherence and Cohesion 7: logical progression and good use of reference and linking, though some lengthy sentences.","Lexical Resource 7: less common items used precisely (erode curiosity, prerequisite, provision).","Grammar 7.5: a wide range of structures with very few errors."],
tip:"Band 7 sounds natural and controlled, not showy."}},
{learn:[["Band 8: fluent and sophisticated","Band 8 writing fully addresses the task, develops ideas in depth, manages cohesion skilfully, uses a wide range of vocabulary fluently, and produces almost entirely error-free sentences. Errors are rare and minor.",["Nuanced argument and precise style."],"Do not penalise a short slip if the control is outstanding."]],e:{
task:"Some people think children should start school at age 4. Do you agree or disagree?",
text:"The proposition that formal schooling ought to begin at four rests on the assumption that earlier is invariably better, an assumption the evidence does not bear out. Although structured provision can compensate for disadvantage at home, its benefits depend heavily on quality: where classrooms are overcrowded and pedagogy is didactic, young learners may acquire anxiety rather than knowledge. Nations such as Finland, which postpone compulsory instruction until seven, nonetheless achieve outstanding outcomes, suggesting that foundations built through play are no less durable. Policymakers would therefore be wiser to invest in well-trained early-years educators than to lower the starting age.",
key:[8,8,8,8],
why:["Task Response 8: sophisticated position, deeply developed with nuance.","Coherence and Cohesion 8: skilful paragraphing, cohesion and progression.","Lexical Resource 8: wide, precise vocabulary used fluently and naturally.","Grammar 8: a wide range of complex structures, almost error-free."],
tip:"Band 8 is about precision, nuance and control."}},
{learn:[["Mixed profiles","Real essays are uneven. Strong ideas can come with weaker language, or perfect grammar with poor ideas. Mark every criterion separately. Do not let one strong area pull all others up.",["Good ideas, unnatural collocations, article errors."],"The highest criterion should not raise the others."]],e:{
task:"Some people think children should start school at age 4. Do you agree or disagree?",
text:"In my opinion, the age of four is too young for school because the children need freedom to explore the world. Government should concentrate for improving kindergartens rather than reduce the starting age. Besides, there are a lot of researches showing that play is more effective than lesson. For instance, children in Nordic countries start later but their academic performances are higher than the others. To sum up, it is more suitable for them to stay at home or nursery in this period.",
key:[6.5,6.5,5.5,5.5],
why:["Task Response 6.5: a clear position with relevant ideas and an example, adequately developed.","Coherence and Cohesion 6.5: clear organisation and linkers, though some are mechanical.","Lexical Resource 5.5: wrong collocations and forms (researches, performances, concentrate for).","Grammar 5.5: article and preposition errors and a missing form (than lesson, to stay at home or nursery) show limited control."],
tip:"Ideas can be Band 6.5 while language is Band 5.5."}}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);}
var SFX={
ok:function(){tone(660,.12,'triangle',.18);tone(880,.2,'triangle',.18,.09);},
no:function(){tone(190,.25,'sawtooth',.1);tone(140,.3,'sawtooth',.09,.1);},
tap:function(){tone(520,.05,'square',.04);},
win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.22,'triangle',.17,i*.1);});},
lvl:function(){[392,523,659,784,1047,1319].forEach(function(f,i){tone(f,.26,'triangle',.17,i*.09);});},
tick:function(){tone(900,.04,'square',.03);}};
function canSpeak(){return ('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';}

function pickVoice(){if(VOICE)return VOICE;try{var vs=speechSynthesis.getVoices()||[];var p=vs.filter(function(v){return /^en[-_](GB|US)/i.test(v.lang);})[0]||vs.filter(function(v){return /^en/i.test(v.lang);})[0]||null;if(p)VOICE=p;}catch(e){}return VOICE;}
function say(t,rate){if(!canSpeak())return false;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';var v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}u.rate=rate||0.95;speechSynthesis.speak(u);return true;}catch(e){return false;}}

var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
window.addEventListener('resize',fit);fit();
function burst(n){if(still)return;fit();var cols=['#f2b705','#0f8b7a','#e04a3c','#2f7fd1','#d6457f','#4fe08e'];
  for(var i=0;i<n;i++){PS.push({x:cv.width/2,y:cv.height*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,w:6+Math.random()*6,h:4+Math.random()*5,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:110+Math.random()*50});}
  if(!going){going=true;requestAnimationFrame(step);}}
function step(){cx.clearRect(0,0,cv.width,cv.height);
  PS=PS.filter(function(p){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    return p.life>0&&p.y<cv.height+30;});
  if(PS.length){requestAnimationFrame(step);}else{going=false;cx.clearRect(0,0,cv.width,cv.height);}}

function mcqItem(q,label,key,mid){return {k:'mcq',t:q[0],o:shuffle(q[1].map(function(x,i){return {x:x,ok:i===q[2]};})),why:q[3]||'',lab:label,key:key,m:mid};}
function itemFromKey(key){
  var c=customById(key);
  if(c)return mcqItem([c.q,c.o,c.a,c.why||'Your own question.'],'My question',key,'custom');
  var e=QIDX[key];if(!e)return null;
  return mcqItem(e.q,modeOf(e.m).name+' · '+lvLabel(e.m,e.n),key,e.m);
}
function poolOf(a){var p=shuffle(a),tries=0;while(p.join('|')===a.join('|')&&tries++<8){p=shuffle(a);}return p;}
function begin(kind,id,n){
  var m=modeOf(id);clearInterval(clock);stopSpeech();n=n||0;
  R={kind:kind,id:id,n:n,type:'mcq',i:0,c:0,t:0,tot:0,combo:0,maxCombo:0,lives:0,wrong:[],locked:false,placed:[],qs:[],xpu:10,over:false,failed:false,flags:[],vals:[]};
  if(kind==='level'){
    var lv=D[id][n];R.type=m.type;
    if(m.type==='mcq'){R.qs=shuffle(lv.q.map(function(q,k){return mcqItem(q,lvLabel(id,n),id+':'+n+':'+k,id);}));R.lives=3;}
    else if(m.type==='build'){R.qs=shuffle(lv.p.map(function(p){return {k:'build',t:p[0],ans:p[1],pool:poolOf(p[1]),m:id};}));R.lives=3;}
    else if(m.type==='listen'){R.qs=shuffle(lv.items.map(function(it){
      if(it[0]==='pair')return {k:'pair',word:it[1],o:shuffle(it[2].map(function(x,i){return {x:x,ok:i===it[3]};})),why:it[4],lab:lvLabel(id,n),m:id};
      return {k:'dict',sent:it[1],why:it[2],lab:lvLabel(id,n),m:id};}));R.lives=3;}
    else if(m.type==='hunt'){R.qs=lv.ps.map(function(p){return {k:'hunt',t:p.t,s:p.s.map(function(x){return {x:x[0],err:x[1],fix:x[2]};}),m:id};});R.xpu=4;}
    else if(m.type==='marker'){R.qs=[{k:'marker',e:lv.e,m:id}];R.xpu=10;}
    else if(m.type==='timer'){R.qs=lv.sc.map(function(s){return {k:'timer',s:s,m:id};});R.xpu=5;}
    R.tot=0;R.qs.forEach(function(q){R.tot+=q.k==='hunt'?q.s.length:q.k==='marker'?4:q.k==='timer'?q.s.st.length:1;});
  }else if(kind==='speed'){
    R.time=60;var all=[];
    MODES.forEach(function(mm){if(mm.type==='mcq'&&visible(mm)){D[mm.id].forEach(function(lv,nn){lv.q.forEach(function(q,k){all.push(mcqItem(q,mm.name+' · '+lvLabel(mm.id,nn),mm.id+':'+nn+':'+k,mm.id));});});}});
    R.qs=shuffle(all);

var CRIT=[['Task Response','Is the question answered, with a clear and developed position?'],['Coherence and Cohesion','Is it organised and linked clearly?'],['Lexical Resource','Is vocabulary wide, precise and natural?'],['Grammatical Range and Accuracy','Is grammar varied and under control?']];

function markerCheck(){

function timerStep(s){return s.total>=60?5:1;}
function renderTimer(h,q,keep){
  var s=q.s,n=s.st.length,st=timerStep(s),base=Math.floor(s.total/n/st)*st,rem=s.total-base*n;R.vals=[];

/* ---------- finishing a round ---------- */
function finish(){
  if(!R||R.over)return;R.over=true;clearInterval(clock);stopSpeech();
  var speed=R.kind==='speed',tot=speed?R.t:R.tot,pct=tot?R.c/tot:0,stars,gain;
  if(speed){stars=R.c>=12?3:R.c>=8?2:R.c>=4?1:0;gain=R.c*4;if(R.c>S.speedBest)S.speedBest=R.c;}
  else{stars=pct>=.99?3:pct>=.8?2:pct>=.6?1:0;
    gain=(R.c*R.xpu+(R.maxCombo>=3?R.maxCombo*2:0)+stars*5)*(R.kind==='level'?1+R.n*.15:1);
    if(R.kind==='daily')gain+=30;
    gain=Math.round(gain);}
  var oldR=rankIdx(S.xp);S.xp+=gain;var newR=rankIdx(S.xp);
  var hadStars=0;
  if(R.kind==='level'){hadStars=S.stars[R.id][R.n];if(stars>hadStars)S.stars[R.id][R.n]=stars;}
  if(R.kind==='daily'){S.daily=today();S.dd=(S.dd||0)+1;}
  var d=today();if(S.last!==d){S.streak=(S.last&&dayNum(d)-dayNum(S.last)===1)?S.streak+1:1;S.last=d;}
  if(S.day!==d){S.day=d;S.dayN=0;}S.dayN++;S.rounds++;
  if(!speed&&tot>=3&&R.c>=tot)S.perfect++;S.best=Math.max(S.best||0,R.maxCombo);
  var chk={first:S.rounds>=1,perfect:S.perfect>=1,combo:S.best>=5,
    explorer:MODES.filter(function(m){return S.stats[m.id].t>0;}).length>=10,speed:S.speedBest>=12,xp:S.xp>=1000,
    stars:totalStars()>=40,days:S.streak>=3,daily:(S.dd||0)>=1,review:S.revC>=10,custom:S.custom.length>=5,
    master:starModes().some(function(m){return S.stars[m.id][nl(m.id)-1]===3;})},fresh2=[];
  BADGES.forEach(function(b){if(chk[b[0]]&&!S.badges[b[0]]){S.badges[b[0]]=true;fresh2.push(b[1]);}});
  save();
  var cc=Math.round(R.c*10)/10;
  var titles=['Keep practising','Good effort','Great work!','Outstanding!'];
  var h='<div class="play"><section class="panel result"><h2>'+(R.failed?'Out of hearts':speed?(R.c>=S.speedBest&&R.c>0?'New best!':'Time is up'):titles[stars])+'</h2>';
  if(!speed){h+='<div class="bigstars">';for(var i=0;i<3;i++){h+='<svg viewBox="0 0 24 24" class="'+(i<stars?'in':'')+'" style="animation-delay:'+(i*.25)+'s"><path class="'+(i<stars?'star-on':'star-off')+'" d="'+STAR+'"/></svg>';}h+='</div>';}
  h+='<div style="font-size:18px;font-weight:700">'+(speed?cc+' correct in 60 seconds':cc+' / '+tot+' correct')+(R.maxCombo>=2?' · best combo '+R.maxCombo:'')+'</div><div class="xpgain">+'+gain+' XP</div>';
  if(R.failed)h+='<p style="margin:0;color:var(--muted)">Read the lesson again, then try the test once more.</p>';
  if(newR>oldR)h+='<div class="chip">New rank: <b>'+esc(RANKS[newR][1])+'</b></div>';
  fresh2.forEach(function(n){h+='<div class="chip">Badge unlocked: <b>'+esc(n)+'</b></div>';});
  if(R.wrong.length){h+='<div class="rev"><b style="font-family:var(--f-display)">Review these</b>';
    R.wrong.slice(0,8).forEach(function(w){h+='<div>'+esc(w.q)+'<small>Answer: '+esc(w.a)+'</small>'+(w.why?'<small>'+esc(w.why)+'</small>':'')+'</div>';});
    h+=(R.qs[0]&&R.qs[0].key?'<small style="color:var(--muted)">Missed questions return in your daily review.</small>':'')+'</div>';}
  h+='<div class="row" style="justify-content:center">';
  var canNext=R.kind==='level'&&R.n+1<nl(R.id)&&S.stars[R.id][R.n]>=gate(R.n+1);
  if(R.kind==='level'){
    if(canNext)h+='<button class="btn" data-a="lv" data-id="'+R.id+'" data-n="'+(R.n+1)+'">Next level</button>';
    else if(stars>=1&&nextStep())h+='<button class="btn" data-a="cont">Continue</button>';
    h+='<button class="btn ghost" data-a="go" data-id="'+R.id+'" data-n="'+R.n+'">Play again</button>';
    if(R.failed||stars<2)h+='<button class="btn ghost" data-a="learn" data-id="'+R.id+'" data-n="'+R.n+'">Read the lesson</button>';
  }else if(R.kind==='speed')h+='<button class="btn" data-a="speed">Play again</button>';
  else if(R.kind==='custom')h+='<button class="btn" data-a="cplay">Play again</button>';
  h+='<button class="btn ghost" data-a="home">Home</button></div></section></div>';
  paint(h);
  if(newR>oldR||fresh2.length){SFX.lvl();burst(110);toast(newR>oldR?'Rank up! '+RANKS[newR][1]:'Badge: '+fresh2[0]);}
  else if(stars>=2){SFX.win();burst(70);}else if(stars===1||speed){SFX.win();}else{SFX.no();}
}
function startLevel(id,n){S.seen[id+':'+n]=1;save();R=null;begin('level',id,n);}

/* ---------- events ---------- */
function addCustom(){
  var q=document.getElementById('cq').value.trim(),w=document.getElementById('cw').value.trim(),opts=[],a=-1,sel=0;
  for(var i=0;i<4;i++){if(document.getElementById('ca'+i).checked)sel=i;}
  for(var j=0;j<4;j++){var v=document.getElementById('co'+j).value.trim();if(v){if(j===sel)a=opts.length;opts.push(v);}}
  if(!q){toast('Write the question first');return;}
  if(opts.length<2){toast('Add at least 2 options');return;}
  if(a<0){toast('The correct option cannot be empty');return;}
  S.custom.push({id:S.cid++,q:q,o:opts,a:a,why:w});
  if(S.custom.length>=5&&!S.badges.custom){S.badges.custom=true;toast('Badge: Author');SFX.lvl();burst(60);}else{SFX.ok();toast('Question added');}
  save();customView();
}
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||el.disabled)return;ac();
  var a=el.getAttribute('data-a'),id=el.getAttribute('data-id'),k=+el.getAttribute('data-k'),n=+el.getAttribute('data-n');
  if(a==='mode'){SFX.tap();modeView(id);}
  else if(a==='alllv'){SFX.tap();modeView(id,true);}
  else if(a==='grp'){SFX.tap();groupView(id);}
  else if(a==='cont'){SFX.tap();var ns=nextStep();if(ns){if(S.seen[ns.id+':'+ns.n])startLevel(ns.id,ns.n);else{L=null;learnView(ns.id,ns.n);}}else home();}
  else if(a==='lv'){SFX.tap();if(S.seen[id+':'+n])startLevel(id,n);else{L=null;learnView(id,n);}}
  else if(a==='learn'){SFX.tap();L=null;learnView(id,n);}
  else if(a==='lnext'){SFX.tap();L.i++;learnView(L.id,L.n);}
  else if(a==='lprev'){SFX.tap();L.i--;learnView(L.id,L.n);}
  else if(a==='go'){SFX.tap();if(!isOpen(id,n)){toast('Earn more stars on the level before');return;}startLevel(id,n);}
  else if(a==='sayex'){if(L&&L.ex[k])say(L.ex[k],0.9);}
  else if(a==='home'){clearInterval(clock);if(R)R.over=true;SFX.tap();home();}
  else if(a==='quit'){clearInterval(clock);var kd=R&&R.kind,rid=R&&R.id;if(R)R.over=true;SFX.tap();R=null;stopSpeech();if(kd==='level')modeView(rid);else home();}
  else if(a==='stats'){SFX.tap();statsView();}
  else if(a==='snd'){S.sound=!S.sound;save();el.innerHTML=ico(S.sound?'vol':'mute');SFX.tap();}
  else if(a==='role'){S.role=id;save();SFX.tap();home();}
  else if(a==='daily'){SFX.tap();R=null;begin('daily','daily',0);}
  else if(a==='review'){SFX.tap();R=null;begin('review','review',0);}
  else if(a==='speed'){SFX.tap();R=null;begin('speed','speed',0);}
  else if(a==='cplay'){SFX.tap();R=null;begin('custom','custom',0);}
  else if(a==='cedit'){SFX.tap();customView();}
  else if(a==='cadd'){addCustom();}
  else if(a==='cdel'){S.custom=S.custom.filter(function(c){return c.id!==k;});delete S.srs['c:'+k];save();SFX.tap();customView();}
  else if(a==='ans'){answer(k);}
  else if(a==='next'){next();}
  else if(a==='pick'){if(R&&!R.locked&&R.placed.indexOf(k)<0){R.placed.push(k);SFX.tap();drawBuild();}}
  else if(a==='unpick'){if(R&&!R.locked){R.placed.splice(k,1);SFX.tap();drawBuild();}}
  else if(a==='clear'){if(R&&!R.locked){R.placed=[];drawBuild();}}
  else if(a==='check'){check();}
  else if(a==='hear'){speakNow(el.getAttribute('data-s')==='1');}
  else if(a==='dcheck'){dictCheck();}
  else if(a==='flag'){flagSent(k);}
  else if(a==='hcheck'){huntCheck();}
  else if(a==='mv'){moveMark(k,+el.getAttribute('data-d'));}
  else if(a==='mcheck'){markerCheck();}
  else if(a==='tv'){moveTime(k,+el.getAttribute('data-d'));}
  else if(a==='tcheck'){timerCheck();}
  else if(a==='reset'){if(!armed){armed=true;el.textContent='Tap again to erase everything';}else{S=fresh();fix(S);save();armed=false;toast('Progress erased');home();}}
});
document.addEventListener('keydown',function(e){
  if(!R||R.over)return;var q=R.qs[R.i];if(!q)return;
  if(e.target&&e.target.id==='dict'){if(e.key==='Enter'){e.preventDefault();dictCheck();}return;}
  if((q.k==='mcq'||q.k==='pair')&&/^[1-4]$/.test(e.key)){if(+e.key<=q.o.length)answer(+e.key-1);}
  else if(e.key==='Enter'&&R.locked&&R.kind!=='speed'){next();}
});
home();
</script>

<div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Thông báo về cookie" hidden>
  <div class="wrap">
    <p>Trang này dùng Google Analytics để biết nội dung nào hữu ích cho bạn — chỉ khi bạn đồng ý. Không có cookie quảng cáo, không bán dữ liệu. Bạn có thể đổi ý bất cứ lúc nào qua “Cài đặt cookie” ở chân trang. Xem <a href="/quyen-rieng-tu.html">Chính sách quyền riêng tư</a>.</p>
    <div class="cookie-actions">
      <button type="button" id="cookie-accept" class="btn">Đồng ý</button>
      <button type="button" id="cookie-decline" class="btn">Từ chối</button>
    </div>
  </div>
</div>
<script>
(function(){
  var KEY='de-consent';
  var banner=document.getElementById('cookie-banner');
  function loadGA(){
    if(document.querySelector('script[src*="googletagmanager.com/gtag/js"]')){return;}
    var s=document.createElement('script');
    s.async=true;
    s.src='https://www.googletagmanager.com/gtag/js?id=G-6WKB00FR9G';
    document.head.appendChild(s);
    gtag('js', new Date());
    gtag('config', 'G-6WKB00FR9G');
  }
  function eraseGaCookies(){
    document.cookie.split(';').forEach(function(c){
      var name=c.split('=')[0].trim();
      if(name.indexOf('_ga')===0){
        document.cookie=name+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
      }
    });
  }
  function showBanner(){banner.hidden=false;}
  function hideBanner(){banner.hidden=true;}
  function accept(){
    try{localStorage.setItem(KEY,'granted');}catch(e){}
    gtag('consent','update',{'analytics_storage':'granted'});
    loadGA();
    hideBanner();
  }
  function decline(){
    try{localStorage.setItem(KEY,'denied');}catch(e){}
    gtag('consent','update',{'analytics_storage':'denied'});
    eraseGaCookies();
    hideBanner();
  }
  document.getElementById('cookie-accept').addEventListener('click',accept);
  document.getElementById('cookie-decline').addEventListener('click',decline);
  var settings=document.getElementById('cookie-settings');
  if(settings){settings.addEventListener('click',function(e){e.preventDefault();showBanner();});}
  var stored=null;
  try{stored=localStorage.getItem(KEY);}catch(e){}
  if(stored==='granted'){
    gtag('consent','update',{'analytics_storage':'granted'});
    loadGA();
  }else if(stored==='denied'){
    /* Da tu choi: khong tai gtag.js, khong hien lai banner. */
  }else{
    showBanner();
  }
})();
</script>
