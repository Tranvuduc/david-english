<title>Bible English Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#edf2f1; --surface:#ffffff; --surface-2:#e2ebe9; --ink:#10303d; --muted:#56707a; --line:#cddbd8;
  --accent:#1d7469; --accent-ink:#ffffff; --accent-soft:#d3ebe6;
  --gold:#b87a12; --gold-soft:#f5e6c6; --good:#2b7a4b; --good-soft:#dcf0e2; --bad:#b0413a; --bad-soft:#f7dfdc;
  --hl:#fbe7a8; --shadow:0 1px 2px rgba(16,48,61,.06),0 6px 18px rgba(16,48,61,.07);
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0b161b; --surface:#12222a; --surface-2:#1a2f37; --ink:#e2eeec; --muted:#93aab0; --line:#27414a;
  --accent:#52b5a6; --accent-ink:#062019; --accent-soft:#173b37;
  --gold:#e6ad48; --gold-soft:#3a2d14; --good:#63c790; --good-soft:#15352a; --bad:#e67c71; --bad-soft:#3d1d1a;
  --hl:#5a4a17; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b161b; --surface:#12222a; --surface-2:#1a2f37; --ink:#e2eeec; --muted:#93aab0; --line:#27414a;
  --accent:#52b5a6; --accent-ink:#062019; --accent-soft:#173b37;
  --gold:#e6ad48; --gold-soft:#3a2d14; --good:#63c790; --good-soft:#15352a; --bad:#e67c71; --bad-soft:#3d1d1a;
  --hl:#5a4a17; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800} h2{font-size:1.3rem;font-weight:800} h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:16px 110px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap-row{flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.raised{box-shadow:var(--shadow);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.gold>i{background:var(--gold)}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.78rem;color:var(--muted)}
.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brandmark{display:inline-flex;align-items:baseline;gap:1px;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.brandmark b{color:var(--ink);font-weight:600}
.brandmark i{font-style:normal;color:var(--gold)}
.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:4px;font-weight:700;font-size:.85rem;padding:5px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip .i{width:16px;height:16px}
.chip.flame{color:var(--gold)}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1}
.ring .v small{display:block;font-family:var(--f-body);font-weight:400;font-size:.68rem;color:var(--muted)}
.continue{background:var(--ink);color:var(--bg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;border:0;text-align:left;width:100%}
.continue .eyebrow{color:inherit;opacity:.7}
.continue h2{font-size:1.45rem}
.continue .go{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.continue .steps-mini{display:flex;gap:4px}
.continue .steps-mini i{flex:1;height:5px;border-radius:9px;background:currentColor;opacity:.22}
.continue .steps-mini i.on{opacity:1;background:var(--accent)}
.verse-card{font-family:var(--f-read);font-size:1.12rem;line-height:1.55}
.verse-card cite{display:block;margin-top:8px;font-family:var(--f-body);font-style:normal;font-size:.85rem;color:var(--muted);font-weight:700}

/* units */
.unit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.unit .num{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.unit.done .num{background:var(--good-soft);color:var(--good)}
.unit.active .num{background:var(--accent);color:var(--accent-ink)}
.unit .t{font-weight:700;line-height:1.25}
.unit .s{font-size:.82rem;color:var(--muted)}
.unit .bar{margin-top:7px;height:5px}
.steplist{display:flex;flex-direction:column;gap:8px}
.stepitem{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stepitem .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:.85rem}
.stepitem.done .dot{background:var(--good);color:var(--surface)}
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.wordtile{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.wordtile b{font-size:.98rem}
.wordtile span{font-size:.8rem;color:var(--muted)}

/* lesson */
.lesson-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;align-items:center;gap:10px}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:7px;border-radius:9px;background:var(--surface-2)}
.segs i.on{background:var(--good)}
.segs i.cur{background:var(--accent)}
.lesson-foot{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.lesson-foot .in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center}
.steptitle{display:flex;flex-direction:column;gap:4px;margin-block:6px 16px}
.steptitle h1{font-size:1.55rem}

.flash{perspective:1200px;min-height:260px}
.flash-in{position:relative;min-height:260px;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg)}
.face .word{font-family:var(--f-display);font-weight:800;font-size:2.3rem;line-height:1.05}
.face .vi{font-size:1.25rem;font-weight:700;color:var(--accent)}
.face .ex{font-family:var(--f-read);font-style:italic}
.tapnote{font-size:.8rem;color:var(--muted);margin-top:auto}
@media (prefers-reduced-motion:reduce){.flash-in{transition:none}.bar>i{transition:none}}

.scripture{font-family:var(--f-read);font-size:1.18rem;line-height:1.75}
.vs{display:block;padding:8px 10px;margin-inline:-10px;border-radius:10px;transition:background .2s}
.vs.playing{background:var(--accent-soft)}
.vs sup{font-family:var(--f-body);font-weight:700;color:var(--accent);font-size:.7rem;margin-right:4px}
.vs .say{vertical-align:middle;margin-left:4px;width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:inline-grid;place-items:center}
.vs .say .i{width:17px;height:17px}
.gw{background:none;border:0;padding:0 1px;font:inherit;color:inherit;border-bottom:2px dotted var(--accent);cursor:pointer}
.gp{background:var(--hl);border-radius:4px;padding:0 2px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.note{font-size:.88rem;background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px}

.q{display:flex;flex-direction:column;gap:8px}
.q .qt{font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;opacity:1}
.fb{font-size:.88rem;font-weight:700}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}

.gtable{width:100%;border-collapse:collapse;font-size:.95rem}
.gtable td,.gtable th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.gtable th{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.scroll-x{overflow-x:auto}
.explain p+p{margin-top:8px}
.explain b{color:var(--accent)}

textarea{width:100%;min-height:180px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:12px;font:1.02rem/1.55 var(--f-body);resize:vertical}
.frame{font-family:var(--f-read);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-style:italic}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.check .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check.ok .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.check .box .i{width:14px;height:14px;stroke-width:3}

.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;min-height:42px}
.tile.used{visibility:hidden}
.answer{min-height:60px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.answer.right{border-color:var(--good);border-style:solid;background:var(--good-soft)}
.answer.wrong{border-color:var(--bad);border-style:solid}
.letters .tile{min-width:44px;font-size:1.2rem;text-transform:lowercase}

.speakline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.speakline p{font-family:var(--f-read);font-size:1.08rem}

/* games */
.gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gamebtn{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.gamebtn .gi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.gamebtn b{font-family:var(--f-display);font-size:1.08rem}
.gamebtn span{font-size:.82rem;color:var(--muted);line-height:1.3}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcell{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;min-height:54px;text-align:center;font-weight:700;font-size:.95rem}
.mcell.sel{border-color:var(--accent);background:var(--accent-soft)}
.mcell.done{visibility:hidden}
.mcell.shake{border-color:var(--bad);background:var(--bad-soft)}
.bigq{font-family:var(--f-read);font-size:1.2rem}

/* progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-weight:800;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:80px}
.days i{display:block;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:3px;opacity:.9}
.days i.zero{background:var(--surface-2);opacity:1}
.days-l{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:.62rem;color:var(--muted);text-align:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.badge .bi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.badge.on .bi{background:var(--gold-soft);color:var(--gold)}
.badge:not(.on){opacity:.6}
.badge b{font-size:.88rem;display:block;line-height:1.2}
.badge span{font-size:.75rem;color:var(--muted);line-height:1.2}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.switch{width:50px;height:30px;border-radius:99px;border:0;background:var(--surface-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:23px}
input[type=range]{accent-color:var(--accent);width:140px}
select{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 8px;max-width:190px}
.codebox{width:100%;min-height:80px;font:.78rem/1.4 ui-monospace,Menlo,monospace}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.72rem;font-weight:700;color:var(--muted);border-radius:10px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .i{width:22px;height:22px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.celebrate{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:30px}
.celebrate .big{font-family:var(--f-display);font-weight:800;font-size:3rem;color:var(--gold);line-height:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.foot-note{font-size:.75rem;color:var(--muted);text-align:center;line-height:1.4}
.sep{height:1px;background:var(--line)}
</style>

function defaults(){return{xp:0,streak:0,last:null,days:{},units:{},words:{},stats:{correct:0,answered:0,games:0},settings:{vi:true,rate:0.85,voice:""}}}
let S=defaults();
let ACTIVE=null;

/* ---------- student profiles (so a shared device keeps each learner's progress separate) ---------- */
function profiles(){try{return JSON.parse(localStorage.getItem(PROFILES_KEY)||"[]")}catch(e){return[]}}

const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};

function curStreak(){return (S.last===today()||S.last===yesterday())?S.streak:0}
function addXP(n){S.xp+=n;const t=today();S.days[t]=(S.days[t]||0)+n;touch();save()}

function scoreWord(w,ok){const r=W(w);r.n++;r.s=ok?Math.min(5,r.s+1):Math.max(0,r.s-1);S.stats.answered++;if(ok)S.stats.correct++;save()}
const mastered=()=>ALLWORDS.filter(v=>(S.words[v.w]||{}).s>=3).length;
function nextLesson(){for(let i=0;i<UNITS.length;i++){const u=UNITS[i];const k=STEPS.findIndex(s=>!done(u.id,s.id));if(k>=0)return{u:i,s:k}}return null}

function reviewOrder(pool){return shuffle(pool).sort((a,b)=>((S.words[a.w]||{}).s||0)-((S.words[b.w]||{}).s||0))}

 return '<nav class="tabbar" aria-label="Main"><div class="in">'+t.map(x=>'<button class="tab" data-act="go" data-arg="'+x[0]+'"'+(active===x[0]?' aria-current="page"':"")+'>'+icon(x[2])+x[1]+'</button>').join("")+'</div></nav>'}
function ring(val,max,label){const r=40,c=2*Math.PI*r,p=Math.min(1,val/max);
 return '<div class="ring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="'+r+'" stroke="var(--surface-2)" stroke-width="9" fill="none"/><circle cx="46" cy="46" r="'+r+'" stroke="'+(p>=1?"var(--gold)":"var(--accent)")+'" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p)).toFixed(1)+'"/></svg><div class="v tnum">'+val+'<small>'+label+'</small></div></div>'}
function markVocab(text,vocab){let t=h(text);const forms=[];vocab.forEach(v=>v.forms.forEach(f=>forms.push([f,v.w])));forms.sort((a,b)=>b[0].length-a[0].length);
 const re=new RegExp("(^|[^A-Za-z])("+forms.map(f=>f[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![A-Za-z])","gi");
 return t.replace(re,(m,pre,word)=>{const f=forms.find(x=>x[0].toLowerCase()===word.toLowerCase());return pre+'<button class="gw" data-act="gloss" data-arg="'+h(f[1])+'">'+word+'</button>'})}
function markPattern(text,src){return h(text).replace(new RegExp(src,"gi"),m=>'<span class="gp">'+m+'</span>')}
function viLine(v){return S.settings.vi?'<div class="vi">'+h(v.vi)+'</div>':''}

 const rng=$("#rate");if(rng)rng.addEventListener("input",()=>{S.settings.rate=+rng.value;$("#rateV").textContent=rng.value+"×";save()});

 cont+
 '<section class="card stack"><div class="row"><span class="eyebrow">Verse of the day</span><div class="spacer"></div>'+say(vod.mv.text+". "+vod.mv.ref)+'</div><blockquote class="verse-card" style="margin:0">'+h(vod.mv.text)+'<cite>'+h(vod.mv.ref)+' · Unit '+vod.id+'</cite></blockquote></section>'+
 '<section class="card row wrap-row"><div class="stack" style="gap:2px;flex:1;min-width:180px"><span class="eyebrow">Word review</span><b>'+(fallback?"Practise Unit 1–2 words":weak+" word"+(weak===1?"":"s")+" still need practice")+'</b><span class="muted" style="font-size:.85rem">'+mastered()+' of '+ALLWORDS.length+' words mastered</span></div><button class="btn primary" data-act="game" data-arg="quiz">'+icon("quiz")+'Quick review</button></section>'+
 '<section class="stack"><div class="row"><h2>Units</h2><div class="spacer"></div><button class="btn small ghost" data-act="go" data-arg="units">See all '+icon("next")+'</button></div>'+UNITS.slice(nl?Math.max(0,Math.min(nl.u,7)):7,(nl?Math.max(0,Math.min(nl.u,7)):7)+3).map(unitRow).join("")+'</section>'+
 '<p class="foot-note">Scripture quotations: World English Bible (public domain).<br>Progress is saved in this browser. Back it up from the Progress tab.</p>'+
 '</div>'+tabbar("home")}
function unitRow(u){const i=UNITS.indexOf(u);const c=unitCount(u.id);const nl=nextLesson();const cls=c===8?"done":(nl&&nl.u===i?"active":"");
 const st=c===8?'<span class="pill good">'+icon("check")+'Done</span>':c>0?'<span class="pill accent">'+c+'/8</span>':'<span class="pill">'+STEPS.reduce((a,s)=>a+s.mins,0)+' min</span>';
 return '<button class="unit '+cls+'" data-act="unit" data-arg="'+i+'"><span class="num">'+(c===8?icon("check"):u.id)+'</span><span><span class="t">'+h(u.title)+'</span><span class="s" style="display:block">'+h(u.ref)+' · '+h(u.grammar)+'</span><span class="bar" style="display:block"><i style="width:'+(c/8*100)+'%"></i></span></span>'+st+'</button>'}

 '<button class="btn primary block" data-act="lesson" data-u="'+view.u+'" data-s="'+(nl<0?0:nl)+'">'+icon("play")+(nl<0?"Review this unit":nl===0?"Start the lesson":"Continue: "+STEPS[nl].name)+'</button>'+

 (ls.gloss?glossSheet(ls.gloss):"")}

 (b.state==="right"?'<div class="note"><b>Perfect!</b> You built the verse.</div>':b.state==="wrong"?'<div class="row"><span class="fb bad">Not quite. Check the order.</span><div class="spacer"></div><button class="btn small" data-act="vbreset">Try again</button></div>':full?'':'')}

function confetti(){const c=document.createElement("canvas");c.className="confetti";document.body.appendChild(c);const x=c.getContext("2d");const W_=c.width=innerWidth,H_=c.height=innerHeight;
 const cs=getComputedStyle(document.documentElement);const cols=["--accent","--gold","--good"].map(v=>cs.getPropertyValue(v).trim()||"#1d7469");
 const ps=Array.from({length:90},()=>({x:Math.random()*W_,y:-20-Math.random()*H_*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,s:4+Math.random()*5,c:cols[Math.floor(Math.random()*3)]}));
 let t=0;(function f(){x.clearRect(0,0,W_,H_);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<160)requestAnimationFrame(f);else c.remove()})()}

function newGame(kind){const {pool}=studiedWords();const ord=reviewOrder(pool);const g={kind,round:0,score:0,total:0,over:false};
 if(kind==="match"){g.words=ord.slice(0,6);g.left=shuffle(g.words.map(v=>v.w));g.right=shuffle(g.words.map(v=>v.w));g.done=[];g.sel=null;g.total=g.words.length}

 else{g.items=ord.slice(0,Math.min(kind==="quiz"?10:8,ord.length));g.total=g.items.length;g.pool=pool}
 return g}

const A={
 go:t=>go({name:t.dataset.arg}),

 lesson:t=>go({name:"lesson",u:+t.dataset.u,s:+t.dataset.s,gained:0}),

 say:t=>speak(t.dataset.text),
 sayslow:t=>speak(t.dataset.text,{rate:Math.max(.5,S.settings.rate-.3)}),
 flip:()=>{ls.flip=!ls.flip;const f=$(".flash");if(f)f.classList.toggle("flipped",ls.flip)},
 wrate:t=>{const u=UNITS[view.u];const v=u.vocab[ls.i];const r=W(v.w);if(t.dataset.arg==="1"){r.s=Math.max(r.s,1)}r.n++;save();ls.i++;ls.flip=false;render()},
 wprev:()=>{ls.i=Math.max(0,ls.i-1);ls.flip=false;render()},
 wrestart:()=>{ls.i=0;ls.flip=false;render()},
 gloss:t=>{ls.gloss=t.dataset.arg;render();speak(baseWord(t.dataset.arg))},
 closegloss:()=>{ls.gloss=null;render()},
 readall:()=>readAll(UNITS[view.u]),
 readslow:()=>{if(ls.playing){ls.playing=false;stopSpeech()}readAll(UNITS[view.u],Math.max(.5,S.settings.rate-.3))},
 ans:t=>{const k=t.dataset.k,i=+t.dataset.i,j=+t.dataset.j;ls[k]=ls[k]||{};if(ls[k][i]!==undefined)return;ls[k][i]=j;const y=scrollY;render();scrollTo(0,y)},
 spoke:t=>{ls.sd=ls.sd||{};const i=t.dataset.arg;if(ls.sd[i])delete ls.sd[i];else ls.sd[i]=1;const y=scrollY;render();scrollTo(0,y)},
 useframe:()=>{const ta=$("#wr");const f=UNITS[view.u].write.frame;if(!ta.value.trim()){ta.value=f}else ta.value=ta.value.trimEnd()+"\n"+f;ta.dispatchEvent(new Event("input"));ta.focus();const p=ta.value.indexOf("___");if(p>=0)ta.setSelectionRange(p,p+3)},
 addword:t=>{const ta=$("#wr");const s=ta.selectionStart??ta.value.length,e=ta.selectionEnd??ta.value.length;const w=t.dataset.arg;const pre=ta.value.slice(0,s);const ins=(pre&&!/\s$/.test(pre)?" ":"")+w+" ";ta.value=pre+ins+ta.value.slice(e);ta.dispatchEvent(new Event("input"));ta.focus();ta.setSelectionRange(s+ins.length,s+ins.length)},
 copywrite:()=>{const u=UNITS[view.u];const txt="Unit "+u.id+" — "+u.title+" ("+u.ref+")\nTask: "+u.write.prompt+"\n\n"+(($("#wr")||{}).value||"");copyText(txt,"Copied. Paste it into a message to your teacher.")},
 buildverse:()=>{ls.build=true;render()},
 vbpick:t=>{const b=ls.vb;const i=+t.dataset.arg;if(b.state==="right"||b.picked.includes(i))return;b.picked.push(i);if(vbCheck()){if(view.name==="lesson")ls.ready=true;else{endRound(ls.g,true)}}render()},
 vbun:t=>{const b=ls.vb;if(b.state==="right")return;b.picked.splice(+t.dataset.arg,1);b.state="";render()},
 vbreset:()=>{ls.vb.picked=[];ls.vb.state="";render()},
 game:t=>go({name:"game",kind:t.dataset.arg}),
 mleft:t=>{const g=ls.g;g.sel=t.dataset.arg;render();speak(baseWord(g.sel))},
 mright:t=>{const g=ls.g;if(!g.sel)return toast("Tap a word on the left first");const w=t.dataset.arg;if(w===g.sel){g.done.push(w);endRound(g,true,w);g.sel=null;if(g.done.length===g.words.length){finishGame(g);return}render()}else{scoreWord(g.sel,false);t.classList.add("shake");setTimeout(()=>t.classList.remove("shake"),450);g.sel=null;document.querySelectorAll(".mcell.sel").forEach(e=>e.classList.remove("sel"))}},
 gpick:t=>{const g=ls.g;if(g.pick!==undefined)return;g.pick=+t.dataset.arg;const v=g.items[g.round];endRound(g,g.opts[g.pick].w===v.w,v.w);render()},
 gnext:()=>gAdvance(ls.g),
 spick:t=>{const g=ls.g;const i=+t.dataset.arg;if(g.sstate||g.spicked.includes(i))return;g.spicked.push(i);if(g.spicked.length===g.letters.length){const v=g.items[g.round];const ok=g.spicked.map(k=>g.letters[k]).join("")===g.letters.join("");g.sstate=ok?"right":"wrong";endRound(g,ok,v.w);if(ok)speak(baseWord(v.w))}render()},
 sun:t=>{const g=ls.g;if(g.sstate)return;g.spicked.splice(+t.dataset.arg,1);render()},
 sskip:()=>{const g=ls.g;const v=g.items[g.round];g.spicked=g.letters.map((c,i)=>i);g.sstate="wrong";endRound(g,false,v.w);render()},
 togglevi:()=>{S.settings.vi=!S.settings.vi;save();render()},
 copycode:()=>{let code="";try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){}copyText(code,"Progress code copied. Save it in your notes.")},
 restore:()=>{const v=($("#restore")||{}).value||"";try{const d=JSON.parse(decodeURIComponent(escape(atob(v.trim()))));if(typeof d.xp!=="number")throw 0;S=Object.assign(defaults(),d);save();toast("Progress restored");render()}catch(e){toast("That code didn't work. Copy the whole code and try again.")}},
 askreset:()=>{ls.confirmReset=true;render()},
 noreset:()=>{ls.confirmReset=false;render()},
 doreset:()=>{S=defaults();save();toast("Progress reset");go({name:"home"})},
 switchstudent:()=>go({name:"onboard",from:"progress"}),
 cancelonboard:()=>go({name:"progress"}),
 pickprofile:t=>{setActive(t.dataset.arg);load();toast("Studying as "+t.dataset.arg);go({name:"home"})},
 newprofile:()=>{const inp=$("#newname");const name=((inp&&inp.value)||"").trim().slice(0,24);if(!name){toast("Type a name first");return}addProfile(name);setActive(name);load();toast("Welcome, "+name+"!");go({name:"home"})}
};
function copyText(txt,msg){const ok=()=>toast(msg);try{navigator.clipboard.writeText(txt).then(ok,()=>fallbackCopy(txt,msg))}catch(e){fallbackCopy(txt,msg)}}
function fallbackCopy(txt,msg){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?msg:"Copy isn't allowed here. Select the text and copy it by hand.")}
app.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
app.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".flash")){e.preventDefault();A.flip()}});
app.addEventListener("submit",e=>{e.preventDefault();if(e.target.dataset.form==="spell"){const g=ls.g;const v=g.items[g.round];const val=($("#spin").value||"").trim();if(!val)return;const ok=val.toLowerCase().replace(/\s+/g," ")===baseWord(v.w).toLowerCase();g.sp={val,ok};endRound(g,ok,v.w);render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ls.gloss){ls.gloss=null;render()}});

(function boot(){let a=null;try{a=localStorage.getItem(ACTIVE_KEY)}catch(e){}
 if(!a)a=migrateLegacy();
 if(a&&(!profiles().length||profiles().includes(a))){if(!profiles().length)addProfile(a);ACTIVE=a;load();render()}
 else{view={name:"onboard"};render()}
})();
})();
</script>

</body></html>
