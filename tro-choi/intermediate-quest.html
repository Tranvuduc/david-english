const PE = [
 {code:"PE1",file:"PE",title:"Reacting to what people say",topic:"Practical English 1",gram:"Reacting",v:[["You're kidding!","Đùa à! / Thật á!","You won the lottery? You're kidding!"],["How awful!","Thật kinh khủng!","You lost your passport? How awful!"],["What a shame!","Tiếc quá!","The concert was cancelled? What a shame!"],["That's great news!","Tin tuyệt quá!","You passed? That's great news!"],["How amazing!","Tuyệt vời thật!","You met the president? How amazing!"],["What a surprise!","Bất ngờ quá!","You're here? What a surprise!"],["Really?","Thật không?","— I'm moving to Canada. — Really?"],["Oh no!","Ôi không!","Oh no! I forgot my keys."]],g:[["Your friend passed the exam. You say: ___",["That's great news!","How awful!","What a shame!"],"Tin vui → That's great news!"],["Your friend broke his leg. You say: ___",["How awful!","How amazing!","You're welcome!"],"Tin xấu → How awful!"],["The party was cancelled. You say: ___",["What a shame!","What a surprise!","Congratulations!"],"Điều đáng tiếc → What a shame!"],["Your friend says she saw a famous actor. You say: ___",["You're kidding!","Never mind.","Excuse me."],"Ngạc nhiên, khó tin → You're kidding!"]]},
 {code:"PE2",file:"PE",title:"Indirect questions",topic:"Practical English 2",gram:"Polite questions",v:[["Could you tell me where…?","Bạn có thể cho tôi biết … ở đâu không?","Could you tell me where the station is?"],["Do you know if…?","Bạn có biết liệu … không?","Do you know if the museum is open?"],["Do you know what time…?","Bạn có biết mấy giờ … không?","Do you know what time the bus leaves?"],["I'd like to know…","Tôi muốn biết…","I'd like to know how much it costs."],["Can you tell me how…?","Bạn chỉ tôi cách … được không?","Can you tell me how to get there?"],["I was wondering if…","Tôi đang tự hỏi liệu…","I was wondering if you could help me."],["Do you mind if I ask…?","Bạn có phiền nếu tôi hỏi…?","Do you mind if I ask how old you are?"],["Excuse me,","Xin lỗi (để hỏi)","Excuse me, is this seat free?"]],g:[["Could you tell me where ___?",["the bank is","is the bank","does the bank"],"Câu hỏi gián tiếp: trật tự khẳng định (S + V)."],["Do you know what time ___?",["the movie starts","does the movie start","starts the movie"],"Không dùng do/does trong câu hỏi gián tiếp."],["Do you know ___ the shop is open?",["if","that","what"],"Câu hỏi Yes/No gián tiếp → if."],["Can you tell me how much ___?",["this costs","does this cost","costs this"],"S + V."]]},
 {code:"PE3",file:"PE",title:"Permission and requests",topic:"Practical English 3",gram:"Asking politely",v:[["Can I…?","Tôi có thể … không?","Can I use your phone?"],["Could you…?","Bạn có thể … được không?","Could you close the door, please?"],["Would you mind…ing?","Bạn có phiền … không?","Would you mind opening the window?"],["Do you mind if I…?","Bạn có phiền nếu tôi…?","Do you mind if I sit here?"],["Is it OK if I…?","Tôi … có được không?","Is it OK if I leave early?"],["Sure, go ahead.","Được, cứ tự nhiên.","— Can I borrow this? — Sure, go ahead."],["Not at all.","Không phiền gì cả.","— Do you mind if I open the window? — Not at all."],["I'm afraid…","Tôi e rằng… (từ chối lịch sự)","I'm afraid you can't park here."]],g:[["Would you mind ___ the window?",["closing","to close","close"],"Would you mind + V-ing."],["Do you mind if I ___ here?",["sit","sitting","to sit"],"Do you mind if I + V nguyên mẫu."],["— Do you mind if I open the window? — ___. It's hot.",["Not at all","Yes, please","Yes, I do"],"Đồng ý với Do you mind → Not at all."],["___ help me with this bag?",["Could you","Do you mind","May I"],"Nhờ người khác → Could you…?"]]},
 {code:"PE4",file:"PE",title:"Giving opinions",topic:"Practical English 4",gram:"Agreeing & disagreeing",v:[["In my opinion,","Theo ý kiến của tôi,","In my opinion, the movie was too long."],["Personally, I think…","Cá nhân tôi nghĩ…","Personally, I think it's a great idea."],["I agree.","Tôi đồng ý.","— Cities are too noisy. — I agree."],["I don't agree.","Tôi không đồng ý.","I don't agree. I love city life."],["I'm not sure about that.","Tôi không chắc về điều đó.","I'm not sure about that. It sounds risky."],["I see what you mean, but…","Tôi hiểu ý bạn, nhưng…","I see what you mean, but it's expensive."],["Exactly!","Chính xác!","— We need more buses. — Exactly!"],["What do you think?","Bạn nghĩ sao?","I like this one. What do you think?"]],g:[["___, online classes are better.",["In my opinion","In my mind","For my opinion"],"Cụm đúng: In my opinion."],["— Tea is healthier than coffee. — I ___.",["agree","am agree","agreeing"],"I agree (không có am)."],["I see what you mean, ___ it's too expensive.",["but","so","because"],"Đồng ý một phần rồi phản bác → but."],["You ask for someone's opinion: ___",["What do you think?","How do you think?","What are you think?"],"What do you think?"]]},
 {code:"PE5",file:"PE",title:"Apologizing & suggesting",topic:"Practical English 5",gram:"Social English",v:[["I'm so sorry.","Tôi rất xin lỗi.","I'm so sorry I'm late."],["It was my fault.","Đó là lỗi của tôi.","Don't blame him. It was my fault."],["Don't worry about it.","Đừng lo về chuyện đó.","— I broke your cup. — Don't worry about it."],["Never mind.","Không sao đâu.","— I forgot the tickets. — Never mind."],["Why don't we…?","Sao chúng ta không…?","Why don't we go for a walk?"],["How about…ing?","…thì sao?","How about having pizza tonight?"],["Let's…","Chúng ta hãy…","Let's take a taxi."],["That's a good idea.","Ý hay đấy.","— Let's eat out. — That's a good idea."]],g:[["How about ___ a movie?",["watching","watch","to watch"],"How about + V-ing."],["Why don't we ___ a taxi?",["take","taking","to take"],"Why don't we + V nguyên mẫu."],["— I'm sorry I broke your pen. — ___",["Don't worry about it.","You're welcome.","Nice to meet you."],"Đáp lại lời xin lỗi."],["___ go to the beach this weekend.",["Let's","Let's to","Let us to"],"Let's + V nguyên mẫu."]]}

2:{read:{t:"The man who gave it all away",x:"Five years ago, Daniel Price had everything most people dream of: a big house, two cars and a well-paid job in a bank in Chicago. He had inherited money from his grandfather, and he had invested it well. 'I could afford anything I wanted,' he says. 'But I wasn't happy. I was working seventy hours a week, and I had stopped seeing my friends.'\n\nThen, on a vacation in Guatemala, he met a teacher who was building a school with almost no money. 'I spent more on dinner that night than she earned in a month,' Daniel remembers. When he got home, he made a decision. He sold his house, gave most of his money to charity and moved into a tiny apartment.\n\nSince then, Daniel has been working part-time and volunteering for a small organization that raises money for schools. So far, it has helped to build twelve schools in three countries. His parents were furious at first, and some friends thought he had gone crazy. 'I've never been so busy or so broke,' he laughs, 'but I've never been happier either.' Daniel admits there are still things he misses — mostly his car.",

3:{read:{t:"Two cities, two ways to travel",x:"Every morning at rush hour, about six million motorbikes fill the streets of Hanoi. For many visitors, crossing the road is the most frightening part of their trip. But for Hanoians, the motorbike is simply the fastest and cheapest way to get around. 'A car would be more comfortable,' says office worker Minh, 'but it would be much slower, and parking is a nightmare.'\n\nAmsterdam is very different. The city has more bikes than people, and there are over 500 kilometers of bike lanes. Cars are not banned, but the speed limit in most of the center is only 30 kilometers per hour, and parking tickets are extremely expensive. As a result, most people think cycling is the easiest way to travel. 'I don't even have a driver's license,' says student Anouk. 'I've never needed one.'\n\nBoth cities have problems, however. Hanoi's air pollution is among the worst in Southeast Asia, and the city is building a metro system to reduce traffic. In Amsterdam, the biggest problem is bike theft: thousands of bikes are stolen every year. Some experts believe Hanoi could learn from Amsterdam, but others say the weather and the size of the city make it impossible.",

4:{read:{t:"Do we still know how to behave?",x:"A recent survey of 2,000 adults in the US asked people which modern habits they found most annoying. The top answer was people who talk loudly on their phones in public places, followed by people who check their phones during meals. 'It's not illegal, but it's incredibly rude,' said one person who took part.\n\nHowever, the survey also showed a big difference between age groups. Seventy percent of people over fifty said you should never put your phone on the table during a meal. Only thirty percent of people under twenty-five agreed. Many young people said they don't have to answer messages immediately, but they like to see them. 'If my phone isn't on the table, I feel anxious,' said one twenty-year-old.\n\nSome restaurants have started to take action. One in New York gives customers a ten percent discount if they leave their phones at the entrance. The owner says that at first people were frustrated, but now many customers love it. 'People are talking to each other again,' she said. Experts say that good manners haven't disappeared; they're just changing. 'Every generation has its own rules,' said one psychologist.",

5:{read:{t:"The marathon that changed my life",x:"Three years ago, Emma Walsh was forty kilos overweight and had never run more than a few meters. 'I used to take the car everywhere,' she says. 'I didn't use to do any exercise at all.' Then her doctor told her that she needed to get in shape. A colleague suggested that she should join a running club, and she decided to try.\n\nThe first few months were awful. 'I was always the slowest in the group, and I felt embarrassed,' she remembers. But the coach, a former athlete called Ryan, was very patient. He helped her to warm up properly and made her a training plan. Slowly, she got fitter.\n\nLast October, Emma ran her first marathon in Chicago. After twenty-five kilometers, she was in terrible pain because she had injured her knee two weeks before the race. She wanted to stop, but when she looked up, she saw that Ryan was running next to her. He had decided to follow her for the last part of the race. She finished in five hours and twelve minutes. Six months later, Ryan proposed to her at the finish line of another race. They are getting married next spring.",

6:{read:{t:"My life as a movie extra",x:"Most people have never heard of Carlos Mendes, but you have probably seen him. In the last ten years, he has appeared in more than sixty movies and TV series, from historical dramas to science fiction thrillers. Carlos is an extra: one of the people you see in the background of a scene, walking down a street or sitting in a restaurant.\n\n'People think it's glamorous, but it isn't,' he says. 'You often have to be on set at five in the morning, and then you wait for hours.' In one war movie, he was asked to lie in the mud for a whole day. 'It was freezing. I couldn't feel my toes.' Extras are paid about a hundred and fifty dollars a day, which is not a lot, and they are not allowed to speak to the stars.\n\nSo why does he do it? 'I love being part of the story,' he says. 'And sometimes funny things happen.' Once, the director noticed that Carlos was wearing a modern watch in a movie that was set in the 1920s. The scene had already been shot six times. 'They had to film it all again. Everyone was staring at me. I wanted to disappear!' Carlos is now writing a script based on his experiences.",

7:{read:{t:"Would you send your child to boarding school?",x:"When Olivia Chen was eleven, her parents sent her to a boarding school in England. 'I was terrified,' she remembers. 'I didn't know anybody, and my English wasn't very good.' The rules were strict: students weren't allowed to use their phones during the week, and they had to be in bed by nine thirty. If you broke the rules, you were punished — usually with extra homework.\n\nBut after the first semester, Olivia started to enjoy it. 'I became very independent. I learned to organize my time, and I made friends for life.' She got excellent grades and later went to college in Canada, where she got a degree in chemistry.\n\nNot everyone has such a positive experience, however. Her younger brother, Ethan, went to the same school but hated it. He was often homesick and was nearly expelled for cheating on an exam. In the end, their parents let him come home and go to a public school near their house. 'He was much happier,' says Olivia. 'I think it depends on the child's personality.' Now a parent herself, Olivia isn't sure what she will do. 'If my daughter wants to go, I'll let her. But I won't make her go.'",

8:{read:{t:"The customer isn't always right",x:"Jess Miller has worked in the customer service department of a large department store for twelve years, and she has heard every kind of complaint. 'Last week, a woman asked for a refund for a dress she had obviously worn to a wedding,' she says. 'There was cake on it! She said that it didn't fit, but she had already cut off the label.'\n\nJess says that most customers are polite, but some are rude and impatient, especially in the sales. 'One man told me that he would never shop here again because the store had run out of the TV he wanted. Then he came back the next day and bought a more expensive one.'\n\nThe store's policy is simple: if you have the receipt and the item is in perfect condition, you can get a refund within thirty days. Without a receipt, you can only exchange it. However, Jess admits that the rules are sometimes difficult for staff. 'If a customer is really angry, the manager often gives them what they want, just to avoid an argument.' After twelve years, is she thinking of changing jobs? 'Not really. I'm good at solving problems, and I enjoy dealing with people — most of the time!'",

9:{read:{t:"Can you live without your phone?",x:"Last month, journalist Tom Reed decided to try a 'digital detox'. For fourteen days, he didn't use his smartphone, laptop or tablet. 'I spend too much time online,' he admits. 'I check my phone about a hundred times a day, and I have very little time for reading or seeing friends.'\n\nThe first few days were difficult. 'I kept reaching for my phone when I was bored. And without maps, I got lost twice on the way to work.' Unfortunately, he also missed an important meeting because he hadn't written it down on paper. 'If I had checked my calendar the night before, I wouldn't have forgotten.'\n\nBut by the end of the first week, things had changed. Tom was sleeping better, and he had read three novels. He also had a lucky encounter: at a bus stop, without a phone to look at, he started talking to an old man who turned out to be a famous songwriter. 'If I'd been looking at my screen, I would never have met him. We're having coffee again next week.'\n\nNow that the experiment is over, Tom uses his phone again, but only a little. He has deleted most of his apps and turned off notifications. 'I don't think I'll ever go back,' he says.",

const BOX_DAYS = [0, 1, 3, 7, 16, 35];
function srsMark(key, correct, known){
  const now = Date.now();
  let it = S.srs[key];
  if (correct) {
    if (!it) { if (!known) return; it = {b:1}; }
    it.b = Math.min(5, it.b + (known ? 2 : 1));
    it.d = now + BOX_DAYS[it.b]*DAY;
  } else {
    it = {b:0, d:now};
  }
  S.srs[key] = it;
}

let AC = null;
function ac(){ if (!AC) { try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, dur=0.12, type='sine', vol=0.18, when=0, slide=0){
  if (!S.sound) return; const c = ac(); if (!c) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f+slide), t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.012); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.05);
}

let VOICE = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
  const pref = ['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Alex','Allison','Ava'];
  VOICE = vs.find(v => pref.some(p => v.name.includes(p))) || vs[0] || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate){
  if (!('speechSynthesis' in window)) { toast('Thiết bị này không hỗ trợ đọc to.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/___/g,'blank').replace(/[∅]/g,''));
  u.lang = 'en-US'; if (VOICE) u.voice = VOICE; u.rate = rate || S.rate;
  speechSynthesis.speak(u);
}

    P.forEach(p => { p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66); cx.restore(); });

/* ============ shared MCQ runner ============ */
// q: {html, say, options, answer, why, key}
function runMCQ(G, qs, opt, done){
  let i = 0, right = 0, hearts = opt.hearts || 0, combo = 0;
  const stat = () => G.stat((opt.hearts ? '<span class="hearts">'+Array.from({length:opt.hearts},(_,k)=>'<span class="'+(k<hearts?'':'off')+'">♥</span>').join('')+'</span>' : '')+'<span>'+right+'/'+qs.length+'</span>');
  function show(){
    stat(); G.prog(i/qs.length*100);
    if (i >= qs.length || (opt.hearts && hearts <= 0)) return done(right, qs.length, hearts);
    const q = qs[i], opts = shuffle(q.options);
    G.body.innerHTML = '<div class="card qbox"><div class="qtext">'+q.html+'</div>'+(q.say ? '<div style="margin-top:10px"><button class="say" id="qs">'+IC.speaker+' Nghe</button></div>' : '')+
      '<div class="opts">'+opts.map((o,k) => '<button class="opt" data-o="'+esc(o)+'"><span class="k">'+'ABCD'[k]+'</span><span>'+esc(o)+'</span></button>').join('')+'</div><div id="fbk"></div></div>';
    if (q.say) $('#qs').onclick = () => speak(q.say);
    G.body.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, q));
  }
  function answer(b, q){
    const ok = b.dataset.o === q.answer;
    G.body.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.o === q.answer) x.classList.add('ok'); });
    const bl = G.body.querySelector('.blank');
    if (bl) { bl.textContent = q.answer; bl.classList.add(ok ? 'fill-ok' : 'fill-bad'); }
    if (ok) { right++; combo++; SFX.ok(combo); b.classList.add('pop'); }
    else { combo = 0; hearts--; SFX.bad(); b.classList.add('bad','shake'); }
    if (q.key) srsMark(q.key, ok);
    if (opt.review) { S.reviews++; }
    save(); stat();
    $('#fbk').innerHTML = '<div class="feedback '+(ok?'ok':'bad')+'"><span>'+(ok ? (combo>=3?'Chuỗi '+combo+'! ':'')+'Chính xác!' : 'Chưa đúng. Đáp án: <b>'+esc(q.answer)+'</b>')+(q.why ? '<br><span class="why">'+esc(q.why)+'</span>' : '')+'</span></div><div class="next-row"><button class="btn primary" id="nx">Tiếp tục</button></div>';
    const nx = $('#nx'); nx.focus({preventScroll:true});
    nx.onclick = () => { i++; show(); };
    if (q.sayAfter) speak(q.sayAfter);
  }
  show();
}
const blankify = s => esc(s).replace('___', '<span class="blank">___</span>');
function gramQ(l, i){ const g = l.g[i]; return {html:blankify(g[0]), options:g[1], answer:g[1][0], why:g[2], key:'g:'+l.code+':'+i, sayAfter:g[0].includes('___') ? g[0].replace('___', g[1][0].replace('∅ / ','').replace(' / ∅','')).replace(/^'.*?' → /,'') : g[1][0]}; }
function vocabQ(l, i, dir){
  const w = l.v[i], others = pick(l.v.filter((x,k) => k !== i && x[1] !== w[1] && x[0] !== w[0]), 3);

/* ============ 1. Flashcards ============ */
function gFlash(l, G, done){
  let deck = shuffle(l.v.map((w,i) => i)), firstTry = new Set(), seen = new Set(), known = 0;
  const total = l.v.length;
  function show(){
    G.prog(known/total*100); G.stat('<span>'+known+'/'+total+'</span>');
    if (!deck.length) return done(firstTry.size/total*100, total*2+5, firstTry.size+'/'+total+' từ thuộc ngay lần đầu');
    const i = deck[0], w = l.v[i];
    G.body.innerHTML = '<div class="flip" id="fc" tabindex="0" role="button" aria-label="Lật thẻ"><div class="flip-in">'+
      '<div class="face front"><div class="eyebrow">English</div><div class="w">'+esc(w[0])+'</div><button class="say" id="s1">'+IC.speaker+' Nghe</button><div class="hint">Chạm vào thẻ để lật</div></div>'+
      '<div class="face back"><div class="w" style="font-size:24px">'+esc(w[0])+'</div><div class="vi">'+esc(w[1])+'</div><div class="ex">“'+esc(w[2])+'”</div><button class="say" id="s2">'+IC.speaker+' Nghe câu ví dụ</button></div></div></div>'+
      '<div class="row" style="justify-content:center"><button class="btn bad" id="no">Chưa thuộc</button><button class="btn ok" id="yes">Đã thuộc</button></div>'+
      '<p class="hint" style="text-align:center">“Chưa thuộc” sẽ đưa thẻ về cuối để gặp lại.</p>';
    const fc = $('#fc');
    const flip = () => { fc.classList.toggle('on'); SFX.flip(); };
    fc.onclick = e => { if (!e.target.closest('.say')) flip(); };
    fc.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } };
    $('#s1').onclick = () => speak(w[0]); $('#s2').onclick = () => speak(w[2]);
    speak(w[0]);
    $('#yes').onclick = () => { if (!seen.has(i)) firstTry.add(i); seen.add(i); srsMark('v:'+l.code+':'+i, true, !seen.has('x'+i)); known++; deck.shift(); SFX.ok(); save(); show(); };
    $('#no').onclick = () => { seen.add(i); seen.add('x'+i); srsMark('v:'+l.code+':'+i, false); deck.push(deck.shift()); SFX.bad(); save(); show(); };
  }
  show();
}

/* ============ 2. Match pairs ============ */
function gMatch(l, G, done){
  const rounds = [], ids = shuffle(l.v.map((_,i) => i));
  const nR = Math.ceil(ids.length/6), per = Math.ceil(ids.length/nR); for (let k = 0; k < ids.length; k += per) rounds.push(ids.slice(k, k+per));
  let r = 0, mistakes = 0, matched = 0, t0 = Date.now(), sel = null;
  const total = ids.length;
  const tick = setInterval(() => G.stat('<span>'+Math.floor((Date.now()-t0)/1000)+'s</span><span style="color:var(--bad)">✗ '+mistakes+'</span>'), 500); TIMERS.push(tick);
  function show(){
    G.prog(matched/total*100);
    if (r >= rounds.length){ clearInterval(tick); const secs = Math.round((Date.now()-t0)/1000); const pct = clamp(100 - mistakes*7 - Math.max(0, secs - total*5), 20, 100); return done(pct, 10 + Math.round(pct/5), 'Thời gian '+secs+' giây, '+mistakes+' lần ghép sai'); }
    const set = rounds[r], L1 = shuffle(set), R1 = shuffle(set);
    G.body.innerHTML = '<p class="hint">Chạm một từ tiếng Anh, rồi chạm nghĩa tiếng Việt tương ứng. Vòng '+(r+1)+'/'+rounds.length+'</p><div class="mgrid"><div class="mcol">'+
      L1.map(i => '<button class="tile" data-side="en" data-i="'+i+'">'+esc(l.v[i][0])+'</button>').join('')+'</div><div class="mcol">'+
      R1.map(i => '<button class="tile" data-side="vi" data-i="'+i+'">'+esc(l.v[i][1])+'</button>').join('')+'</div></div>';
    let left = set.length;
    G.body.querySelectorAll('.tile').forEach(t => t.onclick = () => {
      if (t.classList.contains('done')) return;
      if (t.dataset.side === 'en') speak(l.v[t.dataset.i][0]);
      if (!sel || sel.dataset.side === t.dataset.side){ if (sel) sel.classList.remove('sel'); sel = t; t.classList.add('sel'); SFX.click(); return; }
      const a = sel, b = t; sel = null; a.classList.remove('sel');
      if (a.dataset.i === b.dataset.i){ a.classList.add('done'); b.classList.add('done'); SFX.ok(set.length-left); matched++; left--; srsMark('v:'+l.code+':'+a.dataset.i, true); G.prog(matched/total*100); if (!left) { r++; TIMERS.push(setTimeout(show, 450)); } }
      else { mistakes++; SFX.bad(); srsMark('v:'+l.code+':'+(a.dataset.side==='en'?a.dataset.i:b.dataset.i), false); [a,b].forEach(x => { x.classList.add('bad','shake'); setTimeout(() => x.classList.remove('bad','shake'), 450); }); }
      save();
    });
  }
  show();
}

/* ============ 3. Word Rush ============ */
function gRush(l, G, done){
  const T = 60; let left = T, right = 0, answered = 0, combo = 0, best = 0, pts = 0, over = false, lastI = -1;
  const hi = S.pts[l.code+':rush']||0;
  G.body.innerHTML = '<div class="timer"><i id="tm" style="width:100%"></i></div><div class="row" style="justify-content:space-between"><span class="combo" id="cb"></span><span class="hint">Kỷ lục: '+hi+' điểm</span></div><div id="rq"></div>';
  const stat = () => G.stat('<span>'+pts+' điểm</span>');
  const tk = setInterval(() => { left -= 0.25; $('#tm').style.width = (left/T*100)+'%'; G.prog((T-left)/T*100); if (left <= 5 && Math.abs(left - Math.round(left)) < 0.01 && left > 0) SFX.tick(); if (left <= 0) end(); }, 250); TIMERS.push(tk);
  function end(){ if (over) return; over = true; clearInterval(tk); if (pts > hi) { S.pts[l.code+':rush'] = pts; save(); }
    const acc = answered ? right/answered : 0; const pct = Math.min(100, right/12*100) * (0.5 + acc/2);
    done(pct, Math.round(pts/15)+5, right+' câu đúng / '+answered+' · '+pts+' điểm'+(pts>hi?' · KỶ LỤC MỚI!':'')+' · chuỗi dài nhất '+best); }
  function q(){
    if (over) return; stat();
    let i; do { i = Math.floor(Math.random()*l.v.length); } while (i === lastI && l.v.length > 1); lastI = i;
    const dir = Math.random() < 0.5 ? 'en' : 'vi', w = l.v[i], others = pick(l.v.filter((x,k)=>k!==i && x[1]!==w[1] && x[0]!==w[0]),3);
    const ans = dir === 'en' ? w[1] : w[0];
    const opts = shuffle([ans].concat(others.map(o => dir==='en'?o[1]:o[0])));
    $('#rq').innerHTML = '<div class="card qbox"><div class="bigword">'+esc(dir==='en'?w[0]:w[1])+'</div><div class="hint" style="text-align:center">'+(dir==='en'?'Chọn nghĩa tiếng Việt':'Chọn từ tiếng Anh')+'</div><div class="opts" style="grid-template-columns:1fr 1fr">'+opts.map(o => '<button class="opt" style="justify-content:center;text-align:center" data-o="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div></div>';
    $('#rq').querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (over) return; answered++;
      if (b.dataset.o === ans){ right++; combo++; best = Math.max(best, combo); pts += 10*Math.min(combo,5); SFX.ok(combo); b.classList.add('ok'); srsMark('v:'+l.code+':'+i, true); }
      else { combo = 0; left = Math.max(0, left-3); SFX.bad(); b.classList.add('bad','shake'); srsMark('v:'+l.code+':'+i, false); toast('−3 giây! Đáp án: '+ans); }
      $('#cb').textContent = combo >= 2 ? 'Chuỗi ×'+Math.min(combo,5) : '';
      save(); TIMERS.push(setTimeout(q, b.dataset.o === ans ? 250 : 700));
    });
  }
  q();
}

/* ============ 4. Listen & Spell ============ */
function gSpell(l, G, done){
  const ids = pick(l.v.map((_,i)=>i).filter(i => /^[A-Za-z' -]+$/.test(l.v[i][0])), 8); let k = 0, score = 0;
  function show(){
    G.prog(k/ids.length*100); G.stat('<span>'+Math.round(score*10)/10+'/'+ids.length+'</span>');
    if (k >= ids.length) return done(score/ids.length*100, Math.round(score*3)+5, 'Viết đúng '+Math.round(score*10)/10+'/'+ids.length+' từ');
    const i = ids[k], w = l.v[i]; let hints = 0;
    G.body.innerHTML = '<div class="card qbox" style="text-align:center"><button class="play-big" id="pl" aria-label="Nghe từ">'+IC.play+'</button><div class="row" style="justify-content:center;margin:6px 0 12px"><button class="say" id="sl">Nghe chậm</button><button class="say" id="hn">Gợi ý chữ cái</button></div>'+
      '<div class="hint">Nghĩa: <b style="color:var(--ink)">'+esc(w[1])+'</b> · '+w[0].length+' ký tự</div><div id="hv" class="hint" style="font-size:20px;letter-spacing:3px;font-weight:700;color:var(--sky);min-height:30px;margin:8px 0"></div>'+
      '<form id="sf" autocomplete="off"><input class="field" id="si" placeholder="Gõ từ bạn nghe được…" autocapitalize="off" spellcheck="false"><div class="next-row"><button class="btn primary" type="submit">Kiểm tra</button></div></form><div id="fbk"></div></div>';
    const say = r => speak(w[0], r);
    $('#pl').onclick = () => say(); $('#sl').onclick = () => say(0.6); say();
    $('#hn').onclick = () => { hints = Math.min(w[0].length, hints+1); $('#hv').textContent = w[0].slice(0,hints) + '·'.repeat(Math.max(0,w[0].length-hints)); SFX.click(); };
    $('#si').focus({preventScroll:true});
    $('#sf').onsubmit = e => { e.preventDefault();
      const ok = norm($('#si').value) === norm(w[0]);
      const gain = ok ? (hints ? 0.5 : 1) : 0; score += gain;
      srsMark('v:'+l.code+':'+i, ok && !hints); save();
      ok ? SFX.ok() : SFX.bad();
      $('#sf').innerHTML = '<div class="feedback '+(ok?'ok':'bad')+'">'+(ok ? (hints?'Đúng (có dùng gợi ý).':'Chính xác!') : 'Chưa đúng. Từ đúng là <b>'+esc(w[0])+'</b>')+'<br><span class="why">“'+esc(w[2])+'”</span></div><div class="next-row"><button class="btn primary" type="button" id="nx">Tiếp tục</button></div>';
      if (!ok) $('#si')?.classList.add('shake');
      speak(w[2]);
      $('#nx').onclick = () => { k++; show(); }; $('#nx').focus({preventScroll:true});
    };
  }
  show();
}

/* ============ 5. Grammar hearts ============ */
function gGram(l, G, done){
  const qs = shuffle(l.g.map((_,i) => gramQ(l,i)));
  runMCQ(G, qs, {hearts:3}, (r, n, h) => done(r/n*100, r*4+5, h <= 0 ? 'Hết tim! Đúng '+r+'/'+n+' câu. Đọc lại phần Ghi nhớ nhé.' : 'Đúng '+r+'/'+n+' câu, còn '+h+' tim'));
}

/* ============ 6. Sentence builder ============ */
function gOrder(l, G, done){
  const extra = (l.v||[]).map(w => w[2]).filter(s => !/[—"“]/.test(s) && s.split(' ').length >= 4 && s.split(' ').length <= 9);
  const sents = l.u.concat(pick(extra, 2));
  let k = 0, score = 0;
  function show(){
    G.prog(k/sents.length*100); G.stat('<span>'+Math.round(score*10)/10+'/'+sents.length+'</span>');
    if (k >= sents.length) return done(score/sents.length*100, Math.round(score*4)+5, 'Xếp đúng '+Math.round(score*10)/10+'/'+sents.length+' câu');
    const target = sents[k].split(' ');
    let bank; do { bank = shuffle(target.map((w,i) => ({w,i}))); } while (target.length > 2 && bank.every((b,j) => b.w === target[j]));
    let line = [], tries = 0;
    G.body.innerHTML = '<div class="card qbox"><p class="hint" style="margin-top:0">Chạm các từ theo đúng thứ tự để tạo câu. Chạm lại từ trong khung để bỏ ra.</p><div class="answer-line" id="al"></div><div class="bank" id="bk"></div>'+
      '<div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn ghost" id="cl">Xóa hết</button><button class="btn primary" id="ck" disabled>Kiểm tra</button></div><div id="fbk"></div></div>';
    const drawn = () => {
      $('#al').innerHTML = line.map((b,j) => '<button class="wchip" data-j="'+j+'">'+esc(b.w)+'</button>').join('');
      $('#bk').innerHTML = bank.map((b,j) => '<button class="wchip '+(line.includes(b)?'used':'')+'" data-b="'+j+'">'+esc(b.w)+'</button>').join('');
      $('#ck').disabled = line.length !== target.length;
      $('#al').querySelectorAll('[data-j]').forEach(c => c.onclick = () => { line.splice(+c.dataset.j,1); SFX.click(); drawn(); });
      $('#bk').querySelectorAll('[data-b]').forEach(c => c.onclick = () => { const b = bank[+c.dataset.b]; if (!line.includes(b)) { line.push(b); SFX.click(); drawn(); } });
    };
    drawn();
    $('#cl').onclick = () => { line = []; drawn(); };
    $('#ck').onclick = () => {
      const ok = norm(line.map(b=>b.w).join(' ')) === norm(target.join(' '));
      tries++;
      if (ok){ score += tries === 1 ? 1 : 0.5; SFX.ok(); $('#al').className = 'answer-line ok pop'; speak(sents[k]); after('Chính xác!'); }
      else if (tries < 2){ SFX.bad(); $('#al').className = 'answer-line bad shake'; setTimeout(() => $('#al') && ($('#al').className = 'answer-line'), 500); toast('Chưa đúng, thử lại một lần nữa!'); }
      else { SFX.bad(); $('#al').className = 'answer-line bad'; speak(sents[k]); after('Câu đúng: <b>'+esc(sents[k])+'</b>', true); }
    };
    function after(msg, bad){
      $('#ck').disabled = true; $('#cl').disabled = true;
      $('#bk').querySelectorAll('button').forEach(b => b.disabled = true); $('#al').querySelectorAll('button').forEach(b => b.disabled = true);
      $('#fbk').innerHTML = '<div class="feedback '+(bad?'bad':'ok')+'">'+msg+'</div><div class="next-row"><button class="say" id="rp">'+IC.speaker+' Nghe lại</button>&nbsp;<button class="btn primary" id="nx">Tiếp tục</button></div>';
      $('#rp').onclick = () => speak(sents[k]);
      $('#nx').onclick = () => { k++; show(); }; $('#nx').focus({preventScroll:true});
    }
  }
  show();
}
/* ============ 7. Reading ============ */
function markVocab(text, l){
  const terms = l.v.map((w,i) => ({t:w[0].replace(/^be /,''), i})).sort((a,b) => b.t.length - a.t.length);
  const re = new RegExp('\\b(' + terms.map(x => x.t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')(s|es|ed|d|ing)?\\b', 'gi');
  return esc(text).replace(re, (m, base) => { const hit = terms.find(x => x.t.toLowerCase() === base.toLowerCase()); return hit ? '<mark data-vi="'+esc(l.v[hit.i][1])+'" data-en="'+esc(l.v[hit.i][0])+'">'+m+'</mark>' : m; });
}
function gRead(l, G, done){
  const qs = l.r.q; let answered = 0, right = 0;
  G.stat('<span>0/'+qs.length+'</span>');
  G.body.innerHTML = '<div class="card passage">'+markVocab(l.r.t, l)+'<div class="row" style="margin-top:12px"><button class="say" id="rd">'+IC.speaker+' Nghe cả bài</button><span class="hint">Chạm vào từ tô vàng để xem nghĩa</span></div></div>'+
    '<div class="sec-title" style="margin-top:18px"><h2 style="font-size:19px">Đúng (T) hay Sai (F)?</h2></div><div class="stack" id="tfs">'+
    qs.map((q,i) => '<div class="tf" id="tf'+i+'"><span>'+esc(q[0])+'</span><span class="btns"><button data-i="'+i+'" data-v="1">T</button><button data-i="'+i+'" data-v="0">F</button></span></div>').join('')+'</div>';
  $('#rd').onclick = () => speak(l.r.t);
  G.body.querySelectorAll('mark').forEach(m => m.onclick = () => { toast(m.dataset.en+' = '+m.dataset.vi); speak(m.dataset.en); });
  G.body.querySelectorAll('.tf button').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, row = $('#tf'+i); if (row.dataset.done) return; row.dataset.done = 1;
    const ok = (b.dataset.v === '1') === qs[i][1]; answered++; if (ok) right++;
    row.classList.add(ok?'ok':'bad'); ok ? SFX.ok(right) : (SFX.bad(), row.classList.add('shake'));
    row.querySelectorAll('button').forEach(x => x.disabled = true);
    row.querySelector('.btns').insertAdjacentHTML('beforeend', '<b style="align-self:center;margin-left:6px;color:'+(ok?'var(--ok)':'var(--bad)')+'">'+(qs[i][1]?'TRUE':'FALSE')+'</b>');
    G.prog(answered/qs.length*100); G.stat('<span>'+right+'/'+qs.length+'</span>');
    if (answered === qs.length) { G.body.insertAdjacentHTML('beforeend','<div class="next-row"><button class="btn primary" id="fin">Xem kết quả</button></div>'); $('#fin').onclick = () => done(right/qs.length*100, right*5+5, 'Đúng '+right+'/'+qs.length+' câu'); }
  });
}

/* ============ 8. Listening ============ */
function gListen(l, G, done){
  const qs = l.l.q; let plays = 0, answered = 0, right = 0;
  G.stat('<span>0/'+qs.length+'</span>');
  G.body.innerHTML = '<div class="card qbox" style="text-align:center"><button class="play-big" id="pl" aria-label="Phát">'+IC.play+'</button><div class="row" style="justify-content:center;margin-top:6px"><button class="say" id="sl">Nghe chậm (0.75×)</button><span class="hint" id="pc">Chưa nghe lần nào</span></div><p class="hint">Nghe đoạn hội thoại/độc thoại rồi trả lời câu hỏi. Có thể nghe lại nhiều lần.</p></div>'+
    '<div class="stack" style="margin-top:14px">'+qs.map((q,i) => { const o = shuffle(q[1]); return '<div class="card qbox" id="lq'+i+'"><div style="font-weight:700;font-size:17px">'+(i+1)+'. '+esc(q[0])+'</div><div class="opts">'+o.map((x,k) => '<button class="opt" data-i="'+i+'" data-o="'+esc(x)+'"><span class="k">'+'ABC'[k]+'</span><span>'+esc(x)+'</span></button>').join('')+'</div></div>'; }).join('')+'</div><div id="tr"></div>';
  const play = r => { plays++; $('#pc').textContent = 'Đã nghe '+plays+' lần'; speak(l.l.t, r); };
  $('#pl').onclick = () => play(); $('#sl').onclick = () => play(0.75);
  G.body.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, box = $('#lq'+i); if (box.dataset.done) return; box.dataset.done = 1;
    const ans = qs[i][1][0], ok = b.dataset.o === ans; answered++; if (ok) right++;
    box.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.o === ans) x.classList.add('ok'); });
    if (!ok) { b.classList.add('bad','shake'); SFX.bad(); } else SFX.ok(right);

    if (answered === qs.length){
      $('#tr').innerHTML = '<div class="sec-title"><h2 style="font-size:19px">Lời thoại</h2></div><div class="transcript">'+markVocab(l.l.t, l)+'</div><div class="next-row"><button class="btn primary" id="fin">Xem kết quả</button></div>';
      $('#fin').onclick = () => done(right/qs.length*100, right*5+5, 'Đúng '+right+'/'+qs.length+' câu · nghe '+plays+' lần');
    }
  });
}

/* ============ 9. Speaking ============ */
function gSpeak(l, G, done){
  const shadow = pick(l.v.map(w => w[2]).filter(s => !/[—]/.test(s)), 3).concat(pick(l.u,1));
  const steps = shadow.map(t => ({kind:'shadow', t})).concat(l.s.map(s => ({kind:'qa', q:s[0], m:s[1]})));
  let k = 0, score = 0;
  function rate(v){ score += v; SFX.ok(); k++; show(); }
  const rateHTML = '<div class="srate"><button data-r="0.3"><b>Khó</b>Cần luyện thêm</button><button data-r="0.7"><b>Tạm</b>Gần đúng</button><button data-r="1"><b>Tốt</b>Tự tin</button></div>';
  function show(){
    stopTimers(); G.prog(k/steps.length*100); G.stat('<span>'+(k+1 > steps.length ? steps.length : k+1)+'/'+steps.length+'</span>');
    if (k >= steps.length){ S.speaks++; save(); return done(score/steps.length*100, Math.round(score*5)+10, 'Tự đánh giá trung bình: '+Math.round(score/steps.length*100)+'%'); }
    const st = steps[k];
    if (st.kind === 'shadow'){
      G.body.innerHTML = '<div class="card qbox"><div class="eyebrow">Phần 1 · Nghe và nhắc lại (shadowing)</div><div class="qtext" style="margin:10px 0">'+esc(st.t)+'</div>'+
        '<div class="row"><button class="btn" id="p1">'+IC.speaker.replace('<svg','<svg width="18" height="18"')+' Nghe</button><button class="btn" id="p2">Nghe chậm</button></div>'+
        '<p class="hint">Nghe 2–3 lần, rồi đọc to theo, bắt chước ngữ điệu và trọng âm. Sau đó tự chấm:</p>'+rateHTML+'</div>';
      $('#p1').onclick = () => speak(st.t); $('#p2').onclick = () => speak(st.t, 0.7); speak(st.t);
    } else {
      let left = 30;
      G.body.innerHTML = '<div class="card qbox"><div class="eyebrow">Phần 2 · Trả lời câu hỏi</div><div class="qtext" style="margin:10px 0">'+esc(st.q)+'</div><button class="say" id="hq">'+IC.speaker+' Nghe câu hỏi</button>'+
        '<div class="countdown" id="cd">30</div><div class="row" style="justify-content:center"><button class="btn primary" id="go">Bắt đầu nói (30 giây)</button></div>'+
        '<p class="hint" style="text-align:center">Nói to ít nhất 3 câu. Mẹo: ghi âm bằng ứng dụng ghi âm của điện thoại để nghe lại.</p>'+
        '<div id="md"></div></div>';
      $('#hq').onclick = () => speak(st.q); speak(st.q);
      $('#go').onclick = () => { $('#go').disabled = true; SFX.click();
        const t = setInterval(() => { left--; $('#cd').textContent = left; if (left <= 5 && left > 0) SFX.tick(); if (left <= 0) { clearInterval(t); SFX.meh(); showModel(); } }, 1000); TIMERS.push(t);
        $('#md').innerHTML = '<div class="next-row"><button class="btn ghost" id="stop">Nói xong rồi</button></div>'; $('#stop').onclick = () => { clearInterval(t); showModel(); };
      };
      function showModel(){
        $('#md').innerHTML = '<div class="model" style="margin-top:12px"><div class="eyebrow">Câu trả lời mẫu</div><p style="margin:6px 0">'+esc(st.m)+'</p><button class="say" id="pm">'+IC.speaker+' Nghe mẫu</button></div><p class="hint">So sánh với câu trả lời của bạn và tự chấm:</p>'+rateHTML;
        $('#pm').onclick = () => speak(st.m); speak(st.m);
        bindRate();
      }
    }
    bindRate();
  }
  function bindRate(){ G.body.querySelectorAll('[data-r]').forEach(b => b.onclick = () => rate(+b.dataset.r)); }
  function stopTimers(){ TIMERS.forEach(t => clearInterval(t)); }
  show();
}

/* ============ 10. Writing ============ */
function gWrite(l, G, done){
  const w = l.w, rng = (w.p.match(/(\d+)–(\d+)/) || [0,50,80]).slice(1).map(Number), key = l.code;
  G.stat('<span id="wcs">0 từ</span>');
  G.body.innerHTML = '<div class="card qbox"><div class="eyebrow">Đề bài</div><p style="font-weight:700;font-size:17px;margin:6px 0 4px">'+esc(w.p)+'</p><p class="hint">Dùng các từ/cấu trúc gợi ý dưới đây. Chúng sẽ sáng lên khi bạn dùng đúng.</p>'+
    '<div class="checklist" id="ckl">'+w.k.map(x => '<span data-k="'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div>'+
    '<textarea class="field" id="wt" placeholder="Viết bài của bạn bằng tiếng Anh ở đây…">'+esc(S.drafts[key]||'')+'</textarea>'+
    '<div class="row" style="justify-content:space-between;margin-top:10px"><span class="wc" id="wc"></span><span class="hint">Bản nháp được tự động lưu</span></div>'+
    '<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" id="sm">Xem bài mẫu</button><button class="btn primary" id="sb">Nộp bài</button></div><div id="wf"></div></div>';
  const ta = $('#wt');
  const has = (txt, k) => new RegExp('(^|[^a-z])'+k.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z])').test(txt.toLowerCase().replace(/[’]/g,"'"));
  function upd(){
    const txt = ta.value, n = (txt.trim().match(/[A-Za-z0-9'’-]+/g)||[]).length, got = w.k.filter(k => has(txt,k)).length;
    $('#wc').innerHTML = n+' / '+rng[0]+'–'+rng[1]+' từ '+(n >= rng[0] ? '<span style="color:var(--ok)">✓</span>' : '');
    $('#wcs').textContent = n+' từ';
    G.prog(Math.min(100, (Math.min(n/rng[0],1)*50) + got/w.k.length*50));
    $('#ckl').querySelectorAll('span').forEach(s => s.classList.toggle('got', has(txt, s.dataset.k)));
    S.drafts[key] = txt; save();
    return {n, got};
  }
  ta.oninput = upd; upd();
  const model = () => { $('#wf').innerHTML = '<div class="model" style="margin-top:14px"><div class="eyebrow">Bài mẫu</div><p style="margin:6px 0;line-height:1.7">'+markVocab(w.m, l)+'</p><button class="say" id="pm">'+IC.speaker+' Nghe bài mẫu</button></div>'; $('#pm').onclick = () => speak(w.m); };
  $('#sm').onclick = model;
  $('#sb').onclick = () => {
    const {n, got} = upd();
    if (n < 15) { SFX.bad(); toast('Bài viết quá ngắn. Hãy viết ít nhất '+rng[0]+' từ.'); return; }
    const pct = Math.min(n/rng[0],1)*50 + got/w.k.length*50;
    S.writes++; save();
    const tips = [];
    if (n < rng[0]) tips.push('Viết thêm '+(rng[0]-n)+' từ nữa để đạt độ dài yêu cầu.');
    if (n > rng[1]+20) tips.push('Bài hơi dài; hãy cô đọng ý hơn.');
    const miss = w.k.filter(k => !has(ta.value,k)); if (miss.length) tips.push('Chưa dùng: '+miss.join(', ')+'.');
    if (!/[.!?]\s*$/.test(ta.value.trim())) tips.push('Nhớ kết thúc câu bằng dấu chấm.');
    if (/\bi\b/.test(ta.value)) tips.push('Chữ “I” luôn viết hoa.');
    done(pct, Math.round(pct/5)+10, (tips.length ? 'Gợi ý: '+tips.join(' ') : 'Bài viết đầy đủ yêu cầu. Hãy đọc to bài của bạn một lần!'));
  };
}

/* ============ File test ============ */
function startFileTest(f){
  stopAll(); V.game = 'test'; V.lesson = null; scrollTo(0,0);
  const ls = LESSONS.filter(l => l.file === f);
  let qs = [];
  ls.forEach(l => {
    pick(l.g.map((_,i)=>i), 3).forEach(i => qs.push(gramQ(l,i)));
    pick(l.v.map((_,i)=>i), 3).forEach(i => qs.push(vocabQ(l,i, Math.random()<.5?'en':'vi')));
  });
  qs = shuffle(qs);
  const G = frame('Kiểm tra File '+f+' · '+ls.map(l=>l.code).join(' + '), FILE_COLORS[f-1], () => { stopAll(); V.game = null; go('map'); });
  runMCQ(G, qs, {}, (r, n) => finish({key:'F'+f+':test', pct:r/n*100, xp:r*4+10, note:'Đúng '+r+'/'+n+' câu (ngữ pháp + từ vựng)', again:() => startFileTest(f)}));
}

  if (t === 'g' && l.g[+i]) return gramQ(l, +i);
  if (t === 'v' && l.v[+i]) return vocabQ(l, +i, Math.random()<.5?'en':'vi');
  return null;
}

let SAMPLE = null;
(async () => { try { if (window.claude && window.claude.use) SAMPLE = await window.claude.use('sample'); } catch(e) { SAMPLE = null; } })();

function canon(s){
  s = String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"“”]/g,' ').replace(/\s+/g,' ').trim();
  s = s.replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'cannot').replace(/\bcan not\b/g,'cannot').replace(/\bshan't\b/g,'shall not')
       .replace(/n't\b/g,' not').replace(/'ll\b/g,' will').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/\bi'm\b/g,'i am');
  return s.replace(/\s+/g,' ').trim();
}
const matchAns = (v, arr) => arr.some(a => canon(a) === canon(v));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* find the vocab term inside its example sentence */
function vocabInSentence(w){
  let term = w[0].replace(/^be /,'').replace(/\s*\(.*?\)\s*/g,' ').trim();
  if (/\//.test(term)) return null;
  const m = w[2].match(new RegExp('\\b' + reEsc(term) + '(s|es|d|ed|ing)?\\b','i'));
  if (!m) return null;
  return {form:m[0], sent:w[2].replace(m[0],'___'), exact: !m[1]};
}

function sampleFrom(lessons, getter, n){
  let pool = [];
  lessons.forEach(l => (getter(l)||[]).forEach((x,i) => pool.push({l, x, i})));
  return pick(pool, n);
}

function buildTest(id){
  const ls = id === 'E' ? LESSONS : LESSONS.filter(l => l.file === id);
  const F = id === 'E' ? 1 + Math.floor(Math.random()*10) : id;
  const items = []; let uid = 0;
  const add = (sec, part, o) => { o.id = 'q'+(uid++); o.sec = sec; o.part = part; items.push(o); return o; };
  // GRAMMAR
  sampleFrom(ls, l => TB[l.code].vf, 8).forEach(({l,x}) => add('g','A',{kind:'type', html:esc(x[0]), ans:x[1], mark:1, src:l.code}));
  sampleFrom(ls, l => l.g, 6).forEach(({l,x,i}) => add('g','B',{kind:'mc', html:esc(x[0]), opts:shuffle(x[1]), ans:[x[1][0]], why:x[2], mark:1, key:'g:'+l.code+':'+i, src:l.code}));
  sampleFrom(ls, l => TB[l.code].tr, 6).forEach(({l,x}) => add('g','C',{kind:'type', pre:esc(x[0]), html:esc(x[1]), ans:x[2], mark:1, src:l.code}));
  // VOCABULARY
  const vPool = [];
  ls.forEach(l => l.v.forEach((w,i) => { const f = vocabInSentence(w); if (f) vPool.push({l,w,i,f}); }));
  const vmc = pick(vPool, 6);
  vmc.forEach(({l,w,i,f}) => {
    const others = pick(l.v.filter((x,k) => k !== i && x[0] !== w[0] && x[1] !== w[1]), 2).map(x => x[0]);
    add('v','A',{kind:'mc', html:esc(f.sent), opts:shuffle([w[0]].concat(others)), ans:[w[0]], why:w[0]+' = '+w[1], mark:1, key:'v:'+l.code+':'+i, src:l.code});
  });
  const used = new Set(vmc.map(o => o.l.code+o.i));
  pick(vPool.filter(o => !used.has(o.l.code+o.i) && o.f.form.length >= 3), 8).forEach(({l,w,i,f}) => {
    const hint = f.form[0] + ' ' + f.form.slice(1).replace(/[A-Za-z]/g,'_ ').trim();
    add('v','B',{kind:'type', html:esc(f.sent).replace('___','___'), hint, ans:[f.form], why:w[1], mark:1, key:'v:'+l.code+':'+i, src:l.code});
  });
  let wf = sampleFrom(ls, l => TB[l.code].wf, 6);
  if (wf.length < 6) wf = wf.concat(sampleFrom(LESSONS.filter(l => !ls.includes(l)), l => TB[l.code].wf, 6 - wf.length));
  wf.forEach(({l,x}) => add('v','C',{kind:'type', html:esc(x[0]), base:x[1], ans:x[2], mark:1, src:l.code}));
  // PRONUNCIATION
  sampleFrom(ls, l => TB[l.code].st, 7).forEach(({l,x}) => add('p','A',{kind:'stress', syl:x[0].split('-'), ans:[String(x[1])], mark:1, src:l.code}));
  const sPool = id === 'E' ? Object.values(SOUNDS).flat() : SOUNDS[id];
  pick(sPool, 3).forEach(x => add('p','B',{kind:'sound', words:x[0], ans:[String(x[1])], why:x[2], mark:1}));
  // READING
  const R = FT[F].read;
  R.tf.forEach(x => add('r','A',{kind:'tf3', html:esc(x[0]), ans:[x[1]], mark:2}));
  R.mc.forEach(x => add('r','B',{kind:'mc', html:esc(x[0]), opts:shuffle(x[1]), ans:[x[1][0]], mark:2}));
  // LISTENING
  const Li = FT[F].lis;
  Li.mc.forEach(x => add('l','A',{kind:'mc', html:esc(x[0]), opts:shuffle(x[1]), ans:[x[1][0]], mark:2}));
  Li.tf.forEach(x => add('l','B',{kind:'tf', html:esc(x[0]), ans:[x[1]?'T':'F'], mark:2}));
  // WRITING
  add('w','A',{kind:'write', mark:10});
  return {id, F, items, R, Li, W:FT[F].write};
}

  if (s.k === 'w'){

/* two-voice dialogue with TTS */
function playDialogue(Li){
  if (!('speechSynthesis' in window)) { toast('Thiết bị không hỗ trợ đọc to.'); return; }
  speechSynthesis.cancel();
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const us = vs.filter(v => /^en[-_]US/i.test(v.lang));
  const vA = VOICE || us[0] || vs[0] || null;
  const vB = us.find(v => vA && v.name !== vA.name) || vs.find(v => vA && v.name !== vA.name) || vA;
  Li.lines.forEach(([who, txt]) => {
    const u = new SpeechSynthesisUtterance(txt); u.lang = 'en-US';
    const v = who === 'A' ? vA : vB; if (v) u.voice = v;
    u.pitch = who === 'A' ? (vA === vB ? 0.8 : 1) : (vA === vB ? 1.3 : 1); u.rate = 0.95;
    speechSynthesis.speak(u);
  });
}

/* ---------- writing: offline estimate + AI marking ---------- */
function autoWriting(){
  const txt = T.writing.trim(); if (!txt) return {score:0, notes:['Chưa có bài viết.']};
  const n = (txt.match(/[A-Za-z0-9'’-]+/g)||[]).length, notes = [];
  let s = 0;
  s += n >= 100 && n <= 170 ? 3 : n >= 70 ? 2 : n >= 40 ? 1 : 0;
  if (n < 100) notes.push('Bài viết ngắn ('+n+' từ). Cần 100–150 từ.');
  if (n > 170) notes.push('Bài viết hơi dài ('+n+' từ).');
  const low = ' '+txt.toLowerCase().replace(/[’]/g,"'")+' ', hasK = k => new RegExp('(^|[^a-z])'+reEsc(k.toLowerCase())+'($|[^a-z])').test(low), kHit = T.W.k.filter(hasK).length;
  s += Math.min(3, Math.round(kHit / T.W.k.length * 3));
  if (kHit < T.W.k.length) notes.push('Chưa dùng hết ngôn ngữ mục tiêu: '+T.W.k.filter(k => !hasK(k)).join(', ')+'.');
  const paras = txt.split(/\n\s*\n|\n/).filter(p => p.trim().length > 20).length;
  s += paras >= 3 ? 2 : paras === 2 ? 1 : 0;
  if (paras < 3) notes.push('Nên chia 3–4 đoạn (mở bài, thân bài, kết bài).');
  const sents = txt.split(/[.!?]+/).filter(x => x.trim()).length, capOk = !/(^|[.!?]\s+)[a-z]/.test(txt) && !/\bi\b/.test(txt);
  s += (capOk ? 1 : 0) + (sents >= 6 ? 1 : 0);
  if (!capOk) notes.push('Kiểm tra chữ hoa đầu câu và chữ “I”.');
  const cap = n < 70 ? 4 : n < 100 ? 7 : 10;
  return {score:Math.min(cap,s), notes};
}

function submitTest(){
  if (!T || T.done) return;

  const sec = {};

  T.wauto = autoWriting(); sec.w = T.wauto.score;
  const score = SECS.reduce((a,s) => a + sec[s.k], 0);
  T.result = {sec, score};
  T.items.forEach(it => { if (it.key) srsMark(it.key, isRight(it)); });
  S.tests = S.tests || [];
  S.tests.push({id:T.id, date:today(), score, sec:Object.assign({}, sec), exam:T.exam, mins:Math.round((Date.now()-T.t0)/60000)});
  T.recIndex = S.tests.length - 1;

  addXP(Math.round(score/2) + 10); checkBadges();

}

  h += '<div class="sec-title"><h2>Kỹ năng</h2><span class="muted">Điểm cao nhất trung bình trên 20 bài</span></div><div class="card skills">'+
    SKILLS.map(s => { const v = skillScore(s.id); return '<div class="skill"><span>'+s.n+'</span><span class="bar"><i style="width:'+v+'%;background:'+s.c+'"></i></span><span class="v">'+v+'%</span></div>'; }).join('')+'</div>';
  h += '<div class="sec-title"><h2>7 ngày qua</h2><span class="muted">XP mỗi ngày · mục tiêu '+S.goal+'</span></div><div class="card week"><div class="bars">'+
    week.map(d => { const v = S.days[d.k]||0; return '<div class="b '+(d.o===0?'today':'')+'"><em>'+v+'</em><i style="height:'+(v/mx*100)+'%"></i>'+(d.o===0?'Nay':dn[new Date(Date.now()+d.o*DAY).getDay()])+'</div>'; }).join('')+'</div>'+
    '<div class="row" style="margin-top:14px"><span class="muted">Mục tiêu mỗi ngày:</span>'+[30,60,100,150].map(g => '<button class="btn" style="padding:6px 12px;'+(S.goal===g?'background:var(--accent);color:#fff;border-color:transparent':'')+'" data-goal="'+g+'">'+g+' XP</button>').join('')+'</div></div>';
  h += '<div class="sec-title"><h2>Bản đồ thành thạo</h2><span class="muted">Chạm để mở bài</span></div><div class="card heat">'+
    ALL.map(l => { const p = mastery(l); const c = p === 0 ? 'var(--surface2)' : 'color-mix(in srgb, var(--jade) '+(20+p*0.8)+'%, var(--surface))'; return '<button data-open="'+l.code+'" style="background:'+c+';color:'+(p>60?'#fff':'var(--ink)')+'">'+l.code+'<small>'+p+'%</small></button>'; }).join('')+'</div>';
  h += '<div class="sec-title"><h2>Huy hiệu</h2></div><div class="badges">'+
    BADGES.map(b => '<div class="bdg '+(S.badges[b.id]?'got':'')+'"><div class="bi">'+b.ic+'</div><b>'+b.n+'</b><span>'+b.d+'</span></div>').join('')+'</div>';
  h += '<div class="sec-title"><h2>Cài đặt & sao lưu</h2></div><div class="card" style="padding:16px;display:grid;gap:14px">'+
    '<div class="row"><span style="font-weight:700;min-width:120px">Tốc độ đọc</span>'+[[0.75,'Chậm'],[0.95,'Vừa'],[1.1,'Nhanh']].map(([r,n]) => '<button class="btn" style="padding:6px 12px;'+(S.rate===r?'background:var(--sky);color:#fff;border-color:transparent':'')+'" data-rate="'+r+'">'+n+'</button>').join('')+'<button class="say" id="tv">'+IC.speaker+' Thử giọng</button></div>'+
    '<div><div style="font-weight:700">Sao lưu tiến độ</div><p class="hint" style="margin:4px 0 8px">Tiến độ được lưu trong trình duyệt này. Để chuyển sang máy khác, sao chép mã bên dưới rồi dán vào ô Khôi phục trên máy mới.</p>'+
    '<textarea class="field" id="exp" readonly style="min-height:70px;font-size:12px;font-family:ui-monospace,monospace"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="cp">Sao chép mã</button></div></div>'+
    '<div><div style="font-weight:700">Khôi phục</div><textarea class="field" id="imp" placeholder="Dán mã sao lưu vào đây…" style="min-height:60px;font-size:12px;margin-top:6px"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="im">Khôi phục tiến độ</button></div></div>'+
    '<div><button class="btn '+(confirmReset?'bad':'ghost')+'" id="rs" style="'+(confirmReset?'':'color:var(--bad)')+'">'+(confirmReset?'Chạm lần nữa để xóa hết':'Xóa toàn bộ tiến độ')+'</button></div></div>';
  m.innerHTML = h;
  bindCommon(m);
  let code = ''; try { code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch(e) {}
  $('#exp').value = code;
  $('#cp').onclick = () => { const t = $('#exp'); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Đã sao chép mã sao lưu.')).catch(() => { t.select(); toast('Hãy nhấn giữ để sao chép.'); }); };
  $('#im').onclick = () => { try { const o = JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim())))); if (typeof o.xp !== 'number') throw 0; S = Object.assign(blank(), o); save(); SFX.win(); toast('Đã khôi phục tiến độ!'); render(); } catch(e) { SFX.bad(); toast('Mã không hợp lệ. Kiểm tra lại mã đã sao chép.'); } };
  $('#rs').onclick = () => { if (!confirmReset) { confirmReset = true; SFX.bad(); render(); setTimeout(() => { confirmReset = false; }, 5000); return; } confirmReset = false; S = blank(); save(); toast('Đã xóa tiến độ.'); render(); };
  m.querySelectorAll('[data-goal]').forEach(b => b.onclick = () => { S.goal = +b.dataset.goal; save(); SFX.click(); render(); });
  m.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => { S.rate = +b.dataset.rate; save(); speak('This is how fast I will read.'); render(); });
  $('#tv').onclick = () => speak('Hello! Welcome to American English File, level three.');
}

/* ============ Help ============ */
function renderHelp(m){
  m.innerHTML = '<div class="card help">'+
  '<h3>Cách học với ứng dụng</h3><ul>'+
  '<li>Mỗi <b>File</b> có 2 bài (A, B) giống sách <i>American English File 3</i>, 3rd edition (trình độ B1). Sau mỗi 2 File có 1 bài <b>Practical English</b> (tiếng Anh giao tiếp).</li>'+
  '<li>Vào một bài và đọc phần <b>Ghi nhớ ngữ pháp</b> trước. Sau đó chơi lần lượt các trò từ trên xuống.</li>'+
  '<li>Mỗi trò cho điểm <b>%</b>. Điểm cao nhất được lưu lại. Mức thành thạo của bài là trung bình các trò: <b>40% = 1 sao</b>, <b>70% = 2 sao</b>, <b>90% = 3 sao</b>.</li>'+
  '<li>Học xong 2 bài thì làm <b>Kiểm tra File</b> (12 câu trộn từ vựng và ngữ pháp).</li></ul>'+
  '<h3>10 trò chơi</h3><ul>'+
  '<li><b>Thẻ từ vựng</b>: nghe và xem từ, chạm để lật thẻ xem nghĩa và câu ví dụ. Chọn “Đã thuộc” hoặc “Chưa thuộc”.</li>'+
  '<li><b>Ghép đôi</b>: nối từ tiếng Anh với nghĩa tiếng Việt. Càng nhanh, càng ít lỗi thì điểm càng cao.</li>'+
  '<li><b>Đua tốc độ</b>: 60 giây trả lời càng nhiều càng tốt. Trả lời đúng liên tiếp được nhân điểm đến ×5. Mỗi câu sai bị trừ 3 giây.</li>'+
  '<li><b>Nghe & viết từ</b>: nghe từ và gõ lại đúng chính tả. Có thể xem gợi ý chữ cái, nhưng chỉ được nửa điểm.</li>'+
  '<li><b>Thử thách ngữ pháp</b>: chọn đáp án đúng, có 3 trái tim. Mỗi câu có giải thích bằng tiếng Việt.</li>'+
  '<li><b>Xếp câu</b>: chạm các từ theo đúng thứ tự. Mỗi câu được thử 2 lần.</li>'+
  '<li><b>Đọc hiểu</b>: đọc bài rồi chọn T (đúng) hoặc F (sai). Chạm vào từ tô vàng để xem nghĩa.</li>'+
  '<li><b>Nghe hiểu</b>: nghe đoạn hội thoại (nghe lại bao nhiêu lần cũng được), trả lời câu hỏi rồi xem lời thoại.</li>'+
  '<li><b>Luyện nói</b>: phần 1 nghe và nhắc lại câu (shadowing), phần 2 trả lời câu hỏi trong 30 giây. So sánh với câu trả lời mẫu rồi tự chấm Khó / Tạm / Tốt.</li>'+
  '<li><b>Luyện viết</b>: viết theo đề. Các từ và cấu trúc bắt buộc sáng lên khi bạn dùng. Nộp bài để nhận nhận xét, và xem bài mẫu. Bản nháp được lưu tự động.</li></ul>'+
  '<h3>Luyện thi (Phòng thi)</h3><p>Tab <b>Luyện thi</b> có 10 đề File Test và 1 đề thi cuối khóa, theo cấu trúc bài kiểm tra của American English File: Ngữ pháp 20 · Từ vựng 20 · Phát âm 10 · Đọc 20 · Nghe 20 · Viết 10 = 100 điểm. Bạn phải <b>tự gõ đáp án</b> (chia động từ, viết lại câu, dạng từ), chọn âm tiết nhấn, tìm từ có âm khác, và đọc hiểu True/False/Doesn\'t say. Chế độ <b>Thi thật</b> có đồng hồ 75 phút, chỉ được nghe 2 lần và chấm điểm cuối bài. Chế độ <b>Luyện tập</b> cho chấm từng phần. Bài viết có thể được <b>AI chấm chi tiết</b> (điểm theo 4 tiêu chí, sửa lỗi bằng tiếng Việt).</p>'+
  '<h3>Ôn tập thông minh</h3><p>Mỗi câu sai được đưa vào hộp ôn tập. Tab <b>Ôn tập</b> cho biết hôm nay có bao nhiêu mục cần ôn. Trả lời đúng thì mục đó quay lại sau 1 → 3 → 7 → 16 ngày, đến khi bạn thuộc hẳn. Dấu chấm hồng trên thanh điều hướng là số mục đến hạn.</p>'+
  '<h3>XP, cấp độ, chuỗi ngày</h3><p>Chơi trò nào cũng được XP, đạt 100% được thưởng thêm 10 XP. Học mỗi ngày để giữ <b>chuỗi ngày</b> (▲). Bạn có thể chọn mục tiêu XP mỗi ngày ở tab Tiến độ. Có 14 huy hiệu để mở khóa.</p>'+
  '<h3>Âm thanh và giọng đọc</h3><ul><li>Bật/tắt hiệu ứng âm thanh bằng nút loa ở góc trên. Chỉnh tốc độ giọng đọc ở tab Tiến độ.</li>'+
  '<li>Giọng đọc dùng giọng Anh-Mỹ có sẵn trên thiết bị của bạn. Nếu không nghe thấy gì, hãy tắt chế độ im lặng của điện thoại.</li>'+
  '<li>Ứng dụng không dùng micro. Khi luyện nói, bạn có thể ghi âm bằng ứng dụng ghi âm của điện thoại để tự nghe lại.</li></ul>'+
  '<h3>Lưu tiến độ</h3><p>Tiến độ được lưu trong trình duyệt này. Để học trên máy khác, vào <b>Tiến độ → Sao lưu</b>, sao chép mã và dán vào ô Khôi phục trên máy kia. Chế độ ẩn danh sẽ không lưu tiến độ.</p>'+
  '<h3>Phím tắt</h3><p><span class="kbd">1</span>–<span class="kbd">4</span> chọn đáp án · <span class="kbd">Enter</span> tiếp tục · <span class="kbd">Space</span> lật thẻ.</p>'+
  '<p class="hint" style="margin-top:18px">Nội dung bài tập được biên soạn theo chủ đề và ngữ pháp của từng bài trong American English File 3 (3rd edition, Oxford University Press). Đây là tài liệu luyện tập bổ trợ, không phải sản phẩm chính thức của NXB.</p></div>';
}

/* ============ keyboard ============ */
document.addEventListener('keydown', e => {
  if (!V.game || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const opts = [...document.querySelectorAll('#gb .opt:not([disabled])')];
  if (/^[1-4]$/.test(e.key) && opts[+e.key-1]) { opts[+e.key-1].click(); e.preventDefault(); }
  else if (e.key === 'Enter') { const n = $('#nx') || $('#fin'); if (n) { n.click(); e.preventDefault(); } }
});

/* ============ boot ============ */
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => { SFX.click(); go(b.dataset.tab); });
document.addEventListener('pointerdown', () => ac(), {once:true});
if (S.lastDay && S.lastDay !== today() && S.lastDay !== dayKey(-1)) { S.streak = 0; save(); }
render();
</script>

<script>(function(){var w=document.getElementById("dhero-wrap");if(!w)return;function t(){var v=true;try{v=!!(V.tab==="map"&&!V.lesson&&!V.game)}catch(e){v=true}w.hidden=!v}t();setInterval(t,400)})();</script>
