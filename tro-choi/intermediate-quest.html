<!doctype html><html lang="vi"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><style>.de-back{margin:0;text-align:left;background:#123a6d;color:#fff;padding:0 16px}.de-back a{display:inline-flex;align-items:center;min-height:44px;color:#fff;font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-decoration:none}.de-back a:hover{color:#e8a020;text-decoration:underline}.de-back a:focus-visible{outline:3px solid #e8a020;outline-offset:2px}</style><header class="de-back"><a href="/">← David English</a></header>
<title>Intermediate Quest</title>
<meta name="description" content="Interactive B1 Intermediate English practice game — vocabulary, grammar, reading, listening, speaking and writing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg: #f7f5ef; --surface:#FFFFFF; --surface2:#F5F7FC; --ink:#16203A; --muted:#5A6684; --line:#D6DEEC;
  --accent:#FF6A2B; --accent-ink:#FFFFFF; --sky:#2C86F0; --jade:#0FA37A; --pink:#E6457A; --sun:#FFB81F; --violet:#7458F2;
  --ok:#12A36B; --ok-bg:#DDF6EA; --bad:#E5484D; --bad-bg:#FDE4E5; --warn-bg:#FFF2D6;
  --shadow:0 2px 0 rgba(22,32,58,.08), 0 8px 24px rgba(22,32,58,.06);
  --r:16px;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1424; --surface:#172038; --surface2:#1D2843; --ink:#EEF2FB; --muted:#9CA8C4; --line:#2A3759;
  --accent:#FF7F45; --sky:#5AA2FF; --jade:#2CC495; --pink:#FF6B98; --sun:#FFC94A; --violet:#9A84FF;
  --ok:#34D08B; --ok-bg:#12382A; --bad:#FF6B6F; --bad-bg:#3D1C22; --warn-bg:#3A2F12;
  --shadow:0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
}
:root:not([data-theme="light"]) .brandmark i{color:#E0AC5A}
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1424; --surface:#172038; --surface2:#1D2843; --ink:#EEF2FB; --muted:#9CA8C4; --line:#2A3759;
  --accent:#FF7F45; --sky:#5AA2FF; --jade:#2CC495; --pink:#FF6B98; --sun:#FFC94A; --violet:#9A84FF;
  --ok:#34D08B; --ok-bg:#12382A; --bad:#FF6B6F; --bad-bg:#3D1C22; --warn-bg:#3A2F12;
  --shadow:0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
}
:root[data-theme="dark"] .brandmark i{color:#E0AC5A}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px;transform:rotate(-6deg);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.brand small{font-family:var(--f-body);font-weight:600;font-size:11px;color:var(--muted);display:block;letter-spacing:.04em;text-transform:uppercase;margin-top:-4px}
.brandmark{display:inline-flex;align-items:baseline;gap:1px;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.brandmark b{color:var(--ink);font-weight:600}
.brandmark i{font-style:normal;color:#B9812C}
@media (max-width:480px){.brandmark{display:none}}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .ic{font-size:14px}
.chip.streak .ic{color:var(--accent)}
.chip.xp .ic{color:var(--sun)}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
@media (max-width:480px){.brand small{display:none}.chip.lvl{display:none}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--accent)}
.nav button[aria-current="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .badge-dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;display:grid;place-items:center}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:700;background:var(--surface2);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 62%,#000)}
.btn.primary:active{box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 62%,#000)}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent;box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.btn.bad{background:var(--bad);color:#fff;border-color:transparent;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 12px}
.sec-title h2{font-size:22px}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;padding:20px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(24px,5vw,34px);font-weight:800}
.hero p{margin:6px 0 14px;color:var(--muted);max-width:52ch}
.hero .blob{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sun) 40%,transparent),transparent 70%);pointer-events:none}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--jade) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;position:relative;z-index:1}
.ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;z-index:1;text-align:center;font-weight:800;font-family:var(--f-display);font-size:20px;line-height:1}
.ring small{display:block;font-family:var(--f-body);font-size:10px;font-weight:600;color:var(--muted);margin-top:2px}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero .ring{justify-self:start}}

/* map */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.file{padding:0;overflow:hidden;display:flex;flex-direction:column}
.file-head{padding:12px 16px;display:flex;align-items:center;gap:10px;color:#fff;background:var(--fc)}
.file-head .num{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.file-head .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.9}
.file-head .ttl{font-weight:700;font-size:14px;line-height:1.2}
.lessons{display:flex;flex-direction:column;padding:8px}
.ltile{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:12px;text-align:left}
.ltile:hover{background:var(--surface2)}
.ltile .code{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;background:color-mix(in srgb,var(--fc) 16%,var(--surface));color:var(--fc)}
.ltile .t{font-weight:700;line-height:1.25}
.ltile .s{font-size:12.5px;color:var(--muted);line-height:1.3}
.stars{display:inline-flex;gap:1px;font-size:15px;letter-spacing:-1px;color:var(--line)}
.stars .on{color:var(--sun)}
.mbar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:5px}
.mbar i{display:block;height:100%;background:var(--fc,var(--jade));border-radius:3px}
.file-foot{margin-top:auto;padding:0 12px 12px}
.file-foot .btn{width:100%;font-size:14px;padding:9px}
.pe{border:2px dashed color-mix(in srgb,var(--violet) 55%,var(--line));background:color-mix(in srgb,var(--violet) 6%,var(--surface));box-shadow:none}
.pe .file-head{background:var(--violet)}

/* lesson */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);padding:6px 0}
.lhead{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.lhead .code{width:64px;height:64px;flex:none;border-radius:18px;background:var(--fc);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px;transform:rotate(-4deg);box-shadow:0 4px 0 color-mix(in srgb,var(--fc) 60%,#000)}
.lhead h1{font-size:clamp(22px,4.5vw,30px)}
.rule{padding:14px 16px;border-left:0;background:color-mix(in srgb,var(--sun) 12%,var(--surface))}
.rule summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.rule summary::-webkit-details-marker{display:none}
.rule .body{margin-top:8px;line-height:1.65}
.rule .body i{color:var(--sky);font-style:normal;font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
.mode{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:14px;text-align:left;position:relative;transition:transform .12s}
.mode:hover{transform:translateY(-2px)}
.mode .mi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--mc);color:#fff}
.mode .mi svg{width:26px;height:26px}
.mode .n{font-weight:800;line-height:1.2}
.mode .e{font-size:12px;color:var(--muted)}
.mode .tag{position:absolute;top:10px;right:12px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mc)}
.mode .mbar{grid-column:1/-1;margin-top:0}
.mode .mbar i{background:var(--mc)}

/* game stage */
.stage{max-width:720px;margin:0 auto}
.ghead{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.gprog{flex:1;height:14px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.gprog i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),color-mix(in srgb,var(--jade) 60%,var(--sun)));border-radius:8px;transition:width .35s}
.gstat{font-weight:800;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center;white-space:nowrap}
.hearts{color:var(--bad);letter-spacing:1px}
.hearts .off{color:var(--line)}
.gtitle{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.qbox{padding:20px}
.qtext{font-size:clamp(18px,4vw,23px);font-weight:600;line-height:1.45}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center;padding:0 4px}
.blank.fill-ok{color:var(--ok);border-color:var(--ok)}
.blank.fill-bad{color:var(--bad);border-color:var(--bad)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{padding:14px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:600;text-align:left;font-size:16px;box-shadow:0 3px 0 var(--line);display:flex;gap:12px;align-items:center}
.opt .k{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);flex:none}
.opt:hover{border-color:var(--sky)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 3px 0 var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad)}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback .why{color:var(--ink);font-weight:500}
.next-row{display:flex;justify-content:flex-end;margin-top:14px}

/* flashcards */
.flip{perspective:1200px;height:280px;margin:6px 0 16px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;border:2px solid var(--line);box-shadow:var(--shadow)}
.face.front{background:var(--surface)}
.face.back{background:color-mix(in srgb,var(--sky) 10%,var(--surface));transform:rotateY(180deg)}
.face .w{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7vw,44px);line-height:1.1}
.face .vi{font-size:22px;font-weight:700;color:var(--sky)}
.face .ex{color:var(--muted);font-style:italic;max-width:40ch}
.say{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:13px}
.say svg{width:16px;height:16px}
.hint{font-size:12.5px;color:var(--muted)}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.tile{padding:14px 10px;min-height:58px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;line-height:1.25;transition:transform .15s,opacity .3s}
.tile.sel{border-color:var(--sky);box-shadow:0 3px 0 var(--sky);background:color-mix(in srgb,var(--sky) 10%,var(--surface))}
.tile.done{border-color:var(--ok);background:var(--ok-bg);opacity:.35;pointer-events:none;transform:scale(.96)}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.06)}}

/* rush */
.timer{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-bottom:10px}
.timer i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.combo{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:18px}
.bigword{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,38px);text-align:center;margin:8px 0 4px;line-height:1.15}

/* spell & writing */
.field{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px}
.field:focus{border-color:var(--sky);outline:none}
textarea.field{min-height:200px;font-size:16px;line-height:1.6;resize:vertical}
.play-big{width:92px;height:92px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--sky) 60%,#000);margin:6px auto}
.play-big svg{width:40px;height:40px}
.play-big:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.checklist{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.checklist span{padding:5px 10px;border-radius:999px;border:1.5px dashed var(--line);font-weight:600;font-size:13px;color:var(--muted)}
.checklist span.got{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.wc{font-variant-numeric:tabular-nums;font-weight:700}

/* order */
.answer-line{min-height:64px;padding:10px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface2)}
.answer-line.ok{border-color:var(--ok);background:var(--ok-bg)}
.answer-line.bad{border-color:var(--bad);background:var(--bad-bg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:50px}
.wchip{padding:9px 13px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:16px}
.wchip.used{visibility:hidden}

/* reading */
.passage{padding:18px 20px;font-size:16.5px;line-height:1.75;max-width:68ch}
.passage mark{background:color-mix(in srgb,var(--sun) 35%,transparent);color:inherit;border-radius:4px;padding:0 2px;cursor:pointer}
.tf{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.tf.ok{border-color:var(--ok);background:var(--ok-bg)}
.tf.bad{border-color:var(--bad);background:var(--bad-bg)}
.tf .btns{display:flex;gap:6px}
.tf .btns button{padding:7px 12px;border-radius:10px;border:2px solid var(--line);font-weight:800;font-size:13px;background:var(--surface)}
.transcript{padding:14px 16px;background:var(--surface2);border-radius:12px;line-height:1.7}

/* speaking */
.srate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.srate button{padding:12px 6px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.srate button b{font-size:22px;font-family:var(--f-display)}
.srate button:hover{border-color:var(--sky)}
.countdown{font-family:var(--f-display);font-weight:800;font-size:44px;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent)}
.model{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--jade) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--jade) 35%,var(--line))}

/* finish */
.finish{text-align:center;padding:28px 20px}
.bigstars{display:flex;justify-content:center;gap:8px;font-size:58px;line-height:1;margin:6px 0 10px}
.bigstars span{color:var(--line);transform:scale(.4);opacity:0;animation:starin .5s forwards}
.bigstars span.on{color:var(--sun);text-shadow:0 3px 0 color-mix(in srgb,var(--sun) 55%,#000)}
@keyframes starin{to{transform:scale(1);opacity:1}}
.finish .pct{font-family:var(--f-display);font-weight:800;font-size:48px;line-height:1}
.finish .xpgain{display:inline-block;margin:10px 0 18px;padding:6px 14px;border-radius:999px;background:var(--warn-bg);font-weight:800;color:color-mix(in srgb,var(--sun) 50%,var(--ink))}

/* progress */
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.skills{padding:16px;display:grid;gap:12px}
.skill{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-weight:600;font-size:14px}
.skill .bar{height:12px;border-radius:7px;background:var(--surface2);overflow:hidden}
.skill .bar i{display:block;height:100%;border-radius:7px}
.skill .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.week{padding:16px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px;margin-top:10px}
.bars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars .b i{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--sky);min-height:3px}
.bars .b.today i{background:var(--accent)}
.bars .b em{font-style:normal;font-weight:700;color:var(--ink)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;padding:16px}
.heat button{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:17px;border:1px solid var(--line);line-height:1.1}
.heat button small{font-family:var(--f-body);font-size:11px;font-weight:700;opacity:.85}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{padding:14px 10px;text-align:center;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.bdg .bi{width:52px;height:52px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--surface2);color:var(--muted);font-family:var(--f-display);font-weight:800}
.bdg.got .bi{background:var(--sun);color:#3a2800;box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.bdg b{display:block;font-size:13.5px}
.bdg span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.bdg:not(.got){opacity:.7}

/* help */
.help{padding:18px 20px;line-height:1.65}
.help h3{font-size:19px;margin:18px 0 6px}
.help h3:first-child{margin-top:0}
.help ul{padding-left:20px;margin:6px 0}
.help li{margin:4px 0}
.kbd{display:inline-block;padding:1px 7px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:13px}

/* toast & confetti */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.3s;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.levelup{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(10,15,30,.55);padding:16px}
.levelup .card{padding:28px;text-align:center;max-width:340px}
.levelup .lv{font-family:var(--f-display);font-weight:800;font-size:72px;color:var(--accent);line-height:1}
.danger{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* test center */
.nav-in{grid-template-columns:repeat(5,1fr)!important}
.testgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-align:left}
.tcard .tnum{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--fc);color:#fff;font-family:var(--f-display);font-weight:800;font-size:20px}
.tcard.final .tnum{background:linear-gradient(135deg,var(--accent),var(--pink))}
.tcard .tscore{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.ttable{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ttable th,.ttable td{padding:8px 10px;text-align:left;border-top:1px solid var(--line)}
.ttable th{border-top:0;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.sectabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.sectabs button{flex:none;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.sectabs button small{font-weight:600;color:var(--muted);font-size:11px}
.sectabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sectabs button.on small{color:inherit;opacity:.75}
.tsec{padding:18px 20px}
.ptitle{font-family:var(--f-body);font-size:15.5px;font-weight:700;margin:22px 0 8px;padding-top:14px;border-top:1px dashed var(--line)}
.tlist{margin:0;padding-left:26px;display:grid;gap:12px}
.titem{line-height:1.9;font-size:16px;padding-left:4px}
.titem::marker{font-weight:800;color:var(--muted)}
input.gap{font:inherit;font-weight:700;color:var(--sky);background:var(--surface2);border:0;border-bottom:2px solid var(--sky);border-radius:6px 6px 0 0;padding:2px 8px;min-width:90px;max-width:100%}
input.gap:focus{outline:none;background:color-mix(in srgb,var(--sky) 12%,var(--surface))}
input.gap.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
input.gap.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.base{letter-spacing:.06em;color:var(--violet)}
.topts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center}
.topt{padding:7px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.topt.sm{padding:5px 11px;font-weight:800;font-size:13px}
.topt.sel,.syl.sel{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 14%,var(--surface))}
.topt.right,.syl.right{border-color:var(--ok);background:var(--ok-bg)}
.topt.wrong,.syl.wrong{border-color:var(--bad);background:var(--bad-bg)}
.topt u{text-decoration-thickness:2px;text-underline-offset:3px}
.tfrow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.syls{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.syl{padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px}
.syls .dot{color:var(--muted)}
.tfb{font-size:13.5px;line-height:1.5;margin-top:2px}
.tfb.ok{color:var(--ok)} .tfb.bad{color:var(--bad)}
.lisbox{display:flex;gap:16px;align-items:center;padding:12px;border-radius:14px;background:var(--surface2);margin-top:8px}
.lisbox .play-big{width:72px;height:72px;margin:0;flex:none}
.tmodes{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tmodes .chip{white-space:normal;border-radius:12px;padding:8px 12px;font-weight:600;line-height:1.35;align-items:flex-start;max-width:100%}
.tmodes input{margin-top:3px}
</style>
