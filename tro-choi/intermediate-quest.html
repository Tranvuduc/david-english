L("1A",1,"Eating in… and out","Food & cooking","Present simple vs. continuous",{
rule:"<b>Hiện tại đơn</b>: thói quen, sự thật. <i>I usually cook at home.</i><br><b>Hiện tại tiếp diễn</b>: việc đang xảy ra lúc nói hoặc tạm thời. <i>I'm cooking now. She's eating less this month.</i><br><b>Động từ trạng thái</b> (know, like, want, need, believe, taste, smell…) thường KHÔNG dùng dạng -ing: <i>This soup tastes great.</i> (không nói <s>is tasting</s>)",
v:[["boil","luộc, đun sôi","Boil the eggs for eight minutes."],["fry","chiên, rán","My mom fries fish every Friday."],["roast","quay, nướng lò","We roast a chicken on Sundays."],["steam","hấp","Steamed rice cakes are soft and white."],["grill","nướng (trên vỉ)","He is grilling pork on the balcony."],["spicy","cay","This noodle soup is too spicy for me."],["raw","sống (chưa nấu)","Sushi is often made with raw fish."],["seafood","hải sản","Da Nang is famous for its seafood."],["homemade","tự làm tại nhà","Nothing beats homemade bread."],["takeout","đồ ăn mang đi","Let's order takeout tonight."],["frozen","đông lạnh","Frozen vegetables are quick to cook."],["recipe","công thức nấu ăn","Can you send me the recipe?"]],
g:[["I usually ___ breakfast at seven.",["have","am having","having"],"Thói quen (usually) → hiện tại đơn."],["Look! The chef ___ the fish right now.",["is grilling","grills","grill"],"Look! / right now → hiện tại tiếp diễn."],["This soup ___ delicious.",["tastes","is tasting","taste"],"taste (có vị) là động từ trạng thái → không dùng -ing."],["I ___ what you mean.",["know","am knowing","knows"],"know là động từ trạng thái."],["She ___ a cooking class this month.",["is taking","takes","take"],"Việc tạm thời (this month) → tiếp diễn."],["We ___ about the menu. Come back in a minute.",["are thinking","think","thinks"],"think = cân nhắc (hành động) → có thể dùng -ing."],["My brother ___ seafood. He's allergic.",["doesn't eat","isn't eating","don't eat"],"Sự thật lâu dài → hiện tại đơn, ngôi 3 số ít dùng doesn't."]],
u:["I don't usually eat breakfast","She is cooking dinner right now","Do you like spicy food"],
r:{t:"Minh is a student in Ho Chi Minh City. On weekdays he usually eats out because he doesn't have time to cook. He often buys a bánh mì near his university. But this month he is trying something new. He is learning to cook with his grandmother's recipes. At the moment he is practicing a simple fish soup. He says homemade food tastes better and costs less. His friends think he is crazy, but they always come when he invites them for dinner.",q:[["Minh usually cooks on weekdays.",false],["He is learning his grandmother's recipes this month.",true],["He thinks homemade food is more expensive.",false],["His friends accept his dinner invitations.",true]]},
l:{t:"Hi, I'm Sarah. I'm a chef, so I cook all day at work. When I get home, I don't want to cook again! I usually order takeout, maybe Thai or Vietnamese food. But right now I'm on a diet, so I'm eating a lot of salad and steamed vegetables. I really miss pizza!",q:[["What is Sarah's job?",["A chef","A waiter","A doctor"]],["What does she usually do at home?",["Orders takeout","Cooks pizza","Eats salad"]],["What is she eating now?",["Salad and steamed vegetables","Pizza","Fried fish"]]]},
s:[["What do you usually have for breakfast?","I usually have a bowl of pho or some bread with an egg. On weekends I sometimes skip breakfast."],["Describe a dish you can cook.","I can cook fried rice. First I fry some garlic, then I add rice, eggs and vegetables. It's quick and delicious."]],
w:{p:"Viết 50–80 từ về thói quen ăn uống của bạn và một điều bạn đang thay đổi gần đây.",k:["usually","at the moment","steamed","grilled"],m:"I usually eat breakfast at home, and I often have lunch with my colleagues. I love spicy food, especially beef noodle soup. At the moment I'm trying to eat more homemade food because it's healthier and cheaper. I'm also learning some new recipes from YouTube. This week I'm cooking vegetarian dishes every evening."}
});

L("1B",1,"Modern families","Family & personality","Future forms",{
rule:"<b>be going to</b>: kế hoạch / dự đoán có dấu hiệu. <i>Look at the clouds. It's going to rain.</i><br><b>Hiện tại tiếp diễn</b>: kế hoạch đã sắp xếp (có giờ, vé…). <i>I'm meeting my aunt at 6.</i><br><b>will / won't</b>: quyết định tức thì, lời hứa, đề nghị, dự đoán theo ý kiến. <i>I'll help you. I won't tell anyone.</i>",
v:[["stepmother","mẹ kế","My stepmother is very kind to me."],["only child","con một","As an only child, I often felt lonely."],["relatives","họ hàng","All our relatives come for Tết."],["bossy","hách dịch, thích ra lệnh","My older sister is a bit bossy."],["mature","chín chắn, trưởng thành","He is very mature for his age."],["reliable","đáng tin cậy","She is reliable; she always keeps her promises."],["selfish","ích kỷ","Don't be selfish. Share with your brother."],["stubborn","bướng bỉnh","My grandfather is too stubborn to change."],["sensible","hợp lý, biết điều","That's a sensible decision."],["spoiled","hư, được nuông chiều","The spoiled boy cried for a new toy."],["generous","hào phóng","My uncle is generous with his time."],["anxious","lo âu","She feels anxious before exams."]],
g:[["Look at those dark clouds! It ___ rain.",["is going to","will","is raining"],"Có dấu hiệu rõ ràng → be going to."],["I ___ my grandparents on Saturday. I've already bought the bus tickets.",["am visiting","will visit","visit"],"Kế hoạch đã sắp xếp → hiện tại tiếp diễn."],["The phone's ringing. — OK, I ___ get it!",["'ll","am going to","am getting"],"Quyết định ngay lúc nói → will."],["Don't worry. I ___ tell anyone your secret.",["won't","don't","am not"],"Lời hứa → will / won't."],["I think my brother ___ be a great doctor one day.",["will","is","is being"],"Dự đoán theo ý kiến (I think) → will."],["What ___ you doing this evening?",["are","will","do"],"Hỏi kế hoạch → hiện tại tiếp diễn."],["Those bags look heavy. I ___ carry one for you.",["'ll","am","'m going"],"Lời đề nghị giúp đỡ tức thì → will."]],
u:["We are having a family party on Sunday","I think she will be a good teacher","My sister is going to study abroad"],
r:{t:"Lan's family is not a typical family. Her parents divorced when she was eight, and now she lives with her father and her stepmother, Hoa. At first Lan was anxious about living with Hoa, but Hoa turned out to be generous and sensible. Next year Lan is going to study in Australia. Her father is a little worried, but Hoa says Lan is mature and reliable. The whole family is flying to Sydney with her in August.",q:[["Lan lives with her mother.",false],["Lan was worried about living with Hoa at first.",true],["Hoa thinks Lan is not responsible.",false],["The family has already planned the trip to Sydney.",true]]},
l:{t:"Tom, are you doing anything this weekend? — Yes, I'm visiting my relatives in the countryside. My cousin is getting married on Sunday. — That sounds fun! — I hope so. My aunt is really bossy, so I think it will be a long day. But I'll bring you some wedding cake!",q:[["Why is Tom visiting his relatives?",["His cousin is getting married","It's his birthday","His aunt is sick"]],["What is his aunt like?",["Bossy","Generous","Shy"]],["What does Tom promise?",["To bring some cake","To call on Sunday","To stay home"]]]},
s:[["Describe the personality of someone in your family.","My father is very reliable and a little stubborn. He always keeps his promises, but it's hard to change his mind."],["What are you doing this weekend?","This weekend I'm visiting my parents. On Sunday I'm going to cook lunch for them."]],
w:{p:"Viết 50–80 từ mô tả một người trong gia đình (tính cách) và kế hoạch của bạn với người đó trong tương lai.",k:["going to","will","generous","reliable"],m:"My older brother Nam is generous and reliable. He always helps me with my problems, but he can be a bit bossy. He is getting married next month, so our family is very busy. I'm going to make a video for his wedding. I think he will be a wonderful husband, and I'll visit him and his wife every weekend."}
});

L("2A",2,"Spending money","Money","Present perfect vs. past simple",{
rule:"<b>Hiện tại hoàn thành</b> (have/has + V3): kinh nghiệm, việc vừa xảy ra, thời gian không xác định. Hay đi với <i>ever, never, just, already, yet</i>. <i>I've never borrowed money.</i><br><b>Quá khứ đơn</b>: thời điểm xác định trong quá khứ (<i>yesterday, last week, in 2019, ago, when…?</i>). <i>I bought it last week.</i>",
v:[["borrow","mượn, vay","Can I borrow ten dollars?"],["lend","cho mượn, cho vay","I lent my brother my bike."],["owe","nợ","You still owe me fifty thousand dong."],["afford","đủ khả năng chi trả","We can't afford a new car."],["save","tiết kiệm","I'm saving for a trip to Japan."],["waste","lãng phí","Don't waste money on snacks."],["earn","kiếm được (tiền)","She earns a good salary."],["inherit","thừa kế","He inherited a house from his grandfather."],["cash","tiền mặt","Do you pay in cash or by card?"],["bill","hóa đơn","I need to pay the electricity bill."],["loan","khoản vay","They took out a loan to buy a house."],["bargain","món hời","This jacket was a real bargain."]],
g:[["I ___ my credit card. Have you seen it?",["have lost","lost","lose"],"Việc vừa xảy ra, còn ảnh hưởng hiện tại → HTHT."],["I ___ this jacket last week.",["bought","have bought","buy"],"last week (thời điểm xác định) → quá khứ đơn."],["___ money to a friend?",["Have you ever lent","Did you ever lend","Do you ever lent"],"ever (từng bao giờ) → HTHT."],["We ___ the bill yet.",["haven't paid","didn't pay","don't pay"],"yet → HTHT."],["When ___ you open your bank account?",["did","have","do"],"Câu hỏi When → quá khứ đơn."],["They ___ a lot of money in 2019.",["earned","have earned","earn"],"in 2019 → quá khứ đơn."],["She's ___ bought a new phone. Look!",["just","yet","ago"],"just (vừa mới) đặt giữa have và V3."]],
u:["Have you ever won any money","I bought this bike two years ago","She hasn't paid the bill yet"],
r:{t:"Have you ever bought something you didn't need? Most of us have. Last year a survey asked 2,000 young people about their spending. Half of them said they had wasted money on clothes they never wore. Linh, 24, told us: 'I've saved for a year to buy a laptop, but last month I spent half of it on a new phone.' Experts say the best way to save is simple: wait 48 hours before you buy anything expensive.",q:[["The survey asked 2,000 young people.",true],["Most people said they never wasted money.",false],["Linh spent part of her savings on a phone.",true],["Experts advise buying expensive things quickly.",false]]},
l:{t:"Excuse me, I bought this shirt here yesterday, but it's too small. — Have you got the receipt? — Yes, here it is. I've never had a problem in this store before. — No problem. Would you like another size or your money back? — Could I have my money back, please? I paid in cash.",q:[["When did the customer buy the shirt?",["Yesterday","Last week","Today"]],["What is the problem?",["It's too small","It's the wrong color","It's broken"]],["How did the customer pay?",["In cash","By card","By phone"]]]},
s:[["Have you ever bought something you regretted? What was it?","Yes, I have. Last year I bought an expensive watch online, but I never wear it. It was a waste of money."],["Are you good at saving money?","I'm not bad. I save a little every month, and I try not to waste money on things I don't need."]],
w:{p:"Viết 50–80 từ về một lần bạn mua sắm đáng nhớ (dùng cả HTHT và quá khứ đơn).",k:["have ever","last","bargain","afford"],m:"I have never been good at saving money, but last December I found a real bargain. I bought a second-hand guitar for only one million dong. I couldn't afford a new one, so I was very happy. I have played it almost every day since then, and I have learned ten songs. It was the best thing I have ever bought."}
});

L("2B",2,"Changing lives","Strong adjectives","Present perfect continuous, for / since",{
rule:"<b>for</b> + khoảng thời gian (<i>for three years</i>); <b>since</b> + mốc thời gian (<i>since 2015, since I was a child</i>).<br><b>HTHT tiếp diễn</b> (have/has been + V-ing): hành động kéo dài từ quá khứ đến nay, nhấn mạnh quá trình. <i>I've been learning English for six years.</i><br>Động từ trạng thái dùng HTHT thường: <i>I've known him since 2010.</i>",
v:[["exhausted","kiệt sức","I'm exhausted after the long trip."],["starving","đói lả","What's for dinner? I'm starving!"],["furious","giận dữ","Dad was furious when I broke the window."],["terrified","khiếp sợ","She is terrified of snakes."],["delighted","rất vui mừng","We were delighted with the news."],["amazed","kinh ngạc","I was amazed by the view."],["filthy","bẩn thỉu","Your shoes are filthy. Take them off!"],["freezing","lạnh cóng","It's freezing in Sa Pa in January."],["boiling","nóng như thiêu","It's boiling today. Let's go swimming."],["tiny","tí hon","They live in a tiny apartment."],["enormous","khổng lồ","The new mall is enormous."],["fascinating","cực kỳ thú vị","The documentary was fascinating."]],
g:[["I've lived here ___ 2015.",["since","for","from"],"2015 là mốc thời gian → since."],["She has been learning English ___ six years.",["for","since","during"],"six years là khoảng thời gian → for."],["I'm exhausted. I ___ all day.",["have been working","have worked","am working"],"Hành động kéo dài, kết quả là mệt → HTHT tiếp diễn."],["How long ___ you been waiting?",["have","are","did"],"How long have you been + V-ing?"],["They've known each other ___ they were children.",["since","for","ago"],"since + mệnh đề mốc thời gian."],["It ___ for three hours and the streets are flooded.",["has been raining","is raining","rains"],"Kéo dài đến hiện tại → HTHT tiếp diễn."],["I ___ this phone for five years.",["have had","have been having","am having"],"have (sở hữu) là động từ trạng thái → HTHT thường."]],
u:["How long have you been learning English","I have been waiting for an hour","We have known each other since 2010"],
r:{t:"Five years ago Tuan was an office worker in Hanoi. He was often exhausted and never had time for his family. Then he visited a small village in Ha Giang and was amazed by its beauty. He has been living there since 2021. He has opened a tiny homestay, and he has been teaching English to local children for three years. 'I earn less money,' he says, 'but I'm delighted with my new life.'",q:[["Tuan used to work in an office.",true],["He has been living in Ha Giang for ten years.",false],["He runs a large hotel.",false],["He is happy with his new life.",true]]},
l:{t:"Hi, Mai! You look exhausted. — I am! I've been painting my new apartment since eight o'clock this morning. — Wow. How long have you lived there? — Only for two weeks. It's tiny, but I love it. — Do you want some help? — Yes, please! And bring some food. I'm starving!",q:[["What has Mai been doing?",["Painting her apartment","Cooking","Moving boxes"]],["How long has she lived there?",["Two weeks","Two months","Two years"]],["What does Mai ask her friend to bring?",["Food","Paint","Chairs"]]]},
s:[["How long have you been learning English?","I've been learning English for about ten years, since I was in primary school."],["Describe a time you were exhausted.","Last month I was exhausted because I'd been working late every night to finish a project."]],
w:{p:"Viết 50–80 từ về một thay đổi lớn trong cuộc sống của bạn (dùng for/since và HTHT tiếp diễn).",k:["since","for","have been","delighted"],m:"I have been working as an English teacher since 2020. Before that, I worked in a bank for three years, and I was often exhausted and bored. Now my days are busy but fascinating. I have been teaching teenagers for two years, and I have been studying for a new certificate since January. I'm delighted with my decision."}
});

L("3A",3,"Survive the drive","Transportation","Comparatives & superlatives",{
rule:"<b>So sánh hơn</b>: tính từ ngắn + <i>-er than</i>; tính từ dài: <i>more … than</i>. <i>faster, more dangerous</i>.<br><b>So sánh nhất</b>: <i>the -est / the most …</i>. <i>the busiest street</i>.<br>Bất quy tắc: good → better → best; bad → worse → worst; far → farther.<br><b>as … as</b> (bằng), <b>not as … as</b> (không bằng). <i>The bus isn't as fast as the train.</i><br><b>the + so sánh hơn, the + so sánh hơn</b>: <i>The more you practice, the better you get.</i>",
v:[["traffic jam","tắc đường","We were stuck in a traffic jam for an hour."],["rush hour","giờ cao điểm","Avoid driving at rush hour."],["speed limit","giới hạn tốc độ","The speed limit here is 50 km/h."],["crash","va chạm, tai nạn","Nobody was hurt in the crash."],["seat belt","dây an toàn","Always fasten your seat belt."],["pedestrian","người đi bộ","Drivers must stop for pedestrians."],["motorbike","xe máy","Most people in Vietnam ride a motorbike."],["ferry","phà","We took the ferry to Cat Ba Island."],["platform","sân ga","The train leaves from platform 3."],["fine","tiền phạt","He got a fine for speeding."],["commute","việc đi làm hằng ngày","My commute takes forty minutes."],["parking lot","bãi đỗ xe","The parking lot is full."]],
g:[["The train is ___ than the bus.",["faster","more fast","fastest"],"Tính từ ngắn → -er than."],["This is the ___ road in the city.",["most dangerous","more dangerous","dangerousest"],"Tính từ dài, so sánh nhất → the most."],["My commute isn't ___ yours.",["as long as","as long than","so long than"],"not as … as."],["Traffic today is ___ than yesterday.",["worse","badder","worst"],"bad → worse → worst."],["It's the best trip I've ___ taken.",["ever","never","already"],"so sánh nhất + I've ever…"],["The more you practice, the ___ you drive.",["better","best","good"],"The + so sánh hơn, the + so sánh hơn."],["Cycling is ___ than driving.",["healthier","more healthy","healthiest"],"healthy (2 âm tiết đuôi -y) → healthier."]],
u:["Motorbikes are cheaper than cars","This is the busiest street in town","The bus is not as fast as the train"],
r:{t:"Which is the quickest way to cross Ho Chi Minh City at rush hour? We did a race. Anna took a car, Binh rode a motorbike and Chi used the metro and walked. The car was the slowest: Anna was stuck in a traffic jam for 50 minutes. Binh was faster, but he said the ride was the most stressful. Chi arrived first. 'The metro is cheaper, safer and more relaxing,' she said.",q:[["The car was the fastest.",false],["Binh thought the motorbike ride was stressful.",true],["Chi won the race.",true],["Chi thinks the metro is more expensive.",false]]},
l:{t:"Good morning, here is the traffic news. There's been a crash on the main bridge, so traffic is moving very slowly. If you're driving into the city, the ferry is a better option this morning. And remember, the speed limit near schools is now 30 kilometers per hour. Police are giving fines to drivers who ignore it.",q:[["Where was the crash?",["On the main bridge","Near a school","At the station"]],["What does the speaker suggest?",["Taking the ferry","Driving faster","Staying home"]],["What is the speed limit near schools?",["30 km/h","50 km/h","20 km/h"]]]},
s:[["What's the best way to travel in your city? Why?","I think the motorbike is the most convenient, but the metro is safer and less stressful."],["Compare two kinds of transportation.","Trains are more comfortable than buses, but buses are cheaper and they stop in more places."]],
w:{p:"Viết 50–80 từ so sánh hai hoặc ba phương tiện đi lại ở thành phố của bạn.",k:["than","the most","as","rush hour"],m:"In my city, the motorbike is the most popular way to travel. It's faster than the bus and cheaper than a taxi. However, at rush hour the roads are terrible, and riding is the most stressful part of my day. The bus isn't as quick as a motorbike, but it's safer and more relaxing. I think the new metro will be the best option."}
});

L("3B",3,"Men, women, and children","Dependent prepositions","Articles: a / an / the / no article",{
rule:"<b>a/an</b>: nhắc lần đầu, nghề nghiệp. <i>She's an engineer.</i><br><b>the</b>: đã nhắc trước, duy nhất (<i>the sun</i>), cụ thể.<br><b>Không mạo từ (∅)</b>: nói chung chung với danh từ số nhiều / không đếm được (<i>Children need sleep. I love music.</i>), bữa ăn, <i>go to school/church/work</i>.<br><b>Giới từ đi kèm</b>: good <u>at</u>, afraid <u>of</u>, interested <u>in</u>, depend <u>on</u>, apologize <u>for</u>…",
v:[["depend on","phụ thuộc vào","It depends on the weather."],["argue with","tranh cãi với","I never argue with my parents."],["apologize for","xin lỗi vì","He apologized for being late."],["good at","giỏi về","She's good at math."],["afraid of","sợ","My son is afraid of the dark."],["interested in","quan tâm đến","Are you interested in history?"],["proud of","tự hào về","We're proud of our daughter."],["worried about","lo lắng về","I'm worried about the test."],["similar to","giống với","Your bag is similar to mine."],["responsible for","chịu trách nhiệm về","Who is responsible for this mess?"],["belong to","thuộc về","This phone belongs to Lan."],["wait for","chờ đợi","I'm waiting for the bus."]],
g:[["___ children need a lot of sleep.",["∅","The","A"],"Nói chung chung, danh từ số nhiều → không mạo từ."],["I saw a man and a dog. ___ man was very tall.",["The","A","∅"],"Đã nhắc trước → the."],["She's ___ engineer.",["an","a","the"],"Nghề nghiệp; engineer bắt đầu bằng nguyên âm → an."],["We go to ___ church on Sundays.",["∅","the","a"],"go to church (mục đích chính) → không mạo từ."],["___ sun rises in the east.",["The","A","∅"],"Vật duy nhất → the."],["I'm very interested ___ history.",["in","on","at"],"interested in."],["He apologized ___ being late.",["for","about","to"],"apologize for."]],
u:["She is very good at math","The children are playing in the park","I am worried about my exam"],
r:{t:"Are men and women really so different? A study at a British university looked at how men and women talk. The researchers found that the differences were smaller than people think. Women were not more talkative than men. In fact, it depended on the situation. At work, men often talked more; with friends, women did. The researchers say children learn these habits from the adults around them.",q:[["The study was about how people talk.",true],["Women talked much more than men in every situation.",false],["Men often talked more at work.",true],["Children are born with these habits.",false]]},
l:{t:"Dad, can I go to the concert on Saturday? — It depends on your exam results. Are you worried about the exam? — Not really. I'm good at history. — OK. But who is responsible for driving you home? — Linh's mom. She's waiting for us to decide. — Fine. I'm proud of you for asking first.",q:[["What does Dad's decision depend on?",["Exam results","The weather","Money"]],["What subject is the child good at?",["History","Math","English"]],["Who will drive the child home?",["Linh's mom","Dad","A taxi driver"]]]},
s:[["What are you good at? What are you afraid of?","I'm good at cooking, but I'm afraid of heights. I never go on roller coasters."],["Do you think men and women are good at different things?","I don't think so. It depends on the person, not on whether they are a man or a woman."]],
w:{p:"Viết 50–80 từ về một người bạn tự hào (dùng đúng mạo từ và giới từ).",k:["proud of","good at","interested in","the"],m:"I'm very proud of my younger sister. She's a nurse at a hospital in Da Nang. She's good at calming people down, and patients love her. She has always been interested in medicine. The hospital is far from her home, but she never complains. She is also responsible for training new nurses. I hope I can be as kind as her."}
});
L("4A",4,"Bad manners?","Phone language","have to, must, should",{
rule:"<b>must / have to</b>: bắt buộc. <i>You must wear a seat belt.</i><br><b>mustn't</b>: cấm. <i>You mustn't use your phone in the exam.</i><br><b>don't have to</b>: không cần (không bắt buộc). <i>You don't have to come.</i><br><b>should / shouldn't</b>: lời khuyên. <i>You should call her back.</i><br>Quá khứ của must/have to → <b>had to</b>.",
v:[["text","nhắn tin","I'll text you when I arrive."],["ringtone","nhạc chuông","I love your new ringtone."],["hang up","cúp máy","Don't hang up. I'm still here."],["call back","gọi lại","Can you call me back later?"],["leave a message","để lại lời nhắn","Please leave a message after the beep."],["on silent","ở chế độ im lặng","Put your phone on silent in class."],["voicemail","hộp thư thoại","I checked my voicemail."],["charger","sạc (điện thoại)","Can I borrow your charger?"],["screen","màn hình","My phone screen is cracked."],["polite","lịch sự","It's polite to say thank you."],["rude","thô lỗ","It's rude to look at your phone at dinner."],["interrupt","ngắt lời","Sorry to interrupt, but it's urgent."]],
g:[["You ___ switch off your phone on a plane.",["must","mustn't","don't have to"],"Quy định bắt buộc → must."],["You ___ use your phone while driving. It's illegal.",["mustn't","don't have to","should"],"Cấm → mustn't."],["Tomorrow is Sunday, so I ___ get up early.",["don't have to","mustn't","have"],"Không cần thiết → don't have to."],["You look tired. You ___ go to bed earlier.",["should","must not","has to"],"Lời khuyên → should."],["Do you ___ wear a uniform at work?",["have to","must","should to"],"Câu hỏi: Do you have to…?"],["She ___ work late yesterday.",["had to","must","has to"],"Quá khứ → had to."],["You ___ answer the phone during dinner. It's rude.",["shouldn't","don't have to","haven't to"],"Lời khuyên phủ định → shouldn't."]],
u:["You should put your phone on silent","We don't have to wear a uniform","You mustn't talk during the exam"],
r:{t:"Is it rude to look at your phone during dinner? A recent survey asked 1,000 adults about phone manners. Most people said you shouldn't answer calls in a restaurant, and you mustn't film other people without asking. But opinions were divided about texting. Younger people said you don't have to put your phone away completely; older people disagreed. Everyone agreed on one thing: loud ringtones on public transportation are very annoying.",q:[["The survey asked 1,000 adults.",true],["Most people think it's OK to answer calls in a restaurant.",false],["Everybody agreed about texting at dinner.",false],["Loud ringtones on buses annoy people.",true]]},
l:{t:"Hello, you've reached Doctor Lee's office. We're closed right now. If this is an emergency, you must call 115. Otherwise, please leave a message with your name and number, and we will call you back tomorrow morning. You don't have to call again. Thank you.",q:[["Why can't they answer?",["The office is closed","The doctor is busy","The line is broken"]],["What must you do in an emergency?",["Call 115","Leave a message","Call back tomorrow"]],["When will they call back?",["Tomorrow morning","Tonight","In an hour"]]]},
s:[["What phone manners are important in your country?","In Vietnam you shouldn't talk loudly on the phone in public, and you must put it on silent in church or in class."],["What rules did you have to follow at school?","We had to wear a uniform, and we weren't allowed to use phones. We didn't have to study on Sundays."]],
w:{p:"Viết 50–80 từ: 5 quy tắc dùng điện thoại lịch sự (dùng must, mustn't, should, don't have to).",k:["must","mustn't","should","don't have to"],m:"Here are my phone rules. First, you must put your phone on silent in the movie theater. You mustn't talk loudly on the bus. You should ask before you take a photo of someone. You shouldn't text when a friend is talking to you, because it's rude. Finally, you don't have to answer every message immediately. It can wait!"}
});

L("4B",4,"Yes, I can!","-ed / -ing adjectives","can, could, be able to",{
rule:"<b>can / can't</b>: khả năng hiện tại. <b>could</b>: khả năng chung trong quá khứ. <i>I could swim when I was five.</i><br><b>be able to</b>: dùng cho các thì còn lại (<i>will be able to, have been able to, to be able to</i>) và thành công một lần cụ thể trong quá khứ (<i>we were able to find a taxi</i>).<br><b>-ed</b> = cảm xúc của người (<i>I'm bored</i>); <b>-ing</b> = tính chất gây ra cảm xúc (<i>The film is boring</i>).",
v:[["bored","chán (cảm thấy)","I'm bored. Let's go out."],["boring","nhàm chán (gây chán)","The lecture was so boring."],["embarrassed","xấu hổ (cảm thấy)","I felt embarrassed when I fell."],["embarrassing","đáng xấu hổ","That was an embarrassing mistake."],["frustrated","bực bội, nản","I get frustrated when my computer is slow."],["frustrating","gây bực bội","Waiting in line is frustrating."],["disappointed","thất vọng","We were disappointed with the hotel."],["disappointing","gây thất vọng","The results were disappointing."],["confused","bối rối","I'm confused about the homework."],["confusing","gây khó hiểu","These instructions are confusing."],["relaxed","thư giãn (cảm thấy)","I feel relaxed after yoga."],["relaxing","dễ chịu, thư giãn","A walk by the lake is relaxing."]],
g:[["I ___ swim when I was five.",["could","can","was able"],"Khả năng chung trong quá khứ → could."],["I'd love to ___ speak Japanese.",["be able to","can","could"],"Sau to cần be able to."],["I've never ___ to cook well.",["been able","could","can"],"HTHT → have been able to."],["The movie was so ___ that I fell asleep.",["boring","bored","bore"],"Tính chất của bộ phim → -ing."],["She was ___ when she forgot his name.",["embarrassed","embarrassing","embarrass"],"Cảm xúc của người → -ed."],["Luckily, we ___ find a taxi after the party.",["were able to","could","can"],"Thành công trong một tình huống cụ thể → were able to."],["Next year I ___ drive. I'll be eighteen.",["will be able to","can","could"],"Tương lai → will be able to."]],
u:["I can play the guitar quite well","She will be able to drive next year","The lesson was really confusing"],
r:{t:"Can you learn a new skill in one month? Journalist Kim tried. She couldn't draw at all, so she took an online course and practiced for 30 minutes every day. The first week was frustrating: her drawings were embarrassing. But by week three she was able to draw a simple face. 'I was amazed,' she says. 'Drawing is now the most relaxing part of my day.'",q:[["Kim could draw well before the course.",false],["She practiced every day.",true],["The first week was frustrating.",true],["After a month she still found drawing stressful.",false]]},
l:{t:"How was the cooking class? — Honestly, a bit disappointing. The teacher spoke very fast and the recipe was confusing. — Oh no. Were you able to make anything? — Yes, in the end I was able to make a cake, but it didn't look very nice. I was so embarrassed! — Well, I'm sure it tasted good.",q:[["How was the cooking class?",["Disappointing","Relaxing","Exciting"]],["What was the problem with the recipe?",["It was confusing","It was too easy","It was missing"]],["What did the speaker make?",["A cake","Bread","Soup"]]]},
s:[["What could you do when you were a child that you can't do now?","When I was a child I could do cartwheels, but now I can't. I'm not flexible anymore!"],["Describe something that was disappointing.","The last movie I saw was disappointing. The trailer was exciting, but the story was boring and confusing."]],
w:{p:"Viết 50–80 từ về một kỹ năng bạn muốn học và cảm xúc khi học (dùng be able to và tính từ -ed/-ing).",k:["be able to","could","frustrating","excited"],m:"When I was a child, I could play the piano a little, but I stopped. Now I want to be able to play again. Learning is sometimes frustrating because my fingers are slow, and I feel embarrassed when I make mistakes. But I'm excited because last week I was able to play a whole song. I hope I'll be able to play at church next year."}
});

L("5A",5,"Sports & superstitions","Sports","Narrative tenses: past simple, continuous, perfect",{
rule:"<b>Quá khứ đơn</b>: chuỗi sự việc chính. <i>He scored and the fans cheered.</i><br><b>Quá khứ tiếp diễn</b>: hành động đang diễn ra (bối cảnh) khi việc khác xen vào. <i>We were playing when it started to rain.</i><br><b>Quá khứ hoàn thành</b> (had + V3): việc xảy ra TRƯỚC một thời điểm trong quá khứ. <i>When I arrived, the match had already started.</i>",
v:[["coach","huấn luyện viên","The coach shouted at the players."],["referee","trọng tài","The referee gave him a red card."],["fans","người hâm mộ","The fans sang all through the match."],["stadium","sân vận động","My Dinh Stadium was full."],["score a goal","ghi bàn","He scored a goal in the last minute."],["beat","đánh bại","Vietnam beat Thailand 2–1."],["draw","hòa (tỉ số)","The game was a draw."],["get injured","bị chấn thương","She got injured in training."],["warm up","khởi động","Always warm up before running."],["train","tập luyện","The team trains three times a week."],["superstition","sự mê tín","Many players have a superstition before matches."],["lucky charm","bùa may mắn","He always wears his lucky charm."]],
g:[["When I arrived, the match ___.",["had already started","already started","was already starting"],"Xảy ra trước khi tôi đến → quá khứ hoàn thành."],["He ___ when he fell.",["was running","ran","had run"],"Hành động đang diễn ra thì bị xen vào → QK tiếp diễn."],["While they ___ tennis, it started to rain.",["were playing","played","had played"],"While + QK tiếp diễn."],["I felt nervous because I ___ my lucky socks.",["had forgotten","was forgetting","forget"],"Việc quên xảy ra trước → had + V3."],["The referee ___ the whistle and the game ended.",["blew","was blowing","had blown"],"Chuỗi sự việc nối tiếp → quá khứ đơn."],["Last night I ___ a great match on TV.",["watched","had watched","was watch"],"Sự việc đơn giản trong quá khứ → quá khứ đơn."],["The fans ___ loudly when the team came onto the field.",["were singing","sang already","had sing"],"Bối cảnh đang diễn ra → QK tiếp diễn."]],
u:["We were playing football when it started to rain","The game had started when we arrived","He got injured in the first half"],
r:{t:"Many athletes are superstitious. A famous tennis player always bounced the ball exactly five times before she served. One day in a final, she was losing badly. Then she realized she had bounced the ball only four times. She changed her routine, and she won the next ten points. Was it magic? Psychologists say routines help athletes feel calm and focused, so they really can improve performance.",q:[["The player bounced the ball five times before serving.",true],["She was winning easily in the final.",false],["She had bounced the ball only four times.",true],["Psychologists say routines never help.",false]]},
l:{t:"It was the last minute of the game and the score was one–one. The fans were shouting and the coach was walking up and down nervously. Then our captain got the ball. He had scored twice in the last match, so everyone believed in him. He kicked, and the ball went into the net! We won two–one.",q:[["What was the score before the last goal?",["One–one","Two–one","Zero–zero"]],["What was the coach doing?",["Walking up and down","Shouting at the referee","Sitting quietly"]],["What was the final score?",["Two–one","One–one","Three–one"]]]},
s:[["Tell me about an exciting sports event you watched.","I was watching the final with my friends when Vietnam scored in the last minute. Everyone jumped and shouted. It was amazing!"],["Do you have any superstitions?","Not really, but before exams I always wear the same shirt because I had worn it when I passed my first test."]],
w:{p:"Viết 60–90 từ kể lại một trận đấu hoặc sự kiện thể thao (dùng đủ 3 thì quá khứ).",k:["was","when","had","scored"],m:"Last year I went to a soccer game with my brother. When we arrived, the game had already started and the fans were singing loudly. It was raining and we were freezing. In the second half our best player got injured and the coach looked worried. Then, while everyone was complaining, a young player scored an amazing goal. We won one–nil!"}
});

L("5B",5,"Relationships","Relationships","usually and used to",{
rule:"<b>used to + V</b>: thói quen / trạng thái trong quá khứ, nay không còn. <i>I used to live in Hue.</i><br>Phủ định/câu hỏi: <b>didn't use to</b>, <b>Did you use to…?</b> (không có -d).<br><b>usually + hiện tại đơn</b>: thói quen hiện tại. <i>I usually go to bed early.</i>",
v:[["get on well with","hợp với, hòa thuận với","I get on well with my boss."],["fall in love","phải lòng","They fell in love at university."],["go out with","hẹn hò với","She's going out with a musician."],["break up","chia tay","They broke up after two years."],["get married","kết hôn","We got married in 2020."],["get engaged","đính hôn","They got engaged last Christmas."],["propose","cầu hôn","He proposed on the beach."],["colleague","đồng nghiệp","My colleagues are very friendly."],["classmate","bạn cùng lớp","We were classmates in high school."],["close friend","bạn thân","She's my closest friend."],["ex","người yêu cũ","I saw my ex at the supermarket."],["argue","cãi nhau","They argue about money."]],
g:[["I ___ live in Hue, but now I live in Hanoi.",["used to","use to","usually"],"Thói quen/trạng thái quá khứ → used to."],["Did you ___ have long hair?",["use to","used to","using to"],"Câu hỏi với did → use to."],["She ___ walks to work.",["usually","used to","use"],"Thói quen hiện tại → usually + HTĐ."],["We didn't ___ get on well.",["use to","used to","usually"],"Phủ định với didn't → use to."],["My parents ___ argue a lot, but now they're happy.",["used to","are used","usually"],"Trước đây, nay không còn → used to."],["Nowadays I ___ go to bed early.",["usually","used to","use to"],"Nowadays → hiện tại → usually."],["They ___ be classmates, but now they're colleagues.",["used to","usually","use to"],"used to + be cho trạng thái quá khứ."]],
u:["I used to play the piano","They usually meet on Fridays","Did you use to have a best friend"],
r:{t:"Minh and Thu met at a highway gas station. They were both waiting for a bus that never came, so they started talking. They used to live in the same city, but they had never met. They didn't use to like each other at first: Minh thought Thu was bossy, and Thu thought Minh was too quiet. But they kept in touch, fell in love, and got married three years later. Now they usually visit the gas station on their anniversary.",q:[["Minh and Thu met at a gas station.",true],["They had met many times before.",false],["They liked each other immediately.",false],["They usually go back there on their anniversary.",true]]},
l:{t:"Grandma, how did you meet Grandpa? — We were classmates. He used to sit behind me and pull my hair! I didn't use to like him at all. — Really? So what happened? — Years later we met again at a wedding. He was much more polite. He proposed six months later.",q:[["How did Grandma and Grandpa know each other?",["They were classmates","They were colleagues","They were neighbors"]],["What did Grandpa use to do?",["Pull her hair","Sing to her","Write letters"]],["Where did they meet again?",["At a wedding","At school","At a party"]]]},
s:[["What did you use to do as a child that you don't do now?","I used to play in the rice fields with my cousins every afternoon. Now I usually work at a computer all day."],["How do you usually spend time with friends?","We usually meet at a coffee shop on Saturday and talk for hours."]],
w:{p:"Viết 50–80 từ so sánh cuộc sống trước đây và bây giờ của bạn (dùng used to / didn't use to / usually).",k:["used to","didn't use to","usually","now"],m:"When I was a teenager, I used to be very shy. I didn't use to talk much in class, and I used to spend hours playing video games. I didn't use to have many close friends. Now things are different. I usually meet my friends twice a week, and I'm much more confident. I also get on well with my colleagues at work."}
});
L("6A",6,"Behind the scenes","Movies","The passive (all tenses)",{
rule:"<b>Bị động</b> = <b>be</b> (chia theo thì) + <b>V3</b>. Dùng khi người làm không quan trọng/không rõ, hoặc muốn nhấn mạnh đối tượng. Thêm <i>by</i> nếu cần nói ai làm.<br><i>is made</i> (HTĐ) · <i>was shot</i> (QKĐ) · <i>is being built</i> (HTTD) · <i>has been translated</i> (HTHT) · <i>will be announced</i> (TL)",
v:[["director","đạo diễn","The director won an Oscar."],["cast","dàn diễn viên","The cast was amazing."],["plot","cốt truyện","The plot was hard to follow."],["scene","cảnh (phim)","The final scene made me cry."],["soundtrack","nhạc phim","I love the soundtrack."],["subtitles","phụ đề","I watch English films with subtitles."],["sequel","phần tiếp theo","The sequel is coming out next year."],["special effects","kỹ xảo","The special effects were incredible."],["be set in","lấy bối cảnh ở","The film is set in Hoi An."],["review","bài phê bình","The film got great reviews."],["audience","khán giả","The audience clapped for ten minutes."],["shoot","quay (phim)","They shot the film in Quang Binh."]],
g:[["The movie ___ in Vietnam last year.",["was shot","shot","is shot"],"Quá khứ bị động → was + V3."],["The movie ___ by millions of people every year.",["is watched","watches","was watching"],"Hiện tại bị động → is + V3."],["A new movie theater ___ in our town now.",["is being built","is building","built"],"Đang được xây → is being + V3."],["The winner ___ tomorrow.",["will be announced","will announce","is announce"],"Tương lai bị động → will be + V3."],["This movie has ___ into 30 languages.",["been translated","translated","being translated"],"HTHT bị động → has been + V3."],["Titanic ___ by James Cameron.",["was directed","directed","is directing"],"Bị động quá khứ + by."],["Phones must ___ off during the movie.",["be switched","switch","switched"],"Bị động với động từ khuyết thiếu → must be + V3."]],
u:["The movie was filmed in Ha Long Bay","The actors are being interviewed now","The soundtrack was written by a famous composer"],
r:{t:"Kong: Skull Island was released in 2017. Many of its scenes were shot in Vietnam, in places like Ha Long Bay, Ninh Binh and Quang Binh. After the movie was shown around the world, these places were visited by thousands of new tourists. A large model of Kong's village has been built in Ninh Binh, and it is still being used for photos today.",q:[["The movie was released in 2017.",true],["All the scenes were shot in the USA.",false],["More tourists visited the locations after the movie.",true],["The model village is no longer used.",false]]},
l:{t:"Welcome to the studio tour. This studio was built in 1960, and more than 300 movies have been made here. Right now, a new series is being filmed in Building C, so please be quiet. Photos may be taken in the museum, but not inside the studios. The tour will be finished at 4 p.m.",q:[["When was the studio built?",["1960","1906","2016"]],["What is happening in Building C?",["A series is being filmed","A museum is being built","A party is being held"]],["Where can photos be taken?",["In the museum","Inside the studios","Everywhere"]]]},
s:[["Tell me about a movie you like. Where was it set? Who was it directed by?","My favorite movie is Spirited Away. It was directed by Miyazaki and it's set in a magical bathhouse."],["Do you prefer watching movies with or without subtitles?","I prefer subtitles in English, because I can learn new words while I watch."]],
w:{p:"Viết 60–90 từ giới thiệu một bộ phim (dùng ít nhất 3 câu bị động).",k:["was directed","was set","is","plot"],m:"My favorite movie is Parasite. It was directed by Bong Joon-ho and it was released in 2019. The movie is set in Seoul, and it is about a poor family and a rich family. The plot is clever and surprising. The movie was praised by critics all over the world, and it was given four Oscars. It has been watched by millions of people."}
});

L("6B",6,"Every picture tells a story","The body","Modals of deduction: might, can't, must",{
rule:"Đoán dựa trên dấu hiệu:<br><b>must</b>: chắc chắn đúng (~90%). <i>She's wearing a uniform. She must be a nurse.</i><br><b>might / may / could</b>: có thể (~50%). <i>He might be at home.</i><br><b>can't</b>: chắc chắn không. <i>That can't be true!</i><br>⚠ Không dùng <s>mustn't</s> để đoán.",
v:[["eyebrow","lông mày","He raised his eyebrows in surprise."],["forehead","trán","She touched my forehead. I had a fever."],["chin","cằm","He has a beard on his chin."],["cheek","má","The baby has round cheeks."],["shoulder","vai","My shoulder hurts."],["elbow","khuỷu tay","Don't put your elbows on the table."],["knee","đầu gối","I hurt my knee playing football."],["wrist","cổ tay","She wears a watch on her left wrist."],["stomach","bụng, dạ dày","I have a stomachache."],["toe","ngón chân","I dropped a book on my toe."],["bite","cắn","Don't bite your nails."],["nod","gật đầu","She nodded and smiled."]],
g:[["She's wearing a uniform. She ___ be a nurse.",["must","can't","mightn't"],"Dấu hiệu rõ → must."],["He ___ be at home. I just saw him at the office.",["can't","must","might"],"Chắc chắn không → can't."],["I'm not sure. It ___ be his sister.",["might","must","can't"],"Không chắc → might."],["They've been running for an hour. They ___ be tired.",["must","can't","couldn't"],"Hợp lý chắc chắn → must."],["That ___ be true! It's impossible.",["can't","mustn't","must"],"Không thể đúng → can't (không dùng mustn't)."],["Where's Lan? — She ___ be in the library. I'm not sure.",["could","must","can't"],"Có thể → could."],["He's yawning and rubbing his eyes. He ___ be sleepy.",["must","can't","might not"],"Dấu hiệu rõ → must."]],
u:["He must be the new teacher","She might be at the gym","That can't be his real name"],
r:{t:"Look at the photo. A man is sitting alone at an airport. His shoulders are down and he is holding his forehead. He might be tired, or he could be worried about something. There is a big suitcase next to him, so he must be traveling far. He's wearing a thick coat, so he can't be going somewhere hot. Maybe his flight has been cancelled.",q:[["The man is sitting with friends.",false],["The writer thinks he might be worried.",true],["He is probably traveling somewhere hot.",false],["The writer guesses his flight was cancelled.",true]]},
l:{t:"Whose bag is this? — It must be Anna's. It's pink and she loves pink. — It can't be Anna's. She took her bag home an hour ago. — Well, it might be the new student's. I saw her with a pink bag this morning. — Let's give it to the teacher.",q:[["Why does the first person think it's Anna's bag?",["It's pink","It has her name","It's big"]],["Why can't it be Anna's?",["She took her bag home","She doesn't like pink","She's absent"]],["What do they decide to do?",["Give it to the teacher","Open it","Leave it"]]]},
s:[["Look around you. Guess something about a person you can see.","The man over there is wearing a suit, so he must work in an office. He might be waiting for a meeting."],["Describe a part of your body you have hurt.","Once I hurt my knee playing soccer. It was swollen and I couldn't walk for a week."]],
w:{p:"Viết 50–80 từ mô tả một bức ảnh/người lạ và đoán về họ (dùng must, might, can't).",k:["must","might","can't","could"],m:"In the photo there is an old woman at a market. She has a big smile and deep lines on her forehead. She must be a farmer, because she is selling fresh vegetables. She might be tired, but she looks happy. She can't be rich, because her clothes are old. She could be someone's grandmother who works hard for her family."}
});

L("7A",7,"School and education","Education","First conditional & future time clauses",{
rule:"<b>Câu điều kiện loại 1</b>: <i>If</i> + hiện tại đơn, <i>will</i> + V. Tình huống có thể xảy ra. <i>If you study, you'll pass.</i><br><b>unless</b> = if … not. <i>Unless you hurry, you'll be late.</i><br><b>Mệnh đề thời gian tương lai</b>: sau <i>when, as soon as, until, before, after</i> dùng <b>hiện tại đơn</b>, không dùng will. <i>I'll call you when I get home.</i>",
v:[["primary school","trường tiểu học","My son started primary school this year."],["secondary school","trường trung học","I went to secondary school in Hue."],["university","trường đại học","She's studying law at university."],["boarding school","trường nội trú","He goes to a boarding school."],["term","học kỳ","The new term starts in September."],["subject","môn học","What's your favorite subject?"],["homework","bài tập về nhà","We have too much homework."],["fail an exam","trượt kỳ thi","He failed his driving exam."],["pass","đỗ, vượt qua","I passed all my exams!"],["cheat","gian lận","Don't cheat on the test."],["strict","nghiêm khắc","Our teacher is strict but fair."],["graduate","tốt nghiệp","She graduated in 2022."]],
g:[["If you study hard, you ___ the exam.",["will pass","pass","would pass"],"Loại 1 → will + V ở mệnh đề chính."],["I'll call you when I ___ home.",["get","will get","got"],"Sau when (tương lai) → hiện tại đơn."],["Unless you hurry, you ___ late.",["will be","are","would be"],"unless = if not; loại 1."],["She won't go to college unless she ___ a scholarship.",["gets","will get","doesn't get"],"unless + khẳng định."],["As soon as the class ___, we'll have lunch.",["finishes","will finish","finish"],"as soon as + hiện tại đơn."],["If it ___ tomorrow, the school trip will be cancelled.",["rains","will rain","rained"],"If + hiện tại đơn."],["We won't start ___ everyone arrives.",["until","if","unless"],"until = cho đến khi."]],
u:["If you study you will pass","I will call you when I finish","We won't start until everyone arrives"],
r:{t:"In a small school in Kenya, the principal had an unusual idea to stop students missing classes. Here is how it works: if a student comes every day, the school will give their family a bag of rice. Attendance has gone up by 40 percent. 'When children are in class, they will learn,' the principal says. 'Unless they come, we can't help them.'",q:[["The school is in Kenya.",true],["Students get money for coming every day.",false],["Attendance has increased.",true],["The principal thinks attendance isn't important.",false]]},
l:{t:"Mom, can I go to the party on Friday? — Only if you finish your homework first. — I'll finish it as soon as I get home on Thursday. I promise. — And if your test results are bad, you won't go to any parties until the end of the semester. — Deal!",q:[["What must the child do first?",["Finish homework","Clean the room","Call Mom"]],["When will the child do it?",["On Thursday","On Friday","On Saturday"]],["What will happen if the test results are bad?",["No parties until the end of the semester","No phone for a week","Extra classes"]]]},
s:[["What will you do if you have free time this weekend?","If I have free time, I'll go to the countryside and visit my grandparents."],["What was your favorite subject at school? Why?","My favorite subject was literature because the teacher told amazing stories."]],
w:{p:"Viết 50–80 từ về kế hoạch học tập của bạn (dùng if, unless, when, as soon as).",k:["if","unless","when","as soon as"],m:"I want to get an IELTS score of 7.0 next year. If I practice every day, I'll improve my listening. Unless I read more, my vocabulary won't grow, so I'm going to read one article every morning. When I finish this course, I'll take a practice test. As soon as I get my results, I'll apply for a scholarship."}
});

L("7B",7,"Ideal home","Houses","Second conditional",{
rule:"<b>Câu điều kiện loại 2</b>: <i>If</i> + quá khứ đơn, <i>would/could</i> + V. Tình huống không có thật hoặc khó xảy ra ở hiện tại/tương lai.<br><i>If I had a garden, I'd grow vegetables.</i><br>Với be dùng <b>were</b> cho mọi ngôi: <i>If I were you, I'd…</i> (lời khuyên).<br>So sánh: loại 1 = có thể thật; loại 2 = tưởng tượng.",
v:[["detached house","nhà biệt lập","They live in a detached house."],["apartment","căn hộ","Our apartment is on the tenth floor."],["balcony","ban công","We have breakfast on the balcony."],["basement","tầng hầm","The washing machine is in the basement."],["attic","gác mái","Old toys are stored in the attic."],["garage","nhà để xe","Park the car in the garage."],["fireplace","lò sưởi","We sat by the fireplace."],["neighborhood","khu phố, hàng xóm","It's a quiet neighborhood."],["cozy","ấm cúng","What a cozy living room!"],["spacious","rộng rãi","The kitchen is bright and spacious."],["rent","thuê (nhà)","We rent a small apartment."],["move","chuyển nhà","We're moving next month."]],
g:[["If I ___ rich, I'd buy a house by the sea.",["were","am","will be"],"Loại 2 → were cho mọi ngôi."],["What ___ you do if you won the lottery?",["would","will","did"],"Loại 2 → would."],["If we had a garden, we ___ grow vegetables.",["could","can","will"],"Loại 2 → could/would + V."],["I ___ live in the city if I had a choice.",["wouldn't","won't","don't"],"Loại 2 → wouldn't."],["If I ___ you, I'd rent a smaller apartment.",["were","am","would be"],"If I were you = lời khuyên."],["If it rains tomorrow, we ___ stay home.",["will","would","stayed"],"Có thể xảy ra thật → loại 1."],["If they ___ closer, we'd visit them more often.",["lived","live","would live"],"If + quá khứ đơn."]],
u:["If I had a balcony I would grow flowers","What would you do if you were me","I would move if I had more money"],
r:{t:"What would your dream home look like? We asked three people. Hana said, 'If I could live anywhere, I'd choose a tiny wooden house in the mountains. It would be cozy, with a fireplace.' Duc said he would live in a spacious apartment in the city center, so he could walk everywhere. And ten-year-old Bao said, 'If I had a house, it would have a secret room in the attic and a swimming pool in the basement!'",q:[["Hana would like a house in the mountains.",true],["Duc wants to live far from the city.",false],["Duc would like to walk everywhere.",true],["Bao wants a secret room in the basement.",false]]},
l:{t:"Do you like your new apartment? — It's nice, but it's very small. If it were bigger, I'd invite friends for dinner. — Why don't you move? — I'd move if I could, but the rent is cheap and the neighborhood is quiet. If I moved, I would pay twice as much.",q:[["What's the problem with the apartment?",["It's small","It's noisy","It's expensive"]],["Why doesn't the speaker move?",["The rent is cheap","The landlord is kind","It's near work"]],["What would happen if the speaker moved?",["Pay twice as much","Live closer to friends","Have a garden"]]]},
s:[["If you could live anywhere, where would you live?","If I could live anywhere, I'd live in Da Lat, because the weather is cool and the city is beautiful."],["Describe your home.","I live in a small apartment. It's cozy, and it has a balcony where I grow some plants."]],
w:{p:"Viết 60–90 từ mô tả ngôi nhà mơ ước của bạn (dùng câu điều kiện loại 2).",k:["if","would","could","spacious"],m:"If I had enough money, I would build a house near the sea in Quy Nhon. It would be spacious and bright, with big windows and a balcony facing the beach. There would be a small garden where I could grow vegetables. If I lived there, I would swim every morning and invite my friends every weekend. It would be the perfect home."}
});

L("8A",8,"Sell and tell","Shopping","Reported speech",{
rule:"Tường thuật: lùi thì một bậc. am/is → <b>was</b>; do → <b>did</b>; did/have done → <b>had done</b>; will → <b>would</b>; can → <b>could</b>.<br><b>say</b> (không có tân ngữ) / <b>tell</b> + người: <i>She said (that)… / She told me (that)…</i><br>Câu hỏi: <i>asked if/whether…</i> hoặc <i>asked where I lived</i> (trật tự câu khẳng định, không có do/did).",
v:[["receipt","biên lai, hóa đơn","Keep the receipt in case you want to return it."],["refund","tiền hoàn lại","I asked for a refund."],["exchange","đổi (hàng)","Can I exchange this for a larger size?"],["discount","giảm giá","Students get a 10% discount."],["checkout","quầy thanh toán","Please pay at the checkout."],["try on","thử (quần áo)","Can I try on these shoes?"],["fit","vừa (kích cỡ)","The jacket doesn't fit me."],["in stock","còn hàng","Is this model in stock?"],["sold out","hết hàng","The tickets are sold out."],["complain","phàn nàn","He complained about the service."],["deliver","giao hàng","They deliver free on orders over $50."],["customer","khách hàng","The customer is always right."]],
g:[["'I'm tired.' → She said she ___ tired.",["was","is","has been"],"is → was."],["'I bought a coat.' → He told me he ___ a coat.",["had bought","has bought","buys"],"QKĐ → quá khứ hoàn thành."],["'Do you have a receipt?' → She asked me if I ___ a receipt.",["had","have","did have"],"have → had; câu hỏi Yes/No dùng if."],["'Where do you live?' → He asked me where I ___.",["lived","did live","do live"],"Câu hỏi tường thuật: không dùng do/did."],["'I will call you.' → She said she ___ call me.",["would","will","can"],"will → would."],["He ___ me that the store was closed.",["told","said","asked to"],"tell + người."],["She ___ that the shoes didn't fit.",["said","told","told to"],"say (không có tân ngữ người)."]],
u:["She said that the dress was too small","He asked me where I lived","They told us the shop was closed"],
r:{t:"Last month Nga sold her old bike online. A man messaged her and asked if the bike was still available. She said it was. He asked where she lived and said he would come the next day. When he arrived, he told her the bike was perfect, but he asked if she could give him a discount. Nga said she had already reduced the price. In the end he paid the full price and said he was very happy.",q:[["The man asked if the bike was still available.",true],["He said he would come the same day.",false],["Nga gave him a big discount.",false],["He paid the full price.",true]]},
l:{t:"Hi, I'd like to complain. I ordered a blue sweater, but you delivered a red one. — I'm sorry about that. Do you have the receipt? — Yes. The man on the phone told me you would send the right one. — I'm afraid the blue one is sold out. Would you like a refund? — Yes, please.",q:[["What color sweater did the customer order?",["Blue","Red","Green"]],["What did the man on the phone say?",["They would send the right one","It was sold out","There was a discount"]],["What does the customer choose?",["A refund","An exchange","A new color"]]]},
s:[["Tell me about something someone said to you recently.","Yesterday my boss told me that I had done a great job. She said she would give me a bigger project."],["Do you prefer shopping online or in stores?","I prefer stores because I can try on clothes. Online, things often don't fit."]],
w:{p:"Viết 50–80 từ kể lại một cuộc hội thoại mua sắm (dùng said, told, asked).",k:["said","told","asked","refund"],m:"Last week I went back to a shop because my new shoes didn't fit. The assistant asked me if I had the receipt. I told her that I had lost it. She said she couldn't give me a refund without it. Then the manager came and asked what the problem was. He said I could exchange the shoes for a bigger size. I was very happy."}
});

L("8B",8,"What's the right job for you?","Work","Gerunds and infinitives",{
rule:"<b>V-ing</b>: sau giới từ (<i>good at solving</i>), làm chủ ngữ, sau <i>enjoy, mind, avoid, finish, stop, keep, spend time</i>.<br><b>to + V</b>: sau <i>want, decide, hope, plan, need, would like, learn, promise</i>; sau tính từ (<i>easy to learn</i>).<br><b>V nguyên mẫu</b> (không to): sau <i>make, let</i> và động từ khuyết thiếu. <i>They made me work late.</i>",
v:[["apply for","nộp đơn xin","I'm applying for a job in a bank."],["interview","phỏng vấn","The interview went well."],["salary","lương","The salary is good."],["be promoted","được thăng chức","She was promoted to manager."],["resign","từ chức, nghỉ việc","He resigned last month."],["be fired","bị sa thải","He was fired for being late."],["retire","nghỉ hưu","My father retired at sixty."],["full-time","toàn thời gian","She has a full-time job."],["part-time","bán thời gian","Students often work part-time."],["experience","kinh nghiệm","Do you have any experience?"],["qualifications","bằng cấp","What qualifications do you need?"],["deadline","hạn chót","The deadline is Friday."]],
g:[["I enjoy ___ with people.",["working","to work","work"],"enjoy + V-ing."],["She decided ___ for a new job.",["to apply","applying","apply"],"decide + to V."],["I'm good at ___ problems.",["solving","to solve","solve"],"Sau giới từ → V-ing."],["He wants ___ early.",["to retire","retiring","retire"],"want + to V."],["Would you mind ___ the window?",["opening","to open","open"],"mind + V-ing."],["You should avoid ___ late for the interview.",["being","to be","be"],"avoid + V-ing."],["They made me ___ overtime.",["work","to work","working"],"make + tân ngữ + V nguyên mẫu."]],
u:["I would like to work abroad","She is interested in becoming a nurse","He stopped smoking last year"],
r:{t:"Do you like working with people, or do you prefer working alone? Career experts say that choosing the right job depends on your personality. If you enjoy solving problems, you might like being an engineer. If you hate sitting at a desk, you should avoid applying for office jobs. Most importantly, don't choose a job just to earn a big salary. People who love what they do tend to be more successful.",q:[["Experts say personality is important when choosing a job.",true],["People who enjoy solving problems might like engineering.",true],["You should choose a job only for the salary.",false],["The text says people who love their job are less successful.",false]]},
l:{t:"So, why do you want to work here? — I've always wanted to work in tourism. I enjoy meeting new people and I'm good at speaking English. — Do you mind working at weekends? — Not at all. — Great. We'd like you to start on Monday. The salary is paid monthly.",q:[["What field does the candidate want to work in?",["Tourism","Banking","Teaching"]],["Does the candidate mind working at weekends?",["No","Yes","Only Sundays"]],["When will the candidate start?",["Monday","Tomorrow","Next month"]]]},
s:[["What kind of job would you like to do? Why?","I'd like to be a teacher because I enjoy helping people and I'm good at explaining things."],["What do you avoid doing at work or school?","I try to avoid leaving things until the last minute, because I hate missing deadlines."]],
w:{p:"Viết 60–90 từ: thư ngắn xin việc bán thời gian (dùng V-ing và to V đúng cách).",k:["enjoy","would like to","good at","experience"],m:"Dear Sir or Madam, I would like to apply for the part-time job at your café. I am a college student and I enjoy working with people. I have one year of experience as a waiter, and I am good at making coffee. I don't mind working at weekends, and I hope to learn more about running a business. I look forward to hearing from you."}
});
L("9A",9,"Lucky encounters","Making adjectives & adverbs","Third conditional",{
rule:"<b>Câu điều kiện loại 3</b>: <i>If</i> + had + V3, <i>would have</i> + V3. Tưởng tượng về quá khứ (điều không xảy ra) → hối tiếc, giả định.<br><i>If I had left earlier, I would have caught the bus.</i><br><b>Tạo tính từ/trạng từ</b>: luck → lucky → luckily → unlucky; care → careful/careless; comfort → comfortable; success → successful.",
v:[["lucky","may mắn","We were lucky to find a seat."],["luckily","may thay","Luckily, nobody was hurt."],["unfortunately","không may","Unfortunately, the concert was cancelled."],["careful","cẩn thận","Be careful! The floor is wet."],["careless","bất cẩn","It was a careless mistake."],["comfortable","thoải mái","This sofa is very comfortable."],["successful","thành công","She runs a successful business."],["helpful","hay giúp đỡ, hữu ích","The staff were very helpful."],["useless","vô dụng","This old map is useless."],["patient","kiên nhẫn","Teachers need to be patient."],["impatient","thiếu kiên nhẫn","Don't be impatient. Wait your turn."],["coincidence","sự trùng hợp","What a coincidence! I'm from Hue too!"]],
g:[["If I had left earlier, I ___ the bus.",["would have caught","would catch","will catch"],"Loại 3 → would have + V3."],["If she ___ harder, she would have passed.",["had studied","studied","would study"],"If + had + V3."],["We wouldn't have met if you ___ to that party.",["hadn't gone","didn't go","wouldn't go"],"If + hadn't + V3."],["What would you have done if you ___ the money?",["had found","found","have found"],"If + had + V3."],["If it hadn't rained, we ___ to the beach.",["would have gone","went","would go"],"Loại 3."],["He was ___ lucky to survive the crash.",["incredibly","incredible","incredibility"],"Bổ nghĩa cho tính từ → trạng từ (-ly)."],["___, the museum was closed when we arrived.",["Unfortunately","Unfortunate","Unfortune"],"Trạng từ đầu câu bổ nghĩa cả câu."]],
u:["If I had known I would have come","Luckily nobody was hurt","We would have won if we had played better"],
r:{t:"In 2015 Phuong missed her flight to Singapore because of a traffic jam. She was furious. While she was waiting for the next flight, she sat next to a woman who was reading a book about architecture. They started talking, and the woman turned out to be the director of a design company. She offered Phuong a job. 'If I hadn't missed that flight, I would never have met her,' Phuong says. 'It was the luckiest mistake of my life.'",q:[["Phuong missed her flight because of traffic.",true],["She was happy when she missed it.",false],["The woman offered her a job.",true],["Phuong would have met the woman anyway.",false]]},
l:{t:"Did you hear about Nam? He lost his wallet on the bus yesterday. Luckily, a helpful woman found it and called him. — That was lucky! If she hadn't found it, he would have lost all his money. — Yes, and it was a coincidence: she was his old primary school teacher!",q:[["What did Nam lose?",["His wallet","His phone","His keys"]],["Who found it?",["A woman","A bus driver","A police officer"]],["What was the coincidence?",["She was his old teacher","She lived next door","She had the same name"]]]},
s:[["Tell me about a lucky moment in your life.","Two years ago I missed a bus, so I walked. On the way I met an old friend who told me about my current job. If I hadn't missed the bus, I wouldn't have met him."],["What would you have done differently in the past?","If I had started learning English earlier, I would have studied abroad."]],
w:{p:"Viết 60–90 từ kể về một sự tình cờ may mắn (dùng câu điều kiện loại 3 và trạng từ).",k:["if","had","would have","luckily"],m:"Three years ago I forgot my umbrella and got caught in the rain. Luckily, a kind man let me stand under his shop roof. We started chatting, and I found out he was looking for an English teacher for his children. I have taught them ever since. If I had remembered my umbrella, I would never have stopped there. I wouldn't have found such a wonderful job."}
});

L("9B",9,"Too much information!","Electronic devices","Quantifiers",{
rule:"<b>much</b> + không đếm được; <b>many</b> + đếm được số nhiều (thường dùng trong câu hỏi/phủ định).<br><b>a little</b> (không đếm được) / <b>a few</b> (đếm được): một ít (tích cực). <b>little / few</b>: rất ít (tiêu cực).<br><b>too much / too many</b>: quá nhiều. <b>enough</b>: đủ (<i>enough money</i>, <i>old enough</i>).<br><b>any</b>: câu hỏi và phủ định; <b>some</b>: câu khẳng định.",
v:[["laptop","máy tính xách tay","I do my homework on my laptop."],["tablet","máy tính bảng","My kids watch cartoons on the tablet."],["screenshot","ảnh chụp màn hình","Send me a screenshot of the error."],["download","tải xuống","Download the app for free."],["upload","tải lên","I uploaded the photos last night."],["password","mật khẩu","Don't share your password."],["Wi-Fi","mạng không dây","What's the Wi-Fi password?"],["charge","sạc (pin)","I need to charge my phone."],["app","ứng dụng","This app helps me learn words."],["notification","thông báo","I turned off all notifications."],["log in","đăng nhập","Log in with your email."],["social media","mạng xã hội","She spends hours on social media."]],
g:[["I don't have ___ time to check my email.",["much","many","a few"],"time không đếm được → much."],["There are too ___ apps on my phone.",["many","much","little"],"apps đếm được → too many."],["I have ___ friends who don't use social media.",["a few","a little","much"],"friends đếm được → a few."],["There's very ___ milk left. Can you buy some?",["little","few","many"],"milk không đếm được → little."],["Is there ___ Wi-Fi here?",["any","many","a few"],"Câu hỏi → any."],["I spend ___ time online. I need to stop.",["too much","too many","enough of"],"Quá nhiều + không đếm được → too much."],["We don't have ___ chargers for everyone.",["enough","too","much of"],"enough + danh từ."]],
u:["I spend too much time on my phone","There are a few apps I use every day","We don't have enough chargers"],
r:{t:"How much time do you spend on your phone? A study found that the average adult checks their phone about 100 times a day. Many people say they get too many notifications and have too little time to relax. A few people have started 'digital detox' weekends: they switch off all devices from Friday night to Monday morning. Most of them say they sleep better and feel less anxious.",q:[["The average adult checks their phone about 100 times a day.",true],["Most people say they get very few notifications.",false],["A digital detox means switching off devices.",true],["People on digital detox say they sleep worse.",false]]},
l:{t:"Dad, can I download a new game? — How many games do you already have? — Only a few. — And how much time did you spend on the tablet today? — Just a little. About an hour. — That's enough for today. You can download it tomorrow, after your homework.",q:[["What does the child want to do?",["Download a game","Buy a tablet","Watch a movie"]],["How long did the child use the tablet?",["About an hour","Ten minutes","Three hours"]],["When can the child download it?",["Tomorrow","Tonight","Next week"]]]},
s:[["How much time do you spend on your phone every day?","Probably too much! About four hours. I use a lot of apps for work and a few for fun."],["Which electronic device couldn't you live without? Why?","My laptop, because I use it for work, for study, and for watching films."]],
w:{p:"Viết 50–80 từ về thói quen dùng thiết bị điện tử của bạn (dùng much, many, a few, a little, too, enough).",k:["too much","a few","enough","many"],m:"I think I spend too much time on my phone. I get too many notifications every day, so I often lose focus at work. I only use a few apps for learning, and I spend very little time reading real books. I don't get enough sleep because I watch videos late at night. This month I'm trying to use my phone a little less."}
});

g:[["She's the woman ___ invented this app.",["who","which","whose"],"Người → who."],["This is the phone ___ I bought last week.",["that","who","whose"],"Vật, mệnh đề xác định → that/which."],["That's the man ___ son is a famous singer.",["whose","who","which"],"Sở hữu → whose."],["The café ___ we first met has closed.",["where","which","who"],"Nơi chốn → where."],["Steve Jobs, ___ founded Apple, was born in 1955.",["who","that","which"],"Không xác định (có dấu phẩy) → who, không dùng that."],["The Eiffel Tower, ___ is in Paris, is very famous.",["which","that","who"],"Không xác định, vật → which."],["The book ___ you lent me was great.",["that","who","where"],"Vật → that/which."]],
u:["This is the book that changed my life","He is the artist whose paintings I love","That is the place where I was born"],
r:{t:"The Golden Bridge, which opened in 2018, is in the Ba Na Hills near Da Nang. The bridge, whose design shows two giant stone hands, quickly became an icon. The designers who created it wanted visitors to feel like they were walking in the sky. Photos that were posted on social media made it famous around the world, and it is now one of the landmarks that tourists most want to visit in Vietnam.",q:[["The Golden Bridge opened in 2018.",true],["Its design shows two giant stone feet.",false],["Social media made it famous.",true],["Few tourists want to visit it.",false]]},
l:{t:"Who was the person who invented the first smartphone? Many people think it was Apple, but the first phone that had a touch screen and apps was made by IBM in 1994. It was called Simon. It was a phone which could also send emails. Unfortunately, the battery, which lasted only one hour, was a big problem.",q:[["Who made the first smartphone?",["IBM","Apple","Nokia"]],["What was it called?",["Simon","Sam","iPhone"]],["What was the problem?",["The battery","The price","The screen"]]]},
s:[["Describe a person who is an icon in your country.","Vo Nguyen Giap is someone who many Vietnamese people admire. He was a general whose ideas were very famous."],["Talk about a place where you have special memories.","The beach where I learned to swim is in Nha Trang. It's a place that I visit every summer."]],
w:{p:"Viết 60–90 từ giới thiệu một biểu tượng hiện đại (người, đồ vật hoặc địa danh) dùng who/which/whose/where.",k:["who","which","whose","where"],m:"Landmark 81, which opened in 2018, is the tallest skyscraper in Vietnam. It is in Ho Chi Minh City, where it stands next to the Saigon River. The company which built it wanted to create a new icon for the city. There is a viewing deck where visitors can see the whole city. People whose apartments are on the top floors have an amazing view."}
});

L("10B",10,"Two crime stories","Crime","Question tags",{
rule:"<b>Câu hỏi đuôi</b>: khẳng định → đuôi phủ định; phủ định → đuôi khẳng định. Dùng trợ động từ của câu chính.<br><i>You're a teacher, aren't you? · She didn't go, did she? · They've left, haven't they? · He can swim, can't he?</i><br>Đặc biệt: <i>I'm…, aren't I?</i> · <i>Let's…, shall we?</i><br>Ngữ điệu xuống = mong được đồng ý; ngữ điệu lên = thật sự hỏi.",
v:[["thief","kẻ trộm","The thief took my bag."],["burglar","kẻ đột nhập (nhà)","A burglar broke into the house."],["robbery","vụ cướp","There was a bank robbery."],["steal","ăn cắp","Someone stole my bike."],["rob","cướp (người, nơi)","They robbed a jewelry store."],["arrest","bắt giữ","The police arrested two men."],["witness","nhân chứng","The witness saw everything."],["evidence","bằng chứng","There isn't enough evidence."],["judge","thẩm phán","The judge listened carefully."],["guilty","có tội","He was found guilty."],["innocent","vô tội","She says she's innocent."],["prison","nhà tù","He spent two years in prison."]],
g:[["You're a police officer, ___?",["aren't you","are you","don't you"],"Khẳng định với are → aren't you."],["She didn't steal it, ___?",["did she","didn't she","was she"],"Phủ định với didn't → did she."],["They've arrested him, ___?",["haven't they","have they","didn't they"],"have → haven't."],["He can speak English, ___?",["can't he","can he","doesn't he"],"can → can't."],["Let's go, ___?",["shall we","will we","don't we"],"Let's → shall we."],["I'm right, ___?",["aren't I","am not I","isn't I"],"I'm → aren't I."],["Your brother saw the thief, ___?",["didn't he","did he","wasn't he"],"QKĐ khẳng định → didn't."]],
u:["You saw the thief didn't you","The witness wasn't lying was she","He isn't guilty is he"],
r:{t:"In 2019 a man stole a painting from a small gallery in Europe. He walked in, took it off the wall, and walked out. Nobody saw him. The police had no evidence until a witness remembered a strange detail: the thief was wearing a bright yellow raincoat on a sunny day. Two weeks later, a man in a yellow raincoat was arrested at a flea market while he was trying to sell the painting. He said he was innocent, but the judge found him guilty.",q:[["The thief stole a painting from a gallery.",true],["Many people saw the thief.",false],["A witness remembered his raincoat.",true],["The judge said he was innocent.",false]]},
l:{t:"You were at home on Friday night, weren't you? — Yes, I was. — And you didn't go out, did you? — No, I didn't. — But your neighbor saw you at the bus stop at ten o'clock. — Well… I just went to buy some milk. That's not a crime, is it?",q:[["Who is probably speaking to the man?",["A police officer","A teacher","A doctor"]],["Where did the neighbor see him?",["At the bus stop","In a shop","At the station"]],["What does the man say he was doing?",["Buying milk","Meeting a friend","Walking the dog"]]]},
s:[["Check some facts about your partner using question tags.","You're from Hanoi, aren't you? You've studied English for years, haven't you? You don't like horror movies, do you?"],["Tell me about a crime story you've heard or watched.","I watched a documentary about a jewelry robbery. The thieves were arrested because one of them posted photos on social media."]],
w:{p:"Viết 60–90 từ kể một câu chuyện trinh thám ngắn có ít nhất 3 câu hỏi đuôi trong hội thoại.",k:["didn't you","aren't you","witness","arrested"],m:"The detective looked at the young man. 'You were in the museum yesterday, weren't you?' 'Yes, but I didn't take anything.' 'You aren't telling the truth, are you? A witness saw you near the window.' 'That can't be right.' 'You know about the missing painting, don't you?' Finally the man said sorry and showed them where the painting was. The police arrested him that afternoon."}
