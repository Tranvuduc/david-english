<style>
:root{
  --paper: #f7f5ef; --surface:#FFFFFF; --line:#E4DFD1; --ink:#1E2A2F; --muted:#6B6558;
  --teal:#0F5C55; --teal-soft:#DCEAE7; --gold:#B9812C; --gold-soft:#F3E6CC;
  --bad:#B5443A; --bad-soft:#F6E4E1; --ok:#1E8F5F; --ok-soft:#E1F3E9;
  --display:"Fraunces",Georgia,serif; --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#161B18; --surface:#1F2622; --line:#333C36; --ink:#EDEAE0; --muted:#9BA69C;
  --teal:#4FBDAE; --teal-soft:#1D3532; --gold:#E0AC5A; --gold-soft:#33280F;
  --bad:#E38077; --bad-soft:#3A211E; --ok:#5CC98D; --ok-soft:#183028;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#161B18; --surface:#1F2622; --line:#333C36; --ink:#EDEAE0; --muted:#9BA69C;
  --teal:#4FBDAE; --teal-soft:#1D3532; --gold:#E0AC5A; --gold-soft:#33280F;
  --bad:#E38077; --bad-soft:#3A211E; --ok:#5CC98D; --ok-soft:#183028;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;padding-inline:16px}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 60px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:clamp(28px,6vw,38px);font-weight:700}
.top p{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:44ch}
.brandmark{display:inline-flex;align-items:baseline;gap:1px;font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.brandmark b{color:var(--ink);font-weight:600}
.brandmark i{font-style:normal;color:var(--gold)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.pill b{color:var(--teal);font-family:var(--mono)}

/* mode tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.tab{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tab[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3.5vw,28px);margin-top:18px}
.kicker{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--gold)}
.qtext{font-size:clamp(17px,2.4vw,20px);font-weight:600;margin:8px 0 4px;line-height:1.4}
.instr{color:var(--muted);font-size:13.5px;font-style:italic;margin:0 0 14px}
.passage{background:var(--paper);border-left:3px solid var(--gold);border-radius:6px;padding:12px 16px;font-size:14.5px;margin-bottom:14px;max-height:220px;overflow:auto}

.opts{display:grid;gap:9px;margin-top:14px}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:11px;padding:11px 14px;font-size:15.5px;display:flex;gap:10px;align-items:center;transition:border-color .12s}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--line);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}

.btn{border:none;background:var(--teal);color:#fff;border-radius:11px;padding:10px 18px;font-weight:600;font-size:14.5px;display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.feedback{min-height:22px;margin-top:10px;font-weight:600;font-size:14px}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}

/* flashcard */
.flash{perspective:1200px;max-width:440px;margin:0 auto}
.fcard{position:relative;height:220px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .w{font-family:var(--display);font-size:clamp(24px,5vw,30px);font-weight:700;color:var(--teal)}
.face .vi{font-size:18px;font-weight:600}
.face .def{font-size:14px;color:var(--muted);max-width:36ch}
.face .ex{font-style:italic;color:var(--muted);font-size:13.5px;max-width:34ch}
.face .hint{position:absolute;bottom:10px;font-size:11.5px;color:var(--muted)}
.rate{display:flex;gap:8px;justify-content:center;margin-top:14px}
.rate button{flex:1;max-width:130px;border-radius:10px;padding:9px;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:var(--paper)}
.rate button.no{border-color:var(--bad);color:var(--bad)}
.rate button.yes{border-color:var(--ok);color:var(--ok)}

/* reorder */
.order-list{display:flex;flex-direction:column;gap:8px}
.order-item{display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px}
.order-item .num{font-family:var(--mono);font-weight:700;color:var(--teal);width:20px;flex:none}
.order-item .mv{display:flex;flex-direction:column;gap:2px;margin-left:auto}
.order-item .mv button{background:var(--surface);border:1px solid var(--line);border-radius:6px;width:26px;height:22px;font-size:11px;line-height:1}
.order-item.right{border-color:var(--ok);background:var(--ok-soft)}
.order-item.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* progress + result */
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--teal);transition:width .3s}
.result{text-align:center}
.result .score{font-family:var(--display);font-size:52px;font-weight:700;color:var(--teal);margin:6px 0}
.result .band{font-family:var(--mono);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer a{color:var(--ink);font-weight:600;text-decoration:underline}

/* sub-tabs */
.subtabs{margin-top:10px}
.subtab{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:600;font-size:12.5px}
.subtab[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}

/* word bank / drag-fill */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{background:var(--teal-soft);color:var(--teal);border:1.5px solid var(--teal);border-radius:9px;padding:7px 12px;font-size:14px;font-weight:600}
.chip[disabled]{opacity:.35;cursor:default}
.chip.sel{background:var(--teal);color:#fff}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:88px;padding:3px 8px;margin:0 2px;border-bottom:2.5px solid var(--gold);border-radius:4px;font-weight:700;color:var(--teal);background:var(--gold-soft);cursor:pointer}
.blank.empty{color:var(--muted);font-weight:500}
.blank.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.blank.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fillpassage{font-size:15.5px;line-height:2.1}
.fillpassage select{font:inherit;font-weight:700;color:var(--teal);background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:6px;padding:2px 6px;margin:0 2px}
.fillpassage select.right{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.fillpassage select.wrong{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.fillpassage input.blankin{font:inherit;width:110px;border:1.5px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--surface);color:var(--ink)}
.fillpassage input.blankin.right{border-color:var(--ok);background:var(--ok-soft)}
.fillpassage input.blankin.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* audio control */
.audiorow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:10px 14px;margin-bottom:14px}
.audiorow .instr{margin:0}

/* transcript click-highlight */
.transcript{font-size:16px;line-height:2.15}
.tword{cursor:pointer;padding:1px 3px;border-radius:4px}
.tword:hover{background:var(--teal-soft)}
.tword.picked{background:var(--gold-soft);text-decoration:underline wavy var(--gold)}
.tword.right{background:var(--ok-soft);color:var(--ok);text-decoration:none}
.tword.wrong{background:var(--bad-soft);color:var(--bad);text-decoration:none}
.tword.missed{background:var(--bad-soft);color:var(--bad);text-decoration:underline dotted var(--bad)}

/* free text answer */
textarea.answer{width:100%;min-height:110px;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:11px;padding:12px;background:var(--surface);color:var(--ink);resize:vertical}
input.dictate{width:100%;font:inherit;font-size:15.5px;border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;background:var(--surface);color:var(--ink)}
.wordcount{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px}
.diffline{font-family:var(--mono);font-size:14px;line-height:1.8;background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:6px;word-break:break-word}
.diffline .d-ok{color:var(--ok)}
.diffline .d-bad{color:var(--bad);text-decoration:line-through}
.diffline .d-miss{color:var(--gold);text-decoration:underline}
.modelbox{background:var(--paper);border-left:3px solid var(--teal);border-radius:6px;padding:12px 16px;font-size:14px;margin-top:12px}
.modelbox .lbl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
</style>

{title:"Bees in the city",
 text:"Good afternoon, everyone. Today I want to talk about an unlikely resident of many modern cities: the bee. For a long time, we assumed that pollinators like bees needed large stretches of farmland or wilderness to survive. But recent research tells a different story. Urban areas, it turns out, can actually support a surprising diversity of bee species, in some studies more species than nearby rural farmland. Why might this be the case? Cities often contain a wide variety of flowering plants across gardens, parks, and even roadside verges, blooming at different times throughout the year. This variety gives bees a more continuous supply of food than a single farm growing one crop. Cities are also generally warmer than the surrounding countryside, which can extend the foraging season for some species. Of course, urban environments bring challenges too: pesticide use, traffic pollution, and a shortage of nesting sites can all limit bee populations. Some cities have responded by creating pollinator corridors, strips of wildflower planting that connect green spaces across a city, giving bees safer routes to move and forage. These findings are prompting some urban planners to think of gardens and parks not just as decoration, but as genuine habitat that needs to be planned and protected.",

{title:"Spaced repetition and memory",
 text:"This morning I'd like to look at why cramming the night before an exam is such an inefficient way to learn, and what research suggests we should do instead. When we first learn something, the memory is fragile, and if we don't revisit it, it fades quickly, often within a day or two. Traditional cramming tries to fight this by repeating information many times in a short period, but studies show that this kind of massed repetition produces memories that fade almost as fast as they were formed. A far more durable approach is called spaced repetition: reviewing information at gradually increasing intervals, a day later, then a week later, then a month later, and so on. Each time we successfully recall something just as we're on the verge of forgetting it, the memory is strengthened more than if we'd reviewed it too early or too late. Digital flashcard systems now use algorithms to schedule these reviews automatically, adjusting the interval based on how easily a learner recalls each item. Language learners and medical students, who both need to retain enormous amounts of factual material, have been among the biggest adopters of this technique, and several studies report substantially better long-term retention compared with traditional study methods.",
 model:"The talk contrasts cramming, which produces memories that fade quickly, with spaced repetition, a technique of reviewing material at gradually increasing intervals. Recalling information just before forgetting it strengthens memory more effectively. Digital flashcard systems now automate this scheduling based on individual recall performance. Language learners and medical students have widely adopted the method, with studies showing notably better long-term retention than traditional cramming.",
 keywords:["cram","spaced repetition","memory","interval","retention","flashcard","recall"]},
{title:"Trialling the four-day work week",
 text:"In recent years, a number of companies and even some national governments have experimented with a four-day working week, typically keeping full pay while reducing the standard schedule from five days to four. The idea sounds simple, but the results from several large-scale trials have been closely watched by economists and business leaders alike. In many of these trials, companies reported that overall productivity remained stable or even improved, despite employees working fewer hours. Researchers suggest that this happens partly because a shorter week encourages employees to cut down on low-value meetings and distractions, focusing more tightly on essential tasks. Employee wellbeing measures, including reported stress levels and job satisfaction, also tended to improve significantly during these trials. Not every industry has found the model easy to apply, however; sectors that depend on round-the-clock coverage, such as healthcare and manufacturing, have faced more complex scheduling challenges. Even so, the growing body of trial data has encouraged more organisations to consider testing a shorter week, at least for roles where output can be measured by results rather than hours spent at a desk.",

{title:"Night trains return to Europe",
 text:"Good evening, everyone. Tonight I want to look at a form of travel many people thought had disappeared for good: the night train. For decades, sleeper services across Europe were cut back as cheap flights took over, and by 2015 only a handful of routes remained. In the last few years, however, night trains have made a surprising comeback. One reason is concern about carbon emissions: a journey by rail produces far less carbon per passenger than the equivalent short flight. Another is comfort. Passengers can board in the evening, sleep in a couchette or a private cabin, and arrive in the centre of their destination city the next morning, saving both a hotel night and the long journey to an out-of-town airport. Railway operators have responded by ordering new sleeper carriages and reopening routes between cities such as Vienna, Paris, Amsterdam and Berlin. There are still obstacles. Tickets can be expensive, sleeper carriages are in short supply, and cross-border timetables are complicated to arrange. Even so, bookings have grown steadily, and several governments now describe night trains as part of their climate plans rather than a nostalgic luxury.",

{title:"Why we forget names",
 text:"Hello, and welcome to today's talk on a small frustration almost everyone knows: forgetting someone's name seconds after meeting them. Psychologists say the problem usually starts with attention, not memory. When we are introduced to a new person, we are often busy thinking about what to say next, or worrying about making a good impression, so the name never really registers. Names are also unusually hard to remember because they are arbitrary: unlike a job title or a hometown, a name tells you nothing about the person, so the brain has very little to attach it to. Faces, by contrast, are rich in detail, which is why we often recognise a face while the name escapes us. Research also shows that we remember names better when we use them straight away in conversation, or link them to something familiar, such as a rhyme or a famous person with the same name. The good news is that forgetting a name is normal at any age, and it is not, on its own, a sign of poor memory. The most reliable fix is simple: pay full attention at the moment of introduction, repeat the name back, and use it once more before the conversation ends.",
 model:"The talk explains that we forget names because we do not pay attention when we first hear them, and because a name is an arbitrary label that gives the brain nothing to attach it to, unlike a face, which is rich in detail. Research on memory shows names stick better when we use them immediately or link them to something familiar, which helps recall. Forgetting a name is normal. The best fix is to listen carefully, repeat the name back, and use it again before the conversation ends.",
 keywords:["name","memory","forget","face","recall","brain","attention","familiar"]},
{"title":"The history of coffee","text":"Good morning, everyone. Today I'd like to tell you the story of coffee, a drink that now shapes mornings all over the world. Coffee began in Ethiopia, where, according to legend, a goat herder noticed his animals became energetic after eating certain red berries. From Ethiopia, coffee travelled to Yemen, where people first began roasting the beans and brewing a drink. By the fifteenth century, coffee houses had appeared across the Middle East, and they quickly became places where people met to talk, do business, and debate ideas. Some rulers even tried to ban them, worried about what people discussed there. Coffee reached Europe in the seventeenth century, and coffee houses spread through London, Paris, and Vienna. In London, they became known as 'penny universities' because, for the price of a cup, anyone could join the conversation. From Europe, coffee plants were carried to the Americas, where large plantations grew up in Brazil and Colombia. Today, Brazil is the world's largest coffee producer, and coffee is one of the most widely traded goods on Earth.","model":"The talk traces coffee from its origins in Ethiopia, through Yemen and the Middle East, where coffee houses became meeting places for discussion, to Europe, where London coffee houses were called 'penny universities'. Coffee plants were then carried to the Americas, and today Brazil is the largest producer and coffee is one of the world's most traded goods.","keywords":["coffee","Ethiopia","Yemen","coffee house","London","plantation","Brazil","producer"]},
{"title":"Why we dream","text":"Hello, everyone. Today I want to talk about dreams — those strange films our minds play while we sleep. For centuries, people believed dreams were messages from the gods or predictions of the future. Modern science offers a different explanation. Researchers now think dreams help the brain process memories and emotions from the day. During a stage of sleep called REM sleep, the brain becomes very active, almost as active as when we are awake, and it replays recent experiences, connecting them with older memories. This may be why dreams often mix familiar people with impossible situations. Dreams may also help us practise for real life: studies show that people who dream about a difficult task often perform it better the next day. Not everyone remembers their dreams, but almost everyone has them — several times each night. So the next time you wake from a vivid dream, remember that your brain has been working hard, sorting, storing, and rehearsing while you slept.","model":"The talk explains that dreams were once seen as messages from the gods, but science now links them to processing memories and emotions during REM sleep, when the brain replays experiences and connects them with older memories. Dreams may also help us practise tasks, and although not everyone remembers them, almost everyone dreams several times a night.","keywords":["dream","REM","sleep","memory","emotion","brain","replay","practise"]},
{"title":"The rise of the bicycle city","text":"Good afternoon, everyone. Today I want to talk about how one city changed its streets — and its health — by choosing the bicycle. Fifty years ago, Copenhagen was like most European cities: full of cars, traffic jams, and exhaust fumes. Then the city made a decision. It began building separate cycle lanes, protected from cars, and it gave bicycles priority at many junctions. It also made parking expensive and slow, while cycling stayed free and fast. The results were remarkable. Today, more than half of all journeys to work and school in Copenhagen are made by bicycle. Air pollution has fallen, traffic accidents have dropped, and people are healthier: studies link the cycling habit to longer lives and lower rates of heart disease. Other cities are now copying the model, from Amsterdam to Bogotá. Copenhagen shows that a city does not need to ban cars to change — it only needs to make the healthier choice the easier one.","model":"The talk describes how Copenhagen became a bicycle city by building protected cycle lanes, giving bikes priority, and making car parking expensive and slow. Today more than half of journeys to work and school are by bicycle, air pollution and accidents have fallen, and residents are healthier. Other cities are now copying the model.","keywords":["Copenhagen","bicycle","cycle lane","traffic","pollution","health","journey","city"]},

var LS_KEY="pte_arcade_v2";
var state={score:10,streak:0};
try{var saved=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(saved&&typeof saved.score==="number")state=saved;}catch(e){}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function idxArr(n){var r=[];for(var i=0;i<n;i++)r.push(i);return r;}
function bump(ok){
  if(ok){state.streak++;state.score=Math.min(90,state.score+2);}
  else{state.streak=0;state.score=Math.max(10,state.score-1);}
  save();renderStats();
}
function bumpPartial(ratio){
  if(ratio>=0.7){bump(true);}else{bump(false);}
}
function renderStats(){
  document.getElementById("sScore").textContent=state.score;
  document.getElementById("sStreak").textContent=state.streak;
}
function speak(t,onend){
  try{
    if(!window.speechSynthesis){if(onend)onend();return;}
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.rate=.95;
    if(onend)u.onend=onend;
    window.speechSynthesis.speak(u);
  }catch(e){if(onend)onend();}
}

/* ---------- Reading: Re-order Paragraphs ---------- */
function runReorder(){
  var order=shuffle(idxArr(REORDER.length));
  var idx=0,correct=0;
  function draw(){
    if(idx>=order.length){
      resultPanel("Re-order Paragraphs","Set finished",correct+"/"+order.length,"correctly ordered",runReorder);
      return;
    }
    var set=REORDER[order[idx]];
    var cur=shuffle(set.lines.map(function(l,i){return{t:l,orig:i};}));
    function draw2(checked){
      app.innerHTML=
        '<div class="panel">'+
        '<div class="kicker">Re-order Paragraphs &middot; '+(idx+1)+'/'+order.length+'</div>'+
        '<div class="qtext">'+esc(set.title)+'</div>'+
        '<p class="instr">The paragraphs below are in the wrong order. Use the arrows to move a line into the correct logical order.</p>'+
        '<div class="order-list" id="ol">'+cur.map(function(it,i){
          var cls=checked?(it.orig===i?"right":"wrong"):"";
          return '<div class="order-item '+cls+'"><span class="num">'+(i+1)+'</span><span>'+esc(it.t)+'</span>'+
            (checked?"":'<span class="mv"><button data-d="-1" data-i="'+i+'">&#9650;</button><button data-d="1" data-i="'+i+'">&#9660;</button></span>')+
          '</div>';
        }).join("")+'</div>'+
        '<div class="row">'+
          (checked?'<button class="btn" id="next">Next</button>':'<button class="btn" id="check">Check order</button>')+
        '</div></div>';
      if(!checked){
        Array.prototype.forEach.call(app.querySelectorAll(".mv button"),function(b){
          b.addEventListener("click",function(){
            var i=parseInt(b.getAttribute("data-i"),10),d=parseInt(b.getAttribute("data-d"),10);
            var j=i+d;if(j<0||j>=cur.length)return;
            var t=cur[i];cur[i]=cur[j];cur[j]=t;
            draw2(false);
          });
        });
        document.getElementById("check").onclick=function(){
          var right=cur.every(function(it,i){return it.orig===i;});
          if(right)correct++;
          bump(right);
          draw2(true);
        };
      } else {
        document.getElementById("next").onclick=function(){idx++;draw();};
      }
    }
    draw2(false);
  }
  draw();
}

/* ---------- Reading: Fill in the Blanks (drag / tap-to-place) ---------- */
function runFibDrag(){
  var order=shuffle(idxArr(FIB_DRAG.length));
  var idx=0,correct=0,totalBlanks=0;
  function draw(){
    if(idx>=order.length){
      resultPanel("Fill in the Blanks (Drag & Drop)","Set finished",correct+"/"+totalBlanks,"blanks correct",runFibDrag);
      return;
    }
    var item=FIB_DRAG[order[idx]];
    var n=item.answers.length;
    var placed=new Array(n).fill(null); // word index placed in each blank
    var bankOrder=shuffle(idxArr(n));
    var selectedChip=null;
    var checked=false;

    function passageHtml(){
      var html='<p class="fillpassage">';
      for(var i=0;i<item.parts.length;i++){
        html+=esc(item.parts[i]);
        if(i<n){
          var wi=placed[i];
          var cls="blank"+(wi===null?" empty":"")+(checked?(wi!==null&&item.answers[wi]===item.answers[i]?" right":" wrong"):"");
          html+='<span class="'+cls+'" data-blank="'+i+'">'+(wi===null?"blank "+(i+1):esc(item.answers[wi]))+'</span>';
        }
      }
      html+='</p>';
      return html;
    }
    function bankHtml(){
      return '<div class="bank">'+bankOrder.map(function(wi){
        var used=placed.indexOf(wi)!==-1;
        return '<button class="chip'+(used?"":"")+'" data-w="'+wi+'" '+(used||checked?"disabled":"")+'>'+esc(item.answers[wi])+'</button>';
      }).join("")+'</div>';
    }
    function render(){
      app.innerHTML=
        '<div class="panel">'+
        '<div class="kicker">Fill in the Blanks &middot; Drag &amp; Drop &middot; '+(idx+1)+'/'+order.length+'</div>'+
        '<div class="qtext">'+esc(item.title)+'</div>'+
        '<p class="instr">Tap a word below, then tap the blank where it belongs.</p>'+
        passageHtml()+
        bankHtml()+
        '<div class="row">'+(checked?'<button class="btn" id="next">Next</button>':'<button class="btn" id="check" '+(placed.indexOf(null)!==-1?"disabled":"")+'>Check answers</button>')+'</div>'+
        '</div>';
      if(!checked){
        Array.prototype.forEach.call(app.querySelectorAll(".chip"),function(c){
          c.addEventListener("click",function(){
            selectedChip=parseInt(c.getAttribute("data-w"),10);
            Array.prototype.forEach.call(app.querySelectorAll(".chip"),function(x){x.classList.remove("sel");});
            c.classList.add("sel");
          });
        });
        Array.prototype.forEach.call(app.querySelectorAll(".blank"),function(bl){
          bl.addEventListener("click",function(){
            var bi=parseInt(bl.getAttribute("data-blank"),10);
            if(placed[bi]!==null){placed[bi]=null;render();return;}
            if(selectedChip===null)return;
            placed[bi]=selectedChip;selectedChip=null;render();
          });
        });
        var chk=document.getElementById("check");
        if(chk)chk.onclick=function(){
          checked=true;
          var right=0;
          for(var i=0;i<n;i++){if(placed[i]!==null&&item.answers[placed[i]]===item.answers[i])right++;}
          correct+=right;totalBlanks+=n;
          bumpPartial(right/n);
          render();
        };
      } else {
        document.getElementById("next").onclick=function(){idx++;draw();};
      }
    }
    render();
  }
  draw();
}

/* ---------- word-level diff for dictation feedback ---------- */
function wordDiff(a,b){
  var n=a.length,m=b.length;
  var dp=[];
  for(var i=0;i<=n;i++)dp.push(new Array(m+1).fill(0));
  for(var i=n-1;i>=0;i--){
    for(var j=m-1;j>=0;j--){
      if(a[i].toLowerCase()===b[j].toLowerCase())dp[i][j]=dp[i+1][j+1]+1;
      else dp[i][j]=Math.max(dp[i+1][j],dp[i][j+1]);
    }
  }
  var i=0,j=0,ops=[];
  while(i<n&&j<m){
    if(a[i].toLowerCase()===b[j].toLowerCase()){ops.push({t:"eq",w:a[i]});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){ops.push({t:"del",w:a[i]});i++;}
    else{ops.push({t:"ins",w:b[j]});j++;}
  }
  while(i<n){ops.push({t:"del",w:a[i]});i++;}
  while(j<m){ops.push({t:"ins",w:b[j]});j++;}
  return ops;
}

/* ---------- Listening: Write from Dictation ---------- */
function runDictation(){
  var order=shuffle(idxArr(DICTATION.length));
  var idx=0,correct=0;
  function draw(){
    if(idx>=order.length){
      resultPanel("Write from Dictation","Section finished",correct+"/"+order.length,"exact or near-exact matches",runDictation);
      return;
    }
    var sentence=DICTATION[order[idx]];
    var played=false,checked=false;
    function render(){
      app.innerHTML=
        '<div class="panel">'+
        '<div class="kicker">Write from Dictation &middot; '+(idx+1)+'/'+order.length+'</div>'+
        '<div class="audiorow"><button class="btn ghost" id="play" '+(played?"disabled":"")+'>&#9654; '+(played?"Played once":"Play (once)")+'</button><span class="instr">You will hear the sentence only once, as in the real test.</span></div>'+
        '<p class="instr">Type the sentence exactly as you heard it.</p>'+
        '<input class="dictate" id="ans" '+(checked?"disabled":"")+' autocomplete="off" spellcheck="false" placeholder="Type the sentence here…">'+
        '<div class="row">'+(checked?'<button class="btn" id="next">Next</button>':'<button class="btn" id="submit">Submit</button>')+'</div>'+
        (checked?diffHtml():'')+
        '</div>';
      document.getElementById("play").onclick=function(){
        if(played)return;
        played=true;
        speak(sentence);
        render();
      };
      if(!checked){
        document.getElementById("submit").onclick=function(){
          checked=true;
          var target=sentence.replace(/[.]$/,"").split(" ");
          var given=document.getElementById("ans").value.trim().replace(/[.]$/,"").split(/\s+/).filter(Boolean);
          window.__lastDiff=wordDiff(target,given);
          var eq=window.__lastDiff.filter(function(o){return o.t==="eq";}).length;
          var ratio=eq/target.length;
          if(ratio>=0.98)correct++;
          bumpPartial(ratio);
          render();
        };
      } else {
        document.getElementById("next").onclick=function(){idx++;draw();};
      }
    }
    function diffHtml(){
      var ops=window.__lastDiff||[];
      var eq=ops.filter(function(o){return o.t==="eq";}).length;
      var target=sentence.replace(/[.]$/,"").split(" ").length;
      var pct=Math.round(100*eq/target);
      var spans=ops.map(function(o){
        if(o.t==="eq")return '<span class="d-ok">'+esc(o.w)+'</span>';
        if(o.t==="del")return '<span class="d-miss">'+esc(o.w)+'</span>';
        return '<span class="d-bad">'+esc(o.w)+'</span>';
      }).join(" ");
      return '<div class="feedback '+(pct>=98?"ok":"no")+'">'+pct+"% of words matched. "+
        (pct>=98?"Exact or near-exact match.":"Green = correct, gold underline = word you missed, red strikethrough = extra or wrong word.")+
        '</div><div class="diffline">'+spans+'</div>'+
        '<div class="modelbox"><div class="lbl">Target sentence</div>'+esc(sentence)+'</div>';
    }
    render();
  }
  draw();
}
