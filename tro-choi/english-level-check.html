<style>
:root{--paper: #f7f5ef;--card:#FFFFFF;--ink:#1E2A2F;--muted:#6B6558;--rule:#E4DFD1;--brand:#E5392A;--brand-ink:#FFFFFF;--gold:#B9812C;--navy:#1F3A5F;--good:#2E8B57;--good-soft:#DFF3E6;--bad:#D8402F;--bad-soft:#FBE2DE;
--display:"Big Shoulders Display","Arial Narrow",sans-serif;--body:"Work Sans","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--paper:#161B18;--card:#1F2622;--ink:#EDEAE0;--muted:#9BA69C;--rule:#333C36;--brand:#FF6B5E;--brand-ink:#1A0D08;--gold:#E0AC5A;--navy:#8FB4E6;--good:#4ADE80;--good-soft:#173321;--bad:#FB8177;--bad-soft:#3A1712}}
:root[data-theme="dark"]{color-scheme:dark;--paper:#161B18;--card:#1F2622;--ink:#EDEAE0;--muted:#9BA69C;--rule:#333C36;--brand:#FF6B5E;--brand-ink:#1A0D08;--gold:#E0AC5A;--navy:#8FB4E6;--good:#4ADE80;--good-soft:#173321;--bad:#FB8177;--bad-soft:#3A1712}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);padding-inline:16px;padding-block:20px 40px}
main{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05;font-weight:700}
h1{font-size:clamp(32px,8.5vw,50px);letter-spacing:.01em;text-transform:uppercase}
h2{font-size:23px;text-transform:uppercase;letter-spacing:.01em}
p{margin:0}
.muted{color:var(--muted)}
.brandmark{display:flex;align-items:baseline;gap:1px;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);max-width:680px;margin:0 auto}
.brandmark b{color:var(--ink);font-weight:700}
.brandmark i{font-style:normal;color:var(--gold)}
.vi{font-style:italic;color:var(--muted);font-size:14px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font:700 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
button{font:700 15.5px var(--body);cursor:pointer;border-radius:10px;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:12px 18px;min-height:48px;text-transform:uppercase;letter-spacing:.02em;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);box-shadow:0 3px 0 color-mix(in srgb,var(--brand) 55%,#000)}
button.ghost{background:var(--card);box-shadow:none;border-color:var(--rule);color:var(--muted);font-size:12.5px;padding:8px 14px;min-height:auto;text-transform:none;letter-spacing:0}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.chooser{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.choice{border:2px solid var(--ink);border-radius:14px;background:var(--card);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;text-transform:none;letter-spacing:0;min-height:auto}
.choice b{font-family:var(--display);font-size:23px;text-transform:uppercase;letter-spacing:.01em}
.choice .rng{font:700 11px var(--mono);color:var(--brand);letter-spacing:.05em;text-transform:uppercase}
.choice p{font-size:13.5px;color:var(--muted);font-weight:400}
@media (max-width:520px){.chooser{grid-template-columns:1fr}}
.ticket{display:flex;border:2px solid var(--ink);border-radius:16px;background:var(--card)}
.ticket-main{flex:1;min-width:0;padding:22px;display:flex;flex-direction:column;gap:14px}
.ticket-stub{width:210px;flex:none;padding:22px 18px;display:flex;flex-direction:column;gap:10px;border-left:2px dashed var(--rule);position:relative;background:color-mix(in srgb,var(--brand) 6%,var(--card))}
.ticket-stub::before,.ticket-stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.ticket-stub::before{top:-11px}
.ticket-stub::after{bottom:-11px}
.tk-row{display:flex;gap:8px;flex-wrap:wrap}
.tk-tag{display:inline-flex;align-items:center;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1.5px solid var(--ink);background:var(--gold);color:var(--ink)}
.tk-tag.alt{background:var(--card)}
.stub-row{display:flex;justify-content:space-between;align-items:baseline;font:700 12.5px var(--mono);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px dotted var(--rule);padding-bottom:6px}
.stub-row b{font-family:var(--display);font-size:20px;letter-spacing:0}
.stub-code{font:700 12px var(--mono);letter-spacing:.25em;color:var(--muted);margin-top:auto;text-align:center}
@media (max-width:560px){.ticket{flex-direction:column}.ticket-stub{width:auto;border-left:0;border-top:2px dashed var(--rule)}.ticket-stub::before{left:24px}.ticket-stub::after{left:auto;right:24px;bottom:-11px;top:auto}}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.parts div{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.parts b{font:700 22px var(--display)}
.parts span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font:700 26px var(--mono);font-variant-numeric:tabular-nums;color:var(--navy)}
.timer.low{color:var(--bad)}
.track{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;border:1px solid var(--ink)}
.fill{height:100%;background:var(--brand);transition:width .2s}
.bar::after{content:"";display:block;height:9px;margin-top:8px;background-image:radial-gradient(circle,var(--paper) 0 4px,transparent 4.2px);background-size:16px 9px;background-position:0 0;border-top:2px dashed var(--rule)}
.passage{background:color-mix(in srgb,var(--navy) 7%,var(--card));border:1.5px solid var(--rule);border-radius:10px;padding:16px;font-size:16px;display:flex;flex-direction:column;gap:8px;max-height:38vh;overflow:auto}
.passage h3{font-size:18px;text-transform:none}
.q{font:700 21px/1.3 var(--display);text-transform:none}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;font:16px var(--body);font-weight:500;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);padding:12px 14px;box-shadow:0 2px 0 var(--rule)}
.opt i{font:700 13px var(--mono);font-style:normal;color:var(--card);background:var(--navy);border-radius:6px;padding:2px 7px;min-width:20px;text-align:center}
.opt[aria-checked="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card));box-shadow:inset 0 0 0 2px var(--brand)}
.opt[aria-checked="true"] i{background:var(--brand)}
.nav{display:flex;justify-content:flex-end;gap:12px}
.clip{background:color-mix(in srgb,var(--gold) 14%,var(--card));border:1.5px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.clip .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
textarea{width:100%;min-height:200px;font:16px/1.55 var(--body);padding:14px;border-radius:10px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);resize:vertical}
.big{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:148px;height:148px;flex:none;border-radius:50%;border:4px double var(--brand);transform:rotate(-6deg)}
.band{font:700 clamp(32px,11vw,48px)/1 var(--display);letter-spacing:0;color:var(--brand);text-align:center;padding:0 8px}
.stamp-lbl{font:700 10px var(--mono);letter-spacing:.1em;color:var(--brand);text-transform:uppercase}
.skill{display:grid;grid-template-columns:140px 1fr 52px;gap:10px;align-items:center;font:13px var(--mono);text-transform:uppercase;letter-spacing:.02em}
.skill .track{height:10px}
.skill em{font:700 14px var(--mono);font-style:normal;text-align:right}
.rev{display:flex;flex-direction:column;gap:6px;border-top:1.5px dotted var(--rule);padding-top:12px;font-size:15px}
.tag{font:700 11px var(--mono);padding:3px 9px;border-radius:6px;align-self:flex-start;text-transform:uppercase;letter-spacing:.04em}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.no{background:var(--bad-soft);color:var(--bad)}
.note{font-size:14px;color:var(--muted)}
a{color:var(--navy);font-weight:700;text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px}
.fb{background:color-mix(in srgb,var(--gold) 16%,var(--card));border:1.5px solid var(--rule);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
@media (max-width:520px){.skill{grid-template-columns:104px 1fr 46px}.parts{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

<script>
/* =====================================================================
   Shared helpers
===================================================================== */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){var m=Math.floor(s/60),r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r}
function words(t){return (t.toLowerCase().match(/[a-z']+/g)||[])}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function mk(base,extra){
  var it={b:base.b,q:base.q,fixed:!!base.fixed};
  if(base.fixed){it.o=base.o;it.a=base.a}
  else{var right=base.o[0];it.o=shuffle(base.o);it.a=it.o.indexOf(right)}
  for(var k in extra)it[k]=extra[k];return it;
}
function pickNear(pool,used,val,key,noise){
  var c=[];pool.forEach(function(x,i){if(!used[i])c.push([Math.abs(x[key]-val)+Math.random()*noise,i])});
  c.sort(function(a,b){return a[0]-b[0]});return c.length?c[0][1]:-1;
}
function interp(t,tab){
  if(t<=tab[0][0])return tab[0][1];
  for(var i=1;i<tab.length;i++){if(t<=tab[i][0]){var x0=tab[i-1][0],y0=tab[i-1][1],x1=tab[i][0],y1=tab[i][1];return y0+(y1-y0)*(t-x0)/(x1-x0)}}
  return tab[tab.length-1][1];
}
function irt(theta,b,c){return c+(1-c)/(1+Math.exp(-(theta-b)/.6))}
function estimate(log,mean,sd){
  var g=[],mx=-1e9,t,lp;
  for(t=.5;t<=9.5001;t+=.05){
    lp=-Math.pow((t-mean)/sd,2)/2;
    for(var i=0;i<log.length;i++){var e=log[i];if(e.ex)continue;var p=irt(t,e.item.b,1/e.item.o.length);lp+=Math.log(e.ok?p:1-p)}
    g.push([t,lp]);if(lp>mx)mx=lp;
  }
  var z=0,m=0,v=0;
  g.forEach(function(x){x[1]=Math.exp(x[1]-mx);z+=x[1];m+=x[0]*x[1]});m/=z;
  g.forEach(function(x){v+=(x[0]-m)*(x[0]-m)*x[1]});
  return{theta:m,sd:Math.sqrt(v/z)};
}
function bi(en,vi){var T=curT();return (T&&T.lowVN)? en+" / "+vi : en}

/* ---------- Writing marking ---------- */
function heuristicBand(t){
  var w=words(t),n=w.length;if(n<20)return null;
  var u={};w.forEach(function(x){u[x]=1});
  var ttr=Object.keys(u).length/n,avg=w.join("").length/n,sents=(t.match(/[.!?]+/g)||[]).length||1;
  var c1=Math.min((t.match(/\b(however|although|whereas|moreover|furthermore|therefore|nevertheless|for example|for instance|as a result|while|despite)\b/gi)||[]).length/4,1);
  var c2=Math.min((t.match(/\b(which|who|whereas|although|because|while|if|unless|since|even though)\b/gi)||[]).length/4,1);
  var s=Math.min(n/120,1)*.3+Math.min(Math.max((ttr-.45)/.25,0),1)*.2+Math.min(Math.max((avg-3.9)/1.2,0),1)*.15+c1*.15+c2*.1+Math.min(Math.max((n/sents-9)/10,0),1)*.1;
  return 4+s*3;
}
/* Writing marking via the site's own /api/grade-writing (Groq primary,
   Gemini fallback). The endpoint takes the full essay (up to 3,000
   characters) and returns the four criterion scores plus strengths and
   improvements, or a local automatic check (graded_by "fallback") when
   the AI cannot mark it. 429 = out of free turns today, 503 = not ready.
   Every AI mark is labelled "AI, chưa duyệt". */
function askGradeWriting(essay, prompt, context){
  return fetch("/api/grade-writing",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({essay:String(essay).slice(0,3000),prompt:String(prompt||"").slice(0,200),context:String(context||"").slice(0,200)})})
    .then(function(r){return r.json().then(function(d){return {status:r.status,d:d};});})
    .then(function(res){
      var d=res.d||{};
      if(res.status===200&&d.graded_by)return {ok:true,d:d};
      if(res.status===429)return {ok:false,msg:d.message||"Hôm nay đã hết lượt chấm bài miễn phí, mời bạn quay lại sau 0:00 giờ."};
      if(res.status===503)return {ok:false,msg:d.message||"Tính năng chấm bài AI đang được chuẩn bị, mời bạn quay lại sau."};
      return {ok:false,msg:(d&&d.message)||"Có lỗi xảy ra, mời thử lại sau."};
    })
    .catch(function(){return {ok:false,msg:"Không kết nối được, thử lại sau."};});
}
function gradeWriting(){
  var T=curT(),text=st.text.trim(),n=words(text).length,prompt=st.prompt;
  if(n<20){st.wres={skip:true};showResult();return}
  var done=function(r){st.wres=r;showResult()};
  var fallback=function(){done({h:true,overall:Math.min(7,heuristicBand(text)||4)})};
  askGradeWriting(text,prompt,T.writingCtx).then(function(res){
    if(!res.ok){fallback();return}
    var d=res.d;
    if(d.graded_by==="ai"&&d.task!=null&&d.coherence!=null&&d.lexical!=null&&d.grammar!=null){
      var f=function(x){x=parseFloat(x);return isFinite(x)?Math.max(3,Math.min(9,Math.round(x*2)/2)):null};
      var t=f(d.task),c=f(d.coherence),l=f(d.lexical),g=f(d.grammar);
      if(t==null||c==null||l==null||g==null){fallback();return}
      done({task:t,coherence:c,lexical:l,grammar:g,overall:(t+c+l+g)/4,strengths:d.strengths||"",improve:d.improvements||"",ai:true});
    }else if(d.graded_by==="fallback"&&d.overall!=null){
      done({h:true,overall:Math.min(7,d.overall)});
    }else{fallback();}
  });
}

/* ---------- Result ---------- */
function pct(sec){var a=st.log.filter(function(e){return e.item.sec===sec&&!e.ex}),k=a.filter(function(e){return e.ok}).length;return{n:a.length,k:k,p:a.length?k/a.length:null}}
function bar(n,p,label){p=Math.max(0,Math.min(1,p));return '<div class="skill"><span>'+n+'</span><div class="track"><div class="fill" style="width:'+Math.round(p*100)+'%"></div></div><em>'+label+'</em></div>'}
var MATERIALS={
  G:["A grammar reference at your level (e.g. Cambridge Grammar in Use) — one unit a day, then do its exercises","A vocabulary-in-use book at your level, studied by topic","A spaced-repetition deck (e.g. Anki) of common words at your level, 10 new words a day"],
  L:["Timed practice listening tests for your target exam, then review every wrong answer","Free listening lessons from British Council's LearnEnglish, or your exam board's own practice site","BBC 6 Minute English: listen once for gist, again while taking notes, then check against the transcript"],
  R:["Timed practice reading tests for your target exam, 20 minutes per passage, then review every wrong answer","Practise skimming for the main idea first, then scanning for keywords for detail questions","One BBC News or graded-reader article a day, noting new words"],
  task:["Study your target exam's official writing/speaking descriptors so you know exactly what the top bands need","Plan for a few minutes before writing: a clear position, then one idea per paragraph","Compare your writing to sample answers at the band above yours and note what they cover that yours doesn't"],
  coherence:["Learn a short list of linking words (however, therefore, in addition, for example) and use about one per paragraph, not one per sentence","Keep one main idea per paragraph, with a clear topic sentence","Read your writing aloud and check a stranger could follow it without re-reading"],
  lexical:["A vocabulary-in-use book, focusing on paraphrasing and topic-specific words","Practise rewriting the question in your own words at the start of your answer","Learn a few useful collocations a week, such as 'raise awareness' or 'have a significant impact'"],
  grammar:["A grammar reference, focusing on complex sentences: relative clauses and conditionals","Write three sentences a day, each with a different structure, and check them","When editing, try combining two short sentences into one with 'which', 'because' or 'although'"]
};
var PLAN_LABEL={G:"Grammar & vocabulary",L:"Listening",R:"Reading",task:"Task response",coherence:"Coherence & cohesion",lexical:"Vocabulary in writing",grammar:"Grammar accuracy in writing"};
function skillScores(wr){
  var arr=[];
  ["G","L","R"].forEach(function(s){var r=pct(s);if(r.n)arr.push({k:s,score:r.p})});
  if(wr&&!wr.skip&&!wr.h&&wr.task!=null){["task","coherence","lexical","grammar"].forEach(function(k){arr.push({k:k,score:(wr[k]-3)/6})})}
  arr.sort(function(a,b){return a.score-b.score});
  return arr;
}
function studyPlan(T,comb,wr){
  var weak=skillScores(wr).slice(0,2);
  if(!weak.length)return '';
  var h='<div class="card"><h2>'+esc(T.nextTarget(comb))+'</h2><p class="note">Based on where you lost the most points today, in order.</p>';
  weak.forEach(function(w){h+='<div class="fb"><b>'+esc(PLAN_LABEL[w.k])+'</b>'+MATERIALS[w.k].map(function(m){return '<span>• '+esc(m)+'</span>'}).join('')+'</div>'});
  h+='<p class="note">Give this 3–4 weeks, then retake the check to see if your level has moved.</p></div>';
  return h;
}
function final(){
  var T=curT(),e=estimate(st.log,T.priorMean,T.priorSD),th=e.theta,w=st.wres&&st.wres.overall?st.wres.overall:null;
  var comb=w?th*.75+w*.25:th;
  var half=Math.max(.6,Math.min(1.6,e.sd));
  return{theta:th,comb:comb,lo:comb-half,hi:comb+half};
}
function showResult(){
  var T=curT(),f=final(),wr=st.wres,pending=wr==="pending",d=T.display(f.comb,f.lo,f.hi);
  var h='<div><div class="eyebrow">'+esc(T.name)+'</div><h2 class="t1">Result</h2></div><div class="card">';
  h+='<div class="big"><div class="stamp"><div class="band">'+esc(d.big)+'</div><span class="stamp-lbl">'+esc(d.label)+'</span></div><div><b>'+esc(d.label)+'</b>'+(pending?' (updating when writing is marked)':'')+'<br><span class="muted">Likely between '+esc(d.range)+(d.extra?(' · '+esc(d.extra)):'')+'</span></div></div>';
  h+='<div style="display:flex;flex-direction:column;gap:10px">';
  ["G","L","R"].forEach(function(s){var r=pct(s),nm={G:"Grammar & vocab",L:"Listening",R:"Reading"}[s];h+=r.n?bar(nm,r.p,r.k+"/"+r.n):'<div class="note">'+nm+': not counted.</div>'});
  h+='</div>';
  if(!T.hasWriting){/* no writing section for this test */}
  else if(pending)h+='<div class="fb"><b>Marking your writing…</b><span class="muted">AI đang chấm bài viết của bạn.</span></div>';
  else if(wr&&wr.skip)h+='<div class="note">Writing was too short to mark, so the estimate uses the other parts only.</div>';
  else if(wr&&wr.h)h+='<div class="note">AI chưa chấm được, nên bài viết được chấm bằng cách kiểm tra tự động đơn giản. Chỉ dùng làm tham khảo.</div>';
  else if(wr){
    h+='<div style="display:flex;flex-direction:column;gap:10px"><b>Writing, marked by AI (about '+wr.overall.toFixed(1)+'/9)</b>'+
      bar("Task",(wr.task-3)/6,wr.task.toFixed(1))+bar("Coherence",(wr.coherence-3)/6,wr.coherence.toFixed(1))+bar("Vocabulary",(wr.lexical-3)/6,wr.lexical.toFixed(1))+bar("Grammar",(wr.grammar-3)/6,wr.grammar.toFixed(1))+'</div>'+
      '<div class="fb">'+(wr.strengths?'<span><b>Good:</b> '+esc(wr.strengths)+'</span>':'')+(wr.improve?'<span><b>Improve:</b> '+esc(wr.improve)+'</span>':'')+'</div>'+
      (wr.ai?'<div class="note">AI đã chấm toàn bộ bài viết của bạn (tối đa 3.000 ký tự) — AI, chưa duyệt.</div>':'');
  }
  h+='<p>'+esc(T.advice(pending?f.theta:f.comb))+'</p>';
  var links=T.links(f.comb);
  if(links.length)links.forEach(function(l){h+='<p><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' →</a></p>'});
  h+='<p class="note">With about '+(T.hasWriting?"19":"18")+' questions'+(T.hasWriting?" and one short piece of writing":"")+', the estimate can be off by a wide margin, which is why a range is shown. Difficulty adapts to your answers, guessing is accounted for, and listening uses your browser’s speech voice. Confirm with an official practice test.</p>';
  h+='<div class="nav" style="justify-content:flex-start;gap:10px"><button class="primary" id="re">Take this test again</button><button class="ghost" id="sw">Choose a different test</button></div></div>';
  if(!pending)h+=studyPlan(T,f.comb,wr);
  h+='<div class="card"><h2>Review your answers</h2>';
  st.log.forEach(function(e){var q=e.item,ok=e.ok,g=e.sel;
    h+='<div class="rev"><span class="tag '+(ok?"ok":"no")+'">'+(ok?"Correct":g==null?"Not answered":"Incorrect")+'</span><b>'+esc(q.q)+'</b>'+
    (ok?'':'<span>Your answer: '+(g==null?"–":esc(q.o[g]))+'</span>')+'<span>Correct: '+esc(q.o[q.a])+'</span></div>'});
  h+='</div>';
  app.innerHTML=h;
  document.getElementById("re").onclick=function(){window.scrollTo(0,0);intro(T.id)};
  document.getElementById("sw").onclick=function(){window.scrollTo(0,0);pickTrack()};
  if(!pending&&st.log.length){saveRes(T.id,{label:T.resultPrefix+" "+d.big,date:new Date().toLocaleDateString()})}
}
function finish(){
  if(st.done)return;st.done=true;clearInterval(st.tid);stopSpeech();
  var T=curT();
  if(T.hasWriting){st.wres="pending";showResult();window.scrollTo(0,0);gradeWriting();}
  else{st.wres=null;showResult();window.scrollTo(0,0);}
}
pickTrack();
</script>
