],["C","I am calling the doctor now.","Tôi đang gọi bác sĩ ngay."],["N","I can feel a pulse, but he is breathing slowly. Bring the oxygen.","Tôi bắt được mạch, nhưng ông ấy thở chậm. Mang oxy tới."],["C","Here is the oxygen.","Oxy đây."],["N","Thank you. Stay with me. The doctor is coming.","Cảm ơn. Ở lại với tôi. Bác sĩ đang đến."]]}},{"l":"B1","t":"Taking a full history","v":"Khai thác bệnh sử đầy đủ","c":"I can take a clear, structured history from a patient.","d":[{"t":"Presenting complaint","tip":"Bắt đầu bằng câu hỏi mở: \"What brought you in today?\" rồi để bệnh nhân nói.","p":[["What brought you to the hospital today?","Hôm nay điều gì đưa bạn đến bệnh viện?"],["Can you tell me more about the symptoms?","Bạn có thể nói rõ hơn về các triệu chứng không?"],["How long have you been feeling like this?","Bạn cảm thấy như vậy đã bao lâu rồi?"],["Has anything like this happened before?","Trước đây có từng xảy ra như vậy chưa?"]]},{"t":"Timeline","tip":"Hỏi theo thời gian: onset (khởi phát), duration (thời gian), progression (diễn tiến).","p":[["When did the pain first start?","Cơn đau bắt đầu lần đầu khi nào?"],["Did it come on suddenly or gradually?","Nó đến đột ngột hay từ từ?"],["Has it been getting better or worse?","Nó đang đỡ hơn hay nặng hơn?"],["Does it happen at a certain time of day?","Nó có xảy ra vào một giờ nhất định trong ngày không?"]]},{"t":"Associated symptoms","tip":"Đặt câu hỏi về triệu chứng đi kèm để giúp bác sĩ chẩn đoán.","p":[["Have you noticed any other symptoms?","Bạn có nhận thấy triệu chứng nào khác không?"],["Have you had any fever, chills or sweats?","Bạn có bị sốt, ớn lạnh hoặc đổ mồ hôi không?"],["Have you lost any weight recently?","Gần đây bạn có sụt cân không?"],["Have you noticed any blood in your urine or stool?","Bạn có thấy máu trong nước tiểu hoặc phân không?"]]},{"t":"Medical and surgical history","tip":"Dùng \"Have you ever ...\" để hỏi về tiền sử.","p":[["Have you ever been diagnosed with any long-term conditions?","Bạn từng được chẩn đoán mắc bệnh mạn tính nào chưa?"],["Have you had any operations in the past?","Trước đây bạn có phẫu thuật lần nào không?"],["When was your last hospital stay?","Lần nằm viện gần nhất của bạn là khi nào?"],["Are your vaccinations up to date?","Bạn tiêm chủng đầy đủ chưa?"]]},{"t":"Social history","tip":"Hỏi về đời sống một cách tôn trọng, không phán xét.","p":[["Do you live alone or with family?","Bạn sống một mình hay với gia đình?"],["What kind of work do you do?","Bạn làm nghề gì?"],["How much alcohol do you drink in a typical week?","Một tuần bình thường bạn uống bao nhiêu rượu bia?"],["Do you have any difficulty managing at home?","Bạn có khó khăn gì khi sinh hoạt ở nhà không?"]]}],"dl":{"t":"Taking a history","v":"Khai thác bệnh sử","k":[["N","What brought you to the hospital today, Mr Lee?","Hôm nay điều gì đưa ông đến bệnh viện, ông Lee?"],["P","I have had chest pain since yesterday evening.","Tôi bị đau ngực từ tối qua."],["N","Did it come on suddenly or gradually?","Nó đến đột ngột hay từ từ?"],["P","Suddenly, while I was climbing the stairs.","Đột ngột, khi tôi đang leo cầu thang."],["N","Have you had any shortness of breath or sweating?","Ông có bị khó thở hoặc đổ mồ hôi không?"],["P","Yes, I felt very sweaty and a bit dizzy.","Có, tôi ra nhiều mồ hôi và hơi chóng mặt."],["N","Thank you. I will let the doctor know straight away.","Cảm ơn ông. Tôi sẽ báo bác sĩ ngay."]]}},{"l":"B1","t":"Explaining procedures","v":"Giải thích thủ thuật","c":"I can explain a common procedure to a patient in simple steps.","d":[{"t":"Introducing the procedure","tip":"Nói tên thủ thuật, lý do và thời gian trước khi bắt đầu.","p":[["I am going to take some blood from your arm.","Tôi sắp lấy máu từ tay bạn."],["The test will help us find out what is wrong.","Xét nghiệm này sẽ giúp chúng tôi tìm ra nguyên nhân."],["It will only take a few minutes.","Nó chỉ mất vài phút."],["Do you have any questions before we start?","Bạn có câu hỏi nào trước khi chúng ta bắt đầu không?"]]},{"t":"What will happen","tip":"Giải thích từng bước theo trình tự: first, then, after that, finally.","p":[["First, I will clean the skin with a wipe.","Trước tiên, tôi sẽ lau sạch da bằng gạc."],["Then I will put a small needle into your vein.","Sau đó tôi sẽ đưa một cây kim nhỏ vào tĩnh mạch của bạn."],["After that, I will press a cotton ball on the spot.","Sau đó, tôi sẽ ấn một miếng bông vào chỗ đó."],["Finally, I will put a plaster on it.","Cuối cùng, tôi sẽ dán một miếng băng cá nhân."]]},{"t":"What you may feel","tip":"Báo trước cảm giác: pressure (áp lực), pinch (nhói), warm (ấm).","p":[["You may feel a sharp pinch for a moment.","Bạn có thể thấy nhói một lúc."],["You might feel some pressure, but it should not hurt.","Bạn có thể thấy áp lực nhưng không nên bị đau."],["Please tell me if it becomes too uncomfortable.","Xin báo tôi nếu bạn thấy quá khó chịu."],["You can ask me to stop at any time.","Bạn có thể yêu cầu tôi dừng bất cứ lúc nào."]]},{"t":"What we need from you","tip":"Hướng dẫn bệnh nhân hợp tác: keep still, breathe normally.","p":[["I need you to stay very still.","Tôi cần bạn nằm thật yên."],["Try to relax your arm as much as you can.","Cố gắng thả lỏng cánh tay hết mức có thể."],["Breathe normally and look at the ceiling.","Hãy thở bình thường và nhìn lên trần nhà."],["Please hold this ball and squeeze it gently.","Xin cầm quả bóng này và bóp nhẹ."]]},{"t":"After the procedure","tip":"Dặn dò sau thủ thuật: theo dõi chảy máu, sưng, đau.","p":[["Keep the plaster on for at least two hours.","Giữ miếng băng ít nhất hai tiếng."],["Tell us if you notice bleeding or swelling.","Hãy báo chúng tôi nếu bạn thấy chảy máu hoặc sưng."],["You might have a small bruise, which is normal.","Bạn có thể bị một vết bầm nhỏ, điều này bình thường."],["The results should be back by this afternoon.","Kết quả sẽ có vào chiều nay."]]}],"dl":{"t":"Before a blood test","v":"Trước khi lấy máu","k":[["N","Mrs Hoa, I am going to take some blood from your arm.","Bà Hoa, tôi sắp lấy máu từ tay bà."],["P","Will it hurt?","Có đau không ạ?"],["N","You may feel a sharp pinch for a moment, but it will be quick.","Bà có thể thấy nhói một lúc, nhưng sẽ nhanh thôi."],["P","I am a little afraid of needles.","Tôi hơi sợ kim tiêm."],["N","That is very common. Try to look away and breathe slowly.","Điều đó rất thường gặp. Hãy nhìn đi chỗ khác và thở chậm."],["P","OK. I am ready.","Vâng. Tôi sẵn sàng rồi."],["N","Well done. All finished. Keep the plaster on for two hours.","Tốt lắm. Xong rồi. Giữ miếng băng hai tiếng nhé."]]}},{"l":"B1","t":"Medication instructions","v":"Hướng dẫn dùng thuốc","c":"I can explain the dose, route and possible side effects of a medicine.","d":[{"t":"Dose and frequency","tip":"Dose: liều. Frequency: tần suất. Nói rõ cả hai.","p":[["The usual dose is one tablet twice a day.","Liều thường dùng là một viên, hai lần mỗi ngày."],["Take it every twelve hours, morning and evening.","Uống cách nhau mười hai tiếng, sáng và tối."],["Do not take more than four tablets in twenty-four hours.","Không uống quá bốn viên trong hai mươi bốn giờ."],["If you miss a dose, take it as soon as you remember.","Nếu quên một liều, hãy uống ngay khi nhớ ra."]]},{"t":"Route","tip":"Route: đường dùng thuốc: oral (uống), topical (bôi), intravenous (tiêm tĩnh mạch), inhaled (hít).","p":[["This medicine is given through a drip in your vein.","Thuốc này được truyền qua dây truyền vào tĩnh mạch của bạn."],["You put this cream on the affected area only.","Bạn chỉ bôi kem này lên vùng bị ảnh hưởng."],["Use the inhaler and hold your breath for ten seconds.","Dùng ống hít và nhịn thở mười giây."],["Place the tablet under your tongue and let it dissolve.","Đặt viên thuốc dưới lưỡi và để nó tan."]]},{"t":"Purpose","tip":"Luôn giải thích thuốc dùng để làm gì. Bệnh nhân sẽ tuân thủ tốt hơn.","p":[["This tablet lowers your blood pressure.","Viên này giúp hạ huyết áp của bạn."],["This medicine helps to prevent blood clots.","Thuốc này giúp ngăn ngừa cục máu đông."],["It is an antibiotic to treat your chest infection.","Đây là kháng sinh để điều trị nhiễm trùng phổi của bạn."],["You need to finish the whole course of antibiotics.","Bạn cần uống hết toàn bộ liệu trình kháng sinh."]]},{"t":"Side effects","tip":"Nêu tác dụng phụ thường gặp, và khi nào cần báo ngay.","p":[["Some people feel sleepy after taking it.","Một số người cảm thấy buồn ngủ sau khi uống."],["It may upset your stomach, so take it with food.","Thuốc có thể gây khó chịu dạ dày, nên uống cùng thức ăn."],["Please avoid driving if you feel drowsy.","Xin đừng lái xe nếu bạn thấy buồn ngủ."],["Tell us straight away if you get a rash or swelling.","Hãy báo ngay nếu bạn bị phát ban hoặc sưng."]]},{"t":"Checking understanding","tip":"Yêu cầu bệnh nhân nhắc lại để chắc chắn họ đã hiểu (teach-back).","p":[["Can you tell me how you will take this medicine?","Bạn có thể nói cho tôi biết bạn sẽ dùng thuốc này thế nào không?"],["Is there anything you are unsure about?","Có điều gì bạn chưa chắc chắn không?"],["Would you like me to write the times down?","Bạn có muốn tôi ghi lại các giờ uống thuốc không?"],["Please ask the pharmacist if you have any doubts.","Xin hỏi dược sĩ nếu bạn còn thắc mắc."]]}],"dl":{"t":"Explaining a new medicine","v":"Giải thích thuốc mới","k":[["N","Mr Lee, the doctor has prescribed a new tablet for your blood pressure.","Ông Lee, bác sĩ đã kê một viên thuốc mới cho huyết áp của ông."],["P","How often should I take it?","Tôi nên uống bao lâu một lần?"],["N","Once a day, in the morning, with a glass of water.","Mỗi ngày một lần, vào buổi sáng, với một ly nước."],["P","Are there any side effects?","Có tác dụng phụ nào không?"],["N","Some people feel dizzy, so stand up slowly.","Một số người cảm thấy chóng mặt, nên hãy đứng dậy từ từ."],["P","I see. What if I forget a dose?","Tôi hiểu. Nếu tôi quên một liều thì sao?"],["N","Take it as soon as you remember, but never take two at once.","Uống ngay khi nhớ ra, nhưng không bao giờ uống hai viên cùng lúc."]]}},{"l":"B1","t":"Wound care","v":"Chăm sóc vết thương","c":"I can explain how a wound is cleaned and dressed and how to look after it at home.","d":[{"t":"Assessing a wound","tip":"Mô tả vết thương: size, depth, edges, colour, drainage.","p":[["The wound is about three centimeters long.","Vết thương dài khoảng ba xăng-ti-mét."],["The edges look clean and are healing well.","Mép vết thương sạch và đang lành tốt."],["There is some redness around the wound.","Có chút đỏ xung quanh vết thương."],["There is a small amount of clear fluid on the dressing.","Có một ít dịch trong trên băng."]]},{"t":"Cleaning","tip":"Nói trước bạn sẽ dùng gì: saline, gauze, antiseptic.","p":[["I will clean the wound with sterile saline.","Tôi sẽ rửa vết thương bằng nước muối vô trùng."],["This may sting a little at first.","Lúc đầu có thể hơi xót."],["I will gently pat the area dry with gauze.","Tôi sẽ nhẹ nhàng thấm khô vùng đó bằng gạc."],["Let me know if it becomes painful.","Hãy cho tôi biết nếu bạn thấy đau."]]},{"t":"Dressing","tip":"Loại băng: adhesive dressing, gauze, bandage.","p":[["I will cover the wound with a clean dressing.","Tôi sẽ che vết thương bằng băng sạch."],["The dressing needs to stay dry.","Băng cần được giữ khô."],["We will change it every two days.","Chúng tôi sẽ thay băng mỗi hai ngày."],["Please do not remove the tape yourself.","Xin đừng tự bóc băng dính."]]},{"t":"Signs of infection","tip":"Học các dấu hiệu nhiễm trùng: redness, swelling, warmth, pus, fever.","p":[["Watch for increasing redness, swelling or heat.","Hãy chú ý nếu đỏ, sưng hoặc nóng tăng lên."],["Let us know if there is pus or a bad smell.","Hãy báo chúng tôi nếu có mủ hoặc mùi hôi."],["A high temperature can also be a sign of infection.","Sốt cao cũng có thể là dấu hiệu nhiễm trùng."],["Come back if the pain gets worse.","Hãy quay lại nếu cơn đau nặng hơn."]]},{"t":"Healing advice","tip":"Lời khuyên giúp vết thương mau lành: nghỉ ngơi, dinh dưỡng, không hút thuốc.","p":[["Eating enough protein helps wounds heal.","Ăn đủ chất đạm giúp vết thương lành."],["Try not to scratch or pick at the area.","Cố gắng đừng gãi hoặc cạy vùng đó."],["Keep your leg raised when you are sitting.","Kê cao chân khi bạn ngồi."],["The stitches will be taken out in ten days.","Chỉ khâu sẽ được cắt sau mười ngày."]]}],"dl":{"t":"Changing a dressing","v":"Thay băng","k":[["N","Mr Lee, it is time to change your dressing. Is that all right?","Ông Lee, đến lúc thay băng của ông. Được không ạ?"],["P","Yes. Does it need to be changed every day?","Vâng. Có cần thay hằng ngày không?"],["N","Every two days, unless it gets wet.","Mỗi hai ngày, trừ khi băng bị ướt."],["P","How does the wound look?","Vết thương trông thế nào?"],["N","It looks clean, and the edges are healing well.","Nó sạch và mép vết thương đang lành tốt."],["P","That is good news. What should I watch for?","Tin tốt quá. Tôi nên chú ý điều gì?"],["N","Redness, swelling, pus or a fever. Tell us straight away if you notice any.","Đỏ, sưng, mủ hoặc sốt. Hãy báo ngay nếu ông thấy dấu hiệu nào."]]}},{"l":"B1","t":"Handover basics","v":"Bàn giao ca cơ bản","c":"I can give a short, clear handover about a patient to the next nurse.","d":[{"t":"Opening a handover","tip":"Bắt đầu bằng tên, tuổi, giường, chẩn đoán.","p":[["This is Mr Lee in bed twelve, aged sixty-five.","Đây là ông Lee ở giường mười hai, sáu mươi lăm tuổi."],["He was admitted yesterday with chest pain.","Ông nhập viện hôm qua vì đau ngực."],["He is under Doctor Nam's care.","Ông đang được bác sĩ Nam phụ trách."],["He is allergic to penicillin.","Ông dị ứng với penicillin."]]},{"t":"Current condition","tip":"Nói tình trạng hiện tại: stable, improving, deteriorating.","p":[["His condition is stable at the moment.","Hiện tại tình trạng của ông ổn định."],["He has been improving since this morning.","Ông đã khá lên từ sáng nay."],["His blood pressure was slightly high at noon.","Huyết áp của ông hơi cao lúc trưa."],["He has had no pain since the medication.","Ông không còn đau kể từ khi dùng thuốc."]]},{"t":"Care given","tip":"Nói việc đã làm trong ca.","p":[["I have given his morning medication.","Tôi đã cho ông uống thuốc buổi sáng."],["His dressing was changed at ten o'clock.","Băng của ông được thay lúc mười giờ."],["I helped him to walk to the bathroom twice.","Tôi đã giúp ông đi đến nhà vệ sinh hai lần."],["He has drunk about one liter of fluid.","Ông đã uống khoảng một lít nước."]]},{"t":"Outstanding tasks","tip":"Nói rõ việc cần làm tiếp: due, overdue, to be done.","p":[["His blood test results are still pending.","Kết quả xét nghiệm máu của ông vẫn chưa có."],["He is due for his next dose at three o'clock.","Ông đến giờ uống liều tiếp theo lúc ba giờ."],["Please check his blood pressure again at four.","Xin đo lại huyết áp của ông lúc bốn giờ."],["He needs help to get out of bed.","Ông cần được giúp để ra khỏi giường."]]},{"t":"Concerns and questions","tip":"Kết thúc bằng lo ngại và hỏi lại: \"Any questions?\"","p":[["I am a little worried about his breathing.","Tôi hơi lo về nhịp thở của ông."],["The family would like to speak with the doctor.","Gia đình muốn nói chuyện với bác sĩ."],["Do you have any questions about this patient?","Bạn có câu hỏi nào về bệnh nhân này không?"],["Please call me if you need anything else.","Xin gọi tôi nếu bạn cần gì thêm."]]}],"dl":{"t":"A short handover","v":"Bàn giao ngắn","k":[["N","This is Mr Lee in bed twelve. He was admitted yesterday with chest pain.","Đây là ông Lee ở giường mười hai. Ông nhập viện hôm qua vì đau ngực."],["C","How is he now?","Bây giờ ông ấy thế nào?"],["N","He is stable and has had no pain since the medication.","Ông ổn định và không đau kể từ khi dùng thuốc."],["C","Any allergies?","Có dị ứng không?"],["N","Yes, he is allergic to penicillin. His blood results are still pending.","Có, ông dị ứng với penicillin. Kết quả xét nghiệm máu vẫn chưa có."],["C","OK. Anything else I should know?","Được. Còn gì tôi cần biết nữa không?"],["N","He needs help to get out of bed. Please check his blood pressure again at four.","Ông cần được giúp để ra khỏi giường. Xin đo lại huyết áp của ông lúc bốn giờ."]]}},{"l":"B1","t":"Talking to doctors","v":"Trao đổi với bác sĩ","c":"I can report a change in a patient's condition and ask a doctor for advice.","d":[{"t":"Getting attention","tip":"Nêu tên, khoa, bệnh nhân và lý do gọi ngay từ đầu.","p":[["Doctor, do you have a moment?","Bác sĩ, ông có rảnh một lát không?"],["I am calling about Mrs Hoa in bed four.","Tôi gọi về bà Hoa ở giường bốn."],["I am concerned about her condition.","Tôi lo về tình trạng của bà ấy."],["Could you come and see her, please?","Bác sĩ đến xem bà ấy được không?"]]},{"t":"Reporting changes","tip":"Mô tả thay đổi bằng số liệu cụ thể, không chỉ nói \"worse\".","p":[["Her temperature has risen to thirty-eight point five.","Nhiệt độ của bà đã tăng lên ba mươi tám độ rưỡi."],["Her blood pressure has dropped since this morning.","Huyết áp của bà đã giảm từ sáng nay."],["She has become more drowsy in the last hour.","Bà đã trở nên buồn ngủ hơn trong một giờ qua."],["Her pain has not improved with the painkillers.","Cơn đau của bà không đỡ dù đã dùng thuốc giảm đau."]]},{"t":"Giving results","tip":"Nêu rõ kết quả và xu hướng.","p":[["The blood test shows a high white cell count.","Xét nghiệm máu cho thấy bạch cầu tăng cao."],["Her oxygen level is ninety-two percent on air.","Chỉ số oxy của bà là chín mươi hai phần trăm khi thở khí trời."],["Her urine output is low today.","Lượng nước tiểu của bà hôm nay thấp."],["These readings are different from yesterday.","Các chỉ số này khác với hôm qua."]]},{"t":"Asking for advice","tip":"Hỏi cụ thể điều bạn cần: review, order, advice.","p":[["What would you like me to do?","Bác sĩ muốn tôi làm gì?"],["Should I give her some extra fluids?","Tôi có nên cho bà thêm dịch không?"],["Would you like me to repeat her observations in an hour?","Bác sĩ có muốn tôi đo lại chỉ số của bà sau một giờ không?"],["Can you write up a plan for tonight?","Bác sĩ có thể ghi kế hoạch cho tối nay không?"]]},{"t":"Confirming orders","tip":"Đọc lại y lệnh để xác nhận: \"So you would like me to ...\"","p":[["So you would like me to give one liter of saline?","Vậy bác sĩ muốn tôi truyền một lít nước muối?"],["I will start that straight away.","Tôi sẽ bắt đầu ngay."],["Let me read that back to you.","Để tôi đọc lại cho bác sĩ."],["I will call you again if her condition changes.","Tôi sẽ gọi lại nếu tình trạng của bà thay đổi."]]}],"dl":{"t":"Calling the doctor","v":"Gọi bác sĩ","k":[["N","Doctor Nam, it is Linh from Ward Five. I am calling about Mrs Hoa in bed four.","Bác sĩ Nam, Linh ở Khoa Năm đây. Tôi gọi về bà Hoa ở giường bốn."],["D","What is the problem?","Có vấn đề gì?"],["N","Her temperature has risen to thirty-eight point five and she is more drowsy.","Nhiệt độ của bà tăng lên ba mươi tám độ rưỡi và bà buồn ngủ hơn."],["D","What is her blood pressure?","Huyết áp của bà thế nào?"],["N","One hundred over sixty, lower than this morning.","Một trăm trên sáu mươi, thấp hơn sáng nay."],["D","I will come and see her. Start some fluids first.","Tôi sẽ đến xem bà ấy. Hãy truyền dịch trước."],["N","So you would like me to start one liter of saline? I will do it now.","Vậy bác sĩ muốn tôi truyền một lít nước muối? Tôi sẽ làm ngay."]]}},{"l":"B1","t":"Long-term conditions","v":"Bệnh mạn tính","c":"I can talk with a patient about a long-term condition such as diabetes, high blood pressure or asthma.","d":[{"t":"Diabetes","tip":"Blood sugar: đường huyết. Insulin: insulin.","p":[["Your blood sugar level is a little high today.","Đường huyết của bạn hôm nay hơi cao."],["I need to check your blood sugar before meals.","Tôi cần đo đường huyết của bạn trước bữa ăn."],["Diabetes means your body cannot control sugar well.","Tiểu đường nghĩa là cơ thể bạn không kiểm soát đường tốt."],["You will need insulin injections with your meals.","Bạn sẽ cần tiêm insulin cùng bữa ăn."]]},{"t":"High blood pressure","tip":"Hypertension: cao huyết áp. Giải thích nguy cơ và cách kiểm soát.","p":[["High blood pressure often has no symptoms.","Cao huyết áp thường không có triệu chứng."],["It can increase the risk of a stroke or heart attack.","Nó có thể làm tăng nguy cơ đột quỵ hoặc nhồi máu cơ tim."],["Reducing salt in your diet can help.","Giảm muối trong chế độ ăn có thể giúp ích."],["It is important to take your tablets every day.","Việc uống thuốc mỗi ngày là rất quan trọng."]]},{"t":"Asthma and breathing","tip":"Inhaler: ống hít. Trigger: yếu tố khởi phát.","p":[["Do you know what triggers your asthma?","Bạn có biết điều gì làm hen của bạn khởi phát không?"],["Use the blue inhaler when you feel wheezy.","Dùng ống hít màu xanh khi bạn thấy khò khè."],["Rinse your mouth after using the brown inhaler.","Súc miệng sau khi dùng ống hít màu nâu."],["Avoid dust, smoke and cold air if you can.","Hãy tránh bụi, khói và không khí lạnh nếu có thể."]]},{"t":"Monitoring at home","tip":"Khuyến khích bệnh nhân tự theo dõi tại nhà.","p":[["Please write down your readings in this diary.","Xin ghi các chỉ số của bạn vào cuốn nhật ký này."],["Check your blood pressure at the same time each day.","Đo huyết áp vào cùng một giờ mỗi ngày."],["Weigh yourself every morning.","Cân mình mỗi sáng."],["Bring the diary to your next appointment.","Mang cuốn nhật ký này đến cuộc hẹn tiếp theo."]]},{"t":"Lifestyle","tip":"Đưa lời khuyên thực tế, phù hợp hoàn cảnh của bệnh nhân.","p":[["Regular walking is good for your heart.","Đi bộ đều đặn tốt cho tim của bạn."],["Try to eat smaller meals more often.","Cố gắng ăn các bữa nhỏ hơn nhưng thường xuyên hơn."],["Stopping smoking is the best thing you can do.","Bỏ hút thuốc là điều tốt nhất bạn có thể làm."],["We can refer you to a support group.","Chúng tôi có thể giới thiệu bạn đến một nhóm hỗ trợ."]]}],"dl":{"t":"Living with diabetes","v":"Sống chung với tiểu đường","k":[["N","Mrs Hoa, your blood sugar is a little high today.","Bà Hoa, đường huyết của bà hôm nay hơi cao."],["P","I have had diabetes for five years. I find it hard to control.","Tôi bị tiểu đường năm năm rồi. Tôi thấy khó kiểm soát."],["N","It can be difficult. What do you usually eat for breakfast?","Có thể khó. Bà thường ăn gì vào bữa sáng?"],["P","White rice and sweet tea.","Cơm trắng và trà ngọt."],["N","Try wholegrain food and tea without sugar. That can help.","Hãy thử ngũ cốc nguyên hạt và trà không đường. Điều đó có thể giúp ích."],["P","I will try. Should I check my sugar every day?","Tôi sẽ thử. Tôi có nên đo đường mỗi ngày không?"],["N","Yes, and write the numbers in this diary. Bring it to your next appointment.","Có, và ghi các con số vào cuốn nhật ký này. Mang nó đến cuộc hẹn tiếp theo."]]}},{"l":"B1","t":"Reassurance & comfort","v":"Trấn an & an ủi","c":"I can reassure an anxious patient or family member with kind, clear language.","d":[{"t":"Listening","tip":"Lắng nghe chủ động: nhắc lại điều bệnh nhân nói.","p":[["You seem worried. Can you tell me what is on your mind?","Trông bạn có vẻ lo lắng. Bạn có thể cho tôi biết bạn đang nghĩ gì không?"],["I can see that this is a difficult time for you.","Tôi thấy đây là thời điểm khó khăn với bạn."],["Take your time. I am listening.","Cứ từ từ. Tôi đang lắng nghe."],["Thank you for telling me how you feel.","Cảm ơn bạn đã cho tôi biết bạn cảm thấy thế nào."]]},{"t":"Showing understanding","tip":"Câu đồng cảm: \"It is understandable that ...\"","p":[["It is completely understandable to feel frightened.","Cảm thấy sợ hãi là hoàn toàn dễ hiểu."],["Many patients feel the same way before an operation.","Nhiều bệnh nhân cảm thấy như vậy trước ca mổ."],["You are not alone in this.","Bạn không đơn độc trong chuyện này."],["I would feel nervous too in your situation.","Nếu ở hoàn cảnh của bạn, tôi cũng sẽ lo lắng."]]},{"t":"Giving information","tip":"Thông tin rõ ràng giúp giảm lo âu.","p":[["Let me explain what will happen next.","Để tôi giải thích điều gì sẽ xảy ra tiếp theo."],["The doctor will talk to you about the results today.","Hôm nay bác sĩ sẽ trao đổi với bạn về kết quả."],["We will look after you every step of the way.","Chúng tôi sẽ chăm sóc bạn ở mọi bước."],["I will stay with you until the doctor arrives.","Tôi sẽ ở lại với bạn cho đến khi bác sĩ đến."]]},{"t":"Practical comfort","tip":"Hành động nhỏ cũng có ý nghĩa: nước, chăn, gọi gia đình.","p":[["Would you like a glass of water?","Bạn có muốn một ly nước không?"],["Shall I ask your family to come in?","Tôi mời gia đình bạn vào nhé?"],["Let me adjust your pillow so you feel comfortable.","Để tôi chỉnh lại gối cho bạn thoải mái."],["Would you like some time alone?","Bạn có muốn ở một mình một lát không?"]]},{"t":"Avoid false promises","tip":"Đừng nói \"Everything will be fine\" nếu bạn chưa chắc.","p":[["I cannot promise anything, but we will do our best.","Tôi không thể hứa điều gì, nhưng chúng tôi sẽ cố gắng hết sức."],["I will find out and let you know as soon as I can.","Tôi sẽ tìm hiểu và báo cho bạn sớm nhất có thể."],["What worries you most right now?","Điều gì làm bạn lo nhất lúc này?"],["Is there anyone you would like me to call?","Bạn có muốn tôi gọi cho ai không?"]]}],"dl":{"t":"Reassuring an anxious patient","v":"Trấn an bệnh nhân lo lắng","k":[["N","Mrs Hoa, you seem worried. Can you tell me what is on your mind?","Bà Hoa, trông bà có vẻ lo lắng. Bà có thể cho tôi biết bà đang nghĩ gì không?"],["P","I am afraid of the operation tomorrow.","Tôi sợ ca mổ ngày mai."],["N","It is completely understandable. Many patients feel the same way.","Điều đó hoàn toàn dễ hiểu. Nhiều bệnh nhân cũng cảm thấy như vậy."],["P","What if something goes wrong?","Nếu có chuyện gì xảy ra thì sao?"],["N","I cannot promise anything, but the team will look after you every step of the way.","Tôi không thể hứa điều gì, nhưng cả đội sẽ chăm sóc bà ở mọi bước."],["P","Thank you. That helps.","Cảm ơn cô. Điều đó giúp tôi bớt lo."],["N","Would you like me to ask your daughter to come in?","Bà có muốn tôi mời con gái bà vào không?"]]}},{"l":"B1","t":"Consent & patient rights","v":"Đồng ý điều trị & quyền bệnh nhân","c":"I can check that a patient understands and agrees to care, and explain basic patient rights.","d":[{"t":"Asking for consent","tip":"Consent phải có thông tin đầy đủ, tự nguyện và có thể rút lại.","p":[["Before we start, I need to ask for your permission.","Trước khi bắt đầu, tôi cần xin phép bạn."],["Do you agree to have this procedure?","Bạn có đồng ý làm thủ thuật này không?"],["You do not have to agree if you do not want to.","Bạn không bắt buộc phải đồng ý nếu bạn không muốn."],["You can change your mind at any time.","Bạn có thể đổi ý bất cứ lúc nào."]]},{"t":"Explaining options","tip":"Nêu lợi ích, rủi ro và các lựa chọn khác.","p":[["The doctor will explain the benefits and the risks.","Bác sĩ sẽ giải thích lợi ích và rủi ro."],["There are other options, such as tablets instead of surgery.","Có những lựa chọn khác, chẳng hạn dùng thuốc thay vì phẫu thuật."],["Would you like more time to think about it?","Bạn có muốn có thêm thời gian để suy nghĩ không?"],["You are welcome to discuss it with your family.","Bạn có thể trao đổi với gia đình."]]},{"t":"Signing forms","tip":"Đảm bảo bệnh nhân đọc và hiểu giấy đồng ý trước khi ký.","p":[["Please read this form carefully.","Xin đọc kỹ mẫu này."],["If anything is unclear, please ask me.","Nếu điều gì chưa rõ, xin hỏi tôi."],["Please sign here if you agree.","Xin ký vào đây nếu bạn đồng ý."],["I will give you a copy for your records.","Tôi sẽ đưa bạn một bản sao để lưu."]]},{"t":"Privacy and confidentiality","tip":"Bảo mật thông tin bệnh nhân là nghĩa vụ đạo đức và pháp lý.","p":[["Your information is kept private and confidential.","Thông tin của bạn được giữ kín và bảo mật."],["We only share it with staff involved in your care.","Chúng tôi chỉ chia sẻ với nhân viên tham gia chăm sóc bạn."],["Who are you happy for us to talk to about your health?","Bạn muốn chúng tôi trao đổi về sức khỏe của bạn với ai?"],["We cannot give details to anyone without your permission.","Chúng tôi không thể cung cấp thông tin cho ai khi chưa có phép của bạn."]]},{"t":"Rights and complaints","tip":"Bệnh nhân có quyền được thông tin, quyền từ chối và quyền khiếu nại.","p":[["You have the right to ask questions about your care.","Bạn có quyền hỏi về việc chăm sóc của bạn."],["You can refuse treatment, and we will respect your decision.","Bạn có thể từ chối điều trị và chúng tôi sẽ tôn trọng quyết định của bạn."],["If you are unhappy, you can speak to the nurse in charge.","Nếu bạn không hài lòng, bạn có thể nói với điều dưỡng trưởng."],["This leaflet explains how to make a complaint.","Tờ rơi này giải thích cách khiếu nại."]]}],"dl":{"t":"Checking consent","v":"Kiểm tra sự đồng ý","k":[["N","Mr Lee, the doctor has explained your procedure. Do you have any questions?","Ông Lee, bác sĩ đã giải thích về thủ thuật của ông. Ông có câu hỏi nào không?"],["P","What are the risks?","Rủi ro là gì?"],["N","The doctor will explain that in detail. Would you like more time to think?","Bác sĩ sẽ giải thích chi tiết. Ông có muốn có thêm thời gian suy nghĩ không?"],["P","No, I have decided to go ahead.","Không, tôi đã quyết định làm."],["N","Please read the form carefully and sign here if you agree.","Xin ông đọc kỹ mẫu và ký vào đây nếu ông đồng ý."],["P","Can I change my mind later?","Sau này tôi có thể đổi ý không?"],["N","Yes, you can change your mind at any time.","Được, ông có thể đổi ý bất cứ lúc nào."]]}},{"l":"B1","t":"Before & after surgery","v":"Trước & sau phẫu thuật","c":"I can prepare a patient for an operation and give simple care instructions afterwards.","d":[{"t":"Pre-op preparation","tip":"Kiểm tra: nhịn ăn, trang sức, răng giả, giấy đồng ý.","p":[["You must not eat or drink after midnight.","Bạn không được ăn uống gì sau nửa đêm."],["Please take off your jewelry and dentures.","Xin tháo trang sức và răng giả."],["Have you signed the consent form?","Bạn đã ký giấy đồng ý chưa?"],["I will give you a gown to change into.","Tôi sẽ đưa bạn áo choàng để thay."]]},{"t":"Going to theatre","tip":"\"Theatre\" là phòng mổ. Giải thích quy trình đến khi ngủ mê.","p":[["A porter will take you to the operating theatre.","Nhân viên vận chuyển sẽ đưa bạn đến phòng mổ."],["The anesthetist will talk to you before the operation.","Bác sĩ gây mê sẽ trao đổi với bạn trước ca mổ."],["You will be asleep during the operation.","Bạn sẽ ngủ trong suốt ca mổ."],["I will be waiting for you when you wake up.","Tôi sẽ đợi bạn khi bạn tỉnh dậy."]]},{"t":"Waking up","tip":"Sau mổ: giải thích ở đâu, chuyện gì đang xảy ra.","p":[["The operation is over and everything went well.","Ca mổ đã xong và mọi thứ đều tốt."],["You are in the recovery room.","Bạn đang ở phòng hồi tỉnh."],["You may feel sleepy and a bit sore.","Bạn có thể buồn ngủ và hơi đau."],["Can you tell me if you have any pain or nausea?","Bạn cho tôi biết bạn có đau hoặc buồn nôn không?"]]},{"t":"Post-op care","tip":"Theo dõi vết mổ, đau, dẫn lưu, vận động sớm.","p":[["I will check your wound and vital signs regularly.","Tôi sẽ kiểm tra vết mổ và các chỉ số sinh tồn thường xuyên."],["Please tell us when the pain gets worse.","Xin báo chúng tôi khi cơn đau nặng hơn."],["The drain will be removed in two days.","Ống dẫn lưu sẽ được rút sau hai ngày."],["We will help you walk a little today.","Hôm nay chúng tôi sẽ giúp bạn đi lại một chút."]]},{"t":"Preventing complications","tip":"Hít thở sâu, ho, di chuyển chân: giúp ngừa viêm phổi và huyết khối.","p":[["Take ten deep breaths every hour.","Hít thở sâu mười lần mỗi giờ."],["Support your wound with a pillow when you cough.","Dùng gối đỡ vết mổ khi bạn ho."],["Move your feet and ankles to help blood flow.","Cử động bàn chân và mắt cá để giúp máu lưu thông."],["Getting up early helps you recover faster.","Ngồi dậy sớm giúp bạn hồi phục nhanh hơn."]]}],"dl":{"t":"After the operation","v":"Sau ca mổ","k":[["N","Mrs Hoa, the operation is over and everything went well.","Bà Hoa, ca mổ đã xong và mọi thứ đều tốt."],["P","Where am I?","Tôi đang ở đâu?"],["N","You are in the recovery room. How is your pain?","Bà đang ở phòng hồi tỉnh. Cơn đau của bà thế nào?"],["P","It is about five out of ten.","Khoảng năm trên mười."],["N","I will give you some medicine. Please breathe deeply every hour.","Tôi sẽ cho bà thuốc. Xin hít thở sâu mỗi giờ."],["P","Can I drink some water?","Tôi uống nước được không?"],["N","A few sips for now. We will help you sit up later today.","Bây giờ chỉ vài ngụm thôi. Chiều nay chúng tôi sẽ giúp bà ngồi dậy."]]}},{"l":"B1","t":"Infection control","v":"Kiểm soát nhiễm khuẩn","c":"I can explain hand hygiene and protective equipment to patients and visitors.","d":[{"t":"Hand hygiene","tip":"Rửa tay đúng lúc: trước và sau tiếp xúc, trước thủ thuật, sau chạm bệnh nhân.","p":[["I must wash my hands before I touch you.","Tôi phải rửa tay trước khi chạm vào bạn."],["Please use the hand gel when you enter and leave.","Xin dùng nước rửa tay khi vào và khi ra."],["Rub your hands together for at least twenty seconds.","Xoa hai tay vào nhau ít nhất hai mươi giây."],["Clean between your fingers and under your nails.","Làm sạch giữa các ngón tay và dưới móng tay."]]},{"t":"Protective equipment","tip":"PPE: gloves, mask, gown, goggles. Mặc và cởi đúng thứ tự.","p":[["I am wearing gloves and a mask to protect us both.","Tôi đeo găng tay và khẩu trang để bảo vệ cả hai chúng ta."],["Please put on this mask before you come in.","Xin đeo khẩu trang này trước khi vào."],["Visitors need to wear a gown in this room.","Người thăm phải mặc áo choàng trong phòng này."],["Remove your gloves and wash your hands afterwards.","Tháo găng tay và rửa tay sau đó."]]},{"t":"Isolation","tip":"Giải thích lý do cách ly để bệnh nhân không cảm thấy bị kỳ thị.","p":[["You are in a single room to stop infection spreading.","Bạn ở phòng đơn để ngăn nhiễm trùng lây lan."],["Please keep the door closed.","Xin giữ cửa đóng."],["Only essential visitors can come in.","Chỉ người thăm cần thiết mới được vào."],["This is only for a short time, until your results come back.","Việc này chỉ trong thời gian ngắn, cho đến khi có kết quả."]]},{"t":"Sharps and waste","tip":"An toàn với vật sắc nhọn: không đậy nắp lại, bỏ ngay vào hộp.","p":[["Put used needles straight into the sharps box.","Bỏ kim đã dùng thẳng vào hộp đựng vật sắc nhọn."],["Never recap a needle.","Không bao giờ đậy nắp lại kim tiêm."],["Clinical waste goes in the yellow bag.","Rác y tế bỏ vào túi màu vàng."],["Report any needle-stick injury immediately.","Báo ngay bất kỳ tai nạn kim đâm nào."]]},{"t":"Prevention advice","tip":"Hướng dẫn phòng ngừa cho người bệnh và người nhà.","p":[["Cover your mouth when you cough or sneeze.","Che miệng khi bạn ho hoặc hắt hơi."],["Throw used tissues in the bin straight away.","Bỏ khăn giấy đã dùng vào thùng rác ngay."],["Stay home if you have a fever or diarrhea.","Ở nhà nếu bạn bị sốt hoặc tiêu chảy."],["Getting vaccinated protects you and others.","Tiêm chủng bảo vệ bạn và người khác."]]}],"dl":{"t":"Explaining isolation","v":"Giải thích cách ly","k":[["P","Why am I in a single room?","Sao tôi ở phòng đơn?"],["N","We need to stop infection spreading while we wait for your test results.","Chúng tôi cần ngăn nhiễm trùng lây lan trong khi chờ kết quả xét nghiệm."],["P","Can my family visit me?","Gia đình tôi thăm tôi được không?"],["N","Yes, but they need to wear a gown and gloves and use the hand gel.","Được, nhưng họ cần mặc áo choàng, đeo găng tay và dùng nước rửa tay."],["P","How long will this last?","Việc này kéo dài bao lâu?"],["N","Only until your results come back, probably tomorrow.","Chỉ cho đến khi có kết quả, có thể là ngày mai."],["P","I understand. Thank you for explaining.","Tôi hiểu rồi. Cảm ơn cô đã giải thích."]]}},{"l":"B1","t":"Going home","v":"Chuẩn bị xuất viện","c":"I can explain the basics of discharge and follow-up care.","d":[{"t":"Discharge plan","tip":"Nói ngày giờ xuất viện, ai đến đón, phương tiện.","p":[["The doctor says you can go home tomorrow.","Bác sĩ nói bạn có thể về nhà vào ngày mai."],["Will someone be able to pick you up?","Có ai đến đón bạn được không?"],["Please be ready by ten o'clock in the morning.","Xin sẵn sàng trước mười giờ sáng."],["We will arrange transport if you need it.","Chúng tôi sẽ sắp xếp phương tiện nếu bạn cần."]]},{"t":"Medicines to take home","tip":"Kiểm tra bệnh nhân hiểu từng loại thuốc trước khi rời.","p":[["Here are the medicines you need to take at home.","Đây là những thuốc bạn cần uống ở nhà."],["The pharmacist will explain each one to you.","Dược sĩ sẽ giải thích từng loại cho bạn."],["This list shows when to take each medicine.","Danh sách này cho biết khi nào uống mỗi loại thuốc."],["Please do not stop taking them without asking.","Xin đừng ngừng thuốc mà không hỏi."]]},{"t":"Follow-up","tip":"Ghi rõ lịch tái khám, xét nghiệm, người liên hệ.","p":[["You have a follow-up appointment in two weeks.","Bạn có hẹn tái khám sau hai tuần."],["You will need a blood test before that visit.","Bạn sẽ cần xét nghiệm máu trước lần khám đó."],["The clinic will send you a letter with the date.","Phòng khám sẽ gửi thư cho bạn có ghi ngày."],["Please bring this discharge summary with you.","Xin mang theo bản tóm tắt xuất viện này."]]},{"t":"Advice at home","tip":"Nghỉ ngơi, hoạt động, ăn uống, dấu hiệu nguy hiểm.","p":[["Rest for a few days and increase activity slowly.","Nghỉ ngơi vài ngày và tăng hoạt động từ từ."],["Do not lift anything heavy for four weeks.","Không mang vác nặng trong bốn tuần."],["Keep the wound clean and dry.","Giữ vết thương sạch và khô."],["Continue with your low-salt diet.","Tiếp tục chế độ ăn ít muối."]]},{"t":"When to get help","tip":"Hướng dẫn rõ khi nào gọi cấp cứu, khi nào gọi phòng khám.","p":[["Call an ambulance if you have severe chest pain.","Gọi xe cứu thương nếu bạn đau ngực dữ dội."],["Contact your doctor if you have a high fever.","Liên hệ bác sĩ nếu bạn sốt cao."],["Come back if the wound becomes red or leaks.","Quay lại nếu vết thương đỏ hoặc rỉ dịch."],["This is the number to call if you have any worries.","Đây là số để gọi nếu bạn có lo lắng gì."]]}],"dl":{"t":"Discharge advice","v":"Dặn dò xuất viện","k":[["N","Mr Lee, good news. The doctor says you can go home tomorrow.","Ông Lee, tin vui. Bác sĩ nói ông có thể về nhà vào ngày mai."],["P","That is wonderful. What should I do at home?","Tuyệt quá. Ở nhà tôi nên làm gì?"],["N","Rest for a few days and do not lift anything heavy for four weeks.","Nghỉ ngơi vài ngày và không mang vác nặng trong bốn tuần."],["P","Do I need to keep taking my tablets?","Tôi có cần tiếp tục uống thuốc không?"],["N","Yes. The pharmacist will explain each one before you leave.","Có. Dược sĩ sẽ giải thích từng loại trước khi ông rời đi."],["P","When is my next appointment?","Khi nào tôi tái khám?"],["N","In two weeks. Call an ambulance if you get severe chest pain.","Sau hai tuần. Hãy gọi xe cứu thương nếu ông đau ngực dữ dội."]]}},{"l":"B1","t":"Calling other departments","v":"Gọi các khoa & bộ phận khác","c":"I can make and take work phone calls with the lab, pharmacy and other wards.","d":[{"t":"Making a call","tip":"Nêu tên, khoa và mục đích ngay từ đầu.","p":[["Hello, this is Linh, a nurse from Ward Five.","Xin chào, tôi là Linh, điều dưỡng Khoa Năm."],["I am calling to check on a blood test result.","Tôi gọi để kiểm tra một kết quả xét nghiệm máu."],["Could you tell me who is in charge today?","Bạn cho tôi biết ai phụ trách hôm nay không?"],["Can I speak to someone in the pharmacy, please?","Tôi nói chuyện với ai đó ở nhà thuốc được không?"]]},{"t":"Requesting information","tip":"Đưa thông tin nhận dạng đầy đủ: tên, ngày sinh, mã số.","p":[["The patient's name is Tom Lee, born on the fourth of June, 1960.","Tên bệnh nhân là Tom Lee, sinh ngày bốn tháng sáu năm 1960."],["His hospital number is 4 7 2 1 9.","Mã số bệnh viện của ông là 4 7 2 1 9."],["Could you tell me if the result is ready?","Bạn cho tôi biết kết quả đã có chưa?"],["When can I expect it?","Khi nào tôi có thể nhận được?"]]},{"t":"Urgent requests","tip":"Nói rõ \"urgent\" và lý do. Xác nhận thời gian.","p":[["This is urgent. The doctor needs the result now.","Việc này khẩn cấp. Bác sĩ cần kết quả ngay."],["Could you send it up to the ward as soon as possible?","Bạn gửi lên khoa càng sớm càng tốt được không?"],["How long will it take?","Sẽ mất bao lâu?"],["Please call me back as soon as it is ready.","Xin gọi lại cho tôi ngay khi có."]]},{"t":"Clarifying","tip":"Xác nhận thông tin: đọc lại, đánh vần, kiểm tra hai lần.","p":[["Sorry, I did not catch that. Could you say it again?","Xin lỗi, tôi không nghe rõ. Bạn nói lại được không?"],["Do you mean the morning sample or the afternoon one?","Ý bạn là mẫu buổi sáng hay buổi chiều?"],["Let me repeat that to make sure it is correct.","Để tôi nhắc lại cho chắc chắn là đúng."],["Could you send me a message with the details?","Bạn gửi tin nhắn có chi tiết cho tôi được không?"]]},{"t":"Closing","tip":"Kết thúc lịch sự và ghi lại tên người bạn nói chuyện.","p":[["Thank you for your help.","Cảm ơn bạn đã giúp đỡ."],["Could I have your name for my records?","Cho tôi xin tên bạn để ghi lại được không?"],["I will follow up on this later today.","Tôi sẽ theo dõi việc này lại vào cuối ngày."],["Have a good day. Goodbye.","Chúc bạn một ngày tốt lành. Tạm biệt."]]}],"dl":{"t":"Calling the laboratory","v":"Gọi phòng xét nghiệm","k":[["N","Hello, this is Linh from Ward Five. I am calling about a blood test for Tom Lee.","Xin chào, Linh ở Khoa Năm đây. Tôi gọi về xét nghiệm máu của Tom Lee."],["C","Can you give me his date of birth?","Bạn cho tôi ngày sinh của ông ấy được không?"],["N","The fourth of June, 1960. It is urgent. The doctor needs the result now.","Ngày bốn tháng sáu năm 1960. Việc này khẩn cấp. Bác sĩ cần kết quả ngay."],["C","Let me check. The sample arrived ten minutes ago.","Để tôi kiểm tra. Mẫu đã đến cách đây mười phút."],["N","How long will it take?","Sẽ mất bao lâu?"],["C","About twenty minutes. I will call you as soon as it is ready.","Khoảng hai mươi phút. Tôi sẽ gọi bạn ngay khi có."],["N","Thank you. Could I have your name for my records?","Cảm ơn. Cho tôi xin tên bạn để ghi lại được không?"]]}},{"l":"B2","t":"SBAR handover","v":"Bàn giao theo SBAR","c":"I can give a structured SBAR handover or escalation about a patient.","d":[{"t":"Situation","tip":"S: nêu bạn là ai, bệnh nhân nào và vấn đề chính trong một hai câu.","p":[["I am calling about Mr Lee in bed twelve, who has developed chest pain.","Tôi gọi về ông Lee ở giường mười hai, người vừa bị đau ngực."],["The main concern is that his oxygen saturation has dropped to eighty-nine percent.","Mối lo chính là độ bão hòa oxy của ông đã giảm xuống tám mươi chín phần trăm."],["I am concerned that he is deteriorating.","Tôi lo rằng tình trạng của ông đang xấu đi."],["The situation has changed significantly in the past thirty minutes.","Tình hình đã thay đổi đáng kể trong ba mươi phút qua."]]},{"t":"Background","tip":"B: bối cảnh ngắn gọn: chẩn đoán, phẫu thuật, thuốc, dị ứng, hướng điều trị.","p":[["He was admitted two days ago with a suspected chest infection.","Ông nhập viện hai ngày trước vì nghi nhiễm trùng phổi."],["He has a history of heart failure and type two diabetes.","Ông có tiền sử suy tim và tiểu đường tuýp hai."],["He is currently on intravenous antibiotics and oxygen.","Hiện ông đang dùng kháng sinh tĩnh mạch và oxy."],["He is allergic to penicillin, and his code status is full resuscitation.","Ông dị ứng với penicillin và mức hồi sức là hồi sức đầy đủ."]]},{"t":"Assessment","tip":"A: nêu số liệu và điều bạn nhận thấy. Không suy đoán vượt phạm vi.","p":[["His respiratory rate is twenty-eight and his heart rate is one hundred and ten.","Nhịp thở của ông là hai mươi tám và nhịp tim là một trăm mười."],["His blood pressure has fallen from one thirty to ninety over sixty.","Huyết áp của ông đã giảm từ một trăm ba mươi xuống chín mươi trên sáu mươi."],["He is drowsy but responds to voice.","Ông buồn ngủ nhưng đáp ứng với lời nói."],["I think he may be developing sepsis.","Tôi nghĩ ông có thể đang tiến triển nhiễm trùng huyết."]]},{"t":"Recommendation","tip":"R: nêu điều bạn cần và trong bao lâu.","p":[["I would like you to review him urgently.","Tôi muốn bác sĩ đến khám ông khẩn cấp."],["Could you come to the ward within the next ten minutes?","Bác sĩ có thể đến khoa trong mười phút tới không?"],["Would you like me to start fluids and send blood cultures?","Bác sĩ có muốn tôi bắt đầu truyền dịch và gửi cấy máu không?"],["Please let me know what you would like me to monitor.","Xin cho tôi biết bác sĩ muốn tôi theo dõi điều gì."]]},{"t":"Closing the loop","tip":"Xác nhận đã hiểu kế hoạch. Đọc lại y lệnh. Ghi thời gian.","p":[["Just to confirm, you will be here in ten minutes.","Để xác nhận, bác sĩ sẽ có mặt sau mười phút."],["I will repeat his observations every fifteen minutes until then.","Tôi sẽ đo lại các chỉ số của ông mỗi mười lăm phút cho đến lúc đó."],["If he deteriorates further, I will activate the emergency team.","Nếu ông xấu hơn nữa, tôi sẽ kích hoạt đội cấp cứu."],["I will document this conversation in the notes.","Tôi sẽ ghi cuộc trao đổi này vào hồ sơ."]]}],"dl":{"t":"Escalating with SBAR","v":"Báo cáo khẩn theo SBAR","k":[["N","Doctor, this is Linh, calling about Mr Lee in bed twelve. His oxygen level has dropped to eighty-nine percent.","Bác sĩ, tôi là Linh, gọi về ông Lee ở giường mười hai. Độ bão hòa oxy của ông đã giảm xuống tám mươi chín phần trăm."],["D","What is his background?","Bối cảnh của ông ấy là gì?"],["N","He was admitted two days ago with a chest infection and has a history of heart failure. He is on antibiotics and oxygen.","Ông nhập viện hai ngày trước vì nhiễm trùng phổi và có tiền sử suy tim. Ông đang dùng kháng sinh và oxy."],["D","What are his observations now?","Các chỉ số của ông bây giờ thế nào?"],["N","Respiratory rate twenty-eight, heart rate one ten, blood pressure ninety over sixty. He is drowsy.","Nhịp thở hai mươi tám, nhịp tim một trăm mười, huyết áp chín mươi trên sáu mươi. Ông buồn ngủ."],["D","That sounds serious. I will be there in ten minutes.","Nghe có vẻ nghiêm trọng. Tôi sẽ đến sau mười phút."],["N","Thank you. I will repeat his observations every fifteen minutes until you arrive.","Cảm ơn bác sĩ. Tôi sẽ đo lại chỉ số mỗi mười lăm phút cho đến khi bác sĩ tới."]]}},{"l":"B2","t":"Discharge education","v":"Hướng dẫn xuất viện & tự chăm sóc","c":"I can teach a patient how to manage their condition at home and check they understand.","d":[{"t":"Setting goals","tip":"Hỏi bệnh nhân điều gì quan trọng với họ. Mục tiêu chung tăng hợp tác.","p":[["What matters most to you as you go home?","Điều gì quan trọng nhất với bạn khi về nhà?"],["Let us agree on a few realistic goals together.","Chúng ta hãy cùng thống nhất vài mục tiêu thực tế."],["Managing your condition day to day makes a real difference.","Tự kiểm soát bệnh hằng ngày tạo ra khác biệt thực sự."],["I would like to go through the plan step by step.","Tôi muốn cùng bạn xem kế hoạch từng bước một."]]},{"t":"Teach-back","tip":"Teach-back: nhờ bệnh nhân nhắc lại bằng lời của họ. Nhận trách nhiệm nếu giải thích chưa rõ.","p":[["I want to make sure I have explained this clearly.","Tôi muốn chắc rằng tôi đã giải thích rõ ràng."],["Could you tell me in your own words how you will take this?","Bạn có thể nói bằng lời của bạn cách bạn sẽ dùng thuốc này không?"],["That is right. Let me go over the last part again.","Đúng rồi. Để tôi nhắc lại phần cuối một lần nữa."],["Please show me how you use the inhaler.","Xin cho tôi xem bạn dùng ống hít thế nào."]]},{"t":"Self-monitoring","tip":"Hướng dẫn tự theo dõi: cân nặng, đường huyết, huyết áp, triệu chứng.","p":[["Weigh yourself every morning and record it in the diary.","Cân mình mỗi sáng và ghi vào nhật ký."],["Contact us if you gain more than two kilos in three days.","Hãy liên hệ chúng tôi nếu bạn tăng hơn hai ký trong ba ngày."],["Check your blood sugar before breakfast and before bed.","Đo đường huyết trước bữa sáng và trước khi ngủ."],["Note down any symptoms that worry you.","Ghi lại mọi triệu chứng khiến bạn lo."]]},{"t":"Warning signs","tip":"Phân biệt rõ: gọi cấp cứu, gọi bác sĩ, theo dõi thêm.","p":[["Call the emergency number if you have sudden chest pain or difficulty breathing.","Gọi số cấp cứu nếu bạn đau ngực đột ngột hoặc khó thở."],["Contact your doctor if you have a fever above thirty-eight degrees.","Liên hệ bác sĩ nếu bạn sốt trên ba mươi tám độ."],["Swelling in your legs that gets worse should be checked.","Chân sưng ngày càng nặng cần được kiểm tra."],["If you are unsure, it is always better to ask.","Nếu bạn không chắc, hỏi luôn là tốt hơn."]]},{"t":"Support at home","tip":"Sắp xếp hỗ trợ: gia đình, y tế cộng đồng, thuốc, dụng cụ.","p":[["Who will be helping you at home for the first week?","Ai sẽ giúp bạn ở nhà trong tuần đầu?"],["The community nurse will visit you twice a week.","Điều dưỡng cộng đồng sẽ đến thăm bạn hai lần mỗi tuần."],["We can arrange equipment such as a walking frame.","Chúng tôi có thể sắp xếp dụng cụ như khung tập đi."],["Here is a leaflet with contact numbers and advice.","Đây là tờ rơi có số liên hệ và lời khuyên."]]}],"dl":{"t":"Teaching self-management","v":"Hướng dẫn tự chăm sóc","k":[["N","Mrs Hoa, before you go home, I would like to go through your plan.","Bà Hoa, trước khi bà về nhà, tôi muốn cùng bà xem kế hoạch."],["P","Yes, I am a bit nervous about managing on my own.","Vâng, tôi hơi lo về việc tự lo liệu."],["N","That is understandable. Could you tell me in your own words how you will check your blood sugar?","Điều đó dễ hiểu. Bà có thể nói bằng lời của bà cách bà đo đường huyết không?"],["P","Before breakfast and before bed, and I write it in the diary.","Trước bữa sáng và trước khi ngủ, và tôi ghi vào nhật ký."],["N","That is exactly right. What would you do if your sugar was very high?","Chính xác. Bà sẽ làm gì nếu đường huyết rất cao?"],["P","I would call the clinic if it stays high for two days.","Tôi sẽ gọi phòng khám nếu nó cao suốt hai ngày."],["N","Good. If you feel confused or very unwell, call the emergency number straight away.","Tốt. Nếu bà thấy lú lẫn hoặc rất mệt, hãy gọi số cấp cứu ngay."]]}},{"l":"B2","t":"Difficult conversations","v":"Những cuộc trò chuyện khó","c":"I can respond calmly and professionally to an angry, anxious or non-cooperative patient or relative.","d":[{"t":"Staying calm","tip":"Giữ giọng bình tĩnh, tốc độ chậm, tư thế cởi mở. Đừng phản ứng lại cảm xúc.","p":[["I can see that you are upset, and I want to help.","Tôi thấy bạn đang buồn bực và tôi muốn giúp."],["Let us sit down and talk about what has happened.","Chúng ta hãy ngồi xuống và nói về những gì đã xảy ra."],["I am listening, and I would like to understand your concerns.","Tôi đang lắng nghe và muốn hiểu những lo lắng của bạn."],["Please tell me what is worrying you most.","Xin cho tôi biết điều gì làm bạn lo nhất."]]},{"t":"Acknowledging feelings","tip":"Ghi nhận cảm xúc trước khi giải thích. Không nói \"calm down\".","p":[["It is understandable that you feel frustrated after such a long wait.","Bạn thấy bực vì phải đợi lâu như vậy là dễ hiểu."],["I am sorry that this has been so stressful for you.","Tôi xin lỗi vì việc này đã khiến bạn căng thẳng như vậy."],["I would feel the same way if I were in your position.","Nếu ở vị trí của bạn, tôi cũng sẽ cảm thấy như vậy."],["Thank you for bringing this to my attention.","Cảm ơn bạn đã cho tôi biết việc này."]]},{"t":"Setting limits","tip":"Đặt giới hạn rõ ràng, tôn trọng và nhất quán.","p":[["I want to help, but I cannot do that if I am being shouted at.","Tôi muốn giúp, nhưng không thể nếu bị la hét."],["Let us lower our voices so that we can find a solution.","Chúng ta hãy hạ giọng để tìm ra giải pháp."],["I am going to step out for a moment and come back shortly.","Tôi sẽ ra ngoài một lát và quay lại ngay."],["If the behavior continues, I will have to call security.","Nếu hành vi này tiếp tục, tôi sẽ phải gọi bảo vệ."]]},{"t":"Refusing treatment","tip":"Tìm hiểu lý do từ chối, đưa thông tin, tôn trọng quyết định của người đủ năng lực.","p":[["Can you help me understand why you would prefer not to take it?","Bạn có thể giúp tôi hiểu vì sao bạn không muốn dùng không?"],["Here is what may happen if you decide not to have this treatment.","Đây là điều có thể xảy ra nếu bạn quyết định không điều trị."],["It is your decision, and I will make sure the doctor knows.","Đây là quyết định của bạn và tôi sẽ đảm bảo bác sĩ biết."],["Would it help to talk to the doctor again?","Nói chuyện lại với bác sĩ có giúp bạn không?"]]},{"t":"Finding a way forward","tip":"Đề xuất bước tiếp theo, ghi nhận kết quả, theo dõi.","p":[["What would make this situation better for you?","Điều gì sẽ làm tình huống này tốt hơn với bạn?"],["I will speak to the nurse in charge and return to you within an hour.","Tôi sẽ nói với điều dưỡng trưởng và quay lại với bạn trong vòng một giờ."],["We can arrange a meeting with the ward manager if you wish.","Chúng tôi có thể sắp xếp cuộc gặp với trưởng khoa nếu bạn muốn."],["Thank you for your patience and understanding.","Cảm ơn sự kiên nhẫn và thấu hiểu của bạn."]]}],"dl":{"t":"A frustrated relative","v":"Người nhà bực bội","k":[["F","I have been waiting for two hours and nobody has told me anything!","Tôi đợi hai tiếng rồi mà không ai nói gì với tôi!"],["N","I am sorry. It is understandable that you feel frustrated after such a long wait.","Tôi xin lỗi. Bạn thấy bực vì phải đợi lâu như vậy là dễ hiểu."],["F","My mother is in pain and no one is helping her.","Mẹ tôi đang đau mà không ai giúp bà."],["N","Thank you for telling me. I will check on her straight away.","Cảm ơn bạn đã cho tôi biết. Tôi sẽ đến kiểm tra bà ngay."],["F","I just want someone to be honest with me.","Tôi chỉ muốn có người nói thật với tôi."],["N","Of course. Let us sit down, and I will explain what has happened and what the doctor plans to do.","Tất nhiên rồi. Chúng ta hãy ngồi xuống, tôi sẽ giải thích điều đã xảy ra và kế hoạch của bác sĩ."],["F","Thank you. I appreciate that.","Cảm ơn cô. Tôi rất biết ơn."]]}},{"l":"B2","t":"Supporting after bad news","v":"Hỗ trợ sau tin xấu","c":"I can support a patient or family after difficult news, without giving false hope.","d":[{"t":"Preparing","tip":"Chuẩn bị nơi yên tĩnh, thời gian đủ, người hỗ trợ. Bác sĩ thường nói tin xấu; điều dưỡng hỗ trợ.","p":[["Would you like someone to be with you while we talk?","Bạn có muốn có người ở bên khi chúng ta nói chuyện không?"],["Let us find a quiet room where we will not be disturbed.","Chúng ta hãy tìm một phòng yên tĩnh không bị làm phiền."],["The doctor would like to talk to you about your results.","Bác sĩ muốn trao đổi với bạn về kết quả."],["How much would you like to know at this stage?","Ở giai đoạn này bạn muốn biết bao nhiêu?"]]},{"t":"After the news","tip":"Cho im lặng. Đừng vội lấp đầy bằng lời nói.","p":[["I am so sorry. This must be very hard to hear.","Tôi rất tiếc. Điều này chắc rất khó nghe."],["Take as long as you need. There is no hurry.","Cứ từ từ bao lâu bạn cần. Không cần vội."],["It is normal to feel shocked, angry or numb.","Cảm thấy sốc, tức giận hoặc tê dại là bình thường."],["I will stay here with you for a while.","Tôi sẽ ở lại đây với bạn một lúc."]]},{"t":"Checking understanding","tip":"Kiểm tra bệnh nhân đã tiếp nhận được gì. Đừng đưa quá nhiều thông tin cùng lúc.","p":[["What have you understood from what the doctor said?","Bạn đã hiểu gì từ những điều bác sĩ nói?"],["Would it help if I explained it in a different way?","Nếu tôi giải thích theo cách khác thì có giúp không?"],["It can be hard to take everything in at once.","Khó có thể tiếp nhận mọi điều cùng lúc."],["We can go over it again whenever you are ready.","Chúng ta có thể xem lại bất cứ khi nào bạn sẵn sàng."]]},{"t":"Honest hope","tip":"Nói thật nhưng nhẹ nhàng: tập trung vào điều có thể làm.","p":[["I cannot tell you exactly what will happen.","Tôi không thể nói chính xác điều gì sẽ xảy ra."],["What we can do is focus on keeping you comfortable.","Điều chúng ta có thể làm là tập trung giúp bạn thoải mái."],["There are treatment options, and the team will discuss them with you.","Có các lựa chọn điều trị và đội ngũ sẽ trao đổi với bạn."],["We will support you and your family throughout this.","Chúng tôi sẽ hỗ trợ bạn và gia đình xuyên suốt quá trình này."]]},{"t":"Offering support","tip":"Giới thiệu chuyên gia hỗ trợ: tư vấn, tôn giáo, nhân viên xã hội.","p":[["Would you like me to arrange for a counselor to visit?","Bạn có muốn tôi sắp xếp một chuyên viên tư vấn đến thăm không?"],["The hospital chaplain is available if you would like to speak to someone.","Tuyên úy bệnh viện luôn sẵn sàng nếu bạn muốn nói chuyện với ai đó."],["Is there anyone you would like me to call for you?","Bạn có muốn tôi gọi cho ai giúp bạn không?"],["Please ask for me at any time if you want to talk.","Xin cứ tìm tôi bất cứ lúc nào nếu bạn muốn nói chuyện."]]}],"dl":{"t":"After the diagnosis","v":"Sau khi nhận chẩn đoán","k":[["P","The doctor said it is cancer. I cannot believe it.","Bác sĩ nói đó là ung thư. Tôi không thể tin được."],["N","I am so sorry. This must be very hard to hear.","Tôi rất tiếc. Điều này chắc rất khó nghe."],["P","What is going to happen to me?","Chuyện gì sẽ xảy ra với tôi?"],["N","I cannot tell you exactly, but the team will discuss treatment options with you.","Tôi không thể nói chính xác, nhưng đội ngũ sẽ trao đổi các lựa chọn điều trị với bạn."],["P","I feel so frightened.","Tôi thấy rất sợ hãi."],["N","That is completely normal. I will stay with you for a while. Take as long as you need.","Điều đó hoàn toàn bình thường. Tôi sẽ ở lại với bạn một lúc. Cứ từ từ bao lâu bạn cần."],["P","Thank you. Could you call my daughter?","Cảm ơn cô. Cô gọi giúp con gái tôi được không?"]]}},{"l":"B2","t":"Charts & test results","v":"Đọc biểu đồ & kết quả xét nghiệm","c":"I can read and explain observation charts and common test results.","d":[{"t":"Observation charts","tip":"Đọc xu hướng, không chỉ một con số. So với các lần trước.","p":[["His temperature has been trending upwards over the past six hours.","Nhiệt độ của ông có xu hướng tăng trong sáu giờ qua."],["Her blood pressure is within the normal range but lower than yesterday.","Huyết áp của bà nằm trong giới hạn bình thường nhưng thấp hơn hôm qua."],["The chart shows a gradual rise in his heart rate.","Biểu đồ cho thấy nhịp tim của ông tăng dần."],["An early warning score of five needs urgent review.","Điểm cảnh báo sớm bằng năm cần được xem xét khẩn cấp."]]},{"t":"Blood results","tip":"Học các thuật ngữ: white cell count, hemoglobin, CRP, creatinine, potassium.","p":[["His white cell count is raised, which may indicate an infection.","Bạch cầu của ông tăng, có thể cho thấy nhiễm trùng."],["Her hemoglobin is low, so she is anemic.","Huyết sắc tố của bà thấp, nên bà bị thiếu máu."],["The potassium level is slightly below normal.","Mức kali hơi thấp hơn bình thường."],["The kidney function tests are within the expected range.","Xét nghiệm chức năng thận nằm trong giới hạn mong đợi."]]},{"t":"Fluid balance","tip":"Fluid balance: cân bằng dịch. Input (vào) và output (ra).","p":[["His fluid intake was one and a half liters in twenty-four hours.","Lượng dịch vào của ông là một lít rưỡi trong hai mươi bốn giờ."],["His urine output has fallen to twenty milliliters an hour.","Lượng nước tiểu của ông đã giảm xuống hai mươi mi-li-lít mỗi giờ."],["She has a positive fluid balance of six hundred milliliters.","Bà có cân bằng dịch dương sáu trăm mi-li-lít."],["The patient is dehydrated and needs intravenous fluids.","Bệnh nhân mất nước và cần truyền dịch tĩnh mạch."]]},{"t":"Imaging and reports","tip":"Từ trong báo cáo: consistent with, suggestive of, no acute abnormality.","p":[["The chest X-ray is consistent with a chest infection.","Phim X-quang ngực phù hợp với nhiễm trùng phổi."],["The scan report shows no acute abnormality.","Báo cáo chụp không cho thấy bất thường cấp tính."],["The doctor will explain the findings once all results are back.","Bác sĩ sẽ giải thích kết quả khi có đủ mọi kết quả."],["I am not able to interpret the results, but I can tell you what happens next.","Tôi không thể diễn giải kết quả, nhưng tôi có thể cho bạn biết bước tiếp theo."]]},{"t":"Explaining results simply","tip":"Dùng ngôn ngữ đơn giản: \"borderline\", \"slightly high\", \"within range\".","p":[["Your result is slightly higher than we would like.","Kết quả của bạn hơi cao hơn mức chúng tôi mong muốn."],["This number tells us how well your kidneys are working.","Con số này cho biết thận của bạn hoạt động tốt thế nào."],["It is borderline, so we will repeat the test in a week.","Kết quả ở mức giới hạn, nên chúng tôi sẽ làm lại xét nghiệm sau một tuần."],["Nothing on this report needs to worry you at the moment.","Hiện tại không có gì trong báo cáo này cần làm bạn lo."]]}],"dl":{"t":"Explaining a result","v":"Giải thích một kết quả","k":[["P","Nurse, what do my blood results show?","Điều dưỡng, kết quả máu của tôi cho thấy gì?"],["N","The doctor will go through everything with you, but I can tell you what the report says.","Bác sĩ sẽ giải thích mọi thứ cho bà, nhưng tôi có thể cho bà biết báo cáo nói gì."],["P","Please do. I am worried.","Xin cô nói. Tôi đang lo."],["N","Your hemoglobin is a little low, which means you are slightly anemic.","Huyết sắc tố của bà hơi thấp, nghĩa là bà bị thiếu máu nhẹ."],["P","Is that serious?","Có nghiêm trọng không?"],["N","It is common and treatable. The doctor will decide whether you need iron tablets.","Điều này thường gặp và có thể điều trị. Bác sĩ sẽ quyết định bà có cần uống sắt không."],["P","Thank you. That is a relief.","Cảm ơn cô. Tôi nhẹ cả người."]]}},{"l":"B2","t":"Labels, leaflets & prescriptions","v":"Nhãn thuốc, tờ hướng dẫn & đơn thuốc","c":"I can read a drug label, leaflet or prescription and explain it accurately.","d":[{"t":"Reading a label","tip":"Đọc tên thuốc, hàm lượng, dạng bào chế, hạn dùng, cảnh báo.","p":[["Each tablet contains five hundred milligrams of paracetamol.","Mỗi viên chứa năm trăm mi-li-gam paracetamol."],["Store below twenty-five degrees, away from direct sunlight.","Bảo quản dưới hai mươi lăm độ, tránh ánh nắng trực tiếp."],["Do not use after the expiry date printed on the box.","Không dùng sau hạn sử dụng in trên hộp."],["Keep out of the reach of children.","Để xa tầm với của trẻ em."]]},{"t":"Prescription abbreviations","tip":"Viết tắt: od (mỗi ngày một lần), bd (hai lần), tds (ba lần), prn (khi cần).","p":[["The abbreviation b d means twice a day.","Chữ viết tắt b d có nghĩa là hai lần mỗi ngày."],["P R N means to take the medicine only when it is needed.","P R N có nghĩa là chỉ dùng thuốc khi cần."],["The prescription says one tablet three times daily after food.","Đơn thuốc ghi một viên, ba lần mỗi ngày, sau ăn."],["Please check the dose against the prescription chart.","Xin kiểm tra liều theo bảng chỉ định thuốc."]]},{"t":"Leaflet warnings","tip":"Đọc phần cảnh báo: contraindication, interaction, precaution.","p":[["Do not take this medicine if you are pregnant.","Không dùng thuốc này nếu bạn đang mang thai."],["It may interact with other medicines, including herbal remedies.","Thuốc có thể tương tác với các thuốc khác, kể cả thảo dược."],["Avoid alcohol while you are taking this treatment.","Tránh rượu bia khi bạn đang dùng điều trị này."],["Seek medical advice if you develop a skin rash or difficulty breathing.","Hãy tìm lời khuyên y tế nếu bạn nổi ban da hoặc khó thở."]]},{"t":"Checking safely","tip":"Năm đúng: patient, drug, dose, route, time. Kiểm tra hai lần.","p":[["I need to check your name band against the prescription.","Tôi cần đối chiếu vòng tay của bạn với đơn thuốc."],["The dose on the chart does not match the dose on the box.","Liều trên bảng không khớp với liều trên hộp."],["I will double-check this with another nurse before I give it.","Tôi sẽ kiểm tra lại với một điều dưỡng khác trước khi cho thuốc."],["I have queried the prescription with the doctor.","Tôi đã hỏi lại bác sĩ về đơn thuốc."]]},{"t":"Explaining to patients","tip":"Đổi thuật ngữ thành lời đơn giản: \"swallow\", \"as needed\", \"at bedtime\".","p":[["Take this one only if the pain comes back.","Chỉ uống viên này nếu cơn đau quay lại."],["Take this tablet at bedtime, about an hour before you sleep.","Uống viên này lúc đi ngủ, khoảng một tiếng trước khi bạn ngủ."],["Do not stop taking it suddenly without asking your doctor.","Đừng ngừng thuốc đột ngột mà không hỏi bác sĩ."],["Keep a list of all your medicines and bring it to appointments.","Giữ danh sách tất cả thuốc của bạn và mang đến các cuộc hẹn."]]}],"dl":{"t":"Querying a prescription","v":"Hỏi lại về đơn thuốc","k":[["N","Doctor, I am about to give Mr Lee his morning medicines, but I have a query.","Bác sĩ, tôi sắp cho ông Lee uống thuốc buổi sáng nhưng tôi có một thắc mắc."],["D","Go ahead.","Cứ nói đi."],["N","The prescription says fifty milligrams, but the box says twenty-five milligrams per tablet.","Đơn thuốc ghi năm mươi mi-li-gam, nhưng hộp ghi hai mươi lăm mi-li-gam mỗi viên."],["D","Fifty milligrams is correct, so he needs two tablets.","Năm mươi mi-li-gam là đúng, vậy ông ấy cần hai viên."],["N","Thank you. Could you confirm that on the chart? I will double-check with another nurse too.","Cảm ơn bác sĩ. Bác sĩ xác nhận trên bảng giúp tôi được không? Tôi cũng sẽ kiểm tra lại với một điều dưỡng khác."],["D","Of course. I will update it now.","Tất nhiên. Tôi sẽ cập nhật ngay."],["N","Thank you. I will document the change.","Cảm ơn bác sĩ. Tôi sẽ ghi lại thay đổi."]]}},{"l":"B2","t":"Nursing notes","v":"Ghi chép điều dưỡng","c":"I can write clear, accurate and objective nursing notes.","d":[{"t":"Principles","tip":"Ghi chép: đúng, kịp thời, khách quan, đọc được, có thời gian và chữ ký.","p":[["Notes should be accurate, clear and written as soon as possible.","Ghi chép cần chính xác, rõ ràng và viết càng sớm càng tốt."],["Record what you observed, not your assumptions.","Ghi lại điều bạn quan sát, không phải giả định của bạn."],["Always include the date, time and your signature.","Luôn ghi ngày, giờ và chữ ký của bạn."],["If you make a mistake, cross it out with a single line.","Nếu bạn viết sai, hãy gạch bỏ bằng một đường."]]},{"t":"Objective language","tip":"Dùng số đo và lời của bệnh nhân. Tránh từ mơ hồ.","p":[["The patient stated that he had a pain of seven out of ten.","Bệnh nhân nói rằng ông đau mức bảy trên mười."],["The wound was four centimeters long with no discharge.","Vết thương dài bốn xăng-ti-mét, không có dịch."],["The patient appeared restless and pulled at his drip.","Bệnh nhân có vẻ bồn chồn và kéo dây truyền dịch."],["Avoid writing that the patient was difficult or uncooperative.","Tránh viết rằng bệnh nhân khó tính hoặc không hợp tác."]]},{"t":"Past tense reports","tip":"Ghi chép dùng thì quá khứ: was, was given, was reported.","p":[["The patient was assisted to the bathroom at ten hundred hours.","Bệnh nhân được đưa đến nhà vệ sinh lúc mười giờ."],["Analgesia was given as prescribed and pain reduced to three.","Thuốc giảm đau được dùng theo chỉ định và cơn đau giảm xuống ba."],["The doctor was informed of the patient's raised temperature.","Bác sĩ đã được thông báo về nhiệt độ tăng của bệnh nhân."],["The family were updated on the plan of care.","Gia đình đã được cập nhật về kế hoạch chăm sóc."]]},{"t":"Care plans and evaluation","tip":"Ghi mục tiêu, can thiệp và đánh giá kết quả.","p":[["The aim is to reduce the patient's risk of falls.","Mục tiêu là giảm nguy cơ té ngã của bệnh nhân."],["A bed alarm was put in place and the call bell was within reach.","Đã đặt chuông báo giường và nút gọi ở trong tầm với."],["The pressure area care was carried out every two hours.","Chăm sóc vùng tì đè được thực hiện mỗi hai giờ."],["The plan will be reviewed again in twenty-four hours.","Kế hoạch sẽ được xem xét lại sau hai mươi bốn giờ."]]},{"t":"Incident reporting","tip":"Báo cáo sự cố: sự việc, thời gian, hành động, người được thông báo.","p":[["The patient was found on the floor beside the bed at two a.m.","Bệnh nhân được phát hiện nằm trên sàn cạnh giường lúc hai giờ sáng."],["No injuries were identified after a full assessment.","Không phát hiện thương tích sau khi đánh giá đầy đủ."],["The doctor and the family were informed immediately.","Bác sĩ và gia đình đã được thông báo ngay lập tức."],["An incident report was completed and submitted.","Báo cáo sự cố đã được hoàn thành và nộp."]]}],"dl":{"t":"Checking a note with a colleague","v":"Nhờ đồng nghiệp xem lại ghi chép","k":[["N","Could you have a look at this note before I sign it?","Bạn xem giúp ghi chép này trước khi tôi ký được không?"],["C","Sure. It says that the patient was uncooperative.","Được. Ở đây ghi bệnh nhân không hợp tác."],["N","Yes, he refused his tablets.","Vâng, ông ấy từ chối uống thuốc."],["C","It would be better to record exactly what happened.","Tốt hơn là ghi chính xác điều đã xảy ra."],["N","You are right. I will write that the patient declined his tablets and stated that he felt sick.","Bạn nói đúng. Tôi sẽ viết rằng bệnh nhân từ chối thuốc và nói ông thấy buồn nôn."],["C","That is much clearer. Did you inform the doctor?","Rõ ràng hơn nhiều. Bạn đã báo bác sĩ chưa?"],["N","Yes, at ten thirty. I will add that with the time.","Rồi, lúc mười giờ ba mươi. Tôi sẽ thêm vào cùng thời gian."]]}},{"l":"B2","t":"Deterioration & escalation","v":"Bệnh nhân xấu đi & báo cấp","c":"I can recognize a deteriorating patient and escalate clearly and quickly.","d":[{"t":"Recognizing deterioration","tip":"Dấu hiệu sớm: thay đổi ý thức, nhịp thở, huyết áp, mạch, nước tiểu.","p":[["He has become confused and does not know where he is.","Ông trở nên lú lẫn và không biết mình ở đâu."],["Her breathing has become fast and shallow.","Nhịp thở của bà trở nên nhanh và nông."],["His skin is cold, pale and clammy.","Da ông lạnh, tái và ẩm."],["Trust your instincts if something does not seem right.","Hãy tin trực giác của bạn nếu có điều gì không ổn."]]},{"t":"Early warning scores","tip":"Điểm cảnh báo sớm gồm nhiều chỉ số. Tổng điểm quyết định bạn làm gì.","p":[["His early warning score has increased from two to six.","Điểm cảnh báo sớm của ông đã tăng từ hai lên sáu."],["A score of seven or more triggers an emergency response.","Điểm từ bảy trở lên sẽ kích hoạt phản ứng cấp cứu."],["We need to repeat the observations every fifteen minutes.","Chúng ta cần đo lại các chỉ số mỗi mười lăm phút."],["Escalate according to the hospital protocol.","Báo cấp theo quy trình của bệnh viện."]]},{"t":"Calling for help","tip":"Dùng đường dây khẩn cấp: nêu vị trí, tình trạng, cần gì.","p":[["I need the rapid response team to Bed Four immediately.","Tôi cần đội phản ứng nhanh đến giường bốn ngay lập tức."],["The patient is unresponsive and has a very weak pulse.","Bệnh nhân không đáp ứng và mạch rất yếu."],["Please bring the crash trolley and the defibrillator.","Xin mang xe cấp cứu và máy sốc tim tới."],["Keep the family calm and away from the bedside.","Giữ bình tĩnh cho gia đình và tránh xa giường bệnh."]]},{"t":"During the emergency","tip":"Vai trò rõ ràng: người dẫn dắt, người ghi chép, người thực hiện.","p":[["Who is leading this team?","Ai đang dẫn dắt nhóm này?"],["I will record the times and everything that is given.","Tôi sẽ ghi lại thời gian và mọi thứ được dùng."],["Give him high-flow oxygen through a mask.","Cho ông thở oxy lưu lượng cao qua mặt nạ."],["I am starting compressions now.","Tôi bắt đầu ép tim ngay bây giờ."]]},{"t":"After the event","tip":"Sau sự việc: cập nhật gia đình, ghi chép, họp rút kinh nghiệm.","p":[["He has been stabilized and is being moved to intensive care.","Ông đã được ổn định và đang được chuyển vào chăm sóc tích cực."],["I will speak to the family and explain what happened.","Tôi sẽ nói chuyện với gia đình và giải thích chuyện đã xảy ra."],["All actions and times must be documented carefully.","Mọi hành động và thời gian phải được ghi chép cẩn thận."],["We will have a team debrief to learn from this event.","Chúng ta sẽ có buổi rút kinh nghiệm của nhóm để học hỏi từ sự việc này."]]}],"dl":{"t":"Calling the rapid response team","v":"Gọi đội phản ứng nhanh","k":[["N","Emergency team to Bed Four, please. The patient is unresponsive.","Xin đội cấp cứu đến giường bốn. Bệnh nhân không đáp ứng."],["C","I am on my way. What is his pulse?","Tôi đến ngay. Mạch của ông ấy thế nào?"],["N","Weak and fast, one hundred and thirty. Blood pressure is eighty over fifty.","Yếu và nhanh, một trăm ba mươi. Huyết áp tám mươi trên năm mươi."],["C","Start high-flow oxygen and get intravenous access.","Bắt đầu oxy lưu lượng cao và thiết lập đường truyền tĩnh mạch."],["N","Oxygen is on. I have inserted the cannula.","Đã bật oxy. Tôi đã đặt kim luồn."],["C","Good. Record the times of everything we give.","Tốt. Ghi lại thời gian của mọi thứ chúng ta dùng."],["N","Understood. I will document it all.","Đã rõ. Tôi sẽ ghi lại tất cả."]]}},{"l":"B2","t":"End-of-life care","v":"Chăm sóc cuối đời","c":"I can communicate with sensitivity with dying patients and their families.","d":[{"t":"Palliative approach","tip":"Palliative care: tập trung vào sự thoải mái và chất lượng sống.","p":[["Our aim now is to keep you as comfortable as possible.","Mục tiêu của chúng tôi bây giờ là giúp bạn thoải mái nhất có thể."],["Palliative care focuses on relieving pain and other symptoms.","Chăm sóc giảm nhẹ tập trung vào giảm đau và các triệu chứng khác."],["Your wishes are very important to us.","Mong muốn của bạn rất quan trọng với chúng tôi."],["What would a good day look like for you?","Một ngày tốt đẹp với bạn sẽ như thế nào?"]]},{"t":"Symptom relief","tip":"Hỏi thường xuyên về đau, buồn nôn, khó thở, lo âu.","p":[["Is the medicine controlling your pain well enough?","Thuốc có kiểm soát cơn đau của bạn đủ tốt không?"],["We can give you something to ease the breathlessness.","Chúng tôi có thể cho bạn thuốc để giảm khó thở."],["Please tell us straight away if anything is troubling you.","Xin báo ngay nếu có điều gì làm bạn khó chịu."],["Turning you gently may help you feel more comfortable.","Trở người nhẹ nhàng có thể giúp bạn thấy thoải mái hơn."]]},{"t":"Advance care planning","tip":"Hỏi ý muốn về hồi sức, nơi qua đời, người quyết định thay.","p":[["Have you thought about where you would like to be cared for?","Bạn đã nghĩ đến nơi bạn muốn được chăm sóc chưa?"],["Has anyone discussed resuscitation with you?","Đã có ai trao đổi với bạn về hồi sức chưa?"],["Who would you like to make decisions if you were unable to?","Bạn muốn ai quyết định nếu bạn không thể?"],["We will record your wishes so that everyone knows them.","Chúng tôi sẽ ghi lại mong muốn của bạn để mọi người đều biết."]]},{"t":"Supporting the family","tip":"Cho gia đình biết điều đang xảy ra và điều có thể mong đợi.","p":[["His breathing may change, and that is part of the dying process.","Nhịp thở của ông có thể thay đổi, đó là một phần của quá trình lâm chung."],["He may not be able to speak, but he may still hear you.","Ông có thể không nói được nhưng có thể vẫn nghe bạn."],["You are welcome to stay with him as long as you wish.","Bạn cứ ở lại với ông bao lâu tùy ý."],["We will make sure that he is never alone.","Chúng tôi sẽ đảm bảo ông không bao giờ cô đơn."]]},{"t":"After death","tip":"Nói rõ ràng, dịu dàng. Tôn trọng nghi lễ tôn giáo và văn hóa.","p":[["I am very sorry to tell you that your mother has passed away.","Tôi rất tiếc phải báo rằng mẹ bạn đã qua đời."],["She died peacefully with her family beside her.","Bà mất bình yên với gia đình bên cạnh."],["You can spend as much time with her as you need.","Bạn có thể ở bên bà bao lâu bạn cần."],["Please let us know about any traditions we should respect.","Xin cho chúng tôi biết những phong tục chúng tôi nên tôn trọng."]]}],"dl":{"t":"Speaking with a dying patient's family","v":"Trò chuyện với gia đình người sắp mất","k":[["F","Nurse, how is my father today?","Điều dưỡng, hôm nay bố tôi thế nào?"],["N","He is very weak and sleeping most of the time. We are keeping him comfortable.","Ông rất yếu và ngủ phần lớn thời gian. Chúng tôi đang giữ cho ông thoải mái."],["F","Can he hear us?","Ông có nghe được chúng tôi không?"],["N","He may still hear you, so please talk to him as you normally would.","Ông có thể vẫn nghe được, nên hãy nói chuyện với ông như bình thường."],["F","Is he in pain?","Ông có đau không?"],["N","We check regularly, and he seems peaceful. We will give more medicine if he shows any discomfort.","Chúng tôi kiểm tra thường xuyên và ông có vẻ bình yên. Chúng tôi sẽ cho thêm thuốc nếu ông có dấu hiệu khó chịu."],["F","Thank you for looking after him so kindly.","Cảm ơn cô đã chăm sóc bố tôi tận tình."]]}},{"l":"B2","t":"Mothers, children & older adults","v":"Chăm sóc mẹ, trẻ em & người cao tuổi","c":"I can adapt my communication for pregnant women, children and older adults.","d":[{"t":"Pregnancy and birth","tip":"Hỏi tuần thai, chuyển dạ, cử động thai và dấu hiệu nguy hiểm.","p":[["How many weeks pregnant are you?","Bạn mang thai được bao nhiêu tuần?"],["Can you feel the baby moving as usual?","Bạn có cảm thấy em bé cử động như bình thường không?"],["How often are your contractions coming?","Các cơn co của bạn đến cách nhau bao lâu?"],["Tell us at once if you notice any bleeding.","Hãy báo ngay nếu bạn thấy chảy máu."]]},{"t":"Newborn and breastfeeding","tip":"Hỗ trợ cho con bú và chăm sóc trẻ sơ sinh.","p":[["Let me show you how to hold the baby to feed.","Để tôi chỉ bạn cách bế em bé khi cho bú."],["Feed the baby whenever he shows signs of hunger.","Cho em bé bú bất cứ khi nào bé có dấu hiệu đói."],["Check that he has plenty of wet nappies each day.","Kiểm tra bé có nhiều tã ướt mỗi ngày."],["Always place the baby on his back to sleep.","Luôn đặt em bé nằm ngửa khi ngủ."]]},{"t":"Talking to children","tip":"Nói đơn giản, chơi cùng, cho trẻ lựa chọn nhỏ, khen ngợi.","p":[["I am going to look at your tummy. Is that okay?","Cô sẽ xem bụng của con. Được không?"],["This little pinch will be over very quickly.","Cú nhói nhỏ này sẽ qua rất nhanh."],["You are being so brave. Well done!","Con dũng cảm lắm. Giỏi quá!"],["Would you like to sit on your mum's lap?","Con có muốn ngồi trong lòng mẹ không?"]]},{"t":"Talking to parents","tip":"Giải thích thang đo và thuốc theo cân nặng. Tôn trọng lo lắng của cha mẹ.","p":[["Children's doses depend on their weight.","Liều của trẻ em phụ thuộc vào cân nặng."],["Fever is common in children and usually settles by itself.","Sốt thường gặp ở trẻ em và thường tự hết."],["Take him to hospital if he is very sleepy or has trouble breathing.","Hãy đưa bé đến bệnh viện nếu bé rất buồn ngủ hoặc khó thở."],["Please stay with your child during the procedure.","Xin ở bên con bạn trong suốt thủ thuật."]]},{"t":"Older adults","tip":"Nói chậm, rõ, đối mặt bệnh nhân, kiểm tra thính giác và thị giác, tôn trọng sự tự chủ.","p":[["I will speak slowly and clearly, so please tell me if you cannot hear me.","Tôi sẽ nói chậm và rõ, nên xin báo nếu bạn không nghe được."],["Are you wearing your glasses or hearing aid?","Bạn có đeo kính hoặc máy trợ thính không?"],["Do you feel steady when you walk around at home?","Bạn có thấy vững khi đi lại ở nhà không?"],["We want to help you stay as independent as possible.","Chúng tôi muốn giúp bạn giữ được sự tự lập nhiều nhất có thể."]]}],"dl":{"t":"Talking to a child","v":"Nói chuyện với trẻ em","k":[["N","Hello, Minh. My name is Linh. I am going to check your temperature. Is that okay?","Xin chào Minh. Cô là Linh. Cô sẽ đo nhiệt độ cho con. Được không?"],["P","Will it hurt?","Có đau không ạ?"],["N","No, it will not hurt. It just tickles a little under your arm.","Không, không đau đâu. Nó chỉ hơi nhột một chút dưới nách."],["P","Okay. Can Mum stay?","Vâng. Mẹ ở lại được không ạ?"],["N","Of course. Mum can sit next to you.","Tất nhiên. Mẹ có thể ngồi cạnh con."],["P","Is it finished?","Xong chưa ạ?"],["N","All done. You were so brave. Well done!","Xong rồi. Con dũng cảm lắm. Giỏi q
