<style>
/* Layout concept: phone-first shell. Sticky brand header, scrolling page, fixed bottom tab bar.
   Lessons open as a full-screen layer above it. Progress is drawn like a ward observation chart. */
:root{
  --bg:#f7f5ef;--surface:#ffffff;--surface2:#eaf1f8;--ink:#1d2733;--muted:#5b6b7d;--line:#dfe3e8;
  --accent:#123a6d;--accent-ink:#ffffff;--accent-soft:#eaf1f8;
  --good:#1a7f4b;--good-soft:#e6f3ec;--bad:#b3382e;--bad-soft:#fbeae7;--warn:#7a5200;--warn-soft:#fdf3d7;
  --l-a1:#177245;--l-a2:#0e7c6b;--l-b1:#2f6da3;--l-b2:#6d4a8f;
  --f-display:Georgia,'Palatino Linotype','Book Antiqua','Times New Roman',serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}


*{box-sizing:border-box}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;line-height:1.15;text-wrap:balance;font-weight:700}
h1{font-size:28px}h2{font-size:21px}h3{font-size:16px}
p{margin:0}
svg{display:block}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.page{padding-block:18px calc(88px + env(safe-area-inset-bottom,0px))}
.stack{display:grid;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.vi{color:var(--muted);font-size:.9em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sm{font-size:13px}.xs{font-size:12px}
.lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
.brand small{font-family:var(--f-body);font-weight:600;font-size:11px;color:var(--muted);letter-spacing:0;margin-left:1px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.pill svg{width:16px;height:16px;color:var(--warn)}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ibtn svg{width:22px;height:22px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;color:var(--muted);font-size:11px;font-weight:600;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge-dot{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}

/* basics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:var(--surface2);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;text-align:center;line-height:1.2}
.btn svg{width:18px;height:18px}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.s{background:var(--surface2);color:var(--ink)}
.btn.o{border:1.5px solid var(--line);background:var(--surface)}
.btn.g{color:var(--accent);min-height:40px;padding:0 10px}
.btn.w{width:100%}
.btn.bad{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.lv{background:var(--lc);color:#fff}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.lc>i{background:var(--lc)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px}
textarea{min-height:88px;resize:vertical;font-family:var(--f-mono);font-size:12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:-4px}
.sec h2{font-size:18px}
.pagehead{display:grid;gap:2px;margin-bottom:2px}
.pagehead .vi{font-size:14px}

/* today */
.today{background:var(--ink);color:var(--bg);border:0;padding:20px}
.today .vi,.today .lab{color:color-mix(in srgb,var(--bg) 62%,transparent)}
.today h2{font-size:24px;margin:6px 0 4px}
.today .btn.p{background:var(--accent);color:var(--accent-ink)}
.today .btn.s{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
.phr{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.3}
.dots{display:flex;gap:6px}
.dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:500;background:var(--surface2);color:var(--muted);border:1.5px solid transparent}
.dot.on{background:var(--accent);color:var(--accent-ink)}
.dot.fz{background:repeating-linear-gradient(45deg,var(--accent-soft),var(--accent-soft) 3px,var(--surface2) 3px,var(--surface2) 6px)}
.dot.now{border-color:var(--ink)}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats .card{padding:12px}

/* path */
.lvhead{display:grid;gap:8px;margin-top:6px}
.wk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.wk.cur{border-color:var(--lc);box-shadow:0 0 0 1px var(--lc)}
.wk.lockd{opacity:.55}
.wkn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:13px;background:var(--surface2);color:var(--muted);flex:none}
.wk.done .wkn{background:var(--lc);color:#fff}
.mini{display:flex;gap:3px;margin-top:6px}
.mini i{width:14px;height:5px;border-radius:2px;background:var(--surface2)}
.mini i.on{background:var(--lc)}
.dayrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow[disabled]{opacity:.5}
.dn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-size:12px;background:var(--surface2);color:var(--muted)}
.dayrow.done .dn{background:var(--good);color:#fff}
.dn svg{width:16px;height:16px}

/* progress */
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.ring small{display:block;font-family:var(--f-body);font-weight:600;font-size:10px;color:var(--muted);margin-top:2px}
.heatwrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.hl{display:grid;grid-template-rows:repeat(7,20px);gap:4px;font-family:var(--f-mono);font-size:10px;color:var(--muted);align-items:center}
.hg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,20px);grid-auto-columns:20px;gap:4px}
.hc{width:20px;height:20px;border-radius:5px;background:var(--surface2);display:block}
.hc.l1{background:color-mix(in srgb,var(--accent) 35%,var(--surface2))}
.hc.l2{background:color-mix(in srgb,var(--accent) 65%,var(--surface2))}
.hc.l3{background:var(--accent)}
.hc.fz{background:repeating-linear-gradient(45deg,var(--accent-soft),var(--accent-soft) 3px,var(--surface2) 3px,var(--surface2) 6px)}
.hc.fu{background:transparent;border:1px dashed var(--line)}
.hc.now{outline:2px solid var(--ink);outline-offset:1px}
.skill{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.bdg{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;gap:4px}
.bdg.off{opacity:.45}
.bdg svg{width:22px;height:22px;color:var(--warn)}
details.card summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
.cando{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;margin-top:12px;font-size:14px}
.cando b{font-family:var(--f-mono);font-weight:500;color:var(--muted)}

/* phrasebook */
.pb{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:14px 0;border-bottom:1px solid var(--line)}
.pb:last-child{border-bottom:0}
.pb .en{font-weight:600;font-size:16px}
.pb .acts{display:flex;gap:2px;grid-row:1/3;grid-column:2;align-self:center}

/* overlay (lessons) */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ov-top{padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.ov-top .in,.ov-body>.in,.ov-bot .in{max-width:560px;margin:0 auto}
.ov-top .in{display:flex;align-items:center;gap:12px}
.ov-body{flex:1;overflow:auto;padding:10px 16px 28px;-webkit-overflow-scrolling:touch}
.ov-bot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.ov-bot.ok{background:var(--good-soft);border-top:2px solid var(--good)}
.ov-bot.no{background:var(--bad-soft);border-top:2px solid var(--bad)}
.ov-bot .grid{display:grid;gap:10px}
.qlab{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.qmain{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.3;margin:10px 0 14px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;line-height:1.4}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.say{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px}
.say svg{width:18px;height:18px}
.say.big{width:88px;height:88px;border-radius:50%;justify-content:center;margin:12px auto;display:flex}
.say.big svg{width:36px;height:36px}
.slot{min-height:56px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);align-content:flex-start}
.tok{padding:9px 13px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-size:16px;font-weight:500}
.tok.in{background:var(--accent-soft);border-color:var(--accent)}
.tok[disabled]{opacity:.35}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.card.lcard{display:grid;gap:8px}
.lcard .phr{font-size:20px}
.said{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.said[aria-pressed="true"]{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.said svg{width:16px;height:16px}
.tip{display:flex;gap:10px;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.tip svg{width:20px;height:20px;color:var(--warn);flex:none;margin-top:1px}
.bub{max-width:90%;padding:10px 14px;border-radius:16px;margin:8px 0;font-size:16px;line-height:1.4}
.bub.me{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub.ot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub .spk{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.bub .vi{display:block;color:inherit;opacity:.75;font-size:13px;margin-top:3px}
.bub .say{height:30px;padding:0 10px;font-size:12px;margin-top:6px}
.done{display:grid;gap:16px;text-align:center;padding-top:10px}
.done .ring{width:132px;height:132px;margin:0 auto}
.done .ring>div{width:106px;height:106px;font-size:32px}
.modal-bg{position:absolute;inset:0;background:rgba(6,14,11,.55);display:grid;place-items:center;padding:24px}
.modal{background:var(--surface);border-radius:16px;padding:20px;max-width:360px;width:100%;display:grid;gap:14px}

/* sheet, cert, onboarding, toast */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(6,14,11,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.cert{border:2px solid var(--accent);outline:1px solid var(--accent);outline-offset:-8px;padding:30px 20px;text-align:center;border-radius:6px;background:var(--surface);display:grid;gap:8px}
.cert .nm{font-family:var(--f-display);font-size:30px;font-weight:800;margin:6px 0}
.hero{min-height:100%;display:grid;align-content:center;gap:18px;padding-block:28px}
.hero .logo svg{width:56px;height:56px}
.hero h1{font-size:38px;letter-spacing:-.03em}
.lvbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lvbtns button{min-height:64px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;display:grid;place-items:center;align-content:center;gap:0}
.lvbtns small{font-weight:500;color:var(--muted);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88%}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:600px){body{font-size:16px}}

.banner{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line,transparent)}
@media (min-width:640px){html{zoom:1.2}}
@media (min-width:900px){html{zoom:1.35}}
@media (min-width:1300px){html{zoom:1.6}}

<script>
const CURR=[{"l":"A1","t":"Greetings & introductions","v":"Chào hỏi & giới thiệu","c":"I can greet a patient and introduce myself as a nurse.","d":[{"t":"Greeting patients","tip":"Nói \"Good morning\" trước 12 giờ trưa, \"Good afternoon\" đến khoảng 6 giờ chiều.","p":[["Good morning.","Chào buổi sáng."],["Good afternoon.","Chào buổi chiều."],["Good evening.","Chào buổi tối."],["How are you today?","Hôm nay bạn thế nào?"]]},{"t":"Introducing myself","tip":"Nói chậm và mỉm cười. Câu ngắn dễ nghe hơn câu dài.","p":[["Hello. My name is Linh.","Xin chào. Tên tôi là Linh."],["I am your nurse.","Tôi là điều dưỡng của bạn."],["I am here to help you.","Tôi ở đây để giúp bạn."],["Nice to meet you.","Rất vui được gặp bạn."]]},{"t":"Asking names","tip":"Dùng \"Mr\" cho nam, \"Mrs\" hoặc \"Ms\" cho nữ. Hỏi lại nếu chưa chắc cách gọi.","p":[["What is your name?","Tên bạn là gì?"],["Can you spell your name, please?","Bạn đánh vần tên giúp tôi được không?"],["Is this your name?","Đây có phải tên bạn không?"],["Thank you, Mr Lee.","Cảm ơn ông Lee."]]},{"t":"Polite words","tip":"\"Please\" và \"thank you\" làm bệnh nhân yên tâm. Hãy dùng thật nhiều.","p":[["Please.","Xin vui lòng."],["Thank you very much.","Cảm ơn bạn rất nhiều."],["You are welcome.","Không có gì."],["Excuse me, may I come in?","Xin lỗi, tôi vào được không?"]]},{"t":"Saying goodbye","tip":"Trước khi rời phòng, luôn nói khi nào bạn sẽ quay lại.","p":[["I will be back soon.","Tôi sẽ quay lại ngay."],["Press the call button if you need me.","Bấm nút gọi nếu bạn cần tôi."],["Have a good rest.","Chúc bạn nghỉ ngơi tốt."],["See you later.","Hẹn gặp lại sau."]]}],"dl":{"t":"Meeting a new patient","v":"Gặp bệnh nhân mới","k":[["N","Good morning. My name is Linh. I am your nurse.","Chào buổi sáng. Tên tôi là Linh. Tôi là điều dưỡng của bạn."],["P","Good morning.","Chào buổi sáng."],["N","What is your name, please?","Xin cho biết tên của bạn?"],["P","My name is Tom Lee.","Tên tôi là Tom Lee."],["N","Nice to meet you, Mr Lee. How are you today?","Rất vui được gặp ông Lee. Hôm nay ông thế nào?"],["P","I am fine, thank you.","Tôi khỏe, cảm ơn."],["N","Press the call button if you need me.","Bấm nút gọi nếu ông cần tôi."],["P","Thank you.","Cảm ơn cô."]]}},{"l":"A1","t":"Numbers, time & dates","v":"Số, giờ & ngày tháng","c":"I can say numbers, the time and today's date.","d":[{"t":"Numbers 1 to 10","tip":"Đọc số chậm và rõ. \"Thirteen\" và \"thirty\" rất dễ nhầm.","p":[["One, two, three, four, five.","Một, hai, ba, bốn, năm."],["Six, seven, eight, nine, ten.","Sáu, bảy, tám, chín, mười."],["I have two tablets for you.","Tôi có hai viên thuốc cho bạn."],["Please take three deep breaths.","Xin hít sâu ba lần."]]},{"t":"Numbers 11 to 100","tip":"Các số đuôi -teen nhấn âm cuối, các số đuôi -ty nhấn âm đầu.","p":[["Eleven, twelve, thirteen, fourteen.","Mười một, mười hai, mười ba, mười bốn."],["Twenty, thirty, forty, fifty.","Hai mươi, ba mươi, bốn mươi, năm mươi."],["Your room number is twenty-five.","Số phòng của bạn là hai mươi lăm."],["The temperature is thirty-seven degrees.","Nhiệt độ là ba mươi bảy độ."]]},{"t":"Telling the time","tip":"Trong bệnh viện, nhiều nơi dùng giờ 24 giờ. Hỏi lại nếu chưa chắc.","p":[["What time is it?","Mấy giờ rồi?"],["It is eight o'clock.","Bây giờ là tám giờ."],["It is half past two.","Bây giờ là hai giờ rưỡi."],["It is a quarter to six.","Bây giờ là sáu giờ kém mười lăm."]]},{"t":"Times of day","tip":"Dùng \"in the morning\" nhưng \"at night\" (không nói \"in the night\").","p":[["I work the night shift.","Tôi làm ca đêm."],["Breakfast is at seven in the morning.","Bữa sáng lúc bảy giờ sáng."],["The doctor comes at ten o'clock.","Bác sĩ đến lúc mười giờ."],["Visiting time is at five in the afternoon.","Giờ thăm bệnh là năm giờ chiều."]]},{"t":"Dates","tip":"Ngày dùng số thứ tự: first, second, third... Tháng viết hoa chữ cái đầu.","p":[["What is the date today?","Hôm nay là ngày mấy?"],["Today is the first of March.","Hôm nay là ngày một tháng Ba."],["When is your birthday?","Sinh nhật bạn là khi nào?"],["My birthday is on the tenth of May.","Sinh nhật tôi vào ngày mười tháng Năm."]]}],"dl":{"t":"Time for your tablet","v":"Đến giờ uống thuốc","k":[["N","It is eight o'clock. Time for your tablet.","Tám giờ rồi. Đến giờ uống thuốc."],["P","How many tablets?","Mấy viên vậy?"],["N","Two tablets, please.","Hai viên, xin vui lòng."],["P","What time is lunch?","Mấy giờ ăn trưa?"],["N","Lunch is at twelve o'clock.","Bữa trưa lúc mười hai giờ."],["P","Thank you.","Cảm ơn cô."],["N","You are welcome. I will be back at ten.","Không có gì. Mười giờ tôi quay lại."]]}},{"l":"A1","t":"Patient details","v":"Thông tin bệnh nhân","c":"I can ask for and check a patient's name, age, date of birth and address.","d":[{"t":"Full name and ID","tip":"Luôn kiểm tra ít nhất hai thông tin nhận dạng: tên và ngày sinh.","p":[["What is your full name?","Họ và tên đầy đủ của bạn là gì?"],["Please show me your ID card.","Xin cho tôi xem thẻ căn cước của bạn."],["This is your wristband.","Đây là vòng đeo tay nhận dạng của bạn."],["Please check your name on it.","Xin kiểm tra tên của bạn trên đó."]]},{"t":"Age and date of birth","tip":"Tuổi: \"I am sixty-five\" hoặc \"I am sixty-five years old\" đều đúng.","p":[["How old are you?","Bạn bao nhiêu tuổi?"],["I am sixty-five years old.","Tôi sáu mươi lăm tuổi."],["What is your date of birth?","Ngày sinh của bạn là gì?"],["Your date of birth is the fourth of June, 1960.","Ngày sinh của bạn là ngày 4 tháng 6 năm 1960."]]},{"t":"Address and phone","tip":"Đọc lại số điện thoại từng chữ số một để chắc chắn.","p":[["Where do you live?","Bạn sống ở đâu?"],["What is your address?","Địa chỉ của bạn là gì?"],["What is your phone number?","Số điện thoại của bạn là gì?"],["Can you say it again, please?","Bạn nói lại giúp tôi được không?"]]},{"t":"Job and language","tip":"Hỏi về ngôn ngữ giúp bạn biết có cần phiên dịch hay không.","p":[["Are you married?","Bạn đã kết hôn chưa?"],["What is your job?","Bạn làm nghề gì?"],["What language do you speak?","Bạn nói ngôn ngữ nào?"],["Do you need an interpreter?","Bạn có cần phiên dịch không?"]]},{"t":"Emergency contact","tip":"Luôn ghi lại người liên hệ khẩn cấp ngay khi tiếp nhận.","p":[["Who is your emergency contact?","Ai là người liên hệ khẩn cấp của bạn?"],["What is her phone number?","Số điện thoại của cô ấy là gì?"],["Is she your daughter?","Cô ấy có phải con gái bạn không?"],["Can I call your family?","Tôi gọi cho gia đình bạn được không?"]]}],"dl":{"t":"Admission details","v":"Ghi thông tin nhập viện","k":[["N","Hello. I need to check your details. What is your full name?","Xin chào. Tôi cần kiểm tra thông tin của bạn. Họ tên đầy đủ của bạn là gì?"],["P","My name is Anna Tran.","Tên tôi là Anna Tran."],["N","How old are you, Anna?","Chị bao nhiêu tuổi, Anna?"],["P","I am forty-two.","Tôi bốn mươi hai tuổi."],["N","What is your date of birth?","Ngày sinh của chị là gì?"],["P","It is the second of April, 1983.","Là ngày 2 tháng 4 năm 1983."],["N","Thank you. Who is your emergency contact?","Cảm ơn chị. Ai là người liên hệ khẩn cấp của chị?"],["P","My husband.","Chồng tôi."]]}},{"l":"A1","t":"Parts of the body","v":"Các bộ phận cơ thể","c":"I can name the main parts of the body.","d":[{"t":"Head and face","tip":"Học tên bộ phận cơ thể bằng cách chỉ vào chúng khi nói.","p":[["This is your head.","Đây là đầu của bạn."],["Open your eyes, please.","Xin mở mắt ra."],["Open your mouth, please.","Xin há miệng ra."],["Can you hear me?","Bạn có nghe tôi nói không?"]]},{"t":"Arms and hands","tip":"Số nhiều bất quy tắc: one hand, two hands; one foot, two feet.","p":[["Show me your hand.","Cho tôi xem bàn tay của bạn."],["Lift your right arm.","Giơ cánh tay phải lên."],["Can you move your fingers?","Bạn cử động được các ngón tay không?"],["I will check your left wrist.","Tôi sẽ kiểm tra cổ tay trái của bạn."]]},{"t":"Chest, back and stomach","tip":"Nói trước điều bạn sắp làm, đặc biệt khi chạm vào người bệnh.","p":[["Breathe in and breathe out.","Hít vào và thở ra."],["Please lie on your back.","Xin nằm ngửa."],["Does your stomach hurt?","Bụng bạn có đau không?"],["I will listen to your chest.","Tôi sẽ nghe ngực của bạn."]]},{"t":"Legs and feet","tip":"\"Knee\" đọc là /niː/, chữ k không phát âm.","p":[["Move your leg, please.","Xin cử động chân của bạn."],["Can you feel your foot?","Bạn có cảm thấy bàn chân không?"],["Bend your knee.","Gập đầu gối lại."],["Your ankle is swollen.","Mắt cá chân của bạn bị sưng."]]},{"t":"Skin and inside the body","tip":"Học các từ đơn giản trước khi học thuật ngữ y khoa.","p":[["The heart pumps blood.","Tim bơm máu."],["The lungs help you breathe.","Phổi giúp bạn thở."],["The skin is red here.","Da ở đây bị đỏ."],["This bone is broken.","Chiếc xương này bị gãy."]]}],"dl":{"t":"Checking the body","v":"Kiểm tra cơ thể","k":[["N","Hello, Mr Lee. I need to check your body. Is that OK?","Chào ông Lee. Tôi cần kiểm tra cơ thể ông. Được không ạ?"],["P","Yes, that is OK.","Vâng, được."],["N","Open your mouth, please.","Xin ông há miệng ra."],["P","Like this?","Như thế này à?"],["N","Yes, thank you. Now lift your right arm.","Vâng, cảm ơn ông. Bây giờ giơ cánh tay phải lên."],["P","My arm hurts a little.","Tay tôi hơi đau."],["N","I am sorry. I will be gentle.","Tôi xin lỗi. Tôi sẽ làm nhẹ nhàng."]]}},{"l":"A1","t":"Simple commands","v":"Yêu cầu & chỉ dẫn đơn giản","c":"I can give simple instructions politely.","d":[{"t":"Sit, stand, lie","tip":"Bắt đầu câu bằng \"Please\" để nghe lịch sự hơn.","p":[["Please sit down.","Xin ngồi xuống."],["Please stand up slowly.","Xin đứng lên từ từ."],["Please lie down on the bed.","Xin nằm xuống giường."],["Turn on your side, please.","Xin nằm nghiêng."]]},{"t":"Breathing and moving","tip":"Làm mẫu động tác khi nói giúp bệnh nhân hiểu nhanh hơn.","p":[["Breathe in slowly.","Hít vào từ từ."],["Hold your breath.","Nhịn thở."],["Cough, please.","Xin ho một cái."],["Walk with me.","Đi cùng tôi."]]},{"t":"Asking permission","tip":"\"May I\" lịch sự hơn \"Can I\". Bệnh nhân luôn có quyền từ chối.","p":[["May I check your blood pressure?","Tôi đo huyết áp cho bạn được không?"],["Is it OK if I touch your arm?","Tôi chạm vào tay bạn có được không?"],["Can I close the curtain?","Tôi kéo rèm lại được không?"],["Do you want some water?","Bạn có muốn uống chút nước không?"]]},{"t":"Stop, wait, careful","tip":"Câu phủ định ngắn: \"Don't ...\" dùng cho cảnh báo an toàn.","p":[["Please wait here.","Xin đợi ở đây."],["Stop, please.","Xin dừng lại."],["Be careful. The floor is wet.","Cẩn thận. Sàn nhà đang ướt."],["Don't get up alone.","Đừng tự đứng dậy một mình."]]},{"t":"Checking understanding","tip":"Luôn kiểm tra xem bệnh nhân đã hiểu chưa trước khi làm thủ thuật.","p":[["Do you understand?","Bạn có hiểu không?"],["I don't understand.","Tôi không hiểu."],["Please speak slowly.","Xin nói chậm thôi."],["I will show you.","Tôi sẽ chỉ cho bạn xem."]]}],"dl":{"t":"Getting out of bed","v":"Ra khỏi giường","k":[["N","Good morning. Are you ready to get up?","Chào buổi sáng. Bạn sẵn sàng ngồi dậy chưa?"],["P","Yes, but I feel weak.","Vâng, nhưng tôi thấy yếu."],["N","Sit up slowly, please.","Xin ngồi dậy từ từ."],["P","OK.","Vâng."],["N","Now put your feet on the floor.","Bây giờ đặt chân xuống sàn."],["P","Like this?","Như thế này à?"],["N","Yes. Don't stand up alone. I will help you.","Đúng rồi. Đừng tự đứng dậy. Tôi sẽ giúp bạn."]]}},{"l":"A1","t":"Feelings & simple symptoms","v":"Cảm giác & triệu chứng đơn giản","c":"I can ask how a patient feels and understand simple answers.","d":[{"t":"How do you feel?","tip":"Hỏi \"How do you feel?\" và lắng nghe. Đừng vội ngắt lời.","p":[["How do you feel?","Bạn cảm thấy thế nào?"],["I feel good.","Tôi cảm thấy khỏe."],["I feel tired.","Tôi cảm thấy mệt."],["I feel sick.","Tôi thấy buồn nôn."]]},{"t":"Pain","tip":"Hỏi vị trí đau trước, sau đó mới hỏi mức độ đau.","p":[["Do you have pain?","Bạn có bị đau không?"],["Where does it hurt?","Bạn đau ở đâu?"],["It hurts here.","Đau ở chỗ này."],["I have a headache.","Tôi bị đau đầu."]]},{"t":"Common symptoms","tip":"Nhớ: \"have a fever\", \"have a cough\" (dùng have, không dùng be).","p":[["I have a fever.","Tôi bị sốt."],["I have a cough.","Tôi bị ho."],["I feel dizzy.","Tôi thấy chóng mặt."],["I can't sleep.","Tôi không ngủ được."]]},{"t":"Worry and comfort","tip":"Một câu trấn an ngắn có thể giúp bệnh nhân bình tĩnh hơn nhiều.","p":[["Are you worried?","Bạn có lo lắng không?"],["Don't worry. I am here.","Đừng lo. Tôi ở đây."],["Are you afraid?","Bạn có sợ không?"],["I feel better now.","Bây giờ tôi thấy đỡ hơn."]]},{"t":"A little or a lot","tip":"\"A little\" và \"a lot\" giúp bạn đánh giá mức độ triệu chứng.","p":[["It hurts a little.","Hơi đau một chút."],["It hurts a lot.","Đau nhiều."],["Is it better or worse?","Đỡ hơn hay tệ hơn?"],["It started this morning.","Nó bắt đầu từ sáng nay."]]}],"dl":{"t":"How are you feeling?","v":"Hôm nay bạn thấy thế nào?","k":[["N","How do you feel today, Mrs Hoa?","Hôm nay bà thấy thế nào, bà Hoa?"],["P","I feel tired.","Tôi thấy mệt."],["N","Do you have any pain?","Bà có bị đau không?"],["P","Yes. I have a headache.","Có. Tôi bị đau đầu."],["N","Where does it hurt?","Đau ở đâu ạ?"],["P","Here, on my head.","Ở đây, trên đầu."],["N","I will tell the doctor.","Tôi sẽ báo với bác sĩ."]]}},{"l":"A1","t":"Around the ward","v":"Trong khoa phòng","c":"I can name common places and things in the ward and tell a patient where they are.","d":[{"t":"Ward places","tip":"\"Ward\" là khoa hoặc buồng bệnh. \"Nurses' station\" là trạm điều dưỡng.","p":[["This is your bed.","Đây là giường của bạn."],["The bathroom is over there.","Nhà vệ sinh ở đằng kia."],["This is the nurses' station.","Đây là trạm điều dưỡng."],["This is the waiting room.","Đây là phòng chờ."]]},{"t":"Bedside items","tip":"Chỉ vào đồ vật khi nói để bệnh nhân dễ hiểu.","p":[["This is the call button.","Đây là nút gọi."],["The bed goes up and down.","Giường có thể nâng lên và hạ xuống."],["Here is your blanket and pillow.","Đây là chăn và gối của bạn."],["This is a wheelchair.","Đây là xe lăn."]]},{"t":"Medical equipment","tip":"Nhớ trọng âm: ther-MO-me-ter, STETH-o-scope.","p":[["This is a thermometer.","Đây là nhiệt kế."],["This is a stethoscope.","Đây là ống nghe."],["This machine checks your blood pressure.","Máy này đo huyết áp của bạn."],["This is an IV drip.","Đây là dây truyền dịch."]]},{"t":"Supplies","tip":"Hỏi đồng nghiệp bằng câu ngắn: \"Where is/are ...?\"","p":[["I need gloves and a mask.","Tôi cần găng tay và khẩu trang."],["Where is the bandage?","Băng ở đâu?"],["The syringe is on the tray.","Ống tiêm ở trên khay."],["The waste bin is next to the door.","Thùng rác ở cạnh cửa."]]},{"t":"Where things are","tip":"Giới từ chỉ vị trí: on, in, under, next to, behind.","p":[["The table is next to the bed.","Cái bàn ở cạnh giường."],["The chair is behind the door.","Cái ghế ở sau cánh cửa."],["Your bag is under the bed.","Túi của bạn ở dưới giường."],["The phone is on the table.","Điện thoại ở trên bàn."]]}],"dl":{"t":"Ward tour","v":"Giới thiệu khoa phòng","k":[["N","Welcome to Ward Five. This is your bed.","Chào mừng đến Khoa Năm. Đây là giường của bạn."],["P","Thank you. Where is the bathroom?","Cảm ơn cô. Nhà vệ sinh ở đâu?"],["N","It is over there, next to the door.","Ở đằng kia, cạnh cửa."],["P","What is this button?","Nút này là gì vậy?"],["N","It is the call button. Press it if you need help.","Đó là nút gọi. Bấm nút nếu bạn cần giúp đỡ."],["P","OK. I understand.","Vâng. Tôi hiểu rồi."]]}},{"l":"A1","t":"Family & visitors","v":"Gia đình & người thăm","c":"I can talk with a patient's family and explain visiting rules.","d":[{"t":"Family words","tip":"Từ vựng gia đình: mother, father, son, daughter, husband, wife.","p":[["This is my mother.","Đây là mẹ tôi."],["Are you his son?","Bạn là con trai của ông ấy à?"],["She is my sister.","Cô ấy là chị gái tôi."],["Do you have children?","Bạn có con không?"]]},{"t":"Who is with you","tip":"Hỏi ai là người ra quyết định thay bệnh nhân khi cần.","p":[["Who is with you today?","Hôm nay ai đi cùng bạn?"],["My husband is here.","Chồng tôi ở đây."],["Your family can wait outside.","Gia đình bạn có thể đợi bên ngoài."],["Only two visitors, please.","Xin chỉ hai người thăm thôi."]]},{"t":"Visiting hours","tip":"Nói rõ giờ thăm và quy định để tránh hiểu lầm.","p":[["Visiting hours are from two to four.","Giờ thăm bệnh từ hai đến bốn giờ."],["Visitors can come in now.","Người thăm có thể vào bây giờ."],["Please wash your hands.","Xin rửa tay."],["Please turn off your phone.","Xin tắt điện thoại."]]},{"t":"Talking to family","tip":"Trả lời ngắn, rõ ràng và tôn trọng quyền riêng tư của bệnh nhân.","p":[["Are you the patient's daughter?","Bạn là con gái của bệnh nhân phải không?"],["Your father is sleeping.","Bố bạn đang ngủ."],["He is fine. He is resting.","Ông ấy ổn. Ông ấy đang nghỉ ngơi."],["Do you want to see him?","Bạn có muốn gặp ông ấy không?"]]},{"t":"Home life","tip":"Câu hỏi về gia đình giúp bạn lên kế hoạch xuất viện sau này.","p":[["Who lives with you?","Ai sống cùng bạn?"],["I live with my wife and two children.","Tôi sống với vợ và hai con."],["Who takes care of you at home?","Ai chăm sóc bạn ở nhà?"],["My daughter takes care of me.","Con gái tôi chăm sóc tôi."]]}],"dl":{"t":"Family visit","v":"Gia đình đến thăm","k":[["F","Hello. I am Mr Lee's daughter.","Xin chào. Tôi là con gái của ông Lee."],["N","Nice to meet you. Your father is resting.","Rất vui được gặp chị. Bố chị đang nghỉ ngơi."],["F","Can I see him?","Tôi gặp bố được không?"],["N","Yes, but only for ten minutes.","Được, nhưng chỉ mười phút thôi."],["F","Thank you. Is he OK?","Cảm ơn cô. Bố tôi ổn chứ?"],["N","He is fine. He feels better today.","Ông ổn. Hôm nay ông thấy khá hơn."]]}},{"l":"A1","t":"Daily routines","v":"Sinh hoạt hằng ngày","c":"I can help a patient with eating, drinking, sleeping and washing.","d":[{"t":"Meals","tip":"\"Rice\" là cơm (đã nấu). Hỏi sở thích ăn uống của bệnh nhân.","p":[["It is time for breakfast.","Đến giờ ăn sáng."],["Are you hungry?","Bạn có đói không?"],["Do you want rice or soup?","Bạn muốn ăn cơm hay súp?"],["Please eat slowly.","Xin ăn chậm thôi."]]},{"t":"Drinking","tip":"Hỏi bệnh nhân có bị hạn chế uống nước không trước khi đưa nước.","p":[["Are you thirsty?","Bạn có khát không?"],["Here is a glass of water.","Đây là một ly nước."],["Drink a little water.","Uống một chút nước."],["Do you want tea or milk?","Bạn muốn trà hay sữa?"]]},{"t":"Sleeping","tip":"Bệnh viện thường ồn. Hỏi xem bệnh nhân có ngủ ngon không.","p":[["Did you sleep well?","Bạn ngủ ngon không?"],["It is time to sleep.","Đến giờ đi ngủ."],["Do you want another pillow?","Bạn có muốn thêm một cái gối không?"],["I will turn off the light.","Tôi sẽ tắt đèn."]]},{"t":"Washing","tip":"Luôn hỏi ý bệnh nhân trước khi giúp vệ sinh cá nhân.","p":[["Do you want to wash?","Bạn có muốn rửa ráy không?"],["Here is soap and a towel.","Đây là xà phòng và khăn tắm."],["Please brush your teeth.","Xin đánh răng."],["I will help you wash your face.","Tôi sẽ giúp bạn rửa mặt."]]},{"t":"Toilet","tip":"Nói nhẹ nhàng và giữ sự riêng tư khi hỏi về đi vệ sinh.","p":[["Do you need the toilet?","Bạn có cần đi vệ sinh không?"],["I will help you to the bathroom.","Tôi sẽ đưa bạn đến nhà vệ sinh."],["Please call me when you finish.","Xong thì bạn gọi tôi nhé."],["Wash your hands after that.","Sau đó hãy rửa tay."]]}],"dl":{"t":"Morning routine","v":"Buổi sáng","k":[["N","Good morning. Did you sleep well?","Chào buổi sáng. Bạn ngủ ngon không?"],["P","Not very well.","Không ngon lắm."],["N","I am sorry. Are you hungry?","Tôi rất tiếc. Bạn có đói không?"],["P","Yes, a little.","Có, một chút."],["N","Breakfast is here. Please eat slowly.","Bữa sáng đây. Xin ăn chậm thôi."],["P","Thank you.","Cảm ơn cô."],["N","After that I will help you wash.","Sau đó tôi sẽ giúp bạn rửa ráy."]]}},{"l":"A1","t":"Colors, size & amounts","v":"Màu sắc, kích cỡ & số lượng","c":"I can describe simple things: colour, size, amount and temperature.","d":[{"t":"Colors","tip":"Màu sắc của thuốc, da và dịch cơ thể là thông tin lâm sàng quan trọng.","p":[["The white pill is for the morning.","Viên thuốc màu trắng uống vào buổi sáng."],["The blue tablet is for the evening.","Viên thuốc màu xanh uống vào buổi tối."],["Is the skin red or pink?","Da màu đỏ hay màu hồng?"],["Is the color normal?","Màu sắc có bình thường không?"]]},{"t":"Size","tip":"Dùng small, medium, large; tránh nói \"little big\" hoặc các từ không rõ nghĩa.","p":[["The wound is small.","Vết thương nhỏ."],["The bed is big.","Cái giường lớn."],["It is about this big.","Nó to cỡ này."],["The tube is long and thin.","Ống dài và mảnh."]]},{"t":"Amount","tip":"\"Some\" dùng trong câu khẳng định; \"any\" dùng trong câu hỏi và phủ định.","p":[["Take one tablet.","Uống một viên."],["Do you want more water?","Bạn có muốn thêm nước không?"],["A little bit, please.","Cho một chút thôi."],["That is enough, thank you.","Vậy là đủ, cảm ơn."]]},{"t":"Hot and cold","tip":"Luôn kiểm tra nhiệt độ thức ăn, nước uống trước khi đưa cho bệnh nhân.","p":[["Is the water hot or cold?","Nước nóng hay lạnh?"],["Are you cold? I will get a blanket.","Bạn có lạnh không? Tôi sẽ lấy chăn."],["The room is too hot.","Phòng nóng quá."],["The soup is very hot. Be careful.","Súp rất nóng. Hãy cẩn thận."]]},{"t":"Comparing","tip":"So sánh hơn: better, worse, bigger, smaller.","p":[["Is it better today?","Hôm nay có đỡ hơn không?"],["It is worse than yesterday.","Nó tệ hơn hôm qua."],["This side is bigger than that side.","Bên này to hơn bên kia."],["It is the same as before.","Vẫn như trước."]]}],"dl":{"t":"Looking at a wound","v":"Xem vết thương","k":[["N","Can I see your leg?","Tôi xem chân của bạn được không?"],["P","Yes.","Vâng."],["N","The wound is small. Is it painful?","Vết thương nhỏ. Có đau không?"],["P","A little bit.","Hơi đau."],["N","What color was it yesterday?","Hôm qua nó màu gì?"],["P","It was red. Today it is pink.","Hôm qua màu đỏ. Hôm nay màu hồng."],["N","That is better.","Vậy là đỡ hơn rồi."]]}},{"l":"A1","t":"Food & drinks","v":"Thức ăn & đồ uống","c":"I can offer food and drinks and take a simple meal order.","d":[{"t":"Food words","tip":"Học tên món ăn phổ biến trong bệnh viện: rice, soup, fish, chicken.","p":[["We have rice, fish and vegetables.","Chúng tôi có cơm, cá và rau."],["Do you eat meat?","Bạn có ăn thịt không?"],["Today's lunch is chicken soup.","Bữa trưa hôm nay là súp gà."],["Do you like fruit?","Bạn có thích trái cây không?"]]},{"t":"Drinks","tip":"\"Would you like ...?\" lịch sự hơn \"Do you want ...?\".","p":[["Would you like tea or coffee?","Bạn muốn trà hay cà phê?"],["I would like some water, please.","Cho tôi ít nước."],["Here is your milk.","Đây là sữa của bạn."],["No sugar, please.","Xin đừng cho đường."]]},{"t":"Meal orders","tip":"Nhắc lại đơn của bệnh nhân để tránh nhầm lẫn.","p":[["What would you like for dinner?","Bạn muốn ăn gì cho bữa tối?"],["I would like rice and fish.","Tôi muốn ăn cơm và cá."],["Is that all?","Vậy là đủ chưa?"],["Your meal will come at six.","Bữa ăn của bạn sẽ đến lúc sáu giờ."]]},{"t":"Likes and allergies","tip":"Dị ứng thức ăn có thể nguy hiểm. Luôn hỏi trước khi đặt món.","p":[["I don't like fish.","Tôi không thích cá."],["Are you allergic to any food?","Bạn có dị ứng thức ăn nào không?"],["I can't eat eggs.","Tôi không ăn được trứng."],["Do you eat pork?","Bạn có ăn thịt heo không?"]]},{"t":"Not eating","tip":"\"Nil by mouth\" hoặc \"nothing to eat\" là chỉ dẫn quan trọng trước thủ thuật.","p":[["You must not eat before the test.","Bạn không được ăn trước khi làm xét nghiệm."],["Nothing to eat or drink after midnight.","Không ăn uống gì sau nửa đêm."],["You can drink water.","Bạn có thể uống nước."],["Please tell me when you are hungry.","Khi đói xin báo cho tôi biết."]]}],"dl":{"t":"Dinner order","v":"Đặt bữa tối","k":[["N","What would you like for dinner?","Bạn muốn ăn gì cho bữa tối?"],["P","What do you have?","Có những món gì vậy?"],["N","Rice with fish, or chicken soup.","Cơm với cá, hoặc súp gà."],["P","I would like chicken soup, please.","Cho tôi súp gà."],["N","Do you want tea or water?","Bạn muốn trà hay nước?"],["P","Water, please.","Cho tôi nước."],["N","OK. Your dinner will come at six.","Vâng. Bữa tối của bạn sẽ đến lúc sáu giờ."]]}},{"l":"A1","t":"Days & appointments","v":"Ngày, lịch hẹn & ca trực","c":"I can talk about days of the week, appointments and my shifts.","d":[{"t":"Days of the week","tip":"Tên thứ trong tuần viết hoa: Monday, Tuesday...","p":[["Today is Monday.","Hôm nay là thứ Hai."],["Tomorrow is Tuesday.","Ngày mai là thứ Ba."],["Yesterday was Sunday.","Hôm qua là Chủ nhật."],["The clinic is open on Friday.","Phòng khám mở cửa vào thứ Sáu."]]},{"t":"Appointments","tip":"Nhắc bệnh nhân mang theo giấy tờ và đến sớm.","p":[["You have an appointment on Wednesday.","Bạn có hẹn vào thứ Tư."],["Your appointment is at nine o'clock.","Cuộc hẹn của bạn lúc chín giờ."],["Please come ten minutes early.","Xin đến sớm mười phút."],["Can you come next week?","Tuần sau bạn đến được không?"]]},{"t":"Time words","tip":"\"In ten minutes\" nghĩa là sau mười phút nữa.","p":[["I will come back in ten minutes.","Mười phút nữa tôi sẽ quay lại."],["The doctor will see you soon.","Bác sĩ sẽ khám cho bạn sớm."],["Please wait a moment.","Xin đợi một lát."],["Not now. Maybe later.","Không phải bây giờ. Có thể lúc khác."]]},{"t":"My shifts","tip":"Nói về ca làm giúp bạn bàn giao và đổi ca với đồng nghiệp.","p":[["I work from seven to three.","Tôi làm từ bảy giờ đến ba giờ."],["The next nurse starts at three.","Điều dưỡng ca sau bắt đầu lúc ba giờ."],["I am on the night shift this week.","Tuần này tôi làm ca đêm."],["I have a day off on Sunday.","Chủ nhật tôi được nghỉ."]]},{"t":"Months and plans","tip":"Dùng \"in\" trước tháng, \"on\" trước thứ và ngày.","p":[["Your surgery is in April.","Ca phẫu thuật của bạn vào tháng Tư."],["The check-up is next month.","Buổi tái khám vào tháng sau."],["You were admitted last week.","Bạn nhập viện tuần trước."],["You go home on Saturday.","Bạn về nhà vào thứ Bảy."]]}],"dl":{"t":"Booking an appointment","v":"Đặt lịch hẹn","k":[["P","I need an appointment.","Tôi cần đặt lịch hẹn."],["N","OK. What day is good for you?","Vâng. Ngày nào thuận tiện cho bạn?"],["P","Monday, in the morning.","Thứ Hai, buổi sáng."],["N","Monday at nine o'clock?","Thứ Hai lúc chín giờ nhé?"],["P","Yes, that is fine.","Vâng, được."],["N","Please come ten minutes early.","Xin đến sớm mười phút."],["P","Thank you.","Cảm ơn cô."]]}},{"l":"A1","t":"Basic questions","v":"Câu hỏi cơ bản","c":"I can ask and answer simple yes/no questions and wh-questions.","d":[{"t":"Are you ...?","tip":"Trả lời ngắn: \"Yes, I am.\" hoặc \"No, I am not.\" Không lặp lại cả câu.","p":[["Are you in pain?","Bạn có đang đau không?"],["Are you allergic to anything?","Bạn có dị ứng với thứ gì không?"],["Is this your first time here?","Đây có phải lần đầu bạn đến đây không?"],["Yes, I am. / No, I am not.","Vâng, đúng. / Không, không phải."]]},{"t":"Do you ...?","tip":"Với \"I, you, we, they\" dùng \"do\". Với \"he, she, it\" dùng \"does\".","p":[["Do you smoke?","Bạn có hút thuốc không?"],["Do you take any medicine?","Bạn có đang dùng thuốc gì không?"],["Do you have any questions?","Bạn có câu hỏi nào không?"],["Yes, I do. / No, I don't.","Vâng, có. / Không, không có."]]},{"t":"Can you ...?","tip":"\"Can\" chỉ khả năng; \"May I\" xin phép.","p":[["Can you walk?","Bạn đi được không?"],["Can you swallow?","Bạn nuốt được không?"],["Can you see me clearly?","Bạn có nhìn rõ tôi không?"],["Yes, I can. / No, I can't.","Vâng, được. / Không, không được."]]},{"t":"Wh-questions","tip":"What, when, where, how long: bốn từ hỏi bạn dùng mỗi ngày.","p":[["What is the problem?","Vấn đề là gì vậy?"],["When did it start?","Nó bắt đầu khi nào?"],["Where is the pain?","Đau ở đâu?"],["How long does it last?","Nó kéo dài bao lâu?"]]},{"t":"Survival phrases","tip":"Khi chưa hiểu, xin nhắc lại. Điều này an toàn hơn đoán.","p":[["I don't know.","Tôi không biết."],["Sorry, can you repeat that?","Xin lỗi, bạn nhắc lại được không?"],["I will get the doctor.","Tôi sẽ gọi bác sĩ."],["I will check and come back to you.","Tôi sẽ kiểm tra rồi quay lại với bạn."]]}],"dl":{"t":"First check with questions","v":"Hỏi nhanh khi tiếp nhận","k":[["N","Do you have any pain?","Bạn có bị đau không?"],["P","Yes, in my stomach.","Có, ở bụng."],["N","When did it start?","Nó bắt đầu khi nào?"],["P","This morning.","Sáng nay."],["N","Are you allergic to any medicine?","Bạn có dị ứng thuốc nào không?"],["P","No, I am not.","Không, tôi không bị."],["N","Do you have any questions?","Bạn có câu hỏi nào không?"],["P","No, thank you.","Không, cảm ơn cô."],["N","I will get the doctor.","Tôi sẽ gọi bác sĩ."]]}},{"l":"A2","t":"Vital signs","v":"Dấu hiệu sinh tồn","c":"I can take and report a patient's temperature, pulse, blood pressure, breathing and oxygen level.","d":[{"t":"Temperature","tip":"Đọc số thập phân: 37.5 là \"thirty-seven point five\".","p":[["I am going to take your temperature.","Tôi sắp đo nhiệt độ cho bạn."],["Please put this under your tongue.","Xin đặt cái này dưới lưỡi."],["Your temperature is thirty-eight point two.","Nhiệt độ của bạn là ba mươi tám độ hai."],["You have a slight fever.","Bạn bị sốt nhẹ."]]},{"t":"Pulse","tip":"\"Beats per minute\" (bpm) là số nhịp mỗi phút.","p":[["I am checking your pulse.","Tôi đang bắt mạch cho bạn."],["Your pulse is seventy-two beats per minute.","Mạch của bạn là bảy mươi hai lần mỗi phút."],["Your heart rate is a little fast.","Nhịp tim của bạn hơi nhanh."],["Please rest for five minutes first.","Xin nghỉ năm phút trước."]]},{"t":"Blood pressure","tip":"Huyết áp đọc: \"one twenty over eighty\" cho 120/80.","p":[["I am going to check your blood pressure.","Tôi sắp đo huyết áp cho bạn."],["Please roll up your sleeve.","Xin xắn tay áo lên."],["Your blood pressure is one twenty over eighty.","Huyết áp của bạn là một trăm hai mươi trên tám mươi."],["It is a little high today.","Hôm nay nó hơi cao."]]},{"t":"Breathing","tip":"Đếm nhịp thở trong một phút và không báo bệnh nhân biết để kết quả chính xác.","p":[["Your breathing is normal.","Nhịp thở của bạn bình thường."],["You are breathing quickly.","Bạn đang thở nhanh."],["Try to breathe slowly and deeply.","Hãy cố thở chậm và sâu."],["Do you feel short of breath?","Bạn có thấy khó thở không?"]]},{"t":"Oxygen level","tip":"SpO2 đọc là \"S-P-O-two\". Bình thường thường từ 95% trở lên.","p":[["I will put this clip on your finger.","Tôi sẽ kẹp cái này vào ngón tay bạn."],["Your oxygen level is ninety-eight percent.","Chỉ số oxy của bạn là chín mươi tám phần trăm."],["That is a normal reading.","Đó là chỉ số bình thường."],["I will check it again in an hour.","Một giờ nữa tôi sẽ đo lại."]]}],"dl":{"t":"Morning observations","v":"Đo chỉ số buổi sáng","k":[["N","Good morning, Mr Lee. I need to check your vital signs.","Chào buổi sáng ông Lee. Tôi cần đo các chỉ số sinh tồn của ông."],["P","OK.","Vâng."],["N","First, I will take your temperature. Please open your mouth.","Trước tiên tôi đo nhiệt độ. Xin ông há miệng."],["P","Is it normal?","Bình thường không?"],["N","Yes, thirty-six point eight. Now I will check your blood pressure.","Có, ba mươi sáu độ tám. Bây giờ tôi đo huyết áp."],["P","Is it high?","Có cao không?"],["N","It is a little high, one forty over ninety. I will tell the doctor.","Hơi cao, một trăm bốn mươi trên chín mươi. Tôi sẽ báo bác sĩ."]]}},{"l":"A2","t":"Pain","v":"Đau & thang điểm đau","c":"I can ask about pain and record it on a pain scale.","d":[{"t":"Where is the pain?","tip":"Hỏi vị trí, mức độ và tính chất đau. Ba câu này luôn cần.","p":[["Where exactly is the pain?","Chính xác bạn đau ở đâu?"],["Can you point to it?","Bạn chỉ vào chỗ đau được không?"],["Does the pain move anywhere?","Cơn đau có lan sang chỗ khác không?"],["Is it on one side or both sides?","Đau một bên hay cả hai bên?"]]},{"t":"Pain scale","tip":"Thang đau từ 0 đến 10. Không là không đau, mười là đau nhất có thể.","p":[["On a scale of zero to ten, how bad is the pain?","Trên thang điểm từ 0 đến 10, bạn đau mức nào?"],["Zero is no pain and ten is the worst pain.","Không là không đau, mười là đau nhất."],["It is about seven out of ten.","Khoảng bảy trên mười."],["The pain is worse than yesterday.","Cơn đau nặng hơn hôm qua."]]},{"t":"Types of pain","tip":"Từ mô tả đau: sharp (nhói), dull (âm ỉ), burning (rát), throbbing (đập theo nhịp).","p":[["Is it a sharp pain or a dull pain?","Đau nhói hay đau âm ỉ?"],["It feels like burning.","Cảm giác như bị bỏng rát."],["The pain comes and goes.","Cơn đau lúc có lúc không."],["It is a constant pain.","Đó là cơn đau liên tục."]]},{"t":"What makes it worse","tip":"Tìm hiểu yếu tố làm đau tăng hoặc giảm để báo bác sĩ.","p":[["Does anything make it better?","Có điều gì làm bạn đỡ đau không?"],["It hurts more when I move.","Tôi đau hơn khi cử động."],["It hurts when I breathe in.","Tôi đau khi hít vào."],["Resting helps a little.","Nghỉ ngơi giúp đỡ một chút."]]},{"t":"Pain relief","tip":"Nói rõ bạn có thể làm gì để giúp giảm đau.","p":[["I will give you something for the pain.","Tôi sẽ cho bạn thuốc giảm đau."],["The medicine will work in thirty minutes.","Thuốc sẽ có tác dụng sau ba mươi phút."],["Please tell me if the pain gets worse.","Xin báo tôi nếu cơn đau nặng hơn."],["I will come back to check on you.","Tôi sẽ quay lại xem bạn thế nào."]]}],"dl":{"t":"Assessing pain","v":"Đánh giá cơn đau","k":[["N","Mrs Hoa, are you in pain?","Bà Hoa, bà có đang đau không?"],["P","Yes, my stomach hurts.","Có, bụng tôi đau."],["N","On a scale of zero to ten, how bad is it?","Trên thang điểm 0 đến 10, đau mức nào?"],["P","About six.","Khoảng sáu."],["N","Is it sharp or dull?","Đau nhói hay âm ỉ?"],["P","It is sharp, and it comes and goes.","Đau nhói, và lúc có lúc không."],["N","I will give you something for the pain and tell the doctor.","Tôi sẽ cho bà thuốc giảm đau và báo bác sĩ."]]}},{"l":"A2","t":"Common symptoms","v":"Triệu chứng thường gặp","c":"I can ask about and understand common symptoms.","d":[{"t":"Fever and cough","tip":"Hỏi kéo dài bao lâu: \"How long have you had ...?\"","p":[["How long have you had a fever?","Bạn bị sốt bao lâu rồi?"],["Do you have a dry cough or a wet cough?","Bạn ho khan hay ho có đờm?"],["Are you coughing up anything?","Bạn có ho ra gì không?"],["Do you have a sore throat?","Bạn có bị đau họng không?"]]},{"t":"Nausea and vomiting","tip":"Nausea là buồn nôn, vomiting là nôn. Hỏi số lần và nội dung nôn.","p":[["Do you feel sick?","Bạn có thấy buồn nôn không?"],["Have you been sick today?","Hôm nay bạn có nôn không?"],["How many times did you vomit?","Bạn nôn mấy lần rồi?"],["Can you keep water down?","Bạn uống nước có giữ lại được không?"]]},{"t":"Bowels and urine","tip":"Dùng từ nhẹ nhàng, riêng tư: \"bowels\", \"pass urine\".","p":[["Have you opened your bowels today?","Hôm nay bạn đi đại tiện chưa?"],["Do you have diarrhea?","Bạn có bị tiêu chảy không?"],["Does it hurt when you pass urine?","Bạn có đau khi đi tiểu không?"],["Are you passing enough urine?","Bạn đi tiểu có đủ không?"]]},{"t":"Dizziness and tiredness","tip":"Hỏi thêm: có bị ngã hay xỉu không, để đánh giá nguy cơ té ngã.","p":[["Do you feel dizzy when you stand up?","Bạn có chóng mặt khi đứng dậy không?"],["Did you faint?","Bạn có bị ngất không?"],["Do you feel very weak?","Bạn có thấy rất yếu không?"],["Have you lost your appetite?","Bạn có chán ăn không?"]]},{"t":"Breathing and chest","tip":"Khó thở và đau ngực là dấu hiệu cần báo bác sĩ ngay.","p":[["Are you having trouble breathing?","Bạn có bị khó thở không?"],["Do you have any chest pain?","Bạn có bị đau ngực không?"],["Is your heart beating fast?","Tim bạn có đập nhanh không?"],["Do you wheeze at night?","Bạn có thở khò khè vào ban đêm không?"]]}],"dl":{"t":"A patient with a fever","v":"Bệnh nhân bị sốt","k":[["N","You look hot. Do you have a fever?","Trông bạn nóng. Bạn có bị sốt không?"],["P","Yes, since last night.","Có, từ tối qua."],["N","Do you have a cough?","Bạn có ho không?"],["P","Yes, a dry cough.","Có, ho khan."],["N","Do you have a sore throat?","Bạn có đau họng không?"],["P","A little.","Hơi đau."],["N","Let me take your temperature. I will tell the doctor.","Để tôi đo nhiệt độ. Tôi sẽ báo bác sĩ."]]}},{"l":"A2","t":"Medication basics","v":"Thuốc cơ bản","c":"I can explain simple medication instructions.","d":[{"t":"Types of medicine","tip":"Nhớ dạng thuốc: tablet, capsule, syrup, injection, cream.","p":[["This is a tablet for your blood pressure.","Đây là viên thuốc huyết áp của bạn."],["This is a capsule for your stomach.","Đây là viên nang cho dạ dày của bạn."],["This syrup is for your cough.","Xi-rô này để trị ho."],["This cream is for your skin.","Thuốc kem này để bôi da."]]},{"t":"How often","tip":"Once a day, twice a day, three times a day. Hãy nói kèm giờ cụ thể.","p":[["Take one tablet once a day.","Uống một viên mỗi ngày một lần."],["Take two capsules three times a day.","Uống hai viên nang mỗi ngày ba lần."],["Take it in the morning.","Uống vào buổi sáng."],["Take it every eight hours.","Uống cách nhau tám tiếng."]]},{"t":"With food","tip":"Before food = trước ăn, after food = sau ăn, with food = cùng bữa ăn.","p":[["Take this medicine after meals.","Uống thuốc này sau bữa ăn."],["Take it with a full glass of water.","Uống với một ly nước đầy."],["Do not take it on an empty stomach.","Không uống khi bụng đói."],["Swallow it whole. Do not chew.","Nuốt nguyên viên. Đừng nhai."]]},{"t":"Checking the patient","tip":"Trước khi cho thuốc: đúng bệnh nhân, đúng thuốc, đúng liều, đúng giờ, đúng đường dùng.","p":[["Are you allergic to any medicine?","Bạn có dị ứng với thuốc nào không?"],["What medicines do you take at home?","Ở nhà bạn dùng thuốc gì?"],["Did you take your medicine today?","Hôm nay bạn đã uống thuốc chưa?"],["Do you feel any side effects?","Bạn có thấy tác dụng phụ nào không?"]]},{"t":"Injections","tip":"Báo trước khi tiêm: \"You will feel a small scratch.\"","p":[["I am going to give you an injection.","Tôi sắp tiêm cho bạn một mũi."],["You will feel a small scratch.","Bạn sẽ thấy hơi nhói một chút."],["Please keep your arm still.","Xin giữ yên cánh tay."],["It is finished. Well done.","Xong rồi. Bạn làm tốt lắm."]]}],"dl":{"t":"Giving morning medicine","v":"Đưa thuốc buổi sáng","k":[["N","Good morning, Mr Lee. It is time for your medicine.","Chào buổi sáng ông Lee. Đến giờ uống thuốc của ông."],["P","What is this one?","Viên này là thuốc gì vậy?"],["N","This tablet is for your blood pressure.","Viên này là thuốc huyết áp của ông."],["P","Do I take it with food?","Tôi uống cùng thức ăn à?"],["N","Yes, after breakfast, with a glass of water.","Vâng, sau bữa sáng, uống với một ly nước."],["P","OK. Thank you.","Vâng. Cảm ơn cô."],["N","Tell me if you feel dizzy or sick.","Hãy báo tôi nếu ông thấy chóng mặt hoặc buồn nôn."]]}},{"l":"A2","t":"Directions","v":"Chỉ đường trong bệnh viện","c":"I can give and follow simple directions in a hospital.","d":[{"t":"Where is ...?","tip":"Hỏi đường lịch sự: \"Excuse me, where is ...?\"","p":[["Excuse me, where is the X-ray room?","Xin lỗi, phòng chụp X-quang ở đâu?"],["Where is the pharmacy?","Nhà thuốc ở đâu?"],["Which floor is the laboratory on?","Phòng xét nghiệm ở tầng mấy?"],["How do I get to the emergency department?","Tôi đến khoa cấp cứu bằng cách nào?"]]},{"t":"Turn left, turn right","tip":"Đưa hướng dẫn theo từng bước ngắn.","p":[["Go straight ahead.","Đi thẳng về phía trước."],["Turn left at the end of the corridor.","Rẽ trái ở cuối hành lang."],["Turn right after the lift.","Rẽ phải sau thang máy."],["It is on your left.","Nó ở bên trái bạn."]]},{"t":"Floors and lifts","tip":"Tầng trệt: ground floor. Tầng một: first floor.","p":[["Take the lift to the third floor.","Đi thang máy lên tầng ba."],["The stairs are next to the lift.","Cầu thang ở cạnh thang máy."],["It is on the ground floor.","Nó ở tầng trệt."],["It is opposite the reception desk.","Nó ở đối diện quầy lễ tân."]]},{"t":"Distance and time","tip":"\"It is a five-minute walk\" là cách nói tự nhiên về khoảng cách.","p":[["It is a five-minute walk from here.","Từ đây đi bộ mất năm phút."],["It is not far.","Không xa đâu."],["It is at the other end of the building.","Nó ở đầu bên kia của tòa nhà."],["Follow the blue signs.","Đi theo các biển báo màu xanh."]]},{"t":"Walking with a patient","tip":"Đi cùng bệnh nhân khi họ yếu hoặc dễ té ngã.","p":[["I will take you there.","Tôi sẽ đưa bạn đến đó."],["Please follow me.","Xin đi theo tôi."],["Hold my arm.","Hãy nắm lấy tay tôi."],["We are here.","Chúng ta đến nơi rồi."]]}],"dl":{"t":"Taking a patient to X-ray","v":"Đưa bệnh nhân đi chụp X-quang","k":[["P","Excuse me, where is the X-ray room?","Xin lỗi, phòng chụp X-quang ở đâu?"],["N","It is on the second floor. I will take you there.","Ở tầng hai. Tôi sẽ đưa bạn đến đó."],["P","Thank you. Is it far?","Cảm ơn cô. Có xa không?"],["N","No, it is a five-minute walk. Take the lift, then turn right.","Không, đi bộ năm phút. Đi thang máy, rồi rẽ phải."],["P","I feel a little weak.","Tôi thấy hơi yếu."],["N","Hold my arm. We will go slowly.","Hãy nắm lấy tay tôi. Chúng ta sẽ đi chậm."]]}},{"l":"A2","t":"Admission","v":"Đón tiếp bệnh nhân nhập viện","c":"I can welcome a new patient and settle them into the ward.","d":[{"t":"Welcoming a patient","tip":"Bước đầu tiên quyết định cảm giác an toàn của bệnh nhân.","p":[["Welcome to the ward. I will show you around.","Chào mừng bạn đến khoa. Tôi sẽ dẫn bạn đi xem."],["This will be your bed for your stay.","Đây sẽ là giường của bạn trong thời gian nằm viện."],["Please put your things in this locker.","Xin để đồ của bạn vào tủ này."],["Let me know if you need anything.","Cần gì cứ báo cho tôi."]]},{"t":"Checking arrival details","tip":"Hỏi lý do nhập viện bằng lời của bệnh nhân.","p":[["Why have you come to hospital today?","Hôm nay bạn đến bệnh viện vì lý do gì?"],["Did you come by ambulance?","Bạn đến bằng xe cứu thương à?"],["Did you bring your medicines with you?","Bạn có mang thuốc theo không?"],["Do you have any documents with you?","Bạn có mang theo giấy tờ nào không?"]]},{"t":"Belongings","tip":"Ghi lại đồ có giá trị và tránh mất mát.","p":[["Do you have any valuables with you?","Bạn có mang đồ có giá trị không?"],["Please take off your watch and rings.","Xin tháo đồng hồ và nhẫn ra."],["We can keep your money in the safe.","Chúng tôi có thể cất tiền của bạn vào két."],["Please sign here for your belongings.","Xin ký vào đây xác nhận đồ đạc."]]},{"t":"Ward rules","tip":"Giải thích quy định ngắn gọn, rõ ràng và lịch sự.","p":[["Meals are at eight, twelve and six.","Bữa ăn lúc tám giờ, mười hai giờ và sáu giờ."],["Please do not leave the ward without telling us.","Xin đừng rời khoa mà không báo chúng tôi."],["Smoking is not allowed in the hospital.","Bệnh viện không cho phép hút thuốc."],["Please keep your phone on silent.","Xin để điện thoại ở chế độ im lặng."]]},{"t":"Getting settled","tip":"Hỏi bệnh nhân có thoải mái không trước khi rời đi.","p":[["Is the bed comfortable?","Giường có thoải mái không?"],["Would you like an extra blanket?","Bạn có muốn thêm một cái chăn không?"],["Do you have any questions about the ward?","Bạn có câu hỏi gì về khoa không?"],["The doctor will see you this afternoon.","Chiều nay bác sĩ sẽ khám cho bạn."]]}],"dl":{"t":"Admitting a patient","v":"Tiếp nhận bệnh nhân","k":[["N","Welcome to the ward, Mrs Hoa. I am Linh, your nurse today.","Chào mừng bà Hoa đến khoa. Tôi là Linh, điều dưỡng của bà hôm nay."],["P","Thank you. I feel nervous.","Cảm ơn cô. Tôi thấy lo lắng."],["N","That is normal. Did you bring your medicines?","Bình thường thôi ạ. Bà có mang theo thuốc không?"],["P","Yes, they are in my bag.","Có, thuốc ở trong túi tôi."],["N","Please put your things in this locker.","Xin để đồ của bà vào tủ này."],["P","Where is the bathroom?","Nhà vệ sinh ở đâu?"],["N","I will show you. Then the doctor will see you this afternoon.","Tôi sẽ chỉ cho bà. Sau đó chiều nay bác sĩ sẽ khám cho bà."]]}},{"l":"A2","t":"Hygiene & mobility","v":"Vệ sinh & di chuyển","c":"I can help a patient wash, use the toilet and move safely.","d":[{"t":"Offering help","tip":"Hỏi trước khi giúp: \"Would you like me to ...?\"","p":[["Would you like me to help you wash?","Bạn có muốn tôi giúp bạn rửa ráy không?"],["Can you wash your own face?","Bạn tự rửa mặt được không?"],["I will wash your back for you.","Tôi sẽ rửa lưng giúp bạn."],["Tell me if the water is too hot.","Báo tôi nếu nước quá nóng."]]},{"t":"Privacy","tip":"Tôn trọng riêng tư là một phần của chăm sóc.","p":[["I will pull the curtain for privacy.","Tôi sẽ kéo rèm để giữ riêng tư."],["Is the room warm enough?","Phòng có đủ ấm không?"],["I will cover you with a towel.","Tôi sẽ che bạn bằng khăn tắm."],["You are doing very well.","Bạn đang làm rất tốt."]]},{"t":"Toileting","tip":"Dùng từ nhẹ nhàng: \"go to the toilet\", \"use the commode\".","p":[["Do you need to go to the toilet?","Bạn có cần đi vệ sinh không?"],["You can use the commode next to the bed.","Bạn có thể dùng bô vệ sinh cạnh giường."],["I will wait outside the door.","Tôi sẽ đợi ngoài cửa."],["Press the button when you are ready.","Bấm nút khi bạn xong."]]},{"t":"Moving safely","tip":"Phòng ngừa té ngã là ưu tiên trong chăm sóc.","p":[["I will help you stand up.","Tôi sẽ giúp bạn đứng dậy."],["Put your hands on my shoulders.","Đặt tay lên vai tôi."],["Take small steps and go slowly.","Bước những bước nhỏ và đi chậm."],["Use your walking frame, please.","Xin dùng khung tập đi."]]},{"t":"Changing position","tip":"Trở mình mỗi hai giờ giúp ngừa loét do tì đè.","p":[["I need to turn you every two hours.","Tôi cần trở mình cho bạn mỗi hai giờ."],["Bend your knees and I will roll you.","Gập gối lại và tôi sẽ lăn người bạn."],["Is this position comfortable?","Tư thế này có thoải mái không?"],["I will put a pillow under your leg.","Tôi sẽ kê gối dưới chân bạn."]]}],"dl":{"t":"Helping to wash","v":"Giúp bệnh nhân vệ sinh","k":[["N","Good morning, Mr Lee. Would you like me to help you wash?","Chào buổi sáng ông Lee. Ông có muốn tôi giúp ông rửa ráy không?"],["P","Yes, please. I feel weak today.","Vâng, làm ơn. Hôm nay tôi thấy yếu."],["N","I will pull the curtain for privacy.","Tôi sẽ kéo rèm để giữ riêng tư."],["P","Thank you.","Cảm ơn cô."],["N","Tell me if the water is too hot.","Báo tôi nếu nước quá nóng."],["P","It is fine.","Nước ổn."],["N","Good. Now I will help you sit up.","Tốt. Bây giờ tôi giúp ông ngồi dậy."]]}},{"l":"A2","t":"Diet & fluids","v":"Chế độ ăn & dịch","c":"I can explain simple diet instructions and check fluid intake.","d":[{"t":"Special diets","tip":"Diabetic diet: chế độ ăn cho người tiểu đường. Low salt: ít muối.","p":[["You are on a low-salt diet.","Bạn đang ăn chế độ ít muối."],["This is a diabetic meal.","Đây là bữa ăn cho người tiểu đường."],["You should eat less sugar.","Bạn nên ăn ít đường hơn."],["Soft food is easier to swallow.","Thức ăn mềm dễ nuốt hơn."]]},{"t":"Nil by mouth","tip":"\"Nil by mouth\" nghĩa là không ăn uống gì qua đường miệng.","p":[["You are nil by mouth from midnight.","Bạn không được ăn uống gì từ nửa đêm."],["Do not eat or drink anything before the operation.","Đừng ăn hoặc uống gì trước khi phẫu thuật."],["You can rinse your mouth with water.","Bạn có thể súc miệng bằng nước."],["I will tell you when you can eat again.","Tôi sẽ báo khi bạn được ăn lại."]]},{"t":"Fluid intake","tip":"Ghi chép lượng dịch vào và ra là công việc hằng ngày của điều dưỡng.","p":[["Try to drink two liters of water a day.","Cố gắng uống hai lít nước mỗi ngày."],["I need to record how much you drink.","Tôi cần ghi lại lượng bạn uống."],["Please tell me every time you drink.","Xin báo tôi mỗi lần bạn uống nước."],["Your fluid intake is a little low.","Lượng nước bạn uống hơi ít."]]},{"t":"Appetite and swallowing","tip":"Khó nuốt cần báo bác sĩ hoặc chuyên gia dinh dưỡng.","p":[["Are you eating well?","Bạn ăn có ngon miệng không?"],["Is it hard to swallow?","Bạn có khó nuốt không?"],["Do you cough when you eat?","Bạn có bị ho khi ăn không?"],["Sit up straight when you eat.","Ngồi thẳng khi ăn."]]},{"t":"Weight","tip":"Cân bệnh nhân vào cùng một giờ mỗi ngày để so sánh.","p":[["I need to weigh you this morning.","Sáng nay tôi cần cân bạn."],["Please stand on the scales.","Xin đứng lên cân."],["You have lost two kilos this week.","Tuần này bạn đã giảm hai ký."],["The dietitian will talk to you.","Chuyên gia dinh dưỡng sẽ trao đổi với bạn."]]}],"dl":{"t":"Explaining a diet","v":"Giải thích chế độ ăn","k":[["N","Mr Lee, you are on a low-salt diet now.","Ông Lee, bây giờ ông đang ăn chế độ ít muối."],["P","Can I add salt to my food?","Tôi thêm muối vào thức ăn được không?"],["N","No, please do not add salt. It is not good for your heart.","Không, xin đừng thêm muối. Nó không tốt cho tim của ông."],["P","What can I drink?","Tôi uống được gì?"],["N","Water is fine. Try to drink two liters a day.","Nước thì được. Cố gắng uống hai lít mỗi ngày."],["P","OK. I will try.","Vâng. Tôi sẽ cố."],["N","I will record how much you drink.","Tôi sẽ ghi lại lượng ông uống."]]}},{"l":"A2","t":"What happened?","v":"Chuyện gì đã xảy ra?","c":"I can ask about and describe past events, such as a fall or an accident.","d":[{"t":"Asking what happened","tip":"Dùng thì quá khứ đơn: \"What happened?\", \"When did it happen?\"","p":[["What happened to you?","Chuyện gì đã xảy ra với bạn?"],["When did it happen?","Chuyện đó xảy ra khi nào?"],["Where were you when it happened?","Bạn ở đâu khi chuyện đó xảy ra?"],["Did anyone see it?","Có ai chứng kiến không?"]]},{"t":"Falls","tip":"Ghi lại đầy đủ thông tin về té ngã, cả khi bệnh nhân không bị thương.","p":[["I fell in the bathroom.","Tôi bị ngã trong nhà tắm."],["Did you hit your head?","Bạn có đập đầu không?"],["Did you lose consciousness?","Bạn có bị mất ý thức không?"],["Can you get up by yourself?","Bạn tự đứng dậy được không?"]]},{"t":"Accidents","tip":"Động từ quá khứ bất quy tắc: fall, fell; hit, hit; cut, cut.","p":[["I cut my hand with a knife.","Tôi bị dao cứa vào tay."],["He was in a motorbike accident.","Anh ấy bị tai nạn xe máy."],["She burned her arm on the stove.","Cô ấy bị bỏng tay do bếp."],["I twisted my ankle yesterday.","Hôm qua tôi bị trẹo mắt cá chân."]]},{"t":"Feelings before and after","tip":"Hỏi triệu chứng trước và sau sự việc.","p":[["Did you feel dizzy before you fell?","Bạn có chóng mặt trước khi ngã không?"],["Did you eat or drink anything?","Bạn có ăn hoặc uống gì không?"],["Have you had this before?","Trước đây bạn từng bị như vậy chưa?"],["How did you feel afterwards?","Sau đó bạn thấy thế nào?"]]},{"t":"Reporting","tip":"Báo cáo sự cố theo quy định của bệnh viện và báo bác sĩ.","p":[["I need to fill in an incident form.","Tôi cần điền phiếu báo cáo sự cố."],["I will check you for injuries.","Tôi sẽ kiểm tra xem bạn có bị thương không."],["The doctor will examine you.","Bác sĩ sẽ khám cho bạn."],["Please do not move until I come back.","Xin đừng cử động cho đến khi tôi quay lại."]]}],"dl":{"t":"After a fall","v":"Sau khi bị ngã","k":[["N","Mrs Hoa, what happened?","Bà Hoa, chuyện gì đã xảy ra?"],["P","I fell in the bathroom.","Tôi bị ngã trong nhà tắm."],["N","Did you hit your head?","Bà có đập đầu không?"],["P","No, but my hip hurts.","Không, nhưng hông tôi đau."],["N","Please do not move. I will check you for injuries.","Xin bà đừng cử động. Tôi sẽ kiểm tra xem bà có bị thương không."],["P","Am I in trouble?","Tôi có bị phiền phức không?"],["N","No. We just want to be sure you are safe.","Không. Chúng tôi chỉ muốn chắc rằng bà an toàn."]]}},{"l":"A2","t":"Allergies & medical history","v":"Dị ứng & tiền sử bệnh","c":"I can ask simple questions about allergies and a patient's medical history.","d":[{"t":"Allergies","tip":"Ghi rõ loại dị ứng và phản ứng. Ví dụ: penicillin, rash.","p":[["Are you allergic to penicillin or any other medicine?","Bạn có dị ứng với penicillin hay thuốc nào khác không?"],["What happens when you take it?","Chuyện gì xảy ra khi bạn dùng nó?"],["I get a rash from penicillin.","Tôi bị nổi mẩn khi dùng penicillin."],["Are you allergic to latex or food?","Bạn có dị ứng cao su hay thức ăn nào không?"]]},{"t":"Past illnesses","tip":"Present perfect: \"Have you ever had ...?\"","p":[["Have you ever had surgery?","Bạn từng phẫu thuật chưa?"],["Have you ever been in hospital before?","Trước đây bạn từng nằm viện chưa?"],["Do you have diabetes?","Bạn có bị tiểu đường không?"],["Do you have any heart problems?","Bạn có vấn đề về tim không?"]]},{"t":"Long-term conditions","tip":"Long-term condition: bệnh mạn tính.","p":[["I have had high blood pressure for ten years.","Tôi bị cao huyết áp mười năm rồi."],["I have asthma.","Tôi bị hen suyễn."],["My father had a heart attack.","Bố tôi từng bị nhồi máu cơ tim."],["Does anyone in your family have cancer?","Trong gia đình bạn có ai bị ung thư không?"]]},{"t":"Habits","tip":"Hỏi về thói quen không phán xét, để họ trả lời trung thực.","p":[["Do you smoke? How many a day?","Bạn có hút thuốc không? Một ngày mấy điếu?"],["Do you drink alcohol?","Bạn có uống rượu bia không?"],["Do you exercise?","Bạn có tập thể dục không?"],["How many hours do you sleep?","Bạn ngủ mấy tiếng?"]]},{"t":"Regular medicines","tip":"Hỏi cả thuốc tự mua và thảo dược, vì có thể tương tác.","p":[["What medicines do you take every day?","Hằng ngày bạn uống thuốc gì?"],["Do you take vitamins or herbal medicine?","Bạn có dùng vitamin hay thuốc thảo dược không?"],["When did you last take it?","Lần cuối bạn uống thuốc là khi nào?"],["Can you show me the box?","Bạn cho tôi xem hộp thuốc được không?"]]}],"dl":{"t":"Taking a simple history","v":"Hỏi tiền sử đơn giản","k":[["N","Mr Lee, are you allergic to any medicine?","Ông Lee, ông có dị ứng thuốc nào không?"],["P","Yes, I get a rash from penicillin.","Có, tôi bị nổi mẩn khi dùng penicillin."],["N","Thank you. I will write that down. Do you have any long-term conditions?","Cảm ơn ông. Tôi sẽ ghi lại. Ông có bệnh mạn tính nào không?"],["P","I have high blood pressure.","Tôi bị cao huyết áp."],["N","What medicine do you take for it?","Ông dùng thuốc gì cho nó?"],["P","One small white tablet every morning.","Mỗi sáng một viên nhỏ màu trắng."],["N","Thank you. That is very helpful.","Cảm ơn ông. Thông tin này rất hữu ích."]]}},{"l":"A2","t":"Departments & hospital rules","v":"Các khoa & quy định bệnh viện","c":"I can name hospital departments and explain basic rules and services.","d":[{"t":"Departments","tip":"Cardiology: tim mạch. Pediatrics: nhi. Maternity: sản.","p":[["This is the cardiology department.","Đây là khoa tim mạch."],["The children's ward is on the fourth floor.","Khoa nhi ở tầng bốn."],["The emergency department is open all day and night.","Khoa cấp cứu mở cửa cả ngày lẫn đêm."],["You need to go to the outpatient clinic.","Bạn cần đến phòng khám ngoại trú."]]},{"t":"Tests and scans","tip":"Chuẩn bị bệnh nhân: giải thích ngắn gọn, nói rõ có cần nhịn ăn không.","p":[["You need a blood test this morning.","Sáng nay bạn cần xét nghiệm máu."],["You need to have a chest X-ray.","Bạn cần chụp X-quang ngực."],["The scan takes about twenty minutes.","Lần chụp mất khoảng hai mươi phút."],["The results will be ready tomorrow.","Kết quả sẽ có vào ngày mai."]]},{"t":"Reception and forms","tip":"Giúp bệnh nhân điền giấy tờ khi họ gặp khó khăn về ngôn ngữ.","p":[["Please go to the reception desk.","Xin đến quầy tiếp tân."],["You need to fill in this form.","Bạn cần điền vào mẫu này."],["Please write your name in capital letters.","Xin viết tên của bạn bằng chữ in hoa."],["Do you need help with the form?","Bạn có cần giúp điền mẫu này không?"]]},{"t":"Visiting rules","tip":"Quy định thăm bệnh thay đổi theo bệnh viện. Luôn nói rõ và lịch sự.","p":[["Only two visitors at a time.","Mỗi lần chỉ hai người thăm."],["Children under twelve cannot visit.","Trẻ dưới mười hai tuổi không được vào thăm."],["Please use the hand gel before you enter.","Xin dùng nước rửa tay trước khi vào."],["Visiting time ends at eight in the evening.","Giờ thăm kết thúc lúc tám giờ tối."]]},{"t":"Services","tip":"Đề cập đến dịch vụ hỗ trợ: interpreter, chaplain, social worker.","p":[["We can arrange an interpreter for you.","Chúng tôi có thể sắp xếp phiên dịch cho bạn."],["The social worker can help with your discharge.","Nhân viên xã hội có thể giúp bạn khi xuất viện."],["There is a small shop on the ground floor.","Có một cửa hàng nhỏ ở tầng trệt."],["You can use the free Wi-Fi in the ward.","Bạn có thể dùng Wi-Fi miễn phí trong khoa."]]}],"dl":{"t":"Explaining a test","v":"Giải thích một xét nghiệm","k":[["N","Mr Lee, you need a blood test this morning.","Ông Lee, sáng nay ông cần xét nghiệm máu."],["P","Where do I go?","Tôi đi đâu?"],["N","The laboratory is on the first floor. I will take you.","Phòng xét nghiệm ở tầng một. Tôi sẽ đưa ông đi."],["P","Do I need to fast?","Tôi có cần nhịn ăn không?"],["N","Yes, no food until after the test. Water is fine.","Có, không ăn gì cho đến khi xét nghiệm xong. Uống nước thì được."],["P","How long will it take?","Mất bao lâu?"],["N","About ten minutes. The results will be ready tomorrow.","Khoảng mười phút. Kết quả sẽ có vào ngày mai."]]}},{"l":"A2","t":"Phone basics","v":"Điện thoại cơ bản","c":"I can answer the phone, take a simple message and pass on information.","d":[{"t":"Answering","tip":"Nói rõ: tên khoa, tên bạn. \"Ward Five, Linh speaking.\"","p":[["Ward Five, Linh speaking.","Khoa Năm, Linh nghe đây."],["How can I help you?","Tôi có thể giúp gì cho bạn?"],["Who would you like to speak to?","Bạn muốn gặp ai?"],["One moment, please.","Xin đợi một chút."]]},{"t":"Asking for repetition","tip":"Đừng ngại xin nhắc lại. Đọc lại thông tin để xác nhận.","p":[["Sorry, could you speak more slowly?","Xin lỗi, bạn nói chậm hơn được không?"],["Could you repeat that, please?","Bạn nhắc lại giúp tôi được không?"],["Could you spell that for me?","Bạn đánh vần giúp tôi được không?"],["Let me check that back to you.","Để tôi đọc lại cho bạn kiểm tra."]]},{"t":"Transferring","tip":"Trước khi chuyển máy, hãy nói cho người gọi biết.","p":[["I will put you through to the doctor.","Tôi sẽ nối máy cho bác sĩ."],["I am afraid she is not here right now.","Tôi e là cô ấy không có mặt bây giờ."],["Can I take a message?","Tôi ghi lại lời nhắn được không?"],["Could you call back in ten minutes?","Mười phút nữa bạn gọi lại được không?"]]},{"t":"Taking a message","tip":"Ghi tên, số điện thoại, ngày giờ và nội dung. Đọc lại để kiểm tra.","p":[["What is your name and phone number?","Tên và số điện thoại của bạn là gì?"],["What is the message?","Lời nhắn là gì?"],["I will pass the message to the nurse in charge.","Tôi sẽ chuyển lời nhắn cho điều dưỡng trưởng ca."],["Thank you for calling.","Cảm ơn bạn đã gọi."]]},{"t":"Patient enquiries","tip":"Không cung cấp thông tin bệnh nhân cho người lạ qua điện thoại.","p":[["Are you a relative of the patient?","Bạn có phải người thân của bệnh nhân không?"],["I cannot give details over the phone.","Tôi không thể cung cấp chi tiết qua điện thoại."],["You can visit during visiting hours.","Bạn có thể đến thăm trong giờ thăm bệnh."],["The patient is resting comfortably.","Bệnh nhân đang nghỉ ngơi thoải mái."]]}],"dl":{"t":"Taking a message","v":"Ghi lời nhắn","k":[["N","Ward Five, Linh speaking. How can I help you?","Khoa Năm, Linh nghe đây. Tôi có thể giúp gì cho bạn?"],["C","Hello. Can I speak to Doctor Nam, please?","Xin chào. Tôi nói chuyện với bác sĩ Nam được không?"],["N","I am afraid he is not here right now. Can I take a message?","Tôi e là bác sĩ không có mặt bây giờ. Tôi ghi lời nhắn được không?"],["C","Yes. Please tell him the blood results are ready.","Vâng. Xin nhắn bác sĩ là kết quả máu đã có."],["N","Could you spell your name for me?","Bạn đánh vần tên giúp tôi được không?"],["C","It is Mai, M-A-I. I am from the laboratory.","Tên tôi là Mai, M-A-I. Tôi ở phòng xét nghiệm."],["N","Thank you, Mai. I will pass the message on.","Cảm ơn Mai. Tôi sẽ chuyển lời nhắn."]]}},{"l":"A2","t":"Emergency basics","v":"Cấp cứu cơ bản","c":"I can call for help, give basic first aid instructions and stay calm in an emergency.","d":[{"t":"Calling for help","tip":"Nói to, rõ và ngắn: \"I need help here!\"","p":[["I need help here!","Tôi cần giúp đỡ ở đây!"],["Call the doctor now.","Gọi bác sĩ ngay."],["Press the emergency button.","Bấm nút khẩn cấp."],["Bring the emergency trolley.","Mang xe cấp cứu tới."]]},{"t":"Checking a patient","tip":"Nhớ thứ tự cơ bản: phản ứng, đường thở, thở, mạch.","p":[["Can you hear me? Open your eyes.","Bạn nghe tôi không? Mở mắt ra."],["He is not breathing.","Anh ấy không thở."],["I can not feel a pulse.","Tôi không bắt được mạch."],["She is unconscious.","Cô ấy bất tỉnh."]]},{"t":"First aid","tip":"Áp lực trực tiếp lên vết chảy máu là bước đầu tiên.","p":[["Press firmly on the wound.","Ấn chặt lên vết thương."],["Raise the leg above the heart.","Nâng chân cao hơn tim."],["Do not move his neck.","Đừng di chuyển cổ của anh ấy."],["Keep her warm.","Giữ ấm cho cô ấy."]]},{"t":"Choking and allergy","tip":"Nhận biết nhanh phản ứng dị ứng nặng: sưng mặt, khó thở.","p":[["Are you choking?","Bạn bị nghẹn à?"],["Lean forward and cough.","Nghiêng người về phía trước và ho."],["His face is swollen and he can not breathe.","Mặt anh ấy sưng và không thở được."],["Give oxygen now.","Cho thở oxy ngay."]]},{"t":"After the emergency","tip":"Báo cáo rõ ràng và trấn an người thân.","p":[["The doctor is coming now.","Bác sĩ đang đến ngay."],["Please wait outside, we are helping him.","Xin đợi bên ngoài, chúng tôi đang cứu chữa anh ấy."],["He is stable now.","Bây giờ anh ấy đã ổn định."],["I will write down the time and what happened.","Tôi sẽ ghi lại thời gian và những gì đã xảy ra."]]}],"dl":{"t":"A patient collapses","v":"Bệnh nhân ngã quỵ","k":[["N","Mr Lee! Can you hear me?","Ông Lee! Ông có nghe tôi không?"],["P","(No response.)","(Ông ấy không phản ứng.)"],["N","He is not responding. Press the emergency button!","Ông ấy không phản ứng. Bấm nút khẩn cấp!"
