uá!"]]}},{"l":"B2","t":"Teamwork & professional communication","v":"Làm việc nhóm & giao tiếp nghề nghiệp","c":"I can take part in team meetings, give and receive feedback and speak up about safety.","d":[{"t":"In meetings","tip":"Đóng góp rõ ràng: đưa ý kiến, hỏi làm rõ, đồng ý hoặc phản đối lịch sự.","p":[["I would like to raise a concern about the night-shift staffing.","Tôi muốn nêu một mối lo về nhân sự ca đêm."],["Could you clarify what you mean by that?","Bạn có thể làm rõ ý bạn không?"],["I agree with your point, and I would like to add something.","Tôi đồng ý với ý của bạn và muốn bổ sung một điều."],["I see it slightly differently, if I may.","Nếu được, tôi có góc nhìn hơi khác."]]},{"t":"Asking for help","tip":"Nhờ giúp đỡ cụ thể: việc gì, khi nào, trong bao lâu.","p":[["Could you give me a hand with turning this patient?","Bạn có thể giúp tôi trở mình bệnh nhân này không?"],["I am struggling to keep up. Can anyone cover my break?","Tôi đang khó theo kịp. Có ai thay tôi giờ nghỉ được không?"],["I have not done this procedure before. Could you show me?","Tôi chưa từng làm thủ thuật này. Bạn chỉ tôi được không?"],["Thank you so much for covering for me.","Cảm ơn bạn rất nhiều vì đã làm thay tôi."]]},{"t":"Giving feedback","tip":"Phản hồi cụ thể, tập trung hành vi, và đề xuất cải thiện.","p":[["You handled that difficult conversation really well.","Bạn đã xử lý cuộc trò chuyện khó đó rất tốt."],["I noticed that the notes were not signed.","Tôi nhận thấy các ghi chép chưa được ký."],["Next time, it might help to double-check with a colleague.","Lần sau, kiểm tra lại với đồng nghiệp có thể giúp ích."],["Would you like some feedback on your handover?","Bạn có muốn nhận phản hồi về bàn giao của bạn không?"]]},{"t":"Receiving feedback","tip":"Nhận phản hồi cởi mở: cảm ơn, hỏi thêm, và hành động.","p":[["Thank you for letting me know.","Cảm ơn bạn đã cho tôi biết."],["That is helpful. Could you give me an example?","Điều đó hữu ích. Bạn cho tôi một ví dụ được không?"],["I understand, and I will do it differently next time.","Tôi hiểu và lần sau tôi sẽ làm khác đi."],["I would appreciate your support in improving this.","Tôi rất mong được bạn hỗ trợ để cải thiện điều này."]]},{"t":"Speaking up for safety","tip":"Nói ra khi thấy nguy cơ. CUS: I'm Concerned, I'm Uncomfortable, this is a Safety issue.","p":[["I am concerned that this dose might be too high.","Tôi lo rằng liều này có thể quá cao."],["I am uncomfortable proceeding until we have checked it.","Tôi không thoải mái tiếp tục cho đến khi chúng ta kiểm tra."],["This is a safety issue, and we need to stop.","Đây là vấn đề an toàn và chúng ta cần dừng lại."],["I would like to report this so we can learn from it.","Tôi muốn báo cáo việc này để chúng ta cùng rút kinh nghiệm."]]}],"dl":{"t":"Speaking up about safety","v":"Lên tiếng vì an toàn","k":[["N","Excuse me, Doctor. I am concerned that this dose might be too high for an elderly patient.","Xin lỗi bác sĩ. Tôi lo rằng liều này có thể quá cao với một bệnh nhân lớn tuổi."],["D","It is the standard dose.","Đó là liều tiêu chuẩn."],["N","I understand, but her kidney function is reduced. I am uncomfortable giving it until we have checked.","Tôi hiểu, nhưng chức năng thận của bà giảm. Tôi không thoải mái cho thuốc cho đến khi chúng ta kiểm tra."],["D","You are right. Thank you for raising it. Let me review her results.","Bạn nói đúng. Cảm ơn bạn đã nêu ra. Để tôi xem lại kết quả của bà."],["N","Would you like me to bring her chart?","Bác sĩ có muốn tôi mang bảng theo dõi của bà không?"],["D","Yes, please. I will adjust the dose.","Vâng, làm ơn. Tôi sẽ điều chỉnh liều."],["N","Thank you. I will document the change.","Cảm ơn bác sĩ. Tôi sẽ ghi lại thay đổi."]]}},{"l":"B2","t":"Cultural safety & OET-style tasks","v":"An toàn văn hóa & dạng bài OET","c":"I can adapt my care to patients' cultural needs and complete typical OET-style speaking and writing tasks.","d":[{"t":"Asking about needs","tip":"Hỏi về nhu cầu văn hóa, tôn giáo, ngôn ngữ, ăn uống mà không giả định.","p":[["Are there any cultural or religious practices we should be aware of?","Có phong tục văn hóa hay tôn giáo nào chúng tôi nên biết không?"],["Would you prefer to be examined by a female nurse?","Bạn có muốn được một điều dưỡng nữ khám không?"],["Do you have any dietary requirements for religious reasons?","Bạn có yêu cầu ăn uống nào vì lý do tôn giáo không?"],["Would you like an interpreter for this conversation?","Bạn có muốn có phiên dịch cho cuộc trò chuyện này không?"]]},{"t":"Working with interpreters","tip":"Nói với bệnh nhân, không nói với phiên dịch. Câu ngắn, dừng lại.","p":[["I will speak in short sentences so the interpreter can follow.","Tôi sẽ nói bằng câu ngắn để phiên dịch theo kịp."],["Please tell the interpreter if you do not understand anything.","Xin nói với phiên dịch nếu bạn không hiểu điều gì."],["Can you ask the patient to describe the pain in their own words?","Bạn có thể nhờ bệnh nhân mô tả cơn đau bằng lời của họ không?"],["Thank you for interpreting. Could you confirm that the patient understood?","Cảm ơn bạn đã phiên dịch. Bạn xác nhận bệnh nhân đã hiểu không?"]]},{"t":"OET role-play","tip":"OET nói: bạn đóng vai điều dưỡng. Giải thích rõ, thể hiện đồng cảm, kiểm tra hiểu.","p":[["Before I explain, may I ask what you already know about your condition?","Trước khi giải thích, tôi có thể hỏi bạn đã biết gì về tình trạng của mình không?"],["I would like to explain it step by step, and please stop me if anything is unclear.","Tôi muốn giải thích từng bước, và xin dừng tôi nếu điều gì chưa rõ."],["Let me summarize what we have agreed.","Để tôi tóm tắt những gì chúng ta đã thống nhất."],["What questions do you have for me?","Bạn có câu hỏi nào cho tôi không?"]]},{"t":"OET letters","tip":"Thư chuyển tuyến: mở bằng lý do viết, tóm tắt bệnh sử, và nêu đề nghị.","p":[["I am writing to refer Mr Lee, aged sixty-five, for further assessment.","Tôi viết thư này để chuyển ông Lee, sáu mươi lăm tuổi, đi đánh giá thêm."],["He was admitted on the fourth of March with chest pain.","Ông nhập viện ngày bốn tháng ba vì đau ngực."],["He has a history of hypertension and is allergic to penicillin.","Ông có tiền sử cao huyết áp và dị ứng với penicillin."],["I would be grateful if you could review him at your earliest convenience.","Tôi xin biết ơn nếu bác sĩ có thể khám cho ông sớm nhất có thể."]]},{"t":"Professional register","tip":"Chọn văn phong lịch sự: could/would, \"I would like to\", tránh từ tắt.","p":[["I would like to confirm the details of your appointment.","Tôi muốn xác nhận chi tiết cuộc hẹn của bạn."],["Would you mind waiting for a few minutes, please?","Bạn vui lòng đợi vài phút được không?"],["I apologize for the delay and any inconvenience caused.","Tôi xin lỗi vì sự chậm trễ và bất tiện đã gây ra."],["Please do not hesitate to contact us if you have any concerns.","Xin đừng ngần ngại liên hệ chúng tôi nếu bạn có bất kỳ lo lắng nào."]]}],"dl":{"t":"Working with an interpreter","v":"Làm việc với phiên dịch","k":[["N","Good morning. I have arranged an interpreter to help us today. Is that all right?","Chào buổi sáng. Tôi đã sắp xếp phiên dịch giúp chúng ta hôm nay. Bà thấy ổn chứ?"],["I","Good morning. I will translate everything you say.","Chào buổi sáng. Tôi sẽ dịch mọi điều cô nói."],["N","Thank you. I will speak in short sentences. Mrs Hoa, could you tell me what worries you most?","Cảm ơn. Tôi sẽ nói câu ngắn. Bà Hoa, bà có thể cho tôi biết điều gì làm bà lo nhất không?"],["P","I am afraid I cannot look after myself at home.","Tôi sợ mình không thể tự lo ở nhà."],["N","That is a very valid concern. We can arrange a community nurse to visit you.","Đó là mối lo rất chính đáng. Chúng tôi có thể sắp xếp điều dưỡng cộng đồng đến thăm bà."],["I","She says that would be a great relief.","Bà nói điều đó sẽ giúp bà nhẹ nhõm rất nhiều."],["N","Wonderful. Please ask her to tell us if she has any other questions.","Tuyệt quá. Xin nhờ bà cho chúng tôi biết nếu bà có câu hỏi nào khác."]]}},{"l":"B2","t":"Career English & final review","v":"Tiếng Anh nghề nghiệp & ôn tập cuối khóa","c":"I can introduce my nursing experience, answer interview questions and use English confidently at work.","d":[{"t":"Introducing yourself","tip":"Giới thiệu: vai trò, kinh nghiệm, điểm mạnh, mục tiêu.","p":[["I am a registered nurse with five years of experience in medical wards.","Tôi là điều dưỡng đã đăng ký với năm năm kinh nghiệm ở khoa nội."],["I am passionate about patient-centered care and continuous learning.","Tôi đam mê chăm sóc lấy người bệnh làm trung tâm và học tập liên tục."],["I recently completed a course in wound management.","Gần đây tôi đã hoàn thành một khóa về quản lý vết thương."],["I am looking for an opportunity to develop my skills abroad.","Tôi đang tìm cơ hội phát triển kỹ năng ở nước ngoài."]]},{"t":"Interview questions","tip":"Dùng STAR: Situation, Task, Action, Result.","p":[["Can you tell us about a time when you dealt with a difficult patient?","Bạn có thể kể về một lần bạn xử lý bệnh nhân khó không?"],["How do you prioritize your work when the ward is busy?","Bạn ưu tiên công việc thế nào khi khoa bận?"],["Why do you want to work in our hospital?","Vì sao bạn muốn làm việc ở bệnh viện của chúng tôi?"],["What are your strengths and areas for improvement?","Điểm mạnh và điểm cần cải thiện của bạn là gì?"]]},{"t":"Answering with examples","tip":"Kể ngắn gọn với số liệu và kết quả.","p":[["Last year a patient became very anxious before surgery.","Năm ngoái một bệnh nhân rất lo lắng trước phẫu thuật."],["I sat with him, explained each step and answered his questions.","Tôi ngồi với ông, giải thích từng bước và trả lời các câu hỏi của ông."],["As a result, he felt calmer and the procedure went well.","Kết quả là ông bình tĩnh hơn và thủ thuật diễn ra tốt."],["I learned how important it is to listen before I explain.","Tôi học được việc lắng nghe trước khi giải thích quan trọng đến mức nào."]]},{"t":"Professional development","tip":"Nói về kế hoạch học tập và mục tiêu nghề nghiệp.","p":[["I plan to take the English exam required for registration.","Tôi dự định thi bài thi tiếng Anh cần cho việc đăng ký hành nghề."],["I would like to specialize in critical care in the future.","Tôi muốn chuyên sâu về hồi sức tích cực trong tương lai."],["I try to read one clinical article every week.","Tôi cố gắng đọc một bài báo lâm sàng mỗi tuần."],["Speaking English with colleagues every day helps me improve.","Nói tiếng Anh với đồng nghiệp mỗi ngày giúp tôi tiến bộ."]]},{"t":"Keep improving","tip":"Duy trì tiến bộ: thói quen nhỏ mỗi ngày quan trọng hơn học nhồi.","p":[["Practice a few phrases with a colleague after every shift.","Luyện vài mẫu câu với đồng nghiệp sau mỗi ca trực."],["Write short notes in English about your patients each day.","Mỗi ngày viết ghi chú ngắn bằng tiếng Anh về bệnh nhân."],["Listen to a short medical podcast on your way to work.","Nghe một podcast y khoa ngắn trên đường đi làm."],["Be patient with yourself. Confidence grows with every conversation.","Hãy kiên nhẫn với bản thân. Sự tự tin lớn lên sau mỗi cuộc trò chuyện."]]}],"dl":{"t":"A job interview","v":"Phỏng vấn xin việc","k":[["D","Thank you for coming. Could you tell us a little about yourself?","Cảm ơn bạn đã đến. Bạn có thể giới thiệu đôi chút về bản thân không?"],["N","Certainly. I am a registered nurse with five years of experience in medical wards.","Vâng. Tôi là điều dưỡng đã đăng ký với năm năm kinh nghiệm ở khoa nội."],["D","Can you tell us about a time when you dealt with a difficult situation?","Bạn có thể kể về một lần bạn xử lý tình huống khó khăn không?"],["N","Last year a patient became very anxious. I sat with him, explained each step and answered his questions.","Năm ngoái một bệnh nhân rất lo lắng. Tôi ngồi với ông, giải thích từng bước và trả lời các câu hỏi của ông."],["D","What was the result?","Kết quả là gì?"],["N","He felt calmer and the procedure went well. I learned how important it is to listen first.","Ông bình tĩnh hơn và thủ thuật diễn ra tốt. Tôi học được việc lắng nghe trước quan trọng đến mức nào."],["D","Thank you. That is a very good example.","Cảm ơn bạn. Đó là một ví dụ rất tốt."]]}}];const BANNER='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAJcA4QDASIAAhEBAxEB/8QAHQAAAgIDAQEBAAAAAAAAAAAAAAECAwQFBgcICf/EAFUQAAEDAwEEBQUJCwkIAgMBAQEAAgMEBREhBhIxQQcTUWFxFCIygZEIFSMzUqGxwdEXNkJVYnJzkpOU0hZDU1RWdIKy4SQ0NTeiwuLwRLM4Y/Elg//EABsBAQADAQEBAQAAAAAAAAAAAAABAgMEBQYH/8QAOhEAAgIBAwEFBQUIAgMBAQAAAAECEQMEEiExBRMyQVEUImFxsRUzUoGhBiM0QpHB0eFi8BYkclPx/9oADAMBAAIRAxEAPwD6nRhCBhAGEJowoAkJ4RhAJCeEYUgSE8JIAQgBPCASEJlAJCaSAhJ6OPlHCmoelJ3NHzlTQgEk0KKJBCEIBcEJoQCKippYCAihSwkUAkIQgEQoqaiUAksKWEICshIhWFLCkFeEsKaEIIJEKeFEhARwjCkhCCGEsKaCgK8JYUylhAQIUCFaQokIRRUQoEK0qLghFFRUSrSFHCEFeEKeEEIQV4SIU0igKyEiNFPCRCEFaWFYRhIhCCGEKWEYUghhGFPCWEBFIqeEsIKIYQQp4QQgoqIRhWYRhBRWQkrMIIQiiCiQrMIIQUUkIwrN1GEIohhClhGEFEUKWEYQEcITwjCAijCaFAFhLCkkpBFSDUw1TAwgoiRgKt3FWPOiqKBkCnhPCagqRSKkkUBFNjd4pgElZkEONULRVkoIsBZAbgJtGApclJulQjoFiVEu6DqrZ5A0FayeTeJUFJyorlfvHKrT5pZUnO+SJUVJRKEMFEnPBBKlGzKFepFjC4rMhiDQnHHhXtCg0jGhBuFYAkArAEL0IBPCalhC1Ed1CsA0QhNHT4CMJpIbhzwmhCAEIQoAIQhSAQUIQCQQmhQCPNCaakCCi47rSTyU1V6cn5LT7SgGxuG68TqVNATQCSTPBCASCmhAJCChACEIUAEk0kAsYQU0IBYSTQpBEhLCkhARSUsJEIBEKJCkhARwkQpEJY0QEcJEKWEYUEECkpkKJUgRCippFCCGFEqZUSEBAhRKmQolCCBCiQrCFEhCCsoUiEsIQRSIUsIIQEMJYUsJIQRKgVMpYQUQQmUlJAIQjmhIJJoQCQhCEAkQnlRJQkEIyjKEBhCWUiUA8IwllBcgDCjhPKWUIDCCEEpEoARhCkEBHCWFMpYQghhNrVLCkNEJoA1Rdopk6KlxygZE6pIwhCoj3KOFNBUEEEAJq+CPJ4ISlY4IsnKzmNwERsDQrAFJtFURVc0gY1SleGgla2pm3jgIJSoqqZS4rHUikoOduyJUU3KOVJUCVAlSKrjcH1Dot12QM5xohVsnGzeKy42YCpe9tP1e8x7t9275ozjxWW4iONzyCd0E4aMkqC8UhtCsAUKZ4mhZIGuaHDOHDBClDKJJpYw14MRAJcND4IXTRYApYVU0wimhjLZCZSQC1uQPFWTyCGB8rg5wYMkNGSUJtEwNEwEoXCSJjwCA4AgOGCM9qnhCy5FhCeEISdMhCENgQhCAEIQgBCEIAQhCAEI /* streak: freezes cover missed days before today */
function roll() {
  const t = today();
  if (!S.last) return;
  const gap = dayDiff(S.last, t);
  if (gap > 1) {
    const missed = gap - 1;
    if (S.freezes >= missed) {
      S.freezes -= missed;
      for (let k = 1; k <= missed; k++) S.frz[addDays(S.last, k)] = 1;
      S.last = addDays(t, -1);
    } else { S.streak = 0; S.last = ''; }
  }
}
function touch(xp) {
  const t = today();
  roll();
  S.days[t] = (S.days[t] || 0) + xp;
  S.xp += xp;
  if (S.last !== t) {
    S.streak = (S.last && dayDiff(S.last, t) === 1) ? S.streak + 1 : 1;
    S.last = t;
    if (S.streak > S.best) S.best = S.streak;
    if (S.streak % 7 === 0) S.freezes = Math.min(3, S.freezes + 1);
  }
}
const streakNow = () => {
  if (!S.last) return 0;

};

/* ---------- UI state ---------- */
let sess = null, sheet = null, tab = 'today', bookQ = '', bookF = 'all', bookN = 40, resetArm = false, pathScrolled = false, toastT = 0;

/* ---------- question generation ---------- */
const TW = {
  A1: { mean: 30, rev: 20, listen: 25, order: 15, gap: 10 },
  A2: { mean: 20, rev: 20, listen: 25, order: 20, gap: 15 },
  B1: { mean: 10, rev: 15, listen: 25, order: 25, gap: 25 },
  B2: { mean: 5, rev: 10, listen: 25, order: 30, gap: 30 }
};
function wpick(types, l) {
  const w = types.map(t => TW[l][t]);
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < types.length; i++) { r -= w[i]; if (r <= 0) return types[i]; }
  return types[0];
}
function eligible(p) {
  const t = ['mean', 'rev'];
  if (TTS) t.push('listen');
  const n = p.en.split(' ').length;
  if (n >= 4 && n <= 12) t.push('order');
  if (gapOf(p, true)) t.push('gap');
  return t;
}
function gapOf(p, chk) {
  const ws = p.en.split(' ');
  const ci = [];
  ws.forEach((w, i) => {
    const core = w.replace(/[.,?!:;]+$/, '');
    if (i > 0 && /^[A-Za-z]{4,}$/.test(core)) ci.push(i);
  });
  if (!ci.length) return null;
  if (chk) return true;
  const i = ci[rnd(ci.length)];
  const raw = ws[i], core = raw.replace(/[.,?!:;]+$/, ''), post = raw.slice(core.length);
  const cap = /^[A-Z]/.test(core), low = core.toLowerCase();
  const pool = LW[p.l].filter(x => x !== low && Math.abs(x.length - low.length) <= 3);
  const d = shuffle(pool).slice(0, 2).map(x => cap ? x[0].toUpperCase() + x.slice(1) : x);
  const t = ws.slice(); t[i] = '_____' + post;
  return { text: t.join(' '), ans: core, d };
}
function distract(p, n, key) {
  const c1 = shuffle(PW[p.w].filter(x => x.id !== p.id)).slice(0, 8);
  const c2 = shuffle(PL[p.l].filter(x => x.w !== p.w)).slice(0, 12);
  const c = c1.concat(c2).filter(x => x[key] !== p[key]);
  c.sort((a, b) => Math.abs(a[key].length - p[key].length) - Math.abs(b[key].length - p[key].length));
  const out = [];
  for (const x of c) { if (!out.includes(x[key])) out.push(x[key]); if (out.length === n) break; }
  return out;
}
function mkQ(p, t) {
  const q = { t, pid: p.id, p, fb: false, sel: null };
  if (t === 'mean') { q.skill = 'vocab'; q.opts = shuffle([p.vi, ...distract(p, 2, 'vi')]); q.a = q.opts.indexOf(p.vi); }
  else if (t === 'rev') { q.skill = 'vocab'; q.opts = shuffle([p.en, ...distract(p, 2, 'en')]); q.a = q.opts.indexOf(p.en); }
  else if (t === 'listen') { q.skill = 'listen'; q.opts = shuffle([p.en, ...distract(p, 2, 'en')]); q.a = q.opts.indexOf(p.en); }
  else if (t === 'gap') { q.skill = 'grammar'; const g = gapOf(p); q.text = g.text; q.opts = shuffle([g.ans, ...g.d]); q.a = q.opts.indexOf(g.ans); }
  else if (t === 'order') {
    q.skill = 'grammar';
    const toks = p.en.split(' ');
    let bank, tries = 0;
    do { bank = shuffle(toks.map((w, i) => ({ w, i }))); tries++; } while (bank.map(x => x.w).join(' ') === p.en && tries < 8);

}
function pickTypes(p, n) {

}
const buildPer = (ph, per) => shuffle(ph.flatMap(p => pickTypes(p, per).map(t => mkQ(p, t))));

/* ---------- starting sessions ---------- */
function quickPool() {

  if (L.grad) return shuffle(PH).slice(0, 4);
  if (L.d < 5) return PW[L.w].filter(p => p.d === L.d);
  return shuffle(PW[L.w]).slice(0, 4);
}
function startLesson(i) {

  } else if (k === '4wk') {

  }

}
function startQuick() {

}
function startReview() {

  const ph = ids.map(k => PID[k]);

}
function startPlace() { sess = { kind: 'place', phase: 'pintro', qi: 0, ans: [], sel: null }; sheet = null; render(); }

/* ---------- answering ---------- */
const curQ = () => sess.qs[sess.qi];
function grade(ok) {
  const q = curQ();
  if (!q.rq) {
    sess.tot++; if (ok) sess.cor++;
    if (q.skill) { const s = S.sk[q.skill]; s[1]++; if (ok) s[0]++; }
    if (q.pid) boxUpd(q.pid, ok);
  }
  if (!ok && !q.rq && ['lesson', 'quick', 'review'].includes(sess.kind)) {
    sess.qs.push(Object.assign({}, q, { rq: true, fb: false, sel: null, ok: undefined, built: q.bank ? [] : undefined }));
  }
  save();
}
function pickOpt(i) {
  const q = curQ(); if (!q || q.fb) return;
  q.sel = i; q.ok = (i === q.a); q.fb = true; grade(q.ok); render();
}
function ordAdd(j) { const q = curQ(); if (q.fb || q.built.includes(j)) return; q.built.push(j); render(); }
function ordDel(pos) { const q = curQ(); if (q.fb) return; q.built.splice(pos, 1); render(); }
function ordCheck() {
  const q = curQ(); if (q.fb || q.built.length !== q.bank.length) return;
  q.ok = q.built.map(j => q.bank[j].w).join(' ') === q.p.en; q.fb = true; grade(q.ok); render();
}
function noListen() { const q = curQ(); if (!q || q.fb) return; sess.qs[sess.qi] = Object.assign(mkQ(q.p, 'mean'), { rq: q.rq }); render(); }

/* placement */
function pickPlace(i) { sess.sel = i; render(); }

}

/* dialogue role-play */
function nLines(l, wexc) {
  const out = [];

function roleSetup() {

    const d = shuffle(c.slice(0, 8)).slice(0, 2);

/* ---------- finishing ---------- */
function finish() {
  const s = sess, t = today();

  if (['lesson', 'dlg', 'rev', '4wk', 'grad'].includes(s.kind)) {
    xp += 20;
    s.first = !S.done[s.idx];
    S.done[s.idx] = { a: acc, d: t };
    if (s.idx === S.pos && S.pos < TOTAL) S.pos = s.idx + 1;
    if (s.kind === 'rev' || s.kind === '4wk') {
      S.wk[s.w] = { s: s.cor, n: s.tot, d: t };
      if (s.kind === '4wk') S.chk[s.w] = { s: s.cor, n: s.tot, d: t };
    }

    if (s.kind === 'lesson' || s.kind === 'dlg') s.canDo = null;
    if (s.kind === 'rev' || s.kind === '4wk') s.canDo = CURR[s.w].c;
  } else xp += 10;
  const pool = s.ph || (s.w != null && PW[s.w] ? PW[s.w] : []);
  if (pool.length && (s.kind === 'lesson' || s.kind === 'quick')) s.challenge = pool[rnd(pool.length)];
  s.xp = xp;

  s.badges = checkBadges();

}

function skillVals() {

}
function radarSVG(vals) {
  const cx = 150, cy = 118, R = 76, n = vals.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const f = p => p.map(v => v.toFixed(1)).join(',');
  let g = '';
  [0.25, 0.5, 0.75, 1].forEach(k => { g += `<polygon points="${vals.map((_, i) => f(pt(i, R * k))).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  vals.forEach((_, i) => { const p = pt(i, R); g += `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--line)"/>`; });
  const dp = vals.map((v, i) => pt(i, R * Math.max(v[1] || 0, 4) / 100));
  g += `<polygon points="${dp.map(f).join(' ')}" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  dp.forEach(p => { g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--accent)"/>`; });
  vals.forEach((v, i) => { const p = pt(i, R + 18), an = p[0] < cx - 4 ? 'end' : p[0] > cx + 4 ? 'start' : 'middle'; g += `<text x="${p[0].toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" text-anchor="${an}" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${v[0]}</text>`; });
  return `<svg viewBox="0 0 300 236" role="img" aria-label="Skill radar chart" style="width:100%;max-width:340px;margin:0 auto">${g}</svg>`;
}

  const t = today(), mon = mondayOf(t), cols = 12;

}

  if (q.t === 'mean') h += `<div class="qmain">${esc(q.p.en)}</div>${sayBtn(q.p.en)}<p class="muted" style="margin:16px 0 10px">What does this mean in Vietnamese?</p>`;
  else if (q.t === 'rev') h += `<p class="muted" style="margin-top:10px">How do you say this in English?</p><div class="qmain">${esc(q.p.vi)}</div>`;
  else if (q.t === 'listen') h += `<p class="muted" style="margin-top:10px">Listen, then choose what you hear.</p><button class="say big" data-act="say" data-t="${esc(q.p.en)}" aria-label="Play audio">${ic('speaker')}</button><p style="text-align:center"><button class="btn g" data-act="nolisten">I can’t play audio</button></p>`;
  else if (q.t === 'gap') h += `<p class="muted" style="margin-top:10px">Choose the missing word.</p><div class="qmain">${esc(q.text)}</div>`;
  else if (q.t === 'order') h += `<p class="muted" style="margin-top:10px">Put the words in order.</p><div class="qmain" style="font-size:19px">${esc(q.p.vi)}</div>${ordHTML(q)}`;
  if (q.t !== 'order') h += `<div class="opts">${q.opts.map((o, i) => `<button class="opt${q.fb ? (i === q.a ? ' ok' : i === q.sel ? ' no' : '') : ''}" data-act="opt" data-i="${i}" ${q.fb ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  return h;
}
function fbHTML(q) {
  return `<div class="grid"><div class="row between"><b>${q.ok ? 'Correct' : 'The answer is'}</b>${sayBtn(q.p.en)}</div>
    <div><div style="font-weight:600;font-size:16px">${esc(q.p.en)}</div><div class="vi">${esc(q.p.vi)}</div></div>
    <button class="btn p w" data-act="qnext">Continue</button></div>`;
}

function sessHTML() {
  const s = sess;
  if (s.kind === 'place') return placeHTML();
  const lv = s.w != null && CURR[s.w] ? CURR[s.w].l : 'A1';
  const dayLabel = s.idx != null ? 'Day ' + (s.idx + 1) : '';
  if (s.phase === 'learn') {
    const title = s.kind === 'quick' ? 'Quick mode' : CURR[s.w].d[s.d].t;
    const tip = s.kind === 'lesson' ? CURR[s.w].d[s.d].tip : 'Say each phrase aloud, then answer three quick questions.';
    const body = `<div class="stack"><div><div class="lab">${s.kind === 'quick' ? '3-minute quick mode' : 'Learn · ' + dayLabel}</div><h2 style="margin-top:4px">${esc(title)}</h2></div>
      <div class="tip">${ic('bulb')}<span><b>Ward tip.</b> ${esc(tip)}</span></div>${s.ph.map(p => learnCard(p, s)).join('')}</div>`;
    return ov(s.kind === 'quick' ? 'Quick' : dayLabel, 0, body, bottom('', `<button class="btn p w" data-act="tolq">${s.kind === 'quick' ? 'Start 3 questions' : 'Start practice · ' + s.qs.length + ' questions'}</button>`));
  }
  if (s.phase === 'quiz') {
    const q = s.qs[s.qi];
    const head = s.kind === 'rev' ? 'Week review' : s.kind === '4wk' ? '4-week check' : s.kind === 'grad' ? 'Graduation review' : s.kind === 'review' ? (s.extra ? 'Extra practice' : 'Review') : s.kind === 'quick' ? 'Quick mode' : 'Practice';
    const intro = s.qi === 0 && (s.kind === 'rev' || s.kind === '4wk' || s.kind === 'grad') ? `<div class="tip" style="margin-bottom:14px">${ic('bulb')}<span>${s.kind === 'grad' ? '20 questions from the whole course. Take your time.' : 'Score 70% or more to pass. There is no time limit.'}</span></div>` : '';
    let bot = '';
    if (q.fb) bot = `<div class="ov-bot ${q.ok ? 'ok' : 'no'}"><div class="in">${fbHTML(q)}</div></div>`;
    else if (q.t === 'order') bot = bottom('', `<button class="btn p w" data-act="ocheck" ${q.built.length === q.bank.length ? '' : 'disabled'}>Check</button>`);
    return ov((s.qi + 1) + '/' + s.qs.length, s.qi / s.qs.length * 100, `<div class="lab" style="margin-bottom:8px">${head}</div>${intro}${qHTML(q)}`, bot);
  }
  if (s.phase === 'dlg') {
    const dl = CURR[s.w].dl, showVi = viShown(lv) || s.rev.all;
    const body = `<div class="stack"><div><div class="lab">Role-play · ${dayLabel}</div><h2 style="margin-top:4px">${esc(dl.t)}</h2><p class="vi">${esc(dl.v)}</p></div>
      <p class="muted sm">You are the nurse. Read and listen first, then play your part.</p>
      <div class="row wrapx">${TTS ? `<button class="btn o" data-act="playall">${ic('speaker')}Play all</button>` : ''}${showVi ? '' : '<button class="btn o" data-act="revealall">Show Vietnamese</button>'}</div>
      <div>${s.lines.map(l => bubble(l, s, showVi)).join('')}</div></div>`;
    return ov('Role-play', 0, body, bottom('', '<button class="btn p w" data-act="torole">Play the nurse</button>'));
  }
  if (s.phase === 'role') {
    const r = s.ro, showVi = viShown(lv) || s.rev.all;
    const upto = (r && !r.fb) ? s.li : s.li + 1;
    let body = `<div class="lab" style="margin-bottom:6px">Your turn as the nurse</div>` + s.lines.slice(0, upto).map(l => bubble(l, s, showVi)).join('');
    let bot = '';
    const last = s.li === s.lines.length - 1;
    if (r && !r.fb) {
      body += `<p class="muted" style="margin:16px 0 10px">Choose the best reply.</p><div class="opts">${r.opts.map((o, i) => `<button class="opt" data-act="ropt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    } else if (r) {
      const line = s.lines[s.li];
      bot = `<div class="ov-bot ${r.ok ? 'ok' : 'no'}"><div class="in"><div class="grid"><div><b>${r.ok ? 'Good reply' : 'A better reply is shown above'}</b><div class="vi">${esc(line[2])}</div></div><button class="btn p w" data-act="rnext">${last ? 'Finish' : 'Continue'}</button></div></div></div>`;
    } else {
      bot = bottom('', `<button class="btn p w" data-act="rnext">${last ? 'Finish' : 'Continue'}</button>`);
    }
    return ov((s.li + 1) + '/' + s.lines.length, s.li / s.lines.length * 100, body, bot);
  }
  if (s.phase === 'done') return doneHTML(s);
  return '';
}

function doneHTML(s) {
  const rev = s.kind === 'rev' || s.kind === '4wk', passed = s.acc >= 70;
  const title = s.kind === 'quick' ? 'Streak kept' : s.kind === 'review' ? 'Review complete' : rev ? (passed ? (s.kind === '4wk' ? '4-week check passed' : 'Week passed') : 'Nearly there') : s.kind === 'grad' ? 'You graduated' : 'Lesson complete';
  const sub = rev && !passed ? 'You need 70% to pass. Try again when you are ready.' : s.acc >= 90 ? 'Excellent work.' : s.acc >= 70 ? 'Good work. Keep going.' : 'Every review makes these phrases easier.';
  const nextOK = ['lesson', 'dlg', 'rev', '4wk'].includes(s.kind) && s.idx === S.pos - 1 && S.pos < TOTAL;
  const nextL = nextOK ? LESS[S.pos] : null;
  let body = `<div class="done"><div class="ring" style="--p:${s.acc}"><div><span>${s.acc}%<small>${s.cor}/${s.tot} correct</small></span></div></div>
    <div><h2 class="t1">${title}</h2><p class="muted" style="margin-top:6px">${sub}</p></div>
    <div class="stats"><div class="card stat"><b>+${s.xp}</b><span class="xs muted">points</span></div><div class="card stat"><b>${s.streak}</b><span class="xs muted">day streak</span></div><div class="card stat"><b>${doneCount()}</b><span class="xs muted">lessons done</span></div></div>`;
  if (s.levelUp) body += `<div class="card" style="text-align:left;border-color:var(--accent)"><b>Level ${s.levelUp} complete.</b><p class="sm muted">You finished all 91 days. Your certificate is ready.</p><button class="btn p" style="margin-top:10px" data-act="cert" data-l="${s.levelUp}">View certificate</button></div>`;
  if (s.kind === 'grad') body += `<div class="card" style="text-align:left;border-color:var(--accent)"><b>365 days, A1 to B2.</b><p class="sm muted">Your graduate certificate is ready.</p><button class="btn p" style="margin-top:10px" data-act="cert" data-l="GRAD">View certificate</button></div>`;
  if (s.canDo && passed) body += `<div class="card flat" style="text-align:left"><div class="lab">You can now</div><p style="margin-top:4px;font-weight:600">${esc(s.canDo)}</p></div>`;
  if (s.badges && s.badges.length) body += `<div class="card" style="text-align:left"><div class="lab">New badge${s.badges.length > 1 ? 's' : ''}</div>${s.badges.map(b => `<div class="row" style="margin-top:8px;color:var(--warn)">${ic('award')}<span style="color:var(--ink)"><b>${b.t}</b> <span class="muted sm">${b.d}</span></span></div>`).join('')}</div>`;
  if (s.challenge) body += `<div class="card flat" style="text-align:left"><div class="lab">Try it on shift</div><p class="phr" style="margin-top:6px">“${esc(s.challenge.en)}”</p><p class="vi">${esc(s.challenge.vi)}</p><p class="sm muted" style="margin-top:6px">Use this phrase once with a patient or colleague today.</p></div>`;
  if (nextL && s.kind !== 'quick') body += `<p class="sm muted">Next: ${esc(ltitle(nextL).en)}. Ten minutes a day is enough.</p>`;
  body += '</div>';
  let bt = '';
  if (rev && !passed) bt += `<button class="btn p w" data-act="retry">Try again</button>`;
  else if (nextOK) bt += `<button class="btn p w" data-act="nextlesson">Next lesson</button>`;
  bt += `<button class="btn ${(rev && !passed) || nextOK ? 's' : 'p'} w" data-act="close">Back to Today</button>`;
  return ov('Done', 100, body, bottom('', `<div class="grid">${bt}</div>`));
}

function placeHTML() {
  const s = sess;
  if (s.phase === 'pintro') {
    return ov('Level test', 0, `<div class="stack"><h2>Level test</h2><p class="vi">Bài kiểm tra trình độ · khoảng 5 phút</p>
      <div class="card"><p>20 short questions, from A1 to B2. There is no time limit and no penalty. Answer what you can and choose your best guess when you are not sure.</p></div>
      <p class="sm muted">We use your score only to suggest where to start. You can change your mind at any time.</p></div>`, bottom('', '<button class="btn p w" data-act="pstart">Start the test</button>'));
  }
  if (s.phase === 'ptest') {
    const q = PLACE[s.qi], last = s.qi === PLACE.length - 1;
    return ov((s.qi + 1) + '/' + PLACE.length, s.qi / PLACE.length * 100,
      `<div class="qlab">Question ${s.qi + 1} of ${PLACE.length}</div><div class="qmain">${esc(q.q)}</div>${q.h ? `<p class="vi" style="margin:-6px 0 14px">${esc(q.h)}</p>` : ''}<div class="opts">${q.o.map((o, i) => `<button class="opt${s.sel === i ? ' sel' : ''}" data-act="popt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`,
      bottom('', `<button class="btn p w" data-act="pnext" ${s.sel == null ? 'disabled' : ''}>${last ? 'See my result' : 'Next'}</button>`));
  }
  const rec = s.rec;
  return ov('Result', 100, `<div class="stack"><h2>Your starting point</h2>
    <div class="card stack" style="gap:12px">${LV.map(l => `<div class="skill" style="grid-template-columns:36px 1fr 40px">${lvChip(l)}${bar(s.sc[l] / 5 * 100, LVC[l])}<span class="mono sm" style="text-align:right">${s.sc[l]}/5</span></div>`).join('')}</div>
    <div class="card" style="border-color:${LVC[rec]}"><div class="lab">We suggest</div><h2 style="margin:4px 0">Start at ${rec}: ${LVNAME[rec]}</h2><p class="sm muted">Day ${LSTART[rec] + 1} of 365. ${rec === 'A1' ? 'You will build a strong base first.' : 'Earlier days stay open if you want to revisit them.'}</p></div></div>`,
    bottom('', `<div class="grid"><button class="btn p w" data-act="startat" data-l="${rec}">Start at ${rec}</button>${rec !== 'A1' ? '<button class="btn s w" data-act="startat" data-l="A1">Start from Day 1 instead</button>' : ''}</div>`));
}

/* ---------- sheets ---------- */
function sheetHTML() {
  let inner = '';
  if (sheet.k === 'week') inner = weekSheet(sheet.w);
  else if (sheet.k === 'settings') inner = settingsSheet();
  else if (sheet.k === 'cert') inner = certSheet(sheet.l);
  return `<div class="sheet-bg" data-act="sheetbg"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
}
const sheetHead = t => `<div class="row between"><h2>${t}</h2><button class="ibtn" data-act="sheetx" aria-label="Close">${ic('x')}</button></div>`;
function weekSheet(wi) {
  const w = CURR[wi], l = w.l;
  let rows = '';
  for (let d = 0; d < 7; d++) {
    const i = wi * 7 + d, L = LESS[i], tt = ltitle(L), dn = S.done[i], lockd = i > S.pos && !dn;
    rows += `<button class="dayrow${dn ? ' done' : ''}" data-act="start" data-i="${i}" ${lockd ? 'disabled' : ''}><span class="dn">${dn ? ic('check') : lockd ? ic('lock') : (i + 1)}</span>
      <span class="grow"><b>${esc(tt.en)}</b><br><span class="xs muted">Day ${i + 1} · ${KIND_LABEL[lkind(L)]}${dn ? ' · ' + dn.a + '%' : ''}</span></span>${lockd ? '' : ic('chev').replace('<svg', '<svg width="18" height="18"')}</button>`;
  }
  return `${sheetHead('Week ' + (wi + 1))}<div><div class="row">${lvChip(l)}<b>${esc(w.t)}</b></div><p class="vi">${esc(w.v)}</p><p class="sm" style="margin-top:8px">${esc(w.c)}</p></div><div>${rows}</div>`;
}
function settingsSheet() {
  const seg = (k, opts) => `<div class="seg">${opts.map(o => `<button data-act="set" data-k="${k}" data-v="${o[0]}" aria-pressed="${String(S.set[k]) === String(o[0])}">${o[1]}</button>`).join('')}</div>`;
  return `${sheetHead('Settings')}
  <div><label class="lab" for="nm">Your name</label><input id="nm" type="text" value="${esc(S.name)}" placeholder="Shown on certificates" autocomplete="off"></div>
  <div><div class="lab" style="margin-bottom:6px">Vietnamese help · Trợ giúp tiếng Việt</div>${seg('help', [['auto', 'Auto'], ['always', 'Always'], ['off', 'Tap to show']])}<p class="xs muted" style="margin-top:6px">Auto shows Vietnamese in A1 and A2, then hides it behind a tap in B1 and B2.</p></div>
  ${TTS ? `<div><div class="lab" style="margin-bottom:6px">Speech speed</div>${seg('rate', [[0.8, 'Slow'], [1, 'Normal'], [1.15, 'Fast']])}</div>` : '<p class="xs muted">This browser has no speech voice, so audio buttons are hidden. Reading and writing practice still work.</p>'}
  <div class="card flat stack" style="gap:10px"><div><b>Backup</b><p class="xs muted">Progress lives in this browser. Copy the code to move it to another phone or keep a safe copy.</p></div>
    <button class="btn s" data-act="bkcopy">Copy backup code</button>
    ${sheet.code ? `<textarea id="bk" readonly aria-label="Backup code">${esc(sheet.code)}</textarea>` : ''}
    <textarea id="rs" placeholder="Paste a backup code here to restore" aria-label="Restore code"></textarea>
    <button class="btn o" data-act="bkrestore">Restore from code</button></div>
  <div class="row wrapx"><button class="btn o" data-act="place">Retake level test</button>
    <button class="btn ${resetArm ? 'bad' : 'o'}" data-act="reset">${resetArm ? 'Tap again to erase everything' : 'Reset all progress'}</button></div>
  <p class="xs muted">Tip: set a daily alarm on your phone called “EFEC 10 minutes”. This page cannot send notifications.</p>`;
}
function certSheet(l) {
  const grad = l === 'GRAD';
  const from = grad ? 0 : LSTART[l], to = grad ? 364 : LEND[l];
  let sum = 0, n = 0, last = '';
  for (let i = from; i <= to; i++) { const d = S.done[i]; if (d) { sum += d.a; n++; if (d.d > last) last = d.d; } }
  const avg = n ? Math.round(sum / n) : 0;
  return `${sheetHead('Certificate')}<div class="cert"><div style="width:44px;margin:0 auto">${LOGO}</div><div class="lab">EFEC Helper · Certificate of completion</div>
    <div class="nm">${esc(S.name || 'Nurse')}</div>
    <p>${grad ? 'has completed <b>365 days of English for Nursing</b>, from A1 to B2.' : `has completed <b>English for Nursing, Level ${l}</b>.`}</p>
    <p class="muted">${grad ? 'Ward basics to professional English' : `${LVNAME[l]} · 91 daily lessons`}</p>
    <p class="mono sm">Average score ${avg}% · ${last ? fmtDate(last) : ''}</p></div>
    ${S.name ? '' : '<p class="xs muted">Add your name in Settings to show it here.</p>'}<p class="xs muted">Take a screenshot to save or share your certificate.</p>`;
}

/* ---------- events ---------- */
let lastKey = '', playToken = 0;
function afterRender() {
  const b = document.querySelector('.ov-body');
  if (!b || !sess) { lastKey = ''; return; }
  const key = sess.phase + ':' + (sess.qi || 0) + ':' + (sess.li || 0);
  if (sess.phase === 'role') b.scrollTop = b.scrollHeight;
  else if (key !== lastKey) b.scrollTop = 0;
  lastKey = key;
}
function autoPlay() {
  const q = sess && sess.phase === 'quiz' ? curQ() : null;
  if (q && q.t === 'listen' && !q.fb) speak(q.p.en);
}
function playAll(lines, i, tok) {
  if (tok !== playToken || !sess || sess.phase !== 'dlg' || i >= lines.length) return;
  speak(lines[i][1], () => playAll(lines, i + 1, tok));
}
function copyText(text, cb) {
  try { navigator.clipboard.writeText(text).then(() => cb(true), () => cb(false)); } catch (e) { cb(false); }
}
const nameFromInput = () => { const el = $('#nm'); if (el) { S.name = el.value.trim().slice(0, 40); save(); } };

const H = {
  tab(el) { tab = el.dataset.t; if (tab === 'path') pathScrolled = false; render(); window.scrollTo(0, 0); },
  settings() { sheet = { k: 'settings' }; resetArm = false; render(); },
  sheetx() { sheet = null; resetArm = false; render(); },
  sheetbg(el, e) { if (e.target === el) { sheet = null; resetArm = false; render(); } },
  start(el) { const i = +el.dataset.i; if (i > S.pos && !S.done[i]) return; startLesson(i); },
  quick() { startQuick(); },
  review() { startReview(); },
  place() { nameFromInput(); startPlace(); },
  startat(el) { nameFromInput(); applyStart(el.dataset.l); },
  week(el) { sheet = { k: 'week', w: +el.dataset.w }; render(); },
  cert(el) { sheet = { k: 'cert', l: el.dataset.l }; render(); },
  say(el) { speak(el.dataset.t); },
  reveal(el) { sess.rev[el.dataset.k] = true; render(); },
  revealall() { sess.rev.all = true; render(); },
  said(el) {
    const k = el.dataset.k;
    if (sess.said[k]) { delete sess.said[k]; delete S.said[k]; } else { sess.said[k] = 1; S.said[k] = 1; }
    save(); render();
  },
  fav(el) {
    const k = el.dataset.k;
    if (S.fav[k]) delete S.fav[k]; else S.fav[k] = 1;
    save(); render();
  },
  tolq() { sess.phase = 'quiz'; sess.qi = 0; render(); autoPlay(); },
  opt(el) { pickOpt(+el.dataset.i); },
  oadd(el) { ordAdd(+el.dataset.i); },
  odel(el) { ordDel(+el.dataset.i); },
  ocheck() { ordCheck(); },
  nolisten() { noListen(); },
  qnext() { qNext(); autoPlay(); },
  playall() { playToken++; playAll(sess.lines, 0, playToken); },
  torole() { playToken++; startRole(); },
  ropt(el) { rolePick(+el.dataset.i); },
  rnext() { roleNext(); },
  leave() { sess.leave = true; render(); },
  stay() { sess.leave = false; render(); },
  close() { playToken++; try { if (TTS) speechSynthesis.cancel(); } catch (e) { } sess = null; sheet = null; render(); },
  nextlesson() { startLesson(S.pos); },
  retry() { startLesson(sess.idx); },
  pstart() { sess.phase = 'ptest'; render(); },
  popt(el) { pickPlace(+el.dataset.i); },
  pnext() { pNext(); },
  more() { bookN += 40; const bl = $('#bl'); if (bl) bl.innerHTML = bookRows(); },
  bf(el) { bookF = el.dataset.f; bookN = 40; render(); },
  set(el) { const k = el.dataset.k; S.set[k] = k === 'rate' ? +el.dataset.v : el.dataset.v; save(); render(); },
  bkcopy() {
    sheet.code = exportCode(); render();
    copyText(sheet.code, ok => toast(ok ? 'Backup code copied' : 'Select the code and copy it'));
    const bk = $('#bk'); if (bk) { bk.focus(); bk.select(); }
  },
  bkrestore() {
    const el = $('#rs');
    try { importCode(el ? el.value : ''); sheet = null; sess = null; tab = 'today'; render(); toast('Progress restored'); }
    catch (e) { toast('That backup code is not valid'); }
  },
  reset() {
    if (!resetArm) { resetArm = true; render(); setTimeout(() => { resetArm = false; if (sheet && sheet.k === 'settings') render(); }, 5000); }
    else { S = fresh(); save(); sheet = null; sess = null; resetArm = false; tab = 'today'; render(); }
  },
  nop() { }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = H[el.dataset.act];
  if (f) f(el, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { bookQ = e.target.value; bookN = 40; const bl = $('#bl'); if (bl) bl.innerHTML = bookRows(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'nm') { S.name = e.target.value.trim().slice(0, 40); save(); if (S.ob && !sess && !sheet) render(); }
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { roll(); save(); if (!sess && !sheet) render(); }
});

/* ---------- start ---------- */
roll(); save(); render();

</script>

  <div class="wrap">
    <p>Trang này dùng Google Analytics để biết nội dung nào hữu ích cho bạn — chỉ khi bạn đồng ý. Không có cookie quảng cáo, không bán dữ liệu. Bạn có thể đổi ý bất cứ lúc nào qua “Cài đặt cookie” ở chân trang. Xem <a href="/quyen-rieng-tu.html">Chính sách quyền riêng tư</a>.</p>
    <div class="cookie-actions">
      <button type="button" id="cookie-accept" class="btn">Đồng ý</button>
      <button type="button" id="cookie-decline" class="btn">Từ chối</button>
    </div>
  </div>
</div>
<script>
(function(){
  var KEY='de-consent';
  var banner=document.getElementById('cookie-banner');
  function loadGA(){
    if(document.querySelector('script[src*="googletagmanager.com/gtag/js"]')){return;}
    var s=document.createElement('script');
    s.async=true;
    s.src='https://www.googletagmanager.com/gtag/js?id=G-6WKB00FR9G';
    document.head.appendChild(s);
    gtag('js', new Date());
    gtag('config', 'G-6WKB00FR9G');
  }
  function eraseGaCookies(){
    document.cookie.split(';').forEach(function(c){
      var name=c.split('=')[0].trim();
      if(name.indexOf('_ga')===0){
        document.cookie=name+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
      }
    });
  }
  function showBanner(){banner.hidden=false;}
  function hideBanner(){banner.hidden=true;}
  function accept(){
    try{localStorage.setItem(KEY,'granted');}catch(e){}
    gtag('consent','update',{'analytics_storage':'granted'});
    loadGA();
    hideBanner();
  }
  function decline(){
    try{localStorage.setItem(KEY,'denied');}catch(e){}
    gtag('consent','update',{'analytics_storage':'denied'});
    eraseGaCookies();
    hideBanner();
  }
  document.getElementById('cookie-accept').addEventListener('click',accept);
  document.getElementById('cookie-decline').addEventListener('click',decline);
  var settings=document.getElementById('cookie-settings');
  if(settings){settings.addEventListener('click',function(e){e.preventDefault();showBanner();});}
  var stored=null;
  try{stored=localStorage.getItem(KEY);}catch(e){}
  if(stored==='granted'){
    gtag('consent','update',{'analytics_storage':'granted'});
    loadGA();
  }else if(stored==='denied'){
    /* Da tu choi: khong tai gtag.js, khong hien lai banner. */
  }else{
    showBanner();
  }
})();
</script>
</body></html>
