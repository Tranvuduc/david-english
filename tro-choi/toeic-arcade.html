</head><body><style>.de-back{margin:0;text-align:left;background:#123a6d;color:#fff;padding:0 16px}.de-back a{display:inline-flex;align-items:center;min-height:44px;color:#fff;font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-decoration:none}.de-back a:hover{color:#e8a020;text-decoration:underline}.de-back a:focus-visible{outline:3px solid #e8a020;outline-offset:2px}</style><header class="de-back"><a href="/">← David English</a></header>

<style>
:root{
  color-scheme:dark;
  --ink:#14173A;--ink2:#1D2152;--ink3:#2A3070;--line:#0A0C22;
  --paper:#FFF8EA;--paper2:#F1E6CF;--ptext:#1A1C3A;--pmuted:#5C5F86;
  --text:#F5F3FF;--muted:#AEB3E0;
  --tang:#FF7A2F;--pink:#FF4F9A;--lime:#9BE22E;--sky:#35C4F0;--sun:#FFCC33;--grape:#8C6BFF;
  --good:#22C66E;--bad:#FF4D5E;
  --fd:'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif;
  --fb:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%}body{min-height:100%}
html{overflow-x:clip}
body{background:var(--ink);color:var(--text);font-family:var(--fb);font-size:16px;line-height:1.5;
  background-image:radial-gradient(rgba(255,255,255,.055) 1.2px,transparent 1.3px);background-size:22px 22px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:800;letter-spacing:.3px;line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:1.45rem;margin:26px 0 12px}
p{margin:0}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(20,23,58,.92);backdrop-filter:blur(8px);border-bottom:3px solid var(--line)}
#top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--fd);font-weight:800;font-size:1.3rem;letter-spacing:.5px;white-space:nowrap;background:none;border:0;padding:0}
.logo span:nth-child(5n+1){color:var(--sun)}.logo span:nth-child(5n+2){color:var(--pink)}.logo span:nth-child(5n+3){color:var(--sky)}.logo span:nth-child(5n+4){color:var(--lime)}.logo span:nth-child(5n){color:var(--tang)}
.topstats{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--ink3);border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.85rem;white-space:nowrap}
.pill.fire{color:var(--tang)}
.brandmark{display:inline-flex;align-items:baseline;gap:1px;font-family:var(--fm);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.brandmark b{color:var(--text);font-weight:600}
.brandmark i{font-style:normal;color:#E0AC5A}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--ink3);border:2px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
#xpbar{height:5px;background:var(--line)}
#xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--tang),var(--pink));width:0;transition:width .6s}

/* layout */
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink2);border-top:3px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:800;color:var(--muted);position:relative}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--sun)}
#nav button.on::before{content:"";position:absolute;top:-3px;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--sun)}
#nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--pink);color:#fff;border-radius:999px;font-size:.65rem;padding:0 5px;border:2px solid var(--line)}

/* cards & buttons */
.card{background:var(--paper);color:var(--ptext);border:3px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--line);padding:18px}
.card .muted{color:var(--pmuted)}
.muted{color:var(--muted)}
.btn{--c:var(--sun);background:var(--c);color:var(--line);border:3px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--line);padding:11px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn.ghost{--c:var(--ink3);color:var(--text)}
.btn.sm{padding:7px 11px;font-size:.88rem;border-radius:11px;box-shadow:3px 3px 0 var(--line)}
.btn.big{padding:15px 18px;font-size:1.05rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.c-sun{--c:var(--sun)}.c-pink{--c:var(--pink)}.c-sky{--c:var(--sky)}.c-lime{--c:var(--lime)}.c-tang{--c:var(--tang)}.c-grape{--c:var(--grape)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid3{gap:8px}.stat{padding:10px}.stat .n{font-size:1.3rem}.stat .l{font-size:.66rem}}
.chip{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:800;background:var(--paper2);color:var(--ptext);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips button{flex:none;border:2px solid var(--line);background:var(--ink3);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem}
.chips button.on{background:var(--sun);color:var(--line)}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
.bar{height:10px;background:rgba(0,0,0,.18);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--c,var(--lime));border-radius:99px;transition:width .5s}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--sun)}
.hero h1{font-size:2.1rem;color:var(--line)}
.hero .lv{font-family:var(--fd);font-size:1rem;color:var(--line);opacity:.8}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--fd);font-size:1.25rem;line-height:1;color:var(--line)}
.ring b small{display:block;font-family:var(--fb);font-weight:800;font-size:.66rem;letter-spacing:.8px}
.stat{padding:14px}
.stat .n{font-family:var(--fd);font-size:1.7rem;line-height:1}
.stat .l{font-size:.78rem;font-weight:800;color:var(--pmuted)}
.topic{border:3px solid var(--line);border-radius:16px;padding:14px;background:var(--c);color:var(--line);box-shadow:4px 4px 0 var(--line);text-align:left;display:flex;flex-direction:column;gap:8px;min-height:128px}
.topic .ic{font-size:1.6rem;line-height:1}
.topic h3{font-size:1.1rem}
.topic .vi{font-size:.8rem;font-weight:600;opacity:.8;margin-top:-6px}
.topic .bar{margin-top:auto;background:rgba(255,255,255,.45)}
.topic .bar i{background:var(--line)}
.topic:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}

/* word list */
.wl{display:flex;flex-direction:column;gap:10px}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 14px}
.wrow .w{font-weight:800;font-size:1.08rem}
.wrow .ex{font-size:.86rem;color:var(--pmuted);margin-top:2px}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{width:12px;height:6px;border-radius:3px;background:var(--paper2);border:1px solid rgba(0,0,0,.25)}
.pips i.on{background:var(--good)}
.say{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--sky);display:grid;place-items:center;flex:none}
.say svg{width:20px;height:20px}

/* game tiles */
.tile{border:3px solid var(--line);border-radius:18px;padding:16px;background:var(--c);color:var(--line);box-shadow:5px 5px 0 var(--line);text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;min-height:150px}
.tile h3{font-size:1.3rem}
.tile p{font-size:.86rem;font-weight:600;opacity:.85}
.tile .tag{position:absolute;top:12px;right:12px;background:var(--line);color:var(--paper);font-size:.66rem;font-weight:800;letter-spacing:1px;border-radius:6px;padding:2px 7px}
.tile .best{margin-top:auto;font-size:.78rem;font-weight:800}
.tile .glyph{font-size:2rem;line-height:1}
.tile:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qhead .bar{flex:1;background:var(--ink3)}
.combo{font-family:var(--fd);color:var(--tang);min-width:62px;text-align:right}
.combo.hot{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.35)}}
.qcard{padding:20px 18px}
.qpart{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}
.prompt{font-size:1.3rem;font-weight:800;line-height:1.35}
.prompt .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--pink);margin:0 3px}
.prompt .big{font-family:var(--fd);font-weight:400;font-size:2.3rem;line-height:1.1}
.scene{font-size:4.2rem;text-align:center;padding:14px;background:var(--paper2);border:3px dashed rgba(0,0,0,.25);border-radius:14px;letter-spacing:6px;line-height:1.2}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ptext);border:3px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;font-weight:700;box-shadow:3px 3px 0 var(--line);transition:transform .08s}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.bub{width:34px;height:34px;flex:none;border-radius:50%;border:2.5px solid var(--ptext);display:grid;place-items:center;font-family:var(--fm);font-weight:700;font-size:.95rem}
.opt.ok{background:#D6F8E4;border-color:#0E7C43}.opt.ok .bub{background:var(--good);border-color:#0E7C43;color:#fff}
.opt.no{background:#FFE0E3;border-color:#B3182A;animation:shake .35s}.opt.no .bub{background:var(--bad);border-color:#B3182A;color:#fff}
.opt.dim{opacity:.55}
.opt .hid{color:var(--pmuted);font-style:italic;font-weight:600}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.explain{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:.95rem;border:2px solid var(--line)}
.explain.good{background:#D6F8E4}.explain.bad{background:#FFE7D6}
.play{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.playbtn{width:64px;height:64px;border-radius:50%;background:var(--pink);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);display:grid;place-items:center}
.playbtn svg{width:30px;height:30px}
.playbtn.speaking{animation:ring 1s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,79,154,.6),3px 3px 0 var(--line)}100%{box-shadow:0 0 0 16px rgba(255,79,154,0),3px 3px 0 var(--line)}}
.result{text-align:center}
.result .score{font-family:var(--fd);font-size:4rem;line-height:1}
.miss{text-align:left;margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.miss div{background:var(--paper2);border-radius:10px;padding:8px 10px}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mt{min-height:84px;border:3px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ptext);font-weight:800;padding:8px;box-shadow:3px 3px 0 var(--line);font-size:.92rem;line-height:1.25;word-break:break-word}
.mt.vi{background:#E9F7FF;font-weight:700;font-size:.85rem}
.mt.sel{background:var(--sun)}
.mt.done{visibility:hidden}
.mt.no{animation:shake .35s;background:#FFE0E3}

/* flashcards */
.flip{perspective:1200px;height:300px;cursor:pointer}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}
.face.back{transform:rotateY(180deg);background:var(--sky)}
.face .word{font-family:var(--fd);font-size:2.4rem;line-height:1.1}
.face .viw{font-size:1.4rem;font-weight:800}

/* spell */
.spell input{width:100%;font:inherit;font-size:1.4rem;font-weight:800;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ptext);text-align:center;letter-spacing:1px}

/* review list */
.bank{display:flex;flex-direction:column;gap:8px}
.bitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px}
.bitem .t{font-weight:800}
.bitem .s{font-size:.82rem;color:var(--pmuted)}
.x{background:none;border:2px solid var(--line);border-radius:10px;width:34px;height:34px;color:var(--ptext);font-weight:800}
.wk{display:grid;grid-template-columns:130px 1fr 46px;gap:10px;align-items:center;font-size:.88rem;font-weight:700;margin-bottom:8px}

/* guide */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--paper2)}
th{font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--pmuted)}
td.n{font-family:var(--fm);text-align:right}
details{border:3px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ptext);box-shadow:4px 4px 0 var(--line);margin-bottom:12px;overflow:hidden}
summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .pn{width:44px;height:44px;border-radius:12px;background:var(--c);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--fd);font-size:1.2rem;flex:none}
summary h3{font-size:1.12rem}
summary .muted{font-size:.8rem}
details .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
details ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.trap{background:#FFE7D6;border-radius:12px;padding:10px 12px;font-size:.9rem}
.trap b{color:#B3401A}

/* modal / sheet */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(5,6,20,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--ink2);border:3px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:760px;max-height:88%;overflow-y:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-weight:800;font-size:.9rem}
.field select,.field textarea{font:inherit;font-weight:600;background:var(--paper);color:var(--ptext);border:3px solid var(--line);border-radius:12px;padding:9px 10px}
.field textarea{font-family:var(--fm);font-size:.72rem;min-height:74px;resize:vertical}
.field input[type=range]{accent-color:var(--sun)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bdg{text-align:center;font-size:.7rem;font-weight:800;background:var(--ink3);border:2px solid var(--line);border-radius:12px;padding:8px 4px;opacity:.4}
.bdg.on{opacity:1;background:var(--sun);color:var(--line)}
.bdg i{display:block;font-style:normal;font-size:1.5rem}
@media (max-width:420px){.badges{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* toast & fx */
#toasts{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:0;right:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--sun);color:var(--line);border:3px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:800;box-shadow:3px 3px 0 var(--line);animation:tin .25s ease-out,tout .3s ease-in 1.8s forwards}
.toast.pink{background:var(--pink);color:#fff}.toast.lime{background:var(--lime)}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.enter{animation:rise .3s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stack{display:flex;flex-direction:column;gap:14px}
.seg{display:flex;background:var(--ink3);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ptext)}
.note{font-size:.82rem;color:var(--muted)}

.cq{margin-top:20px}
.cqt{font-weight:800;font-size:1.05rem;line-height:1.35}
.opt.sel{background:#FFF2C2;border-color:#8A6400}.opt.sel .bub{background:var(--sun)}
.cq .opts{margin-top:10px;gap:8px}.cq .opt{padding:9px 11px}.cq .bub{width:30px;height:30px}
.graphic{background:#fff;border:2px solid var(--line);border-radius:12px;margin-top:12px}
.graphic td,.graphic th{padding:6px 10px}
.tscript{margin-top:14px;background:var(--paper2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.tscript b{display:inline-block;min-width:54px;font-size:.78rem;letter-spacing:.5px;text-transform:uppercase}
.exam{color:var(--text);flex:none;display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.82rem;background:var(--ink3);border:2px solid var(--line);border-radius:999px;padding:5px 12px}
.exam.on{background:var(--sun);color:var(--line)}
@media (max-width:440px){.logo{font-size:1.02rem;letter-spacing:0}.topstats{gap:5px}.pill{padding:2px 7px;font-size:.78rem}.iconbtn{width:34px;height:34px}#top .in{gap:6px;padding-inline:12px}.brandmark{display:none}}
.logo{min-width:0;overflow:hidden;text-overflow:clip}
.docs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.doc{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.96rem;font-weight:500;line-height:1.65;color:var(--ptext)}
.doc .dh{font-size:.74rem;font-weight:800;letter-spacing:.4px;color:var(--pmuted);border-bottom:2px dashed var(--paper2);padding-bottom:6px;margin-bottom:8px}
.doc .db{white-space:pre-line}
.qcard.pinned{padding-bottom:40vh}
.cqt .blank,.miss .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--pink);margin:0 3px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.sq{border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ptext);font-family:var(--fm);font-weight:700;font-size:.8rem;padding:6px 0}
.sq.on{background:var(--ptext);color:var(--paper)}
.docs.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:3;max-height:36vh;overflow-y:auto;background:var(--paper);padding:8px 2px;border-bottom:3px solid var(--line);margin-inline:-4px;overscroll-behavior:contain}
.gap{display:inline-block;min-width:46px;padding:0 6px;border-bottom:3px solid var(--pink);font-weight:800;text-align:center;font-family:var(--fm);font-size:.9em}
.gap.ok{background:#D6F8E4;border-color:var(--good);font-family:var(--fb)}.gap.no{background:#FFE7D6;border-color:var(--tang);font-family:var(--fb)}
.stat .n,.result .score,.face .word,.hero h1{font-weight:800}
</style>

["The number of visitors ____ increased this year.",["has","have","are","were"],"\"The number of\" là số ít."],
["A number of employees ____ asked for flexible hours.",["have","has","is","was"],"\"A number of\" = nhiều → số nhiều."],
["Everyone in the department ____ invited to the party.",["is","are","were","have been"],"\"Everyone\" là số ít."]]},
{id:'pron',name:'Pronouns',vi:'Đại từ',c:'var(--tang)',rule:'Chủ ngữ: I/he/they. Tân ngữ: me/him/them. Tính từ sở hữu + danh từ: my/her/its/their. Đại từ sở hữu (đứng một mình): mine/hers/theirs. Phản thân: himself/themselves — khi chủ ngữ tự làm cho chính mình, hoặc "by oneself" = một mình.',tip:'"its" = của nó; "it\'s" = it is. Đây là bẫy TOEIC rất hay gặp.',ex:'He prepared the slides <b>himself</b>. The company improved <b>its</b> service.',qs:[
["Mr. Garcia prepared the slides ____.",["himself","him","his","he"],"Đại từ phản thân để nhấn mạnh: tự anh ấy làm."],
["Please give the forms to Ms. Wong or ____ assistant.",["her","she","hers","herself"],"Trước danh từ (assistant) → tính từ sở hữu."],
["The idea was ____, not mine.",["theirs","their","them","themselves"],"Đứng một mình, song song với \"mine\" → đại từ sở hữu."],
["The company has improved ____ customer service.",["its","it's","it","itself"],"Tính từ sở hữu trước cụm danh từ: its."],
["Ms. Diaz asked ____ to review the contract.",["us","we","our","ours"],"Làm tân ngữ cho động từ \"asked\" → đại từ tân ngữ."],
["The clients finished the tour by ____.",["themselves","them","their","theirs"],"\"by + đại từ phản thân\" = một mình, tự mình."]]},
{id:'prep',name:'Prepositions',vi:'Giới từ',c:'var(--grape)',rule:'Thời gian: at + giờ, on + thứ/ngày, in + tháng/năm. By = không muộn hơn (hạn chót). Until = kéo dài đến. For + khoảng thời gian; since + mốc bắt đầu. Within = trong vòng. Between (giữa hai) / among (giữa ba trở lên).',tip:'"by Friday" (hạn chót) và "until Friday" (kéo dài liên tục) là cặp bẫy kinh điển của Part 5.',ex:'Submit it <b>by</b> Friday. The store is open <b>until</b> 9.',qs:[
["The meeting will begin ____ 9 a.m.",["at","on","in","by"],"at + giờ."],
["The store is closed ____ Sundays.",["on","at","in","for"],"on + thứ trong tuần."],
["Please return the signed form ____ Friday at the latest.",["by","until","at","since"],"by = hạn chót (không muộn hơn)."],
["The office will be closed ____ the holiday.",["during","while","among","between"],"during + danh từ; \"while\" cần một mệnh đề."],
["The package should arrive ____ three business days.",["within","among","since","along"],"within = trong vòng một khoảng thời gian."],
["The museum is located ____ the bank and the post office.",["between","among","across","within"],"between + hai địa điểm."],
["Ms. Kim has worked here ____ ten years.",["for","since","during","by"],"for + khoảng thời gian."]]},
{id:'conj',name:'Conjunction vs Preposition',vi:'Liên từ vs Giới từ',c:'var(--sun)',rule:'Liên từ (although, because, while, unless, if) + mệnh đề (chủ ngữ + động từ). Giới từ (despite, in spite of, because of, due to, during) + danh từ hoặc V-ing.',tip:'Xem sau chỗ trống là cụm danh từ hay một mệnh đề đầy đủ.',ex:'<b>Although</b> it rained, … / <b>Despite</b> the rain, …',qs:[
["____ the heavy rain, the event was a success.",["Despite","Although","Even though","However"],"\"the heavy rain\" là cụm danh từ → giới từ."],
["____ the flight was delayed, we arrived on time.",["Although","Despite","In spite of","Because of"],"\"the flight was delayed\" là mệnh đề → liên từ."],
["The store closed early ____ a power failure.",["because of","because","since","so that"],"Theo sau là cụm danh từ → \"because of\"."],
["Please call the help desk ____ you have any questions.",["if","unless","whether","otherwise"],"Điều kiện: \"if\" + mệnh đề."],
["____ the manager approves the plan, we cannot start.",["Unless","If","Because","Since"],"unless = nếu … không."],
["The project was finished on time, ____ the budget was exceeded.",["but","despite","because of","so that"],"Đối lập giữa hai mệnh đề → but."]]},
{id:'rel',name:'Relative Clauses',vi:'Mệnh đề quan hệ',c:'var(--pink)',rule:'who = người (làm chủ ngữ). whom = người (làm tân ngữ). which = vật. that = người/vật (không dùng sau dấu phẩy). whose + danh từ = sở hữu. where = nơi chốn.',tip:'Sau dấu phẩy (mệnh đề không xác định) không bao giờ dùng "that".',ex:'The hotel, <b>which</b> opened last year, has 200 rooms.',qs:[
["The woman ____ is speaking now is our new CEO.",["who","which","whose","whom"],"Chỉ người, làm chủ ngữ của \"is speaking\" → who."],
["The report ____ you requested is on your desk.",["that","who","whose","what"],"Chỉ vật, làm tân ngữ của \"requested\" → that/which."],
["We visited a company ____ products are sold worldwide.",["whose","which","who","that"],"Sở hữu + danh từ (products) → whose."],
["The hotel, ____ opened last year, has 200 rooms.",["which","that","who","where"],"Sau dấu phẩy và chỉ vật → which."],
["This is the office ____ I worked for five years.",["where","which","who","whose"],"Nơi chốn + mệnh đề đầy đủ → where."],
["The candidate ____ we interviewed yesterday was impressive.",["whom","whose","which","what"],"Chỉ người, làm tân ngữ của \"interviewed\" → whom."]]},
{id:'comp',name:'Comparisons',vi:'So sánh',c:'var(--sky)',rule:'Tính từ ngắn + -er than / the -est. Tính từ dài: more … than / the most. as + tính từ + as. "The more …, the -er …". Nhấn mạnh so sánh hơn bằng much / far / even / a lot (không dùng "very").',tip:'Thấy "than" → so sánh hơn. Thấy "the … of all / in history" → so sánh nhất.',ex:'Sales were <b>much higher than</b> last year.',qs:[
["This model is ____ than the previous one.",["lighter","light","lightest","more light"],"Có \"than\" → so sánh hơn; tính từ ngắn → -er."],
["It was the ____ successful product launch in our history.",["most","more","much","very"],"\"the … in our history\" → so sánh nhất."],
["The new printer works ____ than the old one.",["faster","fast","fastest","more fastly"],"So sánh hơn của trạng từ \"fast\" là \"faster\"."],
["Our prices are as low ____ any in the city.",["as","than","so","like"],"Cấu trúc as … as."],
["The more you practice, the ____ your score will be.",["higher","high","highest","more high"],"The more …, the + so sánh hơn."],
["Sales this year were ____ higher than last year.",["much","very","most","more"],"Dùng \"much\" (không dùng \"very\") để nhấn mạnh so sánh hơn."]]},
{id:'ger',name:'Gerunds & Infinitives',vi:'V-ing & To-V',c:'var(--lime)',rule:'+ V-ing: avoid, consider, enjoy, finish, mind, recommend, suggest, và sau giới từ (look forward to, be responsible for). + to V: decide, plan, hope, agree, offer, refuse, want, need.',tip:'"look forward to" và "be committed to" đi với V-ing — "to" ở đây là giới từ.',ex:'We look forward to <b>seeing</b> you. We plan <b>to open</b> a branch.',qs:[
["We look forward to ____ you at the conference.",["seeing","see","seen","have seen"],"\"to\" trong \"look forward to\" là giới từ → V-ing."],
["The manager decided ____ the meeting.",["to postpone","postponing","postpone","postponed"],"decide + to V."],
["Would you mind ____ the window?",["closing","to close","close","closed"],"mind + V-ing."],
["The company plans ____ a new branch in Da Nang.",["to open","opening","open","opened"],"plan + to V."],
["Please avoid ____ personal calls during work hours.",["making","to make","make","made"],"avoid + V-ing."],
["She is responsible for ____ new staff.",["training","train","to train","trained"],"Sau giới từ (for) → V-ing."]]},
{id:'cond',name:'Conditionals',vi:'Câu điều kiện',c:'var(--tang)',rule:'Loại 1: If + hiện tại, will + V. Loại 2: If + quá khứ, would + V. Loại 3: If + had V3, would have V3. Đảo ngữ: Should you… = If you should…; Had we known… = If we had known…. Sau recommend/suggest/request that → động từ nguyên mẫu.',tip:'Câu bắt đầu bằng Should / Had / Were mà không có "if" thường là câu điều kiện đảo ngữ.',ex:'<b>Should</b> you need help, please call us.',qs:[
["If we had known about the delay, we ____ a later flight.",["would have booked","would book","will book","had booked"],"Loại 3 (không có thật ở quá khứ): would have + V3."],
["If I ____ more time, I would take the course.",["had","have","will have","had had"],"Loại 2: If + quá khứ đơn."],
["Unless you register by Friday, you ____ a discount.",["will not receive","would not have received","did not receive","not receive"],"Loại 1 với unless → will + V."],
["____ you need help, please contact the front desk.",["Should","Would","Had","Were"],"Đảo ngữ: Should you need = If you need."],
["____ the report been ready, we would have sent it.",["Had","Should","If","Were"],"Đảo ngữ loại 3: Had + chủ ngữ + V3."],
["The manager recommended that everyone ____ the training.",["attend","attends","attended","attending"],"recommend that + động từ nguyên mẫu (giả định)."]]},
{id:'part',name:'Participles',vi:'Phân từ (-ing / -ed)',c:'var(--grape)',rule:'Tính từ -ing mô tả nguyên nhân (a surprising result). Tính từ -ed mô tả cảm xúc của người (surprised staff). Rút gọn mệnh đề: V-ing = chủ động (people wishing to…), V3 = bị động (documents submitted late…).',tip:'Hãy hỏi: danh từ TỰ LÀM hành động (-ing) hay BỊ tác động (-ed)?',ex:'Documents <b>submitted</b> late will not be accepted.',qs:[
["The results of the survey were very ____.",["surprising","surprised","surprise","surprisingly"],"Kết quả gây ngạc nhiên → -ing."],
["The staff were ____ with the new schedule.",["pleased","pleasing","please","pleasure"],"Cảm xúc của người → -ed."],
["Documents ____ after the deadline will not be accepted.",["submitted","submitting","submit","to submit"],"Tài liệu được nộp (bị động) → V3."],
["Anyone ____ to attend should contact Ms. Ito.",["wishing","wished","wish","wishes"],"Anyone who wishes → wishing (chủ động)."],
["____ in 1990, the company now has 500 employees.",["Founded","Founding","Found","To found"],"Công ty được thành lập (bị động) → V3."],
["Please read the ____ instructions carefully.",["attached","attaching","attach","attachment"],"Hướng dẫn được đính kèm (bị động) → tính từ -ed."]]},
{id:'quant',name:'Quantifiers',vi:'Từ chỉ số lượng',c:'var(--sun)',rule:'each/every + danh từ số ít. many/few/a few + danh từ đếm được số nhiều. much/little/a little + danh từ không đếm được. neither/either = một trong hai. none = không cái nào (trong ba trở lên).',tip:'"a few / a little" = một vài (tích cực). "few / little" = hầu như không (tiêu cực).',ex:'<b>Every</b> employee must wear a badge. There is <b>little</b> time left.',qs:[
["____ employee must wear a badge.",["Every","All","Most","Many"],"Danh từ số ít (employee) → every."],
["There is ____ time left before the deadline.",["little","few","many","a few"],"\"time\" không đếm được → little."],
["____ of the participants received a certificate.",["Each","Every","Much","Little"],"\"Each of the + số nhiều\" đúng; không có \"every of\"."],
["We received ____ applications for the position.",["many","much","little","a little"],"Danh từ đếm được số nhiều → many."],
["Only a ____ seats are still available.",["few","little","less","much"],"Đếm được số nhiều (seats) → a few."],
["Both proposals are good, but ____ of them is perfect.",["neither","none","either","nor"],"Hai thứ, nghĩa phủ định → neither."]]},
{id:'corr',name:'Paired Conjunctions',vi:'Liên từ tương quan',c:'var(--pink)',rule:'both … and · either … or · neither … nor · not only … but (also) · whether … or. Học theo cặp — từ đầu tiên cho biết từ thứ hai.',tip:'Quét câu tìm "từ cặp" trước khi chọn.',ex:'The job requires <b>both</b> experience <b>and</b> a degree.',qs:[
["The job requires both experience ____ a degree.",["and","or","nor","but"],"both … and."],
["You can pay either by card ____ in cash.",["or","and","nor","but also"],"either … or."],
["Neither the printer ____ the scanner is working.",["nor","or","and","but"],"neither … nor."],
["The product is not only cheap ____ reliable.",["but also","and also","or","nor"],"not only … but also."],
["____ the manager nor her assistant was informed.",["Neither","Either","Both","Not only"],"… nor → neither."],
["The hotel is popular with ____ tourists and business travelers.",["both","either","neither","not only"],"… and → both."]]},
{id:'trans',name:'Transition Words (Part 6)',vi:'Từ nối câu',c:'var(--sky)',rule:'Đối lập: however, nevertheless. Kết quả: therefore, as a result. Bổ sung: in addition, moreover. Ví dụ: for example. Thay thế: instead. Cảnh báo: otherwise (= nếu không thì).',tip:'Đọc câu ĐỨNG TRƯỚC chỗ trống — quan hệ giữa hai câu quyết định đáp án.',ex:'Sales fell in May. <b>However</b>, they recovered in June.',qs:[
["Sales fell in May. ____, they recovered in June.",["However","Therefore","For example","Similarly"],"Hai câu đối lập nhau."],
["The main road is closed. ____, please use the side entrance.",["Therefore","However","Nevertheless","Otherwise"],"Kết quả: vì đường chính bị đóng."],
["We offer many services. ____, we can design your website.",["For example","However","Instead","Nevertheless"],"Câu thứ hai là một ví dụ về dịch vụ."],
["Please arrive early. ____, you may not get a seat.",["Otherwise","Therefore","Moreover","Likewise"],"otherwise = nếu không thì."],
["The hotel is near the beach. ____, it has a great restaurant.",["In addition","However","Instead","Otherwise"],"Bổ sung thêm một ưu điểm."],
["The flight was canceled. ____, we took the train.",["Instead","Moreover","For instance","Similarly"],"Phương án thay thế cho kế hoạch bị hủy."]]},
{id:'coll',name:'Word Partners',vi:'Kết hợp từ (collocation)',c:'var(--lime)',rule:'Câu từ vựng Part 5 hay kiểm tra kết hợp từ — những từ thường đi với nhau: meet a deadline, make a decision, take effect, pay attention, refrain from, eligible for.',tip:'Học động từ + danh từ thành cụm, đừng học từng từ riêng lẻ.',ex:'The new policy will <b>take effect</b> on July 1.',qs:[
["Please ____ attention to the safety instructions.",["pay","make","take","do"],"pay attention = chú ý."],
["The company will ____ a decision next week.",["make","do","put","raise"],"make a decision = đưa ra quyết định."],
["The new policy will take ____ on July 1.",["effect","affect","place","part"],"take effect = bắt đầu có hiệu lực."],
["We worked late to ____ the deadline.",["meet","arrive","achieve","catch"],"meet a deadline = kịp hạn chót."],
["The hotel is ____ located near the airport.",["conveniently","comfortably","eagerly","previously"],"conveniently located = ở vị trí thuận tiện."],
["Please ____ from smoking in the building.",["refrain","avoid","prevent","stop"],"refrain from + V-ing = kiềm chế, không làm."],
["Employees are ____ for a bonus after one year.",["eligible","available","capable","possible"],"eligible for = đủ điều kiện nhận."]]},
{id:'art',name:'Articles',vi:'Mạo từ',c:'var(--sun)',rule:'Mạo từ a/an + danh từ đếm được số ít lần đầu nhắc đến. the + thứ đã xác định, duy nhất, hoặc đã nhắc trước đó. Không mạo từ + danh từ số nhiều/không đếm được nói chung, tên riêng, bữa ăn, môn thể thao.',tip:'Thấy "first/last/only/best" hoặc một thứ duy nhất → thường dùng the.',ex:'She is <b>an</b> engineer. <b>The</b> engineer from Seoul will visit us next week.',qs:[
["Ms. Lee is ____ engineer at our Seoul office.",["an","a","the","—"],"Trước \"engineer\" (âm /e/) dùng \"an\"; đây là lần đầu nhắc, chưa xác định."],
["Please send the report to ____ manager before noon.",["the","a","an","—"],"Người quản lý đã xác định (quản lý của bạn) → the."],
["We had ____ lunch with our clients yesterday.",["—","a","the","an"],"Bữa ăn nói chung không dùng mạo từ."],
["____ sun rises in the east.",["The","A","An","—"],"Mặt trời là duy nhất → the."],
["He plays ____ piano very well.",["the","a","an","—"],"Chơi nhạc cụ dùng the + tên nhạc cụ."],
["I need ____ information about the new product.",["—","an","a","the"],"\"Information\" không đếm được → không dùng a/an; ở đây nói chung nên không dùng the."]]},
{id:'adjed',name:'-ed vs -ing Adjectives',vi:'Tính từ -ed và -ing',c:'var(--pink)',rule:'-ed mô tả cảm xúc của người (bored = cảm thấy chán). -ing mô tả tính chất gây ra cảm xúc (boring = gây chán). Người + -ed; vật/việc + -ing.',tip:'Hỏi "bạn cảm thấy thế nào" → -ed; hỏi "nó thế nào" → -ing.',ex:'I was <b>bored</b> during the <b>boring</b> meeting.',qs:[
["The training session was very ____, so many staff lost focus.",["boring","bored","bore","bores"],"Buổi tập gây chán → -ing."],
["After the long flight, the passengers were ____ and tired.",["exhausted","exhausting","exhaust","exhausts"],"Hành khách cảm thấy kiệt sức → -ed."],
["The results of the survey were quite ____.",["surprising","surprised","surprise","surprises"],"Kết quả gây ngạc nhiên → -ing."],
["She was ____ to hear that she had won the award.",["delighted","delighting","delight","delights"],"Cô ấy cảm thấy vui mừng → -ed."],
["The instructions were ____, so nobody knew what to do.",["confusing","confused","confuse","confuses"],"Hướng dẫn gây khó hiểu → -ing."],
["We were ____ by the sudden change in the schedule.",["annoyed","annoying","annoy","annoys"],"Chúng tôi cảm thấy bực mình → -ed."]]},
{id:'rep',name:'Reported Speech',vi:'Lời tường thuật',c:'var(--sky)',rule:'Lời tường thuật lùi thì: present simple → past simple; will → would; can → could; have done → had done. now → then; today → that day; yesterday → the day before. Câu hỏi Yes/No → asked if/whether + mệnh đề (không đảo ngữ).',tip:'Động từ tường thuật ở quá khứ → thì trong mệnh đề lùi một bậc.',ex:'"I will call you," she said. → She said (that) she <b>would</b> call me.',qs:[
["Direct: \"I am busy today.\" → He said that he ____ busy that day.",["was","is","will be","has been"],"Lùi thì: am → was; today → that day."],
["Direct: \"We will finish the report tomorrow.\" → They said they ____ the report the next day.",["would finish","will finish","finish","finished"],"will → would."],
["Direct: \"Did you attend the meeting?\" → She asked me ____ the meeting.",["if I had attended","did I attend","if I attend","that I attended"],"Câu hỏi Yes/No → asked if + lùi thì (did attend → had attended)."],
["Direct: \"I have just finished the budget.\" → He said he ____ the budget.",["had just finished","has just finished","just finishes","will just finish"],"have finished → had finished."],
["Direct: \"Where is the new office?\" → He asked where ____.",["the new office was","is the new office","was the new office","the new office is"],"Câu hỏi Wh- → giữ từ hỏi, không đảo ngữ, lùi thì."],
["Direct: \"You can leave early today.\" → The manager said we ____ early that day.",["could leave","can leave","may leave","leave"],"can → could."]]},
{id:'modal',name:'Modal Verbs',vi:'Động từ khuyết thiếu',c:'var(--lime)',rule:'must = bắt buộc; have to = bắt buộc (quy định); should = nên; may/might = có thể; mustn\'t = cấm; don\'t have to = không cần (không bắt buộc).',tip:'mustn\'t (cấm hẳn) ≠ don\'t have to (không cần làm).',ex:'You <b>must</b> wear a helmet. You <b>don\'t have to</b> come early.',qs:[
["Employees ____ wear safety helmets in the factory at all times.",["must","may","might","could"],"Quy định bắt buộc → must."],
["You ____ smoke in the office. It is strictly forbidden.",["mustn't","don't have to","needn't","shouldn't"],"Cấm hẳn → mustn't."],
["The meeting is optional, so you ____ attend if you are busy.",["don't have to","mustn't","can't","shouldn't"],"Không bắt buộc → don't have to."],
["Visitors ____ show their ID cards at the front desk.",["have to","mustn't","might","would"],"Quy định bắt buộc → have to."],
["It ____ rain this afternoon, so bring an umbrella just in case.",["might","must","should","has to"],"Khả năng xảy ra → might."],
["You ____ finish the report today; the deadline is Friday.",["don't have to","mustn't","must","can't"],"Hạn là thứ Sáu nên hôm nay chưa cần xong → don't have to."]]},
{id:'phr',name:'Phrasal Verbs',vi:'Cụm động từ',c:'var(--tang)',rule:'put off = hoãn; look into = điều tra; run out of = hết (cạn); set up = thành lập; take over = tiếp quản; call off = hủy; put up with = chịu đựng; turn down = từ chối.',tip:'Trong Part 5, nghĩa của cụm động từ thường quan trọng hơn ngữ pháp.',ex:'We had to <b>put off</b> the launch because the product was not ready.',qs:[
["The meeting was ____ because the director was ill.",["called off","called on","called in","called out"],"Hủy cuộc họp → call off."],
["We have ____ printer paper. Please order more.",["run out of","run into","run over","run by"],"Hết giấy → run out of."],
["The manager promised to ____ the complaint about the late delivery.",["look into","look after","look for","look up"],"Điều tra khiếu nại → look into."],

{id:'emb',name:'Embedded Questions',vi:'Câu hỏi gián tiếp',c:'var(--sun)',rule:'Câu hỏi gián tiếp: không đảo ngữ, không dùng do/does/did. Dùng: Can you tell me + where/when/how... + chủ ngữ + động từ. Câu hỏi Yes/No → if/whether + chủ ngữ + động từ.',tip:'Sau "Do you know / Could you tell me" luôn là thứ tự chủ ngữ + động từ, không đảo.',ex:'Do you know <b>where the meeting is</b>? (không phải "where is the meeting")',qs:[
["Could you tell me ____ the conference room is?",["where","where is","where does","where did"],"Câu hỏi gián tiếp: không đảo → where the conference room is."],
["Do you know ____ the manager arrives?",["when","when does","when is","when will"],"Khi nào quản lý đến → when the manager arrives (không đảo, không trợ động từ)."],
["I wonder ____ the shipment has arrived.",["whether","whether has","whether does","whether is"],"whether + chủ ngữ + động từ → whether the shipment has arrived."],
["Please let me know ____ I should send the invoice.",["where","where should","where do","where does"],"where I should send — chủ ngữ + động từ khuyết thiếu + động từ chính."],
["Can you tell me ____ the training starts?",["what time","what time does","what time is","what time did"],"what time the training starts (không đảo)."],
["I don't know ____ for the position.",["who applied","who did apply","who does apply","who is applied"],"who applied — mệnh đề danh ngữ, không đảo, không trợ động từ."]]},
{id:'det',name:'Determiners',vi:'Từ hạn định',c:'var(--pink)',rule:'some + câu khẳng định/lời mời; any + câu phủ định/câu hỏi; no + danh từ (không cần not); each/every + danh từ số ít; both + số nhiều; few = ít (tiêu cực), a few = một vài (tích cực).',tip:'any đi với phủ định và câu hỏi; some đi với khẳng định và lời đề nghị.',ex:'We have <b>some</b> time. We don\'t have <b>any</b> time.',qs:[
["We don't have ____ coffee left. Please buy some.",["any","some","a","the"],"Câu phủ định → any."],
["Would you like ____ tea before the meeting?",["some","any","no","none"],"Lời mời → some."],
["____ employee must attend the safety training.",["Every","All","Both","Each of"],"Every + danh từ số ít. \"Each of\" phải đi với \"the employees\"."],
["____ of the two proposals is perfect, but the second one is better.",["Neither","None","No","Either"],"Hai đề xuất, không cái nào hoàn hảo → Neither of the two."],
["Only ____ people came to the workshop, so we may cancel the next one.",["few","a few","little","a little"],"few = quá ít, mang nghĩa tiêu cực → có thể hủy."],
["The manager gave ____ staff member a copy of the new policy.",["each","every of","all","both"],"each + danh từ số ít → each staff member."]]},
{id:'caus',name:'Causative Have / Get',vi:'Cấu trúc nhờ vả have/get',c:'var(--sky)',rule:'have + người + động từ nguyên mẫu (nhờ ai làm gì). get + người + to + động từ. have/get + vật + quá khứ phân từ (để cái gì được làm bởi người khác).',tip:'have + tân ngữ + V3 = bị động (nhờ người khác làm hộ).',ex:'I <b>had my car washed</b> yesterday. She <b>got the technician to fix</b> the printer.',qs:[
["We ____ the air conditioner repaired last week.",["had","made","let","got to"],"had + vật + V3 → had the air conditioner repaired."],
["She ____ her assistant book the flights for the trip.",["had","had to","has","is having"],"have + người + động từ nguyên mẫu → had her assistant book."],
["The company ____ its website redesigned by a local agency.",["got","made","let","had to"],"get + vật + V3 → got its website redesigned."],
["Please ____ the IT team check the network today.",["have","having","has","had to"],"Mệnh lệnh với have + người + động từ nguyên mẫu → have the IT team check."],
["He ____ his suit cleaned before the interview.",["had","made","did","let"],"had + vật + V3 → had his suit cleaned."],
["We should ____ a professional translate the contract.",["have","had","having","has"],"have + người + động từ nguyên mẫu → have a professional translate."]]}
];

{p:4,type:'Thông báo nội bộ',lines:[

{p:4,type:'Quảng cáo',lines:[

{p:3,type:'Làm thủ tục sân bay',lines:[

['W',"Of course. Here you are. I'd like a window seat if possible."],
['M',"Let me check. I'm afraid the flight is full, but I can offer you an aisle seat in row 14. Your bag is also two kilos over the limit, so there is a small extra fee."],

{p:3,type:'Đổi trả hàng',lines:[

["What does the man ask to see?","Her receipt","Her ID card","The price tag","Her credit card","\"Do you have your receipt with you?\""],
["What does the man promise?","A full refund within three business days","A replacement jacket today","A discount on her next visit","A free cleaning service","\"we can give you a full refund… within three business days.\""]]},

/* ---- build data ---- */
const WORDS=[],WMAP={};
TOPICS.forEach(t=>{t.words=[];t.raw.trim().split('\n').forEach((l,i)=>{const [w,p,vi,ex]=l.split('|').map(s=>s.trim());const o={id:t.id+'-'+i,w,p,vi,ex,t:t.id};o.re=new RegExp('\\b'+w.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');o.cloze=o.re.test(ex);t.words.push(o);WORDS.push(o);WMAP[o.id]=o})});

const GQ=[],GMAP={};
GRAMMAR.forEach(g=>g.qs.forEach((q,i)=>{const o={id:g.id+'-'+i,cat:g.id,s:q[0],opts:q[1],exp:q[2]};GQ.push(o);GMAP[o.id]=o}));

/* ---- state ---- */
const KEY='toeicArcade.v1';
const DEF=()=>({xp:0,days:{},streak:0,last:'',w:{},g:{},k:{v:[0,0],g:[0,0],l:[0,0],p:[0,0],s:[0,0],r:[0,0]},bank:{},cleared:0,best:{},pt:{},badges:{},maxCombo:0,set:{sound:true,accent:'mix',rate:.95,goal:100,scope:'all',exam:false}});
function hydrate(o){const d=DEF();return Object.assign(d,o,{set:Object.assign(d.set,o.set||{}),k:Object.assign(d.k,o.k||{})})}
function load(){try{const r=localStorage.getItem(KEY);if(r)return hydrate(JSON.parse(r))}catch(e){}return DEF()}
let S=load();
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},120)}

/* ---- sound ---- */
let AC=null,booted=false;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)try{AC=new C()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d,type='triangle',vol=.14,delay=0,slide){if(!S.set.sound||!booted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const SFX={
 tap:()=>tone(660,.05,'square',.035),
 ok:()=>{tone(784,.1);tone(1175,.18,'triangle',.14,.08)},
 bad:()=>tone(240,.3,'sawtooth',.07,0,110),
 combo:n=>[523,659,784,1047].slice(0,Math.min(4,1+Math.floor(n/3))).forEach((f,i)=>tone(f*1.5,.09,'square',.045,.16+i*.06)),
 flip:()=>tone(300,.12,'sine',.08,0,700),
 level:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.24,'triangle',.14,i*.1)),
 win:()=>[659,784,988,1319].forEach((f,i)=>tone(f,.16,'square',.05,i*.09)),
 match:()=>tone(880,.1,'sine',.12,0,1320)
};
function toggleSound(){S.set.sound=!S.set.sound;save();updateTop();if(S.set.sound)SFX.ok()}

/* ---- speech ---- */
const TTS='speechSynthesis' in window;
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){}}
if(TTS){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
const ACCL={'en-US':'Mỹ','en-GB':'Anh','en-AU':'Úc','en-CA':'Canada'};
function pickAccent(){return S.set.accent==='mix'?pick(Object.keys(ACCL),1)[0]:S.set.accent}
const FEM=/female|samantha|karen|serena|victoria|moira|tessa|fiona|zira|susan|libby|sonia|natasha|aria|jenny|hazel|catherine|kate|allison|ava|joanna|salli|kimberly|emma|amy|olivia|google us english|google uk english female/i;
const MAL=/\bmale|daniel|alex|fred|oliver|guy|ryan|thomas|david|mark|george|james|rishi|arthur|aaron|gordon|eric|brian|matthew|joey|justin|william|liam|google uk english male/i;
function voicesFor(lang){const n=l=>(l||'').replace('_','-').toLowerCase();let v=VOICES.filter(x=>n(x.lang)===lang.toLowerCase());if(!v.length)v=VOICES.filter(x=>n(x.lang)==='en-us');if(!v.length)v=VOICES.filter(x=>n(x.lang).startsWith('en'));return v}
function voiceFor(lang,g){const v=voicesFor(lang);if(!v.length)return null;const good=x=>/natural|neural|google|premium|enhanced/i.test(x.name);
  let pool=v;if(g==='W')pool=v.filter(x=>FEM.test(x.name));else if(g==='M'||g==='N')pool=v.filter(x=>MAL.test(x.name)&&!FEM.test(x.name));
  if(!pool.length)pool=v;if(g==='N'&&pool.length>1)return pool[1];return pool.find(good)||pool[0]}
const PITCH={W:1.15,M:.9,N:.78};
function speak(parts,lang,done){if(!TTS){done&&done();return}try{speechSynthesis.cancel()}catch(e){}if(!Array.isArray(parts))parts=[parts];lang=lang||(S.set.accent==='mix'?'en-US':S.set.accent);
  parts=parts.flatMap(p=>{const txt=typeof p==='string'?p:p.t,g=typeof p==='string'?null:p.s;return txt.split(/(?<=[.?!])\s+(?=[A-Z"“])/).map(t=>g?{t,s:g}:t)});
  parts.forEach((p,i)=>{const txt=typeof p==='string'?p:p.t,g=typeof p==='string'?null:p.s;const u=new SpeechSynthesisUtterance(txt);u.lang=lang;const v=voiceFor(lang,g);if(v)u.voice=v;u.rate=S.set.rate;if(g)u.pitch=PITCH[g]||1;if(i===parts.length-1&&done){u.onend=done;u.onerror=done}try{speechSynthesis.speak(u)}catch(e){done&&done()}})}
function stopSpeak(){if(TTS)try{speechSynthesis.cancel()}catch(e){}}
function sayW(id){const w=WMAP[id];if(w)speak(w.w)}

/* ---- fx ---- */
const fx=$('#fx'),cx=fx.getContext('2d');let bits=[],raf=0;
function confetti(n=120){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=devicePixelRatio||1;fx.width=innerWidth*r;fx.height=innerHeight*r;const cols=['#FFCC33','#FF4F9A','#35C4F0','#9BE22E','#FF7A2F','#8C6BFF'];for(let i=0;i<n;i++)bits.push({x:fx.width/2+(Math.random()-.5)*fx.width*.4,y:fx.height*.38,vx:(Math.random()-.5)*18*r,vy:(-Math.random()*17-5)*r,s:(7+Math.random()*8)*r,c:cols[i%6],a:Math.random()*6,va:(Math.random()-.5)*.4,life:0,g:.5*r});if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,fx.width,fx.height);bits=bits.filter(p=>p.life<170&&p.y<fx.height+50);bits.forEach(p=>{p.life++;p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});raf=bits.length?requestAnimationFrame(tick):0}
function toast(msg,cls=''){const d=document.createElement('div');d.className='toast '+cls;d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),2300)}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---- progress ---- */
const xpFor=n=>50*n*(n-1);
function levelOf(xp){let n=1;while(xp>=xpFor(n+1))n++;return n}
const titleOf=n=>LEVELS[Math.min(n-1,LEVELS.length-1)];
function streakNow(){return (S.last===today()||S.last===yesterday())?S.streak:0}
function todayXP(){return S.days[today()]||0}
function addXP(n){
  const t=today(),lv0=levelOf(S.xp),g0=todayXP();
  if(S.last!==t){S.streak=(S.last===yesterday())?S.streak+1:1;S.last=t}
  S.xp+=n;S.days[t]=(S.days[t]||0)+n;
  const lv1=levelOf(S.xp);
  if(lv1>lv0){setTimeout(()=>{SFX.level();confetti(170);toast('Thăng chức! Bạn là '+titleOf(lv1),'lime')},350)}
  if(g0<S.set.goal&&todayXP()>=S.set.goal){setTimeout(()=>{toast('Hoàn thành mục tiêu hôm nay!','pink');confetti(80)},700)}
  checkBadges();updateTop();save();
}
const IV=[0,1,2,4,7,15];
function wstat(id){return S.w[id]||(S.w[id]={b:0,d:0,r:0,x:0})}
function markWord(id,ok){const s=wstat(id);if(ok){s.r++;s.b=Math.min(5,s.b+1);s.d=Date.now()+IV[s.b]*DAY;bankHit('w:'+id)}else{s.x++;s.b=1;s.d=Date.now();addBank('w:'+id)}S.k.v[ok?0:1]++;save()}
function addBank(k){const b=S.bank[k];if(b){b.n++;b.b=0}else S.bank[k]={n:1,b:0,t:Date.now()}}
function bankHit(k){const b=S.bank[k];if(!b)return;b.b++;if(b.b>=2){delete S.bank[k];S.cleared++;toast('Đã xóa khỏi Kho ôn tập','lime')}}
function partOfKey(k){const m=(k||'').match(/^(\w+):(.+)$/);if(!m)return 0;const [,t,id]=m;if(t==='p1')return 1;if(t==='p2')return 2;if(t==='g')return 5;if(t==='c')return (CONV[+id.split('-')[0]]||{}).p||0;if(t==='r')return (READ[+id.split('-')[0]]||{}).p||0;return 0}
function record(it,ok){
  {const pt=partOfKey(it.key);if(pt){S.pt=S.pt||{};const a=S.pt[pt]||(S.pt[pt]=[0,0]);a[ok?0:1]++}}
  if(it.kind==='w')markWord(it.ref,ok);
  else{const k={g:'g',p1:'l',p2:'l',c:'l',pp:'p',st:'s',r:'r'}[it.kind];S.k[k][ok?0:1]++;if(it.kind==='g'){const c=S.g[it.cat]||(S.g[it.cat]=[0,0]);c[ok?0:1]++}if(ok)bankHit(it.key);else addBank(it.key)}
  checkBadges();save();
}
function dueWords(){const now=Date.now();return WORDS.filter(w=>{const s=S.w[w.id];return s&&s.b>0&&s.b<5&&s.d<=now&&!S.bank['w:'+w.id]})}
function dueCount(){return Object.keys(S.bank).length+dueWords().length}
const mastered=()=>WORDS.filter(w=>(S.w[w.id]?.b||0)>=4).length;
const met=()=>Object.keys(S.w).filter(id=>WMAP[id]).length;
const acc=a=>a[0]+a[1]?Math.round(100*a[0]/(a[0]+a[1]))+'%':'—';
function award(id){if(S.badges[id])return;S.badges[id]=Date.now();const b=BADGES.find(x=>x.id===id);setTimeout(()=>{toast('Huy hiệu mới: '+b.name,'pink');SFX.win()},500);save()}
function checkBadges(){
  if(S.k.v[0]+S.k.g[0]+S.k.l[0]+S.k.p[0]+S.k.s[0]>0)award('first');
  if(S.maxCombo>=10)award('combo10');
  if(streakNow()>=3)award('streak3');if(streakNow()>=7)award('streak7');
  if(met()>=50)award('words50');if(mastered()>=50)award('master50');
  if(S.k.g[0]>=100)award('gram100');if(S.k.l[0]>=50)award('ear50');
  if(S.cleared>=20)award('bank20');if(levelOf(S.xp)>=5)award('lv5');
}
function updateTop(){
  const n=levelOf(S.xp),a=xpFor(n),b=xpFor(n+1);
  $('#lvpill').textContent='Cấp '+n;
  $('#streakpill').textContent=streakNow()+'🔥';
  $('#xpbar i').style.width=Math.min(100,(S.xp-a)/(b-a)*100)+'%';
  $('#sndbtn').innerHTML=S.set.sound?ICON.on:ICON.off;
  const d=dueCount(),nb=$('#navdue');nb.hidden=!d;nb.textContent=d>99?'99+':d;
}

/* ---- question builders ---- */
function mc(correct,ds){let opts=shuffle([correct,...ds]);if(opts.every(o=>/^\[\d\]$/.test(o))||opts.every(o=>/^\$?\d/.test(o)))opts=opts.slice().sort((x,y)=>parseFloat(x.replace(/[^\d.]/g,''))-parseFloat(y.replace(/[^\d.]/g,'')));return{opts,ans:opts.indexOf(correct)}}
const norm1=t=>t.trim().replace(/^(sự|việc|cuộc|người|khoản)\s+/,'');
function senses(w){return w._s||(w._s=w.vi.toLowerCase().replace(/\(.*?\)/g,'').split(/[,;]/).map(norm1).filter(x=>x.length>1))}
function clash(a,b){if(a.w.toLowerCase()===b.w.toLowerCase())return true;const A=senses(a),B=senses(b);return A.some(x=>B.some(y=>x===y||x.startsWith(y+' ')||y.startsWith(x+' ')))}
function distract(w,field,n=3,other=false){const out=[],seen=new Set([w[field].toLowerCase()]);const sameT=WORDS.filter(x=>x.t===w.t&&x.p===w.p),othT=WORDS.filter(x=>x.t!==w.t&&x.p===w.p);const tiers=other?[shuffle(othT),shuffle(sameT),shuffle(WORDS)]:[shuffle(sameT),shuffle(othT),shuffle(WORDS)];for(const tier of tiers)for(const x of tier){if(out.length>=n)return out;const v=x[field];if(!seen.has(v.toLowerCase())&&!clash(w,x)){seen.add(v.toLowerCase());out.push(v)}}return out}
function wBase(w){return{kind:'w',ref:w.id,key:'w:'+w.id,tag:TMAP[w.t].vi,sayAfter:w.w,explain:`<b>${esc(w.w)}</b> <span class="chip">${posL(w.p)}</span> = ${esc(w.vi)}<br><i>${esc(w.ex)}</i>`,sum:w.w+' = '+w.vi}}
function itemMeaning(w){return{...wBase(w),...mc(w.vi,distract(w,'vi')),part:'Từ vựng · Chọn nghĩa',prompt:`<div class="big">${esc(w.w)}</div><div class="muted" style="margin-top:8px;font-size:1rem;font-weight:600"><span class="chip">${posL(w.p)}</span> Từ này nghĩa là gì?</div>`,sayFirst:w.w}}
function itemReverse(w){return{...wBase(w),...mc(w.w,distract(w,'w')),part:'Từ vựng · Chọn từ',prompt:`<div class="eyebrow muted">Từ nào có nghĩa là…</div><div class="big" style="font-size:1.75rem;margin-top:6px">${esc(w.vi)}</div>`}}
function itemCloze(w){return{...wBase(w),...mc(w.w,distract(w,'w',3,true)),part:'Từ vựng · Điền vào câu',prompt:esc(w.ex).replace(w.re,'<span class="blank"></span>')}}
function wordItem(w){const f=[itemMeaning,itemReverse];if(w.cloze)f.push(itemCloze);return pick(f,1)[0](w)}
function itemGram(q){const g=GCAT[q.cat];return{kind:'g',cat:q.cat,key:'g:'+q.id,part:'Part 5 · Điền câu',tag:g.vi,...mc(q.opts[0],q.opts.slice(1)),prompt:esc(q.s).replace('____','<span class="blank"></span>'),explain:esc(q.exp)+`<div style="margin-top:6px;font-size:.85rem" class="muted">Quy tắc: ${esc(g.rule)}</div>`,sayAfter:q.s.replace('____',q.opts[0]),sum:q.s.replace('____','['+q.opts[0]+']')}}
function itemP1(i){const r=P1[i];return{kind:'p1',key:'p1:'+i,part:'Part 1 · Mô tả tranh',tag:'Nghe',accent:pickAccent(),listen:true,hide:true,...mc(r[1],r.slice(2,5)),prompt:`<div class="scene" role="img" aria-label="Tranh cho câu hỏi">${r[0]}</div>`,explain:'Mẹo: '+esc(r[5]),sum:'Part 1: '+r[1]}}
function itemP2(i){const r=P2[i];return{kind:'p2',key:'p2:'+i,part:'Part 2 · Hỏi – Đáp',tag:'Nghe',accent:pickAccent(),listen:true,hide:true,q:r[0],...mc(r[1],[r[2],r[3]]),prompt:`<div class="muted" style="font-size:.95rem;font-weight:600">Nghe một câu hỏi và ba câu đáp. Chọn câu đáp phù hợp nhất.</div><div id="qtext" hidden style="margin-top:8px">“${esc(r[0])}”</div>`,explain:'Soi bẫy: '+esc(r[4]),sum:r[0]+' → '+r[1]}}
function convLines(c){const nar=pick(['M','W'],1)[0];return c.lines.map(([s,t])=>({s:c.p===4?nar:s,t}))}
const SPK={M:'Nam',W:'Nữ',N:'Nam 2'};
function transcript(c,lines){return`<div class="tscript">${lines.map((l,i)=>`<div><b>${c.p===4?'Người nói':SPK[c.lines[i][0]]}</b> ${esc(l.t)}</div>`).join('')}</div>`}
function itemConv(ci,qi){const c=CONV[ci],q=c.qs[qi],lines=convLines(c);return{kind:'c',key:'c:'+ci+'-'+qi,part:'Part '+c.p+' · '+(c.p===3?'Hội thoại':'Bài nói'),tag:c.type,accent:pickAccent(),listen:true,hide:false,lines,...mc(q[1],q.slice(2,5)),
  prompt:`<div class="muted" style="font-size:.9rem;font-weight:600">Nghe ${c.p===3?'đoạn hội thoại':'bài nói'} rồi trả lời câu hỏi.</div>${c.graphic?`<div class="tbl graphic">${c.graphic}</div>`:''}<div style="margin-top:10px">${esc(q[0])}</div>`,
  explain:esc(q[5])+`<details style="margin-top:10px;box-shadow:none;border-width:2px"><summary style="padding:8px 12px;font-weight:800">Xem lời thoại</summary><div style="padding:0 10px 10px">${transcript(c,lines)}</div></details>`,sum:q[0]+' → '+q[1]}}
function docsHTML(r){return r.docs.map(d=>`<div class="doc"><div class="dh">${esc(d.h)}</div><div class="db">${esc(d.b).replace(/\{(\d)\}/g,(m,n)=>`<span class="gap" data-g="${n}">(${n})</span>`)}</div></div>`).join('')}
const rLabel=(r,qi)=>r.qs[qi][0]||('Chỗ trống ('+(qi+1)+')'+(r.qs[qi][1].length>30?' · chọn câu phù hợp':''));
function itemRead(ri,qi){const r=READ[ri],q=r.qs[qi];return{kind:'r',key:'r:'+ri+'-'+qi,part:'Part '+r.p+' · '+(r.p===6?'Điền đoạn văn':'Đọc hiểu'),tag:r.type,...mc(q[1],q.slice(2,5)),prompt:`<div class="docs">${docsHTML(r)}</div><div style="margin-top:12px">${esc(rLabel(r,qi))}</div>`,explain:esc(q[5]),sum:(q[0]||r.type+' ('+(qi+1)+')')+' → '+q[1]}}
function itemPara(i){const r=PARA[i];const ds=pick(PARA.filter((x,j)=>j!==i),3).map(x=>x[1]);return{kind:'pp',key:'pp:'+i,part:'Diễn đạt lại · Part 3, 4, 7',tag:'Cụm từ',...mc(r[1],ds),prompt:`<div class="eyebrow muted">Gần nghĩa nhất với…</div><div class="big" style="font-size:1.8rem;margin-top:6px">“${esc(r[0])}”</div>`,sayFirst:r[0].replace(/\(.*?\)/g,''),explain:`<b>${esc(r[0])}</b> = ${esc(r[1])} · <i>${esc(r[2])}</i>`,sum:r[0]+' = '+r[1]}}
function itemStrat(i){const r=STRAT[i];return{kind:'st',key:'st:'+i,part:'Chiến lược làm bài',tag:'Chiến lược',...mc(r[1],r.slice(2,5)),prompt:esc(r[0]),explain:esc(r[5]),sum:r[0]+' → '+r[1]}}
function itemFromKey(k){const m=k.match(/^(\w+):(.+)$/);if(!m)return null;const [,t,id]=m;
  if(t==='w')return WMAP[id]?wordItem(WMAP[id]):null;if(t==='g')return GMAP[id]?itemGram(GMAP[id]):null;
  if(t==='p1')return P1[+id]?itemP1(+id):null;if(t==='p2')return P2[+id]?itemP2(+id):null;
  if(t==='c'){const [a,b]=id.split('-').map(Number);return CONV[a]&&CONV[a].qs[b]?itemConv(a,b):null}
  if(t==='r'){const [a,b]=id.split('-').map(Number);return READ[a]&&READ[a].qs[b]?itemRead(a,b):null}
  if(t==='pp')return PARA[+id]?itemPara(+id):null;if(t==='st')return STRAT[+id]?itemStrat(+id):null;return null}
function describe(k){const m=k.match(/^(\w+):(.+)$/);if(!m)return null;const [,t,id]=m;
  if(t==='w'){const w=WMAP[id];return w&&{t:w.w,s:w.vi+' · '+TMAP[w.t].vi,f:'w'}}
  if(t==='g'){const q=GMAP[id];return q&&{t:q.s.replace('____','['+q.opts[0]+']'),s:'Part 5 · '+GCAT[q.cat].vi,f:'g'}}
  if(t==='p1'){const r=P1[+id];return r&&{t:r[0]+'  '+r[1],s:'Part 1 · Mô tả tranh',f:'l'}}
  if(t==='p2'){const r=P2[+id];return r&&{t:r[0],s:'Part 2 · Đáp án: '+r[1],f:'l'}}
  if(t==='c'){const [a,b]=id.split('-').map(Number);const c=CONV[a],q=c&&c.qs[b];return q&&{t:q[0],s:'Part '+c.p+' · '+c.type+' · Đáp án: '+q[1],f:'l'}}
  if(t==='r'){const [a,b]=id.split('-').map(Number);const r=READ[a],q=r&&r.qs[b];return q&&{t:q[0]||r.type+' · chỗ trống ('+(b+1)+')',s:'Part '+r.p+' · Đáp án: '+q[1],f:'r'}}
  if(t==='pp'){const r=PARA[+id];return r&&{t:r[0],s:'Diễn đạt lại · '+r[1],f:'p'}}
  if(t==='st'){const r=STRAT[+id];return r&&{t:r[0],s:'Chiến lược · '+r[1],f:'p'}}return null}

/* ---- selection ---- */
function scopeWords(scope){scope=scope||S.set.scope;return scope==='all'||!TMAP[scope]?WORDS:TMAP[scope].words}
function prioritize(ws,n){const now=Date.now();const sc=w=>{const s=S.w[w.id];if(!s)return 1+Math.random();if(s.b<5&&s.d<=now)return Math.random()*.5;return 2+s.b+Math.random()};return ws.map(w=>[sc(w),w]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1])}
const idx=n=>Array.from({length:n},(_,i)=>i);
function startBlitz(sc){runQuiz({id:'blitz',title:'Meaning Blitz',items:shuffle(prioritize(scopeWords(sc),10)).map(w=>Math.random()<.6?itemMeaning(w):itemReverse(w)),again:()=>startBlitz(sc)})}
function startSnap(sc){let ws=scopeWords(sc).filter(w=>w.cloze);runQuiz({id:'snap',title:'Sentence Snap',items:shuffle(prioritize(ws,10)).map(itemCloze),again:()=>startSnap(sc)})}
function startGrammar(cat){const pool=cat?GQ.filter(q=>q.cat===cat):GQ;runQuiz({id:cat?'g-'+cat:'gram',title:cat?GCAT[cat].vi:'Grammar Arena',items:pick(pool,cat?pool.length:12).map(itemGram),back:cat?'learn':'play',again:()=>startGrammar(cat)})}
function startP1(){runQuiz({id:'p1',title:'Photo Talk',items:pick(idx(P1.length),6).map(itemP1),again:startP1})}
function startP2(){runQuiz({id:'p2',title:'Quick Reply',items:pick(idx(P2.length),10).map(itemP2),again:startP2})}
function startPara(){runQuiz({id:'para',title:'Paraphrase Pop',items:pick(idx(PARA.length),10).map(itemPara),again:startPara})}
function startStrat(){runQuiz({id:'strat',title:'Strategy Check',items:pick(idx(STRAT.length),10).map(itemStrat),back:'guide',again:startStrat})}
function startMix(){const ci=pick(idx(CONV.length),1)[0];const items=[...prioritize(WORDS,4).map(wordItem),...pick(GQ,2).map(itemGram),...pick(idx(P2.length),1).map(itemP2),(()=>{const ri=pick(idx(READ.length),1)[0];return itemRead(ri,pick(idx(READ[ri].qs.length),1)[0])})(),itemConv(ci,pick(idx(CONV[ci].qs.length),1)[0]),...pick(idx(PARA.length),1).map(itemPara)];runQuiz({id:'mix',title:'Daily Mix',items:shuffle(items),back:'home',again:startMix})}
function startMini(){const byP=(src,p)=>idx(src.length).filter(i=>src[i].p===p);const one=(arr,f,src)=>arr.map(i=>f(i,pick(idx(src[i].qs.length),1)[0]));
  const items=[...pick(idx(P1.length),3).map(itemP1),...pick(idx(P2.length),5).map(itemP2),...one(pick(byP(CONV,3),2),itemConv,CONV),...one(pick(byP(CONV,4),2),itemConv,CONV),...pick(GQ,8).map(itemGram),...one(pick(byP(READ,6),2),itemRead,READ),...one(pick(byP(READ,7),4),itemRead,READ)];
  runQuiz({id:'mini',title:'Thi thử mini',items,exam:true,back:'play',again:startMini})}
function startReview(f){f=f||'all';let keys=Object.entries(S.bank).filter(([k])=>{const d=describe(k);return d&&(f==='all'||d.f===f)}).sort((a,b)=>b[1].n-a[1].n||a[1].t-b[1].t).map(x=>x[0]);
  if(f==='all'||f==='w')keys=keys.concat(dueWords().map(w=>'w:'+w.id));
  keys=keys.slice(0,15);const items=keys.map(itemFromKey).filter(Boolean);
  if(!items.length){toast('Chưa có gì để ôn. Hãy chơi một trò trước nhé!');return}
  runQuiz({id:'review',title:'Review Rush',items:shuffle(items),back:'review',again:()=>startReview(f)})}

const PRAISE=['Hay lắm!','Chính xác!','Tuyệt!','Xuất sắc!','Đúng rồi!','Quá đỉnh!','Chuẩn!'];
VIEWS.quiz=cfg=>{
  const items=cfg.items.filter(Boolean);let i=0,score=0,combo=0,best=0,xp=0,missed=[],locked=false,showText=!TTS;const EX=!!cfg.exam,t0=Date.now(),res=[];let tmr=0;

    <div class="card qcard enter"><div class="qpart"><span class="eyebrow" style="color:var(--pmuted)">${esc(it.part)}</span><span class="chip">${esc(it.tag)}${it.accent?' · giọng '+ACCL[it.accent]:''}</span></div>

    <div id="fb"></div></div>`;

  window.Q={
    play(){const it=items[i];if(!it.listen)return;let parts;if(it.lines)parts=it.lines;else if(it.kind==='p2')parts=[it.q,...it.opts.map((o,k)=>LETTERS[k]+'. '+o)];else parts=it.opts.map((o,k)=>LETTERS[k]+'. '+o);const pb=$('#pb');pb&&pb.classList.add('speaking');speak(parts,it.accent,()=>{const p=$('#pb');p&&p.classList.remove('speaking')})},
    toggle(){showText=true;reveal()},
    say(){const it=items[i];speak(it.sayFirst||it.sayAfter,it.accent)},
    sayAfter(){const it=items[i];if(it.lines)return speak(it.lines,it.accent);speak(it.sayAfter||it.q||it.opts[it.ans],it.accent)},
    pick(k){if(locked)return;locked=true;const it=items[i],ok=k===it.ans;

      else{combo=0;SFX.bad();buzz(90);missed.push(it);$('#combo').textContent=''}

      <div class="row" style="margin-top:14px;justify-content:flex-end">${TTS?`<button class="btn sm" style="--c:var(--paper2)" onclick="Q.sayAfter()">🔊 Nghe lại</button>`:''}<button class="btn c-lime" id="nextb" onclick="Q.next()">${i+1<items.length?'Tiếp →':'Xem kết quả'}</button></div>`;
      if(ok&&it.kind==='w')setTimeout(()=>speak(it.sayAfter),350);

    },
    next(){stopSpeak();i++;if(i>=items.length)finish();else{render();window.scrollTo(0,0)}},
    again(){cfg.again?cfg.again():go(cfg.back||'play')}
  };
  function finish(){
    if(EX)return finishExam();
    const n=items.length,pct=score/n;let bonus=0;
    if(pct>=.8){bonus=20;addXP(bonus);xp+=bonus}

    if(S.best[cfg.id]==null||pct>S.best[cfg.id])S.best[cfg.id]=pct;save();

    app.innerHTML=resultCard(cfg.title,`${score}/${n}`,msg,[[Math.round(pct*100)+'%','ĐỘ CHÍNH XÁC'],['+'+xp,'XP'],['×'+best,'COMBO CAO NHẤT']],missed.map(m=>m.sum),`Q.again()`,`go('${cfg.back||'play'}')`);

    const L=res.filter(r=>['p1','p2','c'].includes(r.it.kind)),Rd=res.filter(r=>!['p1','p2','c'].includes(r.it.kind));const c=a=>a.filter(r=>r.ok).length;
    const byPart={};res.forEach(r=>{const pt=partOfKey(r.it.key);if(!pt)return;const a=byPart[pt]||(byPart[pt]=[0,0]);a[0]+=r.ok?1:0;a[1]++});
    if(pct>=.8)xp+=30;if(xp)addXP(xp);if(S.best[cfg.id]==null||pct>S.best[cfg.id])S.best[cfg.id]=pct;save();if(pct>=.6)SFX.win();if(pct>=.8)confetti(140);
    const msg=pct>=.9?'Xuất sắc! Bạn đã sẵn sàng cho đề thật.':pct>=.7?'Tốt lắm. Xem lại các câu sai bên dưới.':pct>=.5?'Khá. Hãy luyện thêm các Part có điểm thấp.':'Cố lên! Xem giải thích từng câu sai và luyện lại nhé.';
    app.innerHTML=`<div class="card result enter"><div class="eyebrow muted">${esc(cfg.title)}</div><div class="score mono" style="margin-top:8px">${score}/${n}</div><p style="font-weight:700;margin-top:6px">${msg}</p>
    <div class="grid3" style="margin-top:16px;text-align:center"><div><div class="mono" style="font-size:1.5rem;font-weight:700">${c(L)}/${L.length}</div><div class="muted" style="font-size:.72rem;font-weight:800">NGHE</div></div><div><div class="mono" style="font-size:1.5rem;font-weight:700">${c(Rd)}/${Rd.length}</div><div class="muted" style="font-size:.72rem;font-weight:800">ĐỌC</div></div><div><div class="mono" style="font-size:1.5rem;font-weight:700">${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</div><div class="muted" style="font-size:.72rem;font-weight:800">THỜI GIAN</div></div></div>

    <p class="note" style="color:var(--pmuted);margin-top:6px">Đây là bài luyện ngắn, không quy đổi ra điểm TOEIC chính thức. +${xp} XP</p>
    ${res.filter(r=>!r.ok).length?`<div class="miss"><b>Các câu sai (đã thêm vào Kho ôn tập)</b>${res.filter(r=>!r.ok).map(r=>`<div><b>${esc(r.it.part)}</b><br>${esc(r.it.sum)}<br><span style="color:var(--pmuted)">Bạn chọn (${LETTERS[r.k]}) · Đáp án đúng (${LETTERS[r.it.ans]})</span><div style="margin-top:4px">${r.it.explain}</div></div>`).join('')}</div>`:''}
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn c-sun" onclick="Q.again()">↻ Làm đề khác</button><button class="btn c-sky" onclick="go('${cfg.back||'play'}')">Quay lại</button></div></div>`}
  if(EX){tmr=setInterval(()=>{const el=$('#qtime');if(el){const s=Math.floor((Date.now()-t0)/1000);el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},500)}
  const key=e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;const k=e.key.toUpperCase();const n='1234'.indexOf(k)>=0?'1234'.indexOf(k):LETTERS.indexOf(k);if(!locked&&n>=0&&items[i]&&n<items[i].opts.length){e.preventDefault();Q.pick(n)}else if(locked&&e.key==='Enter'&&$('#nextb')&&document.activeElement!==$('#nextb')){e.preventDefault();Q.next()}};
  document.addEventListener('keydown',key);cleanup=()=>{document.removeEventListener('keydown',key);clearInterval(tmr)};
  render();
};
function partBars(){const rows=PARTS.map(p=>({p,a:(S.pt||{})[p.p]||[0,0]}));return`<div class="card">${rows.map(({p,a})=>{const n=a[0]+a[1],pc=n?a[0]/n:0;return`<button onclick="${PRACTICE[p.p][0]}" style="all:unset;cursor:pointer;display:block"><div class="wk"><span>Part ${p.p} · ${p.vn}</span><span class="bar" style="--c:${!n?'var(--paper2)':pc<.6?'var(--bad)':pc<.8?'var(--sun)':'var(--good)'}"><i style="width:${n?Math.max(4,pc*100):0}%"></i></span><span class="mono" style="text-align:right">${n?Math.round(pc*100)+'%':'—'}</span></div></button>`}).join('')}<p class="muted" style="font-size:.8rem;margin-top:6px">Tính trên các câu bạn đã làm. Chạm vào một Part để luyện ngay.</p></div>`}
function resultCard(title,big,msg,stats,missed,again,back){return`<div class="card result enter"><div class="eyebrow muted">${esc(title)}</div><div class="score mono" style="margin-top:8px">${big}</div><p style="font-weight:700;margin-top:6px">${msg}</p>
  ${stats?`<div class="grid3" style="margin-top:16px;text-align:center">${stats.map(([v,l])=>`<div><div class="mono" style="font-size:1.5rem;font-weight:700">${v}</div><div class="muted" style="font-size:.72rem;font-weight:800">${l}</div></div>`).join('')}</div>`:''}
  ${missed&&missed.length?`<div class="miss"><b>Đã thêm vào Kho ôn tập</b>${missed.map(m=>`<div>${esc(m)}</div>`).join('')}</div>`:''}
  <div class="row" style="justify-content:center;margin-top:18px"><button class="btn c-sun" onclick="${again}">↻ Chơi lại</button><button class="btn c-sky" onclick="${back}">Quay lại</button></div></div>`}

/* ---- TALK TIME (Part 3 & 4) ---- */
VIEWS.talk=part=>{
  const pool=idx(CONV.length).filter(i=>!part||CONV[i].p===part);
  const sets=pick(pool,2);let si=0,score=0,total=0,xp=0,missed=[];const gid='talk'+(part||'');
  let c,ci,lines,accent,qs,answers,plays,submitted;
  function renderSet(){
    ci=sets[si];c=CONV[ci];lines=convLines(c);accent=pickAccent();qs=c.qs.map(q=>mc(q[1],q.slice(2,5)));answers=qs.map(()=>null);plays=0;submitted=false;
    const kind=c.p===3?'Hội thoại':'Bài nói';
    app.innerHTML=`<div class="qhead"><button class="iconbtn" onclick="go('play')" aria-label="Thoát">✕</button><div class="bar" style="--c:var(--lime)"><i style="width:${si/sets.length*100}%"></i></div><span class="mono" style="font-weight:700">Bài ${si+1}/${sets.length}</span></div>
    <div class="card qcard enter">
      <div class="qpart"><span class="eyebrow" style="color:var(--pmuted)">Part ${c.p} · ${kind}</span><span class="chip">${esc(c.type)} · giọng ${ACCL[accent]}</span></div>

      <div class="play"><button class="playbtn" id="pb" onclick="T.play()" aria-label="Phát bài nghe">${ICON.play}</button><div><b>${TTS?'Nghe '+kind.toLowerCase():'Đọc lời thoại'}</b><div class="muted" style="font-size:.82rem" id="plays">${TTS?'Chưa nghe':'Trình duyệt không có giọng đọc'}</div></div>
      <button class="exam ${S.set.exam?'on':''}" style="margin-left:auto" id="exam" onclick="T.exam()">${S.set.exam?'✓ ':''}Nghe 1 lần</button></div>
      ${TTS?'':transcript(c,lines)}
      ${c.graphic?`<div class="tbl graphic">${c.graphic}</div>`:''}
      ${c.qs.map((q,qi)=>`<div class="cq"><div class="cqt">${qi+1}. ${esc(q[0])}</div><div class="opts">${qs[qi].opts.map((o,k)=>`<button class="opt" data-q="${qi}" data-k="${k}" onclick="T.pick(${qi},${k})"><span class="bub">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="ex${qi}"></div></div>`).join('')}
      <div id="tfb"></div>
      <div class="row" style="margin-top:18px;justify-content:flex-end" id="tact"><button class="btn c-lime" id="sub" onclick="T.submit()" disabled>Nộp bài</button></div>
    </div>`;
  }
  window.T={
    exam(){S.set.exam=!S.set.exam;save();const b=$('#exam');b.classList.toggle('on',S.set.exam);b.textContent=(S.set.exam?'✓ ':'')+'Nghe 1 lần';toast(S.set.exam?'Chế độ thi thật: chỉ được nghe 1 lần':'Được nghe lại nhiều lần')},
    play(){if(!TTS)return;if(S.set.exam&&plays>=1&&!submitted){toast('Chế độ thi thật: chỉ được nghe 1 lần');return}plays++;$('#plays').textContent='Đã nghe '+plays+' lần';const pb=$('#pb');pb.classList.add('speaking');speak(lines,accent,()=>{const p=$('#pb');p&&p.classList.remove('speaking')})},
    pick(qi,k){if(submitted)return;answers[qi]=k;SFX.tap();document.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(b=>b.classList.toggle('sel',+b.dataset.k===k));$('#sub').disabled=answers.some(a=>a===null)},

        $('#ex'+qi).innerHTML=`<div class="explain ${ok?'good':'bad'}" style="margin-top:8px"><b>${ok?'Đúng.':'Sai. Đáp án: ('+LETTERS[qs[qi].ans]+')'}</b> ${esc(q[5])}</div>`;
        record({kind:'c',key:'c:'+ci+'-'+qi},ok)});
      if(right)S.maxCombo=Math.max(S.maxCombo,right);

      if(gain){xp+=gain;addXP(gain)}
      $('#tfb').innerHTML=`<div class="explain ${right===3?'good':'bad'}" style="margin-top:18px"><b>Đúng ${right}/3 câu${gain?' · +'+gain+' XP':''}.</b> Đọc lời thoại bên dưới và chú ý cách đáp án <b>diễn đạt lại</b> lời trong bài nghe.</div>${transcript(c,lines)}`;
      $('#tact').innerHTML=`${TTS?`<button class="btn sm" style="--c:var(--paper2)" onclick="T.replay()">🔊 Nghe lại</button>`:''}<button class="btn c-lime" onclick="T.next()">${si+1<sets.length?'Bài tiếp →':'Xem kết quả'}</button>`;
      $('#tfb').scrollIntoView({block:'start',behavior:'smooth'})},

  };
  function finish(){const pct=total?score/total:0;if(pct>=.8){addXP(20);xp+=20}if(pct===1&&total>=6)award('perfect');if(S.best[gid]==null||pct>S.best[gid])S.best[gid]=pct;save();if(pct>=.6)SFX.win();if(pct>=.8)confetti(130);
    const msg=pct===1?'Nghe hiểu tuyệt đối!':pct>=.8?'Rất tốt. Thưởng thêm 20 XP!':pct>=.5?'Khá. Luyện thêm cách nhận ra diễn đạt lại nhé.':'Cố lên! Đọc lời thoại sau mỗi bài rồi nghe lại để bắt kịp từng câu.';
    app.innerHTML=resultCard(part===4?'Talk Time: Bài nói':'Talk Time: Hội thoại',`${score}/${total}`,msg,[[Math.round(pct*100)+'%','ĐỘ CHÍNH XÁC'],['+'+xp,'XP'],[sets.length,'BÀI NGHE']],missed,`go('talk',${part||0})`,`go('play')`)}
